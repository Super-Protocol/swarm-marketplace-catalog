# Renders every chart and diffs it against the committed golden. A chart that is
# only ever exercised by `helm package` is a chart whose templates are checked by
# whoever deploys it next; these run before the merge that publishes it.
#
# The same helm version as publish-charts.yml, so a chart that renders here
# packages there.
name: Chart tests

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'apps/confidential-router/**'
      - '.github/workflows/chart-tests.yml'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'apps/confidential-router/**'
      - '.github/workflows/chart-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    name: lint and goldens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # pyyaml for the evidence-drift check, which reads the rendered objects
      # rather than grepping them: an exclusion is a JSON pointer, and whether it
      # still lands on the field it names is not a question `grep` can answer.
      #
      # fastapi for root_path_guard.py, which is a canary rather than a copy of
      # the engine: the versions that serve are the pinned image's, and what this
      # catches is `--root-path` stopping short of authenticating the prefixed
      # path in a *later* framework than the one measured against. Without it the
      # check skips with a note, which is a check nobody runs.
      #
      # httpx and python-multipart for cva_console.py, which loads Confidential
      # Vulnerability Analysis's console out of the ConfigMap the chart renders
      # and drives it as an ASGI app. Those two are what the console imports
      # beside fastapi — httpx for its two relays to the analysis API, and
      # python-multipart because FastAPI requires it of any route taking a
      # `Form`, which the sign-in route does, so the module does not load
      # without it. What this catches is the console accepting something it
      # cannot answer for: a report path part that is `..`, a `Content-Length`
      # that is not a number, a GHSA identifier nothing here can research.
      # Without them that half skips with a note.
      #
      # pandas for transaction_workspace.py, which stubs cuDF with it: the
      # transaction workbench's column mapping and its vocabulary-coverage check
      # are the whole of that listing's port, they live in a Python module the
      # chart mounts, and nothing in a render can see either. pandas implements
      # every operation that module uses, so the logic is exercised here without
      # a GPU and without the 9 GB image.
      - run: pip install --quiet pyyaml fastapi httpx python-multipart pandas

      - name: Lint, render, diff
        run: charts/tests/run.sh

  # A digest is a property of the binary behind it, not of anything rendered, so
  # no golden can say whether the egress sidecar the listing declares survives the
  # document every fresh deployment starts from. One that exits on it keeps the
  # API pod un-Ready and the API hostname at 503 (SUP-248). This boots it.
  sidecar:
    name: egress sidecar boots on an empty endpoint list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      - name: Boot the declared sidecar
        run: charts/tests/sidecar_boot.sh
