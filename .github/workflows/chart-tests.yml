# Renders every chart and diffs it against the committed golden. A chart that is
# only ever exercised by `helm package` is a chart whose templates are checked by
# whoever deploys it next; these run before the merge that publishes it.
#
# The same helm version as publish-charts.yml, so a chart that renders here
# packages there.
name: Chart tests

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'apps/confidential-router/**'
      - '.github/workflows/chart-tests.yml'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'apps/confidential-router/**'
      - '.github/workflows/chart-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden:
    name: lint and goldens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # For the evidence-drift check, which reads the rendered objects rather
      # than grepping them: an exclusion is a JSON pointer, and whether it still
      # lands on the field it names is not a question `grep` can answer.
      - run: pip install --quiet pyyaml

      - name: Lint, render, diff
        run: charts/tests/run.sh

  # A digest is a property of the binary behind it, not of anything rendered, so
  # no golden can say whether the egress sidecar the listing declares survives the
  # document every fresh deployment starts from. One that exits on it keeps the
  # API pod un-Ready and the API hostname at 503 (SUP-248). This boots it.
  sidecar:
    name: egress sidecar boots on an empty endpoint list
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      - name: Boot the declared sidecar
        run: charts/tests/sidecar_boot.sh
