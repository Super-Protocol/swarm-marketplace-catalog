name: Publish charts

# The chart repository is served from GitHub Pages. Packaging happens here rather than in the
# repository so `charts/` stays readable source: no committed .tgz, no committed index.
on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/publish-charts.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      # A published application pins the chart versions it was tested against, so the repository
      # has to be append-only. `helm repo index` rebuilds from whatever is on disk, which on a
      # fresh runner is only the versions in this commit — every older one would silently vanish
      # and every deployment pinned to it would stop being reconfigurable.
      - name: Carry forward what is already published
        continue-on-error: true
        run: |
          mkdir -p site/charts
          base="https://super-protocol.github.io/${GITHUB_REPOSITORY#*/}/charts"
          if curl -sfL --retry 3 --max-time 60 "$base/index.yaml" -o site/charts/index.yaml; then
            grep -oE 'https?://\S+\.tgz' site/charts/index.yaml | sort -u | while read -r url; do
              curl -sfL --retry 3 --max-time 120 "$url" -O --output-dir site/charts || true
            done
            echo "carried forward: $(ls site/charts/*.tgz 2>/dev/null | wc -l) chart(s)"
          else
            echo "no published index yet"
          fi

      - name: Package every chart
        run: |
          mkdir -p site/charts
          # Not every directory under charts/ is a chart of ours: vendor/ holds vendored
          # subcharts and tests/ the render tests. A Chart.yaml at the root is what makes
          # a directory publishable here.
          for chart in charts/*/; do
            if [ ! -f "$chart/Chart.yaml" ]; then
              continue
            fi
            helm dependency update "$chart"
            helm package "$chart" --destination site/charts
          done
          # --merge keeps the entries of versions whose archives are no longer produced here but
          # were carried forward above.
          if [ -f site/charts/index.yaml ]; then
            helm repo index site/charts --merge site/charts/index.yaml \
              --url "https://super-protocol.github.io/${GITHUB_REPOSITORY#*/}/charts"
          else
            helm repo index site/charts \
              --url "https://super-protocol.github.io/${GITHUB_REPOSITORY#*/}/charts"
          fi

      - name: Landing page
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html>
          <title>Swarm Cloud Marketplace charts</title>
          <h1>Swarm Cloud Marketplace charts</h1>
          <p>Helm repository for the applications in
          <a href="https://github.com/Super-Protocol/swarm-marketplace-catalog">swarm-marketplace-catalog</a>.</p>
          <pre>helm repo add swarm-marketplace https://super-protocol.github.io/swarm-marketplace-catalog/charts</pre>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
