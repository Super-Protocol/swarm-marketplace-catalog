apiVersion: swarm.cloud/v1alpha1
kind: DataInterface

metadata:
  name: s3-npy
  version: v1
  title: S3-Compatible Object Storage (NumPy Arrays)
  description: Read access to NumPy array files (.npy / .npz) stored in an S3-compatible bucket. Intended for pre-computed embeddings and other dense numeric payloads; vector columns map to array files, scalar attribute columns to a Parquet or JSONL sidecar under the same prefix.

spec:
  connection:
    properties:
      endpoint:
        type: string
        description: S3-compatible endpoint URL.
      region:
        type: string
        default: us-east-1
        description: Bucket region.
      bucket:
        type: string
        description: Bucket containing the dataset.
      prefix:
        type: string
        default: ""
        description: Key prefix under which dataset files are stored.
      accessKeyId:
        type: string
        secret: true
        description: Access key provisioned for this binding. Sealed for the target TEE.
      secretAccessKey:
        type: string
        secret: true
        description: Secret key provisioned for this binding. Sealed for the target TEE.
      pathStyle:
        type: boolean
        default: true
        description: Whether to use path-style addressing (required by most S3-compatible services).
    required:
      - endpoint
      - bucket
      - accessKeyId
      - secretAccessKey
