apiVersion: swarm.cloud/v1alpha1
kind: DataInterface

metadata:
  name: s3-h5ad
  version: v1
  title: S3-Compatible Object Storage (AnnData / h5ad)
  description: >-
    Read access to AnnData files (`.h5ad`) stored in an S3-compatible bucket — the native format of
    the scverse single-cell stack, and the form a lab's own expression matrices already exist in. One
    object is one annotated matrix: the count matrix together with its per-cell (`obs`) and per-gene
    (`var`) annotation, so unlike the tabular interfaces beside it there is no sidecar to keep in
    step. A consumer reads the objects `objects` names, or every `.h5ad` under `prefix` when it names
    none.

spec:
  connection:
    properties:
      endpoint:
        type: string
        description: S3-compatible endpoint URL.
      region:
        type: string
        default: us-east-1
        description: Bucket region.
      bucket:
        type: string
        description: Bucket containing the dataset.
      prefix:
        type: string
        default: ""
        description: Key prefix under which the `.h5ad` objects are stored.
      objects:
        type: string
        default: ""
        description: >-
          Comma-separated object names under `prefix`, in the order a consumer should read them.
          Empty means every `.h5ad` under the prefix, which is right for a dataset whose contents
          change without republishing and wrong for one where order matters. A list rather than a
          repeated property because a connection property is a scalar: the interface schema allows
          string, integer, number and boolean and nothing else.
      accessKeyId:
        type: string
        secret: true
        description: Access key provisioned for this binding. Sealed for the target TEE.
      secretAccessKey:
        type: string
        secret: true
        description: Secret key provisioned for this binding. Sealed for the target TEE.
      pathStyle:
        type: boolean
        default: true
        description: Whether to use path-style addressing (required by most S3-compatible services).
    required:
      - endpoint
      - bucket
      - accessKeyId
      - secretAccessKey
