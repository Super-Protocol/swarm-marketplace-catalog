apiVersion: swarm.cloud/v1alpha1
kind: DataInterface

metadata:
  name: s3-csv
  version: v1
  title: S3-Compatible Object Storage (CSV)
  description: Read access to CSV files stored in an S3-compatible bucket. Each dataset table maps to a directory of .csv files under the prefix; the first row carries column headers.

spec:
  connection:
    properties:
      endpoint:
        type: string
        description: S3-compatible endpoint URL.
      region:
        type: string
        default: us-east-1
        description: Bucket region.
      bucket:
        type: string
        description: Bucket containing the dataset.
      prefix:
        type: string
        default: ""
        description: Key prefix under which dataset tables are stored (one directory of .csv files per table).
      delimiter:
        type: string
        default: ","
        description: Field delimiter character.
      accessKeyId:
        type: string
        secret: true
        description: Access key provisioned for this binding. Sealed for the target TEE.
      secretAccessKey:
        type: string
        secret: true
        description: Secret key provisioned for this binding. Sealed for the target TEE.
      pathStyle:
        type: boolean
        default: true
        description: Whether to use path-style addressing (required by most S3-compatible services).
    required:
      - endpoint
      - bucket
      - accessKeyId
      - secretAccessKey
