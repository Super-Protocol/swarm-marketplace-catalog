# Referenced by digest, not by tag. `cpu-1.8` is a release tag the publisher could rebuild, and
# a rebuilt tag replaces the software while leaving the manifests — and so the digest the
# deployment attests to — unchanged. The tag stays beside it so a human can see which release
# this is.
image:
  registry: ghcr.io
  repository: huggingface/text-embeddings-inference
  digest: sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c
  tag: cpu-1.8
  pullPolicy: IfNotPresent

# The fetcher is stdlib Python and the serving image carries no interpreter, so the init
# container runs a plain Python base. Two images, both pinned by digest in the listing.
fetcher:
  image:
    registry: docker.io
    repository: library/python
    digest: sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    tag: 3.12.16-slim-bookworm
    pullPolicy: IfNotPresent
  # Measured, and the obvious number was wrong: a streaming writer's resident set is not its
  # container's memory demand, because the page cache of a file being written is charged to the
  # cgroup. 512Mi is 2.6x the measured peak of the releasing fetcher
  # (charts/swarm-model-server/README.md has the table).
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
      nvidia.com/gpu: "0"
    limits:
      cpu: "1"
      memory: 512Mi
      nvidia.com/gpu: "0"

# The endpoint authenticates. It is reachable only from inside the namespace and is on no
# Ingress, but an unauthenticated inference endpoint is an unauthenticated inference endpoint,
# and the caller has to carry a key for its OpenAI client anyway. Required: the chart refuses
# to render without one.
apiKey: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Holds the verified weights. Survives a restart, so a bounced pod re-hashes a couple of GiB in
# under a minute instead of downloading them again. Left empty, the chart sizes it from the
# preset's own manifest — every byte plus a tenth, rounded up to whole GiB — because a listing
# whose model is a parameter has no one right number to write here.
persistence:
  enabled: true
  size: ""
  storageClass: ""
  accessMode: ReadWriteOnce

replicaCount: 1

# Left empty, the CPU and memory come from the selected preset's measured `sizing` — which is
# the only place they can be right, because the demand is a property of the checkpoint's
# sequence length and not of this chart. Set it to override, and own the measurement.
#
# The explicit `nvidia.com/gpu: 0` the chart renders either way is what stops a GPU cluster
# space's LimitRange from defaulting a card into this pod — a pod holding the card this way is
# a pod the generation engine cannot then be scheduled beside.
resources: {}

podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
