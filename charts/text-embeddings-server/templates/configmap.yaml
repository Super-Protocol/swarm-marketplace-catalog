{{- include "tes.validate" . -}}
{{- $p := include "tes.preset" . | fromJson -}}
{{- /*
The two documents a verifier needs to believe anything about what this endpoint serves.

`manifest.json` names every file the deployment may load, by sha256, and the licence those
bytes are served under. `fetch-weights.py` is the code that enforces it. Both are rendered
into the manifests the cloud digests and signs, so the published evidence carries the bytes
that were admitted, the terms they came under, and the rule that admitted them — which is the
entire reason the weights are not simply pulled by model name at boot.

Deterministic: nothing here is derived from the consumer, the hostname or a generated
credential, so this document is identical in every deployment of one listing version that
chose the same preset.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tes.name" . }}-weights
  labels:
    {{- include "tes.labels" . | nindent 4 }}
data:
  manifest.json: |
    {{- toPrettyJson (dict
        "task" $p.task
        "model" $p.id
        "licence" $p.licence
        "repo" $p.weights.repo
        "revision" $p.weights.revision
        "totalBytes" (int64 $p.weights.totalBytes)
        "files" $p.weights.files) | nindent 4 }}
  fetch-weights.py: |
    {{- .Files.Get "files/fetch-weights.py" | nindent 4 }}
