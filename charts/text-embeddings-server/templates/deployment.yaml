{{- $p := include "tes.preset" . | fromJson -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tes.name" . }}
  labels:
    {{- include "tes.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.persistence.enabled }}
  # The weights volume is ReadWriteOnce and held by the running pod, so a rolling update
  # leaves the replacement Pending on the volume for ever while the old pod serves — a
  # rollout that reports itself in progress and never finishes. `Recreate` costs one gap of
  # the model's load time on an upgrade and removes that.
  #
  # It also keeps the cluster space's quota honest: a surging pod is a second 6Gi the quota
  # has to cover, and a quota sized without it evicts whichever pod is heaviest at the moment
  # the rollout starts.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "tes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tes.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Downloads the weights and refuses to hand over anything the manifest did not name,
        # by sha256. Idempotent: a restarted pod with a populated volume re-hashes and starts
        # in under a minute instead of downloading the checkpoint again.
        #
        # This is the one outbound connection the component makes, it is made once, at boot,
        # to a declared host, for bytes whose hashes are in the attested manifest beside it —
        # and no data of the operator's is in the request. That is a different thing from an
        # inference call to a hosted provider, which is what this component exists to remove.
        - name: fetch-weights
          image: {{ include "tes.imageRef" .Values.fetcher.image | quote }}
          imagePullPolicy: {{ .Values.fetcher.image.pullPolicy }}
          command: [python3, /opt/weights/fetch-weights.py]
          env:
            - name: WEIGHTS_MANIFEST
              value: /opt/weights/manifest.json
            - name: WEIGHTS_DIR
              value: {{ .Values.model.dir | quote }}
            - name: HF_ENDPOINT
              value: {{ .Values.model.endpoint | quote }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.fetcher.resources | nindent 12 }}
          volumeMounts:
            - name: weights
              mountPath: {{ dir .Values.model.dir | quote }}
            - name: manifest
              mountPath: /opt/weights
              readOnly: true
      containers:
        - name: server
          image: {{ include "tes.imageRef" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Flags, not env, for everything that is not a secret: the arguments are part of what
          # the evidence attests, so a reader sees the model directory, the pooling and the
          # batch ceilings this endpoint really runs with.
          #
          # `--hostname 0.0.0.0` is explicit because Kubernetes sets HOSTNAME to the pod name,
          # the server reads HOSTNAME as an address to bind, finds it is not one, warns and
          # falls back. Saying it here removes the warning and the dependence on that fallback.
          #
          # `--auto-truncate` is load-bearing rather than defensive. The client this serves
          # does no tokenising of its own — upstream's client-side split was removed in the
          # fork precisely so that the server owns truncation — so without this flag one chunk
          # longer than the model's window fails the whole batch it arrived in.
          args:
            - --model-id
            - {{ .Values.model.dir | quote }}
            {{- if $p.pooling }}
            - --pooling
            - {{ $p.pooling | quote }}
            {{- end }}
            # Measured per preset, not a chart-wide preference: the backend warms up by
            # pushing a full batch through the model, the activation that allocates goes as
            # the square of the sequence length, and an 8192-token checkpoint under the
            # 16384-token budget a 512-token one takes happily is OOMKilled three seconds
            # into start-up — before it serves a request, and past every render test and
            # readiness probe in this repository.
            - --max-batch-tokens
            - {{ $p.sizing.maxBatchTokens | quote }}
            - --max-client-batch-size
            - {{ $p.sizing.maxClientBatchSize | quote }}
            - --auto-truncate
            - --hostname
            - 0.0.0.0
            - --port
            - {{ .Values.service.targetPort | quote }}
            - --json-output
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tes.name" . }}-auth
                  key: api-key
            # Nothing is to be fetched at serving time: the weights are already on the volume,
            # verified, and a model file that went missing must fail loudly rather than be
            # quietly re-downloaded unverified.
            - name: HF_HUB_OFFLINE
              value: "1"
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # `/health` is outside the server's authentication, which is what makes it usable as
          # a probe, and it answers only once the model is loaded and warmed.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- include "tes.resources" . | nindent 12 }}
          volumeMounts:
            - name: weights
              mountPath: {{ dir .Values.model.dir | quote }}
              readOnly: true
      volumes:
        - name: manifest
          configMap:
            name: {{ include "tes.name" . }}-weights
        - name: weights
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "tes.name" . }}-weights
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
