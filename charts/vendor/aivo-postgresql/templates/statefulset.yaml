apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "postgresql.fullname" . }}-headless
  # Одна реплика — это не кластер высокой доступности, а одна база с одним
  # томом. Репликация PostgreSQL здесь сознательно не поддерживается: кому
  # нужна отказоустойчивость, подключает внешний PostgreSQL.
  replicas: 1
  selector:
    matchLabels:
      {{- include "postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postgresql.labels" . | nindent 8 }}
      annotations:
        # Смена скрипта инициализации не должна молча оставаться неприменённой:
        # под перезапускается, а сам скрипт отработает на пустом томе.
        checksum/init: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            {{- range $key, $value := .Values.parameters }}
            - -c
            - {{ printf "%s=%s" $key (toString $value) | quote }}
            {{- end }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.secretName" . }}
                  key: postgres-password
            # Данные лежат в подкаталоге тома: в корне смонтированного PVC
            # обычно есть lost+found, и initdb отказывается работать.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          # Пробы ходят по TCP (-h 127.0.0.1), и это не придирка к стилю.
          # На первом старте entrypoint образа поднимает ВРЕМЕННЫЙ сервер только
          # на unix-сокете, прогоняет им /docker-entrypoint-initdb.d (наши базы,
          # роли и расширения) и лишь потом стартует настоящий, слушающий TCP.
          # `pg_isready` через сокет отвечает OK уже на этом временном сервере —
          # то есть проба зеленеет ПОСРЕДИ инициализации. Дальше включается
          # liveness, не дожидается конца создания баз, убивает контейнер, а при
          # перезапуске PGDATA уже не пуст — и init-скрипты не выполняются
          # вовсе. Роли, которые не успели создаться, не создаются никогда, и
          # приложение получает «authentication failed» на живой, здоровой с
          # виду СУБД. Ровно это и поймал e2e-прогон AIV-1060.
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.auth.username | quote }}, "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.auth.username | quote }}, "-h", "127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Пока startupProbe не прошла, liveness и readiness выключены — этим и
          # закрывается вся инициализация: пять минут на создание баз, ролей и
          # расширений, и только потом за под берутся остальные пробы.
          startupProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.auth.username | quote }}, "-h", "127.0.0.1"]
            periodSeconds: 10
            failureThreshold: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            # Официальный образ пишет сюда сокет и временные файлы.
            - name: run
              mountPath: /var/run/postgresql
            {{- if .Values.shm.enabled }}
            # DSM-сегменты параллельных операций — см. `shm` в values.yaml.
            - name: shm
              mountPath: /dev/shm
            {{- end }}
      volumes:
        - name: init
          secret:
            secretName: {{ include "postgresql.fullname" . }}-init
        - name: run
          emptyDir: {}
        {{- if .Values.shm.enabled }}
        - name: shm
          emptyDir:
            medium: Memory
            {{- with .Values.shm.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- end }}
        {{- end }}
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
  {{- end }}
