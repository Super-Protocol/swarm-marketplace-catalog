{{- if not .Values.auth.existingSecret }}
{{- if not .Values.auth.password }}
{{- fail "postgresql: нужен auth.password (пароль суперпользователя) или auth.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.auth.password | quote }}
{{- end }}
---
{{/* Скрипт первичной инициализации лежит в секрете, а не в ConfigMap: в нём
     пароли ролей. Официальный образ выполняет всё из /docker-entrypoint-initdb.d
     ровно один раз — при создании пустого каталога данных. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}-init
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  10-aivo-databases.sh: |
    #!/bin/bash
    # Базы, роли и расширения Aivo. Выполняется один раз — при инициализации
    # пустого каталога данных; на уже развёрнутой БД правка списка ничего не
    # меняет (её делает администратор вручную).
    #
    # Пароли ролей НЕ подставляются в текст SQL: значение кладётся в переменную
    # окружения (шаблон умеет только shell-кавычки), а в запрос оно попадает
    # через psql-переменную `:'pw'`, которая сама делает из него SQL-литерал.
    # Имена баз, ролей и расширений проверены шаблоном по [A-Za-z_][A-Za-z0-9_]*,
    # поэтому подстановка их в SQL безопасна.
    set -Eeuo pipefail
    psql() { command psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" "$@"; }
    {{- range .Values.databases }}
    {{- $db := . }}
    {{- $ident := "^[A-Za-z_][A-Za-z0-9_]*$" }}
    {{- if not (regexMatch $ident (toString $db.name)) }}
      {{- fail (printf "postgresql: имя базы %q — допустимы латинские буквы, цифры и подчёркивание" (toString $db.name)) }}
    {{- end }}
    {{- if and $db.owner (not (hasKey $db "password")) }}
      {{- fail (printf "postgresql: databases[%s].owner задан без password" $db.name) }}
    {{- end }}
    {{- /*
      Пустой пароль — это НЕ забытое значение, а «эта база в данной установке не
      нужна»: список баз один на все поставки, а компонент, которому база
      принадлежит, может подключаться у заказчика или не ставиться вовсе
      (Keycloak, Langfuse). Инсталлятор в таком случае подставляет пустую
      строку; забытый пароль — это отсутствующий ключ, и он по-прежнему роняет
      рендер проверкой выше.
    */}}
    {{- $needed := or (not $db.owner) (ne (toString $db.password) "") }}
    {{- if $needed }}
    {{- if and $db.owner (not (regexMatch $ident (toString $db.owner))) }}
      {{- fail (printf "postgresql: имя роли %q — допустимы латинские буквы, цифры и подчёркивание" (toString $db.owner)) }}
    {{- end }}
    {{- /*
      Локаль базы. Блок необязателен: без него CREATE DATABASE наследует локаль
      кластера ровно как раньше, и уже развёрнутые установки не меняются.

      Зачем он вообще нужен. Локаль базы в PostgreSQL неизменяема после
      создания, а провайдер libc даёт РАЗНЫЙ порядок сортировки на glibc и на
      musl (alpine). База, снятая дампом с одного образа и восстановленная в
      другой, получает индексы, порядок которых сервер считает верным, а он уже
      не тот — и это молчаливая порча, которая всплывает на первом же
      `ORDER BY` или уникальном индексе по тексту. Встроенный провайдер
      (`builtin`, PostgreSQL >= 17) от libc не зависит вовсе, поэтому база,
      созданная на нём, переживает смену образа. Именно это и нужно стенду,
      который сначала живёт на in-cluster PostgreSQL, а потом переезжает на
      инстанс заказчика (AIV-1944).

      Значения подставляются в SQL как литералы, поэтому проверяются по строгому
      набору символов — кавычке и пробелу внутрь не попасть.
    */}}
    {{- $loc := $db.locale | default dict }}
    {{- $locval := "^[A-Za-z0-9_.@+-]+$" }}
    {{- range $k, $v := $loc }}
    {{- if not (has $k (list "provider" "builtin" "icu" "collate" "ctype" "encoding" "template")) }}
      {{- fail (printf "postgresql: databases[%s].locale.%s — неизвестный ключ; допустимы provider, builtin, icu, collate, ctype, encoding, template" $db.name $k) }}
    {{- end }}
    {{- if not (regexMatch $locval (toString $v)) }}
      {{- fail (printf "postgresql: databases[%s].locale.%s = %q — допустимы латинские буквы, цифры и . _ @ + -" $db.name $k (toString $v)) }}
    {{- end }}
    {{- end }}
    {{- if and $loc.provider (not (has $loc.provider (list "builtin" "icu" "libc"))) }}
      {{- fail (printf "postgresql: databases[%s].locale.provider = %q — допустимы builtin, icu, libc" $db.name (toString $loc.provider)) }}
    {{- end }}
    {{- if and (eq (toString ($loc.provider | default "")) "builtin") (not $loc.builtin) }}
      {{- fail (printf "postgresql: databases[%s].locale.provider = builtin требует locale.builtin (например C.UTF-8)" $db.name) }}
    {{- end }}
    {{- if and (eq (toString ($loc.provider | default "")) "icu") (not $loc.icu) }}
      {{- fail (printf "postgresql: databases[%s].locale.provider = icu требует locale.icu" $db.name) }}
    {{- end }}
    {{- /* Смена локали возможна только от template0: template1 её уже несёт. */}}
    {{- $tmpl := $loc.template | default (ternary "template0" "" (gt (len $loc) 0)) }}
    {{- $create := printf "CREATE DATABASE \\\"%s\\\"" $db.name }}
    {{- if $db.owner }}{{- $create = printf "%s OWNER \\\"%s\\\"" $create $db.owner }}{{- end }}
    {{- if $tmpl }}{{- $create = printf "%s TEMPLATE \\\"%s\\\"" $create $tmpl }}{{- end }}
    {{- if $loc.encoding }}{{- $create = printf "%s ENCODING '%s'" $create $loc.encoding }}{{- end }}
    {{- if $loc.provider }}{{- $create = printf "%s LOCALE_PROVIDER %s" $create $loc.provider }}{{- end }}
    {{- if $loc.builtin }}{{- $create = printf "%s BUILTIN_LOCALE '%s'" $create $loc.builtin }}{{- end }}
    {{- if $loc.icu }}{{- $create = printf "%s ICU_LOCALE '%s'" $create $loc.icu }}{{- end }}
    {{- if $loc.collate }}{{- $create = printf "%s LC_COLLATE '%s'" $create $loc.collate }}{{- end }}
    {{- if $loc.ctype }}{{- $create = printf "%s LC_CTYPE '%s'" $create $loc.ctype }}{{- end }}
    {{- range $db.extensions }}
    {{- if not (regexMatch $ident (toString .)) }}
      {{- fail (printf "postgresql: имя расширения %q — допустимы латинские буквы, цифры и подчёркивание" (toString .)) }}
    {{- end }}
    {{- end }}

    echo "==> база {{ $db.name }}"
    {{- if $db.owner }}
    # Одинарные кавычки: внутри них shell не раскрывает ни $, ни `…`, ни \.
    # Апостроф в самом пароле закрывает строку и открывает новую — '\'' —
    # поэтому в SQL пароль дальше уходит только через :'pw'.
    AIVO_ROLE_PASSWORD='{{ $db.password | toString | replace "'" "'\\''" }}'
    export AIVO_ROLE_PASSWORD
    if [ -z "$(psql --dbname postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '{{ $db.owner }}'")" ]; then
      # SQL уходит psql'ю на ВХОД, а не через -c: переменные `-v` подставляются
      # только в том, что psql читает как скрипт. У `-c` строка отправляется на
      # сервер как есть, и `:'pw'` доезжает до него буквально — синтаксическая
      # ошибка, ON_ERROR_STOP, обрыв init-скрипта. Проверено на образе.
      printf '%s\n' "CREATE ROLE \"{{ $db.owner }}\" LOGIN PASSWORD :'pw'" \
        | psql --dbname postgres -v pw="$AIVO_ROLE_PASSWORD"
    fi
    unset AIVO_ROLE_PASSWORD
    {{- end }}
    # Результат в переменную, а не в `| grep -q`: при совпадении grep закрывает
    # канал первым, psql получает SIGPIPE, и `pipefail` делает из этого падение
    # всего скрипта на второй же базе того же владельца.
    if [ -z "$(psql --dbname postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ $db.name }}'")" ]; then
      psql --dbname postgres -c "{{ $create }}"
    fi
    {{- if $db.owner }}
    psql --dbname postgres -c "GRANT ALL PRIVILEGES ON DATABASE \"{{ $db.name }}\" TO \"{{ $db.owner }}\""
    # С PostgreSQL 15 схема public больше не доступна на запись всем подряд:
    # без смены владельца приложение не создаст в своей базе ни одной таблицы.
    psql --dbname "{{ $db.name }}" -c "ALTER SCHEMA public OWNER TO \"{{ $db.owner }}\""
    {{- end }}
    {{- range $db.extensions }}
    psql --dbname "{{ $db.name }}" -c "CREATE EXTENSION IF NOT EXISTS \"{{ . }}\""
    {{- end }}
    {{- else }}
    # база {{ $db.name }}: в этой установке не нужна (пароль роли пуст —
    # компонент, которому она принадлежит, поднимается не из бандла)
    {{- end }}
    {{- end }}
