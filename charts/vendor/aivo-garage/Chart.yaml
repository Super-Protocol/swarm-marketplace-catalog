apiVersion: v2
name: garage
description: >-
  Garage — S3-совместимое хранилище для установок Aivo внутри кластера: один
  узел с одним PVC или (cluster.enabled) несколько узлов с репликацией, ключ
  доступа и бакеты заводятся при установке. Этим чартом
  ставится релиз aivo-garage — вложения и выгрузки платформы (бакет aivo-files)
  и блобы Langfuse (бакет langfuse).
type: application
version: 0.2.0
# Чарт свой, не upstream'ный, и сервер не MinIO. Причина смены — состав
# поставки, который ИБ заказчика сканирует целиком (Trivy 0.74.0,
# --severity CRITICAL,HIGH, AIV-1585):
#
#   quay.io/minio/minio:RELEASE.2025-09-07   8 C / 96 H
#   quay.io/minio/mc:RELEASE.2025-08-13      3 C / 43 H
#   dxflrs/garage:v2.3.0                     0 C /  0 H
#
# У MinIO это счёт на 2026-09-08; в триаже AIV-1585 четырьмя днями раньше на
# том же теге было 7 и 73. Разница не в другой сборке — тег заморожен, — а в
# базе Trivy: по замороженному тегу счёт может только расти.
#
# Две из восьми критичных у MinIO — в его собственном коде (CVE-2026-33322,
# CVE-2026-33419) и закрыты только в платном AIStor: community-сборки после
# сентября 2025 не выходят вовсе. Остальное — ОС-слой образа, которого у Garage
# нет: образ собран из scratch и несёт один статический бинарь на Rust.
#
# Оговорка, которую отчёт о скане обязан нести рядом со строкой garage: у
# Rust-бинарей нет ни манифеста зависимостей, ни buildinfo, который читают
# сканеры, — Trivy не находит в этом образе ни одной цели и печатает пустой
# результат. «0 находок» здесь означает «сканеру не на что смотреть», а не
# «проверено и чисто». У заказчика будет ровно тот же пустой отчёт.
#
# Версия 2.3.0, а не 2.1.0, названная в решении, и не свежайшая 2.4.1. В 2.3.0
# появились `garage server --single-node` (узел сам заводит раскладку кластера)
# и `--default-access-key` (сам заводит ключ доступа из переменных окружения) —
# без них чарту пришлось бы нести Job, который перед первым запуском вычисляет
# идентификатор узла и применяет раскладку через админ-API, а до этого момента
# сервер отвечает 503 и под никогда не становится Ready. Там же ослаблены
# требования к импортируемым ключам, из-за которых логин пришлось бы заменить
# на `GK` + 24 шестнадцатеричных символа. 2.4.1 вышла за день до этой правки,
# и её единственное отличие от 2.4.0 — паника при обнаружении узлов через
# Consul и Kubernetes, которых поставка не использует: брать в комплект релиз
# суточной давности ради этого нечего.
#
# Лицензия AGPL-3.0 — та же, что у MinIO community, и согласована (AIV-1661).
appVersion: "2.3.0"
keywords:
  - garage
  - s3
  - object-storage
  - storage
sources:
  - https://git.deuxfleurs.fr/Deuxfleurs/garage
