# =============================================================================
# Garage — S3-совместимое хранилище в кластере.
#
# Чарт рассчитан на одну инсталляцию Aivo и ставится в одном из двух режимов:
#
#   по умолчанию      один под, один PVC, один узел кластера Garage;
#   cluster.enabled   несколько подов по одному на рабочий узел, у каждого свой
#                     PVC, каждый объект лежит на replicationFactor из них —
#                     отказ одного узла не останавливает ни чтение, ни запись
#                     (HA-профиль, AIV-2668).
#
# Потребителей у релиза два, и оба ходят по обычному S3:
#
#   платформа   вложения в диалогах и выгрузки  бакет aivo-files
#   Langfuse    блобы событий и медиа           бакет langfuse
#
# Оба ходят в стиле path (`forcePathStyle`), потому что виртуальный хост
# `<бакет>.aivo-garage` в кластере не резолвится ничем.
# =============================================================================

image:
  repository: dxflrs/garage
  tag: "v2.3.0"
  pullPolicy: IfNotPresent

# Образ для Job'а, который заводит бакеты. Обычный busybox: он уже есть в
# поставке (вспомогательный под local-path-provisioner), и ничего сверх
# `wget` Job'у не нужно.
#
# Образ garage для этого не годится, хотя `garage bucket create` и существует:
# он собран из scratch, оболочки в нём нет вовсе, а CLI, запущенный отдельным
# подом, ищет ключ узла в каталоге метаданных — то есть на томе, который держит
# сервер. Job ходит в админ-API по HTTP, и это единственный способ сделать то
# же самое снаружи пода.
initImage:
  repository: busybox
  tag: "1.38.0"
  pullPolicy: IfNotPresent

# Регион, который сервер ждёт в подписи запроса. Значение обязано совпадать с
# регионом у КАЖДОГО клиента (`objectstore.region` в ответах установки).
#
# Это не косметика и не «поле для порядка». Garage сверяет регион в scope
# подписи SigV4, и при расхождении простые PutObject/GetObject проходят
# (клиент подписывает их регионом, который сервер принимает как есть), а
# ListBuckets и ЛЮБОЙ presigned URL отвечают 400 AuthorizationHeaderMalformed —
# проверено на 2.3.0. Для Langfuse это означает установку, которая выглядит
# рабочей до первой картинки в трейсе: события он кладёт обычным PutObject, а
# медиа отдаёт браузеру presigned-ссылкой.
region: us-east-1

# Ключ доступа S3. Один на обоих потребителей: разделять их разными ключами
# незачем — бакеты всё равно лежат в одном хранилище на одном узле, и второй
# ключ добавил бы к установке ещё одну пару значений, а не ещё одну границу.
credentials:
  # Требования к паре задаёт сам Garage и на негодной не стартует вовсе:
  # идентификатор не короче 8 символов, секрет не короче 16, и оба — только из
  # печатного ASCII (U+0021…U+007E), то есть без пробелов, переводов строк и
  # кириллицы. Шаблон отказывается рендерить такие значения раньше: под,
  # который падает на старте с `Invalid default access key`, ищут в журнале, а
  # не в values.
  accessKeyId: ""
  secretAccessKey: ""

# Ключ сети RPC. Нужен и одному узлу: без него сервер не стартует вовсе
# (`rpc_secret value is missing`). 32 байта в шестнадцатеричном виде.
rpcSecret: ""

# Токен админ-API. Им ходит Job, который заводит бакеты; на нём же закрыт
# /metrics — иначе метрики отдаются в namespace кому угодно без спроса.
#
# Тот же токен на обе роли (`admin_token` и `metrics_token`) намеренно:
# метрики Garage в поставке никто не собирает, и второе значение в ответах
# установки означало бы ещё один секрет, у которого нет ни одного читателя.
# Когда сборщик появится, он получит свой токен, а не этот.
adminToken: ""

# Бакеты, которые должны существовать после установки. Заводит их хук
# post-install: сервер умеет создать при первом запуске ровно один
# (`--default-bucket`), а нужно два — и одинаковым способом, а не «первый так,
# остальные иначе».
#
# Ключ доступа получает на каждый из них полный доступ: и платформа, и Langfuse
# в своём бакете и пишут, и читают, и удаляют.
buckets:
  - aivo-files
  - langfuse

service:
  type: ClusterIP
  # Порт S3-API. Родной порт Garage, а не 9000 от MinIO: адрес хранилища всё
  # равно меняется вместе с именем релиза, и притворяться прежним ему незачем.
  port: 3900

# Публичный адрес S3-API (AIV-2408). Выключен по умолчанию: платформе внутри
# кластера он не нужен. Включают его там, где браузер скачивает файлы по
# presigned-ссылкам (выгрузки), а сервис хранилища снаружи кластера не виден;
# тот же хост, со схемой, пишется в `fileStorage.config.publicEndpoint` api.
#
# Наружу уходит только порт S3 — админ-API остаётся на headless-сервисе.
# Доступ к бакетам по-прежнему закрыт подписью SigV4: анонимного чтения у
# Garage нет, и ingress его не добавляет.
#
# Если путь к серверу идёт через прокси с лимитом на тело запроса (у
# ingress-nginx это 1 МиБ по умолчанию), скачиванию он не мешает, а загрузке
# по presigned PUT — мешает; такой установке нужна аннотация
# `nginx.ingress.kubernetes.io/proxy-body-size`.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Хост без схемы, например s3.example.com.
  host: ""
  tls:
    enabled: true
    # Пусто — `<host>-tls`; секрет выпускает cert-manager по аннотации.
    secretName: ""

# Порт админ-API. Наружу сервисом S3 он не публикуется — его несёт только
# headless-сервис, по которому в него ходит Job.
adminPort: 3903

persistence:
  enabled: true
  # Метаданные и данные лежат на одном томе разными каталогами (`meta/` и
  # `data/`), которые сервер создаёт сам. Разносить их по двум PVC имеет смысл
  # там, где метаданные кладут на SSD, а данные на диск; в поставке узел один и
  # диск под ним один. В кластерном режиме том у каждого пода свой, размер —
  # на под (по документу HA — 150Gi).
  size: 100Gi
  # Пусто — класс по умолчанию (в поставке это local-path).
  storageClass: ""
  accessMode: ReadWriteOnce

# Лимита памяти нет намеренно — по той же причине, по которой его не было у
# MinIO: размер буферов загрузки задаёт не сервер, а клиент, размером объекта и
# числом параллельных потоков. Потолка, который наверняка выше пика, здесь не
# существует, а занижённый превращает выгрузку крупного файла в OOMKill.
# Ограничение ставится снаружи — размером узла, а не догадкой в values.
resources:
  requests:
    cpu: 100m
    memory: 512Mi

initResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

# Образ собран из scratch: ни /etc/passwd, ни объявленного `USER` в нём нет, и
# без этого блока под работал бы от root (AIV-1590). uid 1000 произвольный —
# серверу нужен только записываемый каталог данных, а права на томе даёт
# kubelet по fsGroup.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Сервер пишет только на свой том: /var/lib/garage/{meta,data}. Проверено на
# 2.3.0 прогоном под `--user 1000:1000 --read-only` — стартует, заводит
# раскладку, принимает и отдаёт объекты.
containerSecurityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Пробы бьют в /health админ-порта. Эта ручка отвечает 200 только когда узел
# может обслуживать чтение и запись, и 503, пока раскладка кластера не
# применена, — то есть отвечает ровно на тот вопрос, который задаёт readiness.
# Проба tcpSocket зеленела бы на сервере, который на каждый запрос S3 отвечает
# «quorum is not available».
#
# Токен ей не нужен: /health и /metrics — единственные ручки админ-порта,
# которые Garage отдаёт без авторизации (/metrics закрыт нашим metrics_token,
# /health открыт всегда).
startupProbe:
  periodSeconds: 5
  failureThreshold: 60
  timeoutSeconds: 5

readinessProbe:
  periodSeconds: 10
  failureThreshold: 3
  timeoutSeconds: 5

livenessProbe:
  periodSeconds: 15
  failureThreshold: 5
  timeoutSeconds: 5

# Кластерный режим (AIV-2668). Выключен по умолчанию: одиночный узел рендерится
# ровно так же, как до появления этого блока.
#
# Включается на НОВОЙ установке. Перевести работающий одиночный узел в кластер
# этим флагом нельзя: у StatefulSet'а меняется podManagementPolicy, которую
# Kubernetes на существующем объекте не правит, а у данных — фактор репликации,
# который Garage на заполненном кластере не пересчитывает. Переезд — новый
# релиз и перенос бакетов клиентом S3.
cluster:
  enabled: false
  # Подов в StatefulSet'е — по одному на рабочий узел (см. podAntiAffinity).
  replicas: 3
  # Копий каждого объекта. При 3 запись и чтение идут кворумом 2 из 3: один
  # недоступный узел не замечает никто, два — останавливают хранилище (оставшийся
  # узел перестаёт быть Ready, а не отвечает на запросы «quorum is not
  # available»). Не больше replicas.
  replicationFactor: 3
  # Ёмкость узла в раскладке, в байтах или с суффиксом (150Gi). Пусто — размер
  # тома (persistence.size). Garage ёмкость не меряет и не ограничивает, это вес
  # узла при раскладке разделов: при одинаковых томах значение одно на всех и
  # ни на что, кроме баланса, не влияет.
  capacity: ""
  # Как разводить поды по узлам Kubernetes, если affinity ниже не задан:
  #   required   строго по одному на узел — под без свободного рабочего узла
  #              стоит Pending, а не садится вторым к соседу (две копии на одной
  #              машине отказ этой машины не переживают);
  #   preferred  по возможности — для стенда, где рабочих узлов меньше, чем подов.
  podAntiAffinity: required
  # Раз во сколько секунд контейнер `peer` сверяет соседей и раскладку, когда
  # кластер здоров. Пока узел не готов — раз в 5 секунд.
  peerInterval: 30
  # PodDisruptionBudget: drain рабочего узла выселяет не больше одного пода за
  # раз — ровно столько, сколько переживает кворум при replicationFactor 3.
  pdb:
    enabled: true
    maxUnavailable: 1

# Контейнер `peer` в кластерном режиме: busybox с циклом из пары HTTP-запросов
# в админ-API. Лимит памяти здесь безопасен — буферов у него нет.
peerResources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 32Mi

nodeSelector: {}
tolerations: []
# Задан — используется как есть, и правило cluster.podAntiAffinity не
# добавляется.
affinity: {}
