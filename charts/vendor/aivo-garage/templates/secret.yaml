{{- if not .Values.credentials.accessKeyId }}
{{- fail "garage: нужен credentials.accessKeyId — ключ доступа S3, не короче 8 символов" }}
{{- end }}
{{- if lt (len .Values.credentials.accessKeyId) 8 }}
{{- fail "garage: credentials.accessKeyId короче 8 символов — с таким сервер не стартует" }}
{{- end }}
{{- if not .Values.credentials.secretAccessKey }}
{{- fail "garage: нужен credentials.secretAccessKey — хранилище в общем namespace без ключа открыто любому поду" }}
{{- end }}
{{- if lt (len .Values.credentials.secretAccessKey) 16 }}
{{- fail "garage: credentials.secretAccessKey короче 16 символов — с таким сервер не стартует" }}
{{- end }}
{{/* Печатный ASCII без пробела: Garage принимает только U+0021…U+007E и с
     пробелом, переводом строки или кириллицей в ключе не стартует. Проверяются
     оба значения — ошибка сервера называет только «default access key», не
     уточняя, какая половина пары ему не понравилась. */}}
{{- if not (regexMatch "^[!-~]+$" .Values.credentials.accessKeyId) }}
{{- fail "garage: credentials.accessKeyId — только печатный ASCII без пробелов (U+0021…U+007E)" }}
{{- end }}
{{- if not (regexMatch "^[!-~]+$" .Values.credentials.secretAccessKey) }}
{{- fail "garage: credentials.secretAccessKey — только печатный ASCII без пробелов (U+0021…U+007E)" }}
{{- end }}
{{- if not .Values.rpcSecret }}
{{- fail "garage: нужен rpcSecret — без него сервер не стартует (rpc_secret value is missing)" }}
{{- end }}
{{- if not .Values.adminToken }}
{{- fail "garage: нужен adminToken — им заводятся бакеты и закрыт /metrics" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garage.fullname" . }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Конфигурация целиком — в ней rpc_secret и admin_token.
  garage.toml: |
    {{- include "garage.toml" . | nindent 4 }}
  # Ключ доступа отдельными ключами: сервер получает его переменными окружения
  # (GARAGE_DEFAULT_ACCESS_KEY / GARAGE_DEFAULT_SECRET_KEY), Job — только
  # идентификатор, чтобы выдать ему права на бакеты.
  access-key-id: {{ .Values.credentials.accessKeyId | quote }}
  secret-access-key: {{ .Values.credentials.secretAccessKey | quote }}
  # Токен админ-API — его читает Job.
  admin-token: {{ .Values.adminToken | quote }}
