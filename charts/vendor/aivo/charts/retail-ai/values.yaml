# Default values for app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  host: "https-example.foo.com"
  tls: false
  oauth2ProxyServiceName: "aivo-oauth2-proxy"

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe: {}
  # httpGet:
  #   path: /healthz
  #   port: http
readinessProbe: {}
  # httpGet:
  #   path: /healthz
  #   port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

clusterDomain: cluster.local

back:
  replicaCount: 1
  image:
    repository: localhost:32123/vaultee-back
    pullPolicy: Always
    tag: "latest"
  config:
    args:
    - apps/api/dist/main.js
    maxOldSpaceSize: 16384
    port: 80
  service:
    type: ClusterIP
    port: 80

front:
  replicaCount: 1
  image:
    repository: localhost:32123/front
    pullPolicy: Always
    tag: "latest"
  config:
    port: 8080
  service:
    type: ClusterIP
    port: 80
gatekeeper:
  enabled: false
  image:
    repository: quay.io/gogatekeeper/gatekeeper
    tag: "4.4.0"
    pullPolicy: IfNotPresent
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000
  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  config:
    listen: 3000
    clientId: aivo
    clientSecret: secret
    discoveryUrl: http://keycloak/realms/master/.well-known/openid-configuration
    enableLogoutRedirect: true
    postLogoutRedirectUri: https://test.youdomaindom.com/logged-out
    enableJsonLogging: true
    enableMetrics: false
    enableRefreshTokens: true
    enableSessionCookies: true
    storeUrl: redis://127.0.0.1:6379
    encryptionKey: 16_or_32_symbols
    skipOpenidProviderTlsVerify: true
    skipAccessTokenClientIdCheck: true
    listenAdmin: 4000
    secureCookie: false
    redirectionUrl: https://test.youdomaindom.com
    serverReadTimeout: 600s
    serverWriteTimeout: 600s
    serverIdleTimeout: 600s
    upstreamResponseHeaderTimeout: 600s
    verbose: false
