{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labelsCommon" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "https://$host/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://$host/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "x-auth-request-user, x-auth-request-email, x-auth-request-access-token, x-auth-request-preferred-username, authorization, x-auth-request-groups"
    nginx.ingress.kubernetes.io/server-snippet: |
      # Security: Remove client-provided auth headers to prevent spoofing
      more_clear_input_headers 'x-auth-*';
      more_clear_input_headers 'authorization';
    nginx.ingress.kubernetes.io/configuration-snippet: |
      # Set x-auth-subject from oauth2-proxy response
      proxy_set_header x-auth-subject $http_x_auth_request_preferred_username;
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ include "app.fullname" . }}-tls
  {{- end }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: {{ include "app.fullname" . }}-back
            port:
              name: http
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "app.fullname" . }}-front
            port:
              name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "app.fullname" . }}-oauth2-proxy
  labels:
    {{- include "app.labelsCommon" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ include "app.fullname" . }}-tls
  {{- end }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /oauth2
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.ingress.oauth2ProxyServiceName }}
            port:
              number: 4180
{{- end }}
