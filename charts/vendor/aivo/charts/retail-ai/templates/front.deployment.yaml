apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}-front
  labels:
    {{- include "app.labelsFront" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.front.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabelsFront" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "app.labelsFront" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        image: "{{ .Values.front.image.repository }}:{{ .Values.front.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.front.image.pullPolicy }}
        env:
        - name: PORT
          value: {{ .Values.front.config.port | quote }}
        - name: RAI_SERVICE_DISCOVERY_URL
          value: http://{{ .Release.Name }}-service-discovery
        ports:
        - name: http
          containerPort: {{ .Values.front.config.port }}
          protocol: TCP
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- if .Values.gatekeeper.enabled }}
      - name: "gatekeeper"
        securityContext:
          {{- toYaml .Values.gatekeeper.securityContext | nindent 12 }}
        image: "{{ .Values.gatekeeper.image.repository }}:{{ .Values.gatekeeper.image.tag }}"
        imagePullPolicy: {{ .Values.gatekeeper.image.pullPolicy }}
        args:
          - --config
          - /etc/gatekeeper/config.yaml
        ports:
          - name: gatekeeper
            containerPort: {{ int .Values.gatekeeper.config.listen }}
            protocol: TCP
        resources:
          {{- toYaml .Values.gatekeeper.resources | nindent 12 }}
        volumeMounts:
          - name: gatekeeper-config
            mountPath: /etc/gatekeeper
        {{- end }}
      {{- if .Values.gatekeeper.enabled }}
      volumes:
        - name: gatekeeper-config
          secret:
            secretName: "{{ include "app.fullname" . }}-front-gk-cfg"
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
