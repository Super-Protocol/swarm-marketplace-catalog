apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}-back
  labels:
    {{- include "app.labelsBack" . | nindent 4 }}
spec:
  type: {{ .Values.back.service.type }}
  ports:
    - port: {{ .Values.back.service.port }}
      targetPort: http
      name: http
      protocol: TCP
  selector:
    {{- include "app.selectorLabelsBack" . | nindent 4 }}
