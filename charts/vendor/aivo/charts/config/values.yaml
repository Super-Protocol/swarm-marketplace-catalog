# Default values for app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: localhost:32123/vaultee-back
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

clusterDomain: cluster.local

config:
  args:
  - apps/config/dist/main.js
  port: 80
  services:
    identityService:
      clientId: identity
      clientSecret: glGxGPzKCuySzcJa9Bjm2nrhyHdIn5CS
      endpoint: http://kc-keycloak
      realm: master
    api:
      cors:
        origin: true
        credentials: true
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - OPTIONS
        allowedHeaders:
          - Content-Type
          - Authorization
          - X-Api-Key
          - apollo-require-preflight
      db:
        type: postgresql
        config:
          host: pg-postgresql
          port: 5432
          username: aivo_user
          password: password123
          database: aivo
          ssl: false
          synchronize: false
          autoLoadEntities: true
          logging: false
      embeddings:
        provider: openai
        model: text-embedding-3-small
        dimensions: 1536
        # apiKey: ""  # Optional: uses OPENAI_API_KEY env var if not provided
        # ollamaBaseUrl: http://ollama:11434  # Optional: for Ollama provider
        # baseUrl: ""  # Optional: override base URL for OpenAI-compatible APIs
      pythonExecutor:
        type: docker
        timeout: 30000
        config:
          image: aivo-python:latest
          memoryLimit: 512m
          cpuLimit: "1.0"
          network: none
          autoRemove: true
      recursionLimit: 10
      llmSmart:
        provider: openai
        apiKey: "sk-your-openai-api-key-here"
        model: gpt-4o
        temperature: 0.7
        # baseURL: ""  # Optional: for OpenAI provider
      llmFast:
        provider: openai
        apiKey: "sk-your-openai-api-key-here"
        model: gpt-4o-mini
        temperature: 0.7
        # baseURL: ""  # Optional: for OpenAI provider
      langsmith:
        endpoint: https://eu.api.smith.langchain.com
        # apiKey: ""  # Optional
        tracing: false
        project: aivo
      langfuse:
        host: http://langfuse:3000
        # publicKey: ""
        # secretKey: ""
        tracing: false
      checkpointer:
        type: memory
        # uri: ""  # Required for postgres type
      nats:
        url: nats://nats:4222
      memory:
        enabled: true
        maxMessages: 5
        summarizeThreshold: 50
        approximateTokenCounting: false
      fileStorage:
        type: s3
        config:
          region: us-east-1
          bucket: aivo-files
          accessKeyId: ""
          secretAccessKey: ""
          # endpoint: ""  # Optional: for MinIO compatibility
      fileUpload:
        maxFileSize: 1048576  # 1MB in bytes
        indexTextFiles: true
        defaultTTL: 3600  # 1 hour in seconds
        textMimeTypes:
          - text/plain
          - text/csv
          - text/html
          - text/css
          - text/javascript
          - application/json
          - application/xml
          - text/xml
          - application/javascript
          - text/markdown
          - text/yaml
          - application/x-yaml
          - text/x-yaml
          - application/yaml
          - text/vnd.yaml
      redis:
        host: redis
        port: 6379
        # password: ""  # Optional
        db: 0
      # stt:
      #   provider: openai
      #   apiKey: ""
      #   model: whisper-1
      #   baseUrl: ""  # Optional: override base URL
      #   maxDurationSeconds: 120
      #   maxFileSizeMb: 25
    kafkaLlmProxy:
      kafka:
        brokers:
          - kafka:9092
        groupId: kafka-llm-proxy
        requestsTopic: llm-requests
        responsesTopic: llm-responses
        # clarificationResponsesTopic: llm-clarification-responses
        ssl:
          enabled: false
          # caFile: ""
          # certFile: ""
          # keyFile: ""
        requestTimeoutMs: 300000
        taskName: generate_sql_from_messages
        userId: "00000000-0000-0000-0000-000000000001"
    instance:
      instanceId: kkk
      endpoints:
        graphqlHttp: http://localhost:3004/graphql
        graphqlWs: ws://localhost:3004/graphql
      brand:
        name: Aivo
        # theme:
        #   primaryColor: "#4B72E7"
        #   secondaryColor: "#000000"
        logoSvg:
          dark: |-
