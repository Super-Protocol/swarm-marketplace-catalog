# Default values for app.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: localhost:32123/vaultee-back
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Образы платформы уже non-root: backend объявляет `USER nestjs`, frontend —
# `USER nextjs`, оба под номером 1001, и файлы приложения принадлежат группе
# 1001 (`--chown=nestjs:nodejs`). Значения здесь ничего не меняют в поведении —
# они делают это ПРОВЕРЯЕМЫМ: проверка ИБ читает securityContext манифеста, а
# не метаданные образа, и «мы собираем образы правильно» она не видит
# (AIV-1590).
#
# readOnlyRootFilesystem не включается: Next.js держит кэш рендера в /app/.next
# внутри образа (frontend.dockerfile заводит этот каталог отдельным chown), и
# запись туда идёт на каждом запросе.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - ALL

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Пробы. С AIV-1294 `/healthz` у identity — это readiness, а не liveness: он
# отвечает 503, пока не отвечает база. Вешать на него liveness нельзя — моргание
# PostgreSQL перезапустило бы все поды identity вместо того, чтобы вывести их из
# ротации, а перезапуск от недоступной базы не лечит (новый под на старте в неё
# же и не достучится).
#
# Поэтому liveness проверяет только то, что процесс жив и слушает порт, а
# «готов отвечать на вопросы о тенантах» проверяет readiness.
livenessProbe:
  tcpSocket:
    port: http
  periodSeconds: 10
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  # 30 секунд недоступной базы, прежде чем под уйдёт из ротации: короче — и
  # каждая пауза в сети выдёргивала бы identity из-под api.
  failureThreshold: 3
# Первый старт — это ещё и прогон миграций на пустой базе, плюс до пяти попыток
# подключения по 3 секунды внутри TypeORM. Без startupProbe этим временем
# распоряжается liveness, и она успела бы убить под посреди DDL.
startupProbe:
  tcpSocket:
    port: http
  periodSeconds: 5
  failureThreshold: 30

# Стратегия обновления. Recreate, а не RollingUpdate: новый под применяет
# миграции на старте, и при перекрытии старый под какое-то время работает с уже
# изменённой схемой. Сервис однорепличный и поднимается за секунды, поэтому
# короткий перерыв дешевле, чем работа старого кода по новой схеме.
strategy:
  type: Recreate

# Образ применяет миграции на старте под `pg_advisory_lock` (aivoagent/agent#1159,
# AIV-2669): поды identity стартуют одновременно без гонки DDL. Чарт версию образа
# не знает, поэтому это говорится явно; на образе без лока `true` вернул бы гонку.
bootMigrationsLocked: false

# Автомасштабирование. Пока миграции применяются на старте (по умолчанию —
# `config.services.identity.db.config.migrationsRun`) без лока, реплика должна
# быть одна: несколько подов пойдут применять миграции наперегонки. Родительский
# чарт этот случай отказывается рендерить
# (aivo/templates/identity-migrations-guard.yaml), пока не задан
# `bootMigrationsLocked: true` выше.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Placement of the replicas across nodes (AIV-2669). The service is stateless —
# every replica answers every request — so a second replica only buys anything
# if it sits on another node: a soft `kubernetes.io/hostname` anti-affinity
# against its own pods, merged with `affinity` above (an `affinity` that carries
# its own `podAntiAffinity` replaces it). `required: true` makes the term hard —
# for a cluster with at least `replicaCount` + 1 worker nodes; with fewer, the
# extra pod stays Pending. Costs nothing at one replica.
podAntiAffinity:
  enabled: true
  required: false

# `auto` renders a PodDisruptionBudget once `replicaCount` (or, under the HPA,
# `autoscaling.minReplicas`) is above one, so a node drain cannot take every
# replica at once; `true` / `false` decide it outright. `maxUnavailable` wins
# over `minAvailable` when set; exactly one of them has to carry a value.
podDisruptionBudget:
  enabled: auto
  minAvailable: 1
  maxUnavailable: ""

clusterDomain: cluster.local

config:
  args:
  - apps/identity/dist/main.js
  port: 80
