{{- if .Values.kafkaSsl.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-kafka-ssl
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
data:
  ca.pem: {{ .Values.kafkaSsl.ca | b64enc }}
  cert.pem: {{ .Values.kafkaSsl.cert | b64enc }}
  key.pem: {{ .Values.kafkaSsl.key | b64enc }}
{{- end }}
