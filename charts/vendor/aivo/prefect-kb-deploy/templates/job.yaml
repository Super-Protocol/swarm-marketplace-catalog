apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: deploy
          image: {{ .Values.image | quote }}
          command:
            - sh
            - -c
            - |
              prefect work-pool create {{ .Values.workPool | quote }} --type kubernetes 2>/dev/null || true
              prefect work-pool resume {{ .Values.workPool | quote }} 2>/dev/null || true
              prefect deploy --all
          workingDir: /app
          env:
            - name: PREFECT_API_URL
              value: {{ .Values.prefectApiUrl | quote }}
          volumeMounts:
            - name: config
              mountPath: /app/prefect.yaml
              subPath: prefect.yaml
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
      restartPolicy: Never
