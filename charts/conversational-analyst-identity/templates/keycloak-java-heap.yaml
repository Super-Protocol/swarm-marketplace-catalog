{{- /*
The JVM heap ceiling, as a number this chart chose rather than a share of the container limit.

`kc.sh` sizes the heap from the container when `JAVA_OPTS_KC_HEAP` is unset, and the bitnami
image leaves it unset:

    JAVA_OPTS_KC_HEAP="-XX:MaxRAMPercentage=70 -XX:MinRAMPercentage=70 -XX:InitialRAMPercentage=50"

Under the 2Gi limit below that is an initial heap of 1024 MiB and a maximum of 1434 MiB — and
the heap is not what the kernel counts. Metaspace (capped at 256m by the same script), the code
cache, G1's own bookkeeping, thread stacks and Netty's direct buffers are all outside it and
add 435-609 MiB on this image, so the container's own ceiling all but reaches its limit and
the question is when the heap finishes expanding into it. Read on the Latica stands as
`OOMKilled`, exit 137, at 2.6 h and 15.6 h of uptime, each kill costing ~50 s during which
`/auth/realms/...` answers 502 and then 503 and nobody can sign in (SUP-917, SUP-925).

Measured on kind with this image digest and this chart's own values, 55 minutes of sign-in
load: with the heap `kc.sh` picks, the container peaks at 1460 MiB and keeps CREEPING — 1.52 MiB
a minute, with 589 MiB of its limit left — while its ceiling, `-Xmx` plus the 435-609 MiB that
is not heap, lands in the last 200 MiB of that limit. A limit cannot fix that on its own,
because a percentage of a bigger limit is a bigger heap, so the heap is capped here and the
limit is sized above it: 768 MiB of heap, an 886 MiB peak, a creep of 0.14 MiB a minute and a
ceiling 671 MiB clear. The live set is ~160 MiB either way, so the cap costs nothing.

Worse, a percentage is not even reliably a percentage of the container. On a kernel whose
`/proc/cgroups` carries no `memory` row the JVM's container support switches itself off —
«controller memory is not enabled» — while `UseContainerSupport` still reports true and
`/sys/fs/cgroup/memory.max` still reads the limit from inside the container; this image then
resolved `-XX:MaxRAMPercentage=70` against the HOST's 31 GiB (`MaxHeapSize = 23555211264`) and
was OOMKilled five times in twenty minutes. An absolute `-Xmx` is the same number on any
kernel, which is why it is the one here.

This is a ConfigMap and not an `extraEnvVars` entry on purpose. A definition's list REPLACES
the chart's rather than appending to it, and the conversational-analyst listing supplies that
list for five variables of its own — so an entry added there would be dropped by every
marketplace deployment, which is the trap `charts/tests/keycloak_jvm.py` exists for. The
vendored chart renders `extraEnvVarsCM` into `envFrom` after its own env ConfigMap and before
the hostname Secret, none of which defines this variable, and the listing sets no
`extraEnvVarsCM` — so what is written here is what the JVM gets.

A constant, so it is attested in full rather than excluded, and a data owner reading the signed
snapshot can see the heap this deployment's identity provider is allowed to grow to.

One dependency worth naming: `kc.sh` reads `JAVA_OPTS_KC_HEAP` only while `JAVA_OPTS` itself is
unset — anything that sets `JAVA_OPTS` takes the whole block, this cap included. Nothing in
this chart or the listing does; `charts/tests/analyst_boot.py` asserts the wiring, and the
container's own log says «JAVA_OPTS_KC_HEAP already set in environment; overriding default
settings» when it is in force.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: analyst-keycloak-java-opts
  labels:
    app.kubernetes.io/name: conversational-analyst-identity
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  JAVA_OPTS_KC_HEAP: {{ required "keycloakHeap must set the JVM heap flags" .Values.keycloakHeap | quote }}
