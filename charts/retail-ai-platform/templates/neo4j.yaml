{{- /*
The knowledge graph the agent grounds against: System -> Namespace -> Dataset -> Field, with
embeddings and vector indexes. Community edition, single instance — the graph is derived from
the bound datasets and can be rebuilt, so it is a cache, not a system of record.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  labels:
    app: neo4j
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  labels:
    app: neo4j
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      # Kubernetes injects NEO4J_PORT=tcp://... from the Service of the same name, which the
      # server reads as its own configuration and refuses to start on.
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: {{ .Values.neo4j.image | quote }}
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          env:
            - name: NEO4J_AUTH
              value: "neo4j/{{ include "platform.internalSecret" . }}"
            - name: NEO4J_server_memory_heap_initial__size
              value: {{ .Values.neo4j.heap.initial | quote }}
            - name: NEO4J_server_memory_heap_max__size
              value: {{ .Values.neo4j.heap.max | quote }}
            - name: NEO4J_server_memory_pagecache_size
              value: {{ .Values.neo4j.pagecache | quote }}
            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.neo4j.storage | quote }}
