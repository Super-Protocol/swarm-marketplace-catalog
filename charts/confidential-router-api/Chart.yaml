apiVersion: v2
name: confidential-router-api
description: The Confidential Router's OpenAI-compatible gateway and console GraphQL API, with the replicated PostgreSQL it stores generations and sessions in.
type: application
# 0.8.0 adds the attested egress: a second container in the API pod, the
# gatekeeper's own core, verifying an external model endpoint before anything is
# proxied to it (ADR-008). Off unless `externalEndpoints.enabled` says otherwise,
# and a re-pin rollout for anyone pinning this deployment's digest when it is on.
#
# 0.8.1 re-pins that sidecar to the build whose supervisor waits for a runnable
# configuration. The 0.8.0 build handed router-api's first render — `endpoints: []`,
# which every fresh deployment starts from — straight to `gatekeeper run`, which
# exits 4 on it: the API pod never became Ready and its hostname answered 503 on
# every path, the admin page that registers an endpoint included (SUP-248).
#
# 0.9.0 adds `billing.signupGrantUsd` — credit granted to every new account at
# registration (SUP-249), rendered into `router.yaml` only when above zero.
#
# 0.9.1 re-pins the router API and its egress sidecar to `main-5efa452`: the
# sidecar verifies roots enrolled on Azure confidential VMs (SUP-251) and the API
# drives two-factor endpoint trust — cloud measurement and pinned digest
# (SUP-252). No values change.
#
# 0.10.0 always renders the deployment's own endpoint (`ownEndpoint`, new), not
# only the ones a selected model refers to. An empty model selection rendered
# `endpoints: []`, so the API could not tell which endpoint was its own and the
# chat composer stayed locked, asking the user to name it in the router
# configuration — on exactly the shape the listing's form arrives at since
# 0.13.0 (SUP-255). The hostname stays the `${ROUTER_PUBLIC_HOSTNAME}`
# placeholder (SUP-211), so the snapshot is still hostname-independent — but it
# does gain a block: `checksum/config` moves for every no-model and external-only
# render, and anyone pinning such a deployment's digest re-pins. Renders with a
# model selected are unchanged.
#
# 0.10.0 also re-pins the router API and its egress sidecar to `main-f23d2d6`,
# the build that lands the rest of SUP-255: hex-only digests in the console's
# upstream dialog and verdict timeline (with the API sending the hex twins), the
# "How to connect" page, and the gatekeeper's registry lookup proven against the
# real signatures layout.
#
# 0.10.1 (SUP-266) re-pins the router API to `main-9e86c41`, which lands SUP-267:
# an account without a password — the bootstrapped first admin — can set one.
# No template change; the egress sidecar keeps its pin.
#
# 0.11.0 adds `mail` (SUP-269): SMTP or Resend for sign-in links, password reset
# and the welcome email. Every mail value reaches the pod out of the Secret as a
# `CR_API_MAIL__*` variable, and the env list names all of them `optional`
# whatever is configured — so the attested objects, and the evidence digest, are
# the same for every mail setup (`charts/tests/mail_invariance.py`). The env list
# itself grows by those nine entries for everyone, so anyone pinning a digest
# re-pins once. With `mail.provider` unset nothing is set and an image older than
# the section boots as before; configuring a provider needs a router image from
# SUP-269 on.
version: 0.11.0
appVersion: "0.4.1"
dependencies:
  # Three PostgreSQL instances under Patroni, one per node, with synchronous
  # replication — because a tenant volume on this platform lives on the node's
  # per-boot-ephemeral disk, so a single-instance database does not survive the node
  # it is on being rebooted (SUP-179), and routine TCB updates reboot nodes.
  #
  # 0.2.0 keeps Patroni's leader lock in its own in-namespace etcd and puts a TCP
  # router in front of the leader. 0.1.0 used the Kubernetes API, which a cluster
  # space's confinement blocks: it deployed cleanly and never elected anybody
  # (SUP-215).
  #
  # Aliased to `postgresql` so the values key an application sets is the one it
  # always was. Off for a deployment that brings its own database: set
  # `postgresql.enabled: false` and point `database.*` at it.
  - name: patroni-postgresql
    version: 0.2.2
    repository: "file://../patroni-postgresql"
    alias: postgresql
    condition: postgresql.enabled
