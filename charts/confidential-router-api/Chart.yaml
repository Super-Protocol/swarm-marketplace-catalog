apiVersion: v2
name: confidential-router-api
description: The Confidential Router's OpenAI-compatible gateway and console GraphQL API, with the replicated PostgreSQL it stores generations and sessions in.
type: application
# 0.8.0 adds the attested egress: a second container in the API pod, the
# gatekeeper's own core, verifying an external model endpoint before anything is
# proxied to it (ADR-008). Off unless `externalEndpoints.enabled` says otherwise,
# and a re-pin rollout for anyone pinning this deployment's digest when it is on.
#
# 0.8.1 re-pins that sidecar to the build whose supervisor waits for a runnable
# configuration. The 0.8.0 build handed router-api's first render — `endpoints: []`,
# which every fresh deployment starts from — straight to `gatekeeper run`, which
# exits 4 on it: the API pod never became Ready and its hostname answered 503 on
# every path, the admin page that registers an endpoint included (SUP-248).
#
# 0.9.0 adds `billing.signupGrantUsd` — credit granted to every new account at
# registration (SUP-249), rendered into `router.yaml` only when above zero.
#
# 0.9.1 re-pins the router API and its egress sidecar to `main-5efa452`: the
# sidecar verifies roots enrolled on Azure confidential VMs (SUP-251) and the API
# drives two-factor endpoint trust — cloud measurement and pinned digest
# (SUP-252). No values change.
#
# 0.10.0 always renders the deployment's own endpoint (`ownEndpoint`, new), not
# only the ones a selected model refers to. An empty model selection rendered
# `endpoints: []`, so the API could not tell which endpoint was its own and the
# chat composer stayed locked, asking the user to name it in the router
# configuration — on exactly the shape the listing's form arrives at since
# 0.13.0 (SUP-255). The hostname stays the `${ROUTER_PUBLIC_HOSTNAME}`
# placeholder (SUP-211), so the snapshot is still hostname-independent — but it
# does gain a block: `checksum/config` moves for every no-model and external-only
# render, and anyone pinning such a deployment's digest re-pins. Renders with a
# model selected are unchanged.
#
# 0.10.0 also re-pins the router API and its egress sidecar to `main-f23d2d6`,
# the build that lands the rest of SUP-255: hex-only digests in the console's
# upstream dialog and verdict timeline (with the API sending the hex twins), the
# "How to connect" page, and the gatekeeper's registry lookup proven against the
# real signatures layout.
#
# 0.10.1 (SUP-266) re-pins the router API to `main-9e86c41`, which lands SUP-267:
# an account without a password — the bootstrapped first admin — can set one.
# No template change; the egress sidecar keeps its pin.
#
# 0.10.2 (SUP-268) re-pins the router API to `main-b885b86`: the admin
# Invitations API (mint, list, attribution, statistics) and the TEE label read
# from published evidence (SUP-270). No template change; the egress sidecar keeps
# its pin.
#
# 0.11.0 is SUP-269: sign-in by a code mailed to the address, and the mail to
# send it with. `auth.password` is gone from the values and from the rendered
# config — the router stores no hash — `auth.sessionDays` sets how long a browser
# stays signed in (90), `auth.magicLink.enabled: false` leaves the code as the
# only mail sign-in, and a deployment with no mail, no OAuth app and no
# first-sign-in token is refused at render time because nobody could enter it.
#
# It pins the router API to `main-44708f9`, which also carries the invitation
# codes CSV export/import (SUP-272) and the data export/import bundle (SUP-271);
# the egress sidecar keeps its pin — nothing under `apps/gatekeeper` changed.
#
# It adds `mail`: SMTP or Resend for sign-in codes and the welcome email. Every mail value reaches the pod out of the Secret as a
# `CR_API_MAIL__*` variable, and the env list names all of them `optional`
# whatever is configured — so the attested objects, and the evidence digest, are
# the same for every mail setup (`charts/tests/mail_invariance.py`). The env list
# itself grows by those nine entries for everyone, so anyone pinning a digest
# re-pins once. It needs a router image from SUP-269 on: an older one has no
# code sign-in, and with the password block gone it would have no sign-in at all.
#
# 0.11.1 (SUP-275) routes `/admin` on the API's Ingress. 0.11.0 pinned the build
# with the data export/import and the invitation codes CSV and left their
# controllers — `admin/data`, `admin/invite-codes` — off `ingress.paths`, so all
# four routes answered 404 from nginx on every deployment and neither screen
# could work. One more path in the attested Ingress: anyone pinning a digest
# re-pins. No image change.
#
# 0.12.0 (SUP-260) drops `endpoints.<name>.tee`. It was an operator-declared TEE
# label rendered into the attested `router.yaml` and printed by the console
# beside the endpoint — and one chart holds one value of it, so every deployment
# of this listing claimed "Intel TDX + H100 CC": the Azure clouds running on AMD
# SEV-SNP, and the pure-TDX production cloud with no GPU at all, which is where
# the test group read it off the screen. One listing deploys to both, so no
# string here can be right for all of them. The router names the TEE from the
# hardware branch of the `TeeEvidence` in the root certificate of the evidence
# each endpoint publishes instead — read, never verified (ADR-002) — which is
# the only source that differs per deployment because it *is* the deployment.
#
# One line leaves the attested document, so `checksum/config` moves on every
# render and anyone pinning a digest re-pins once.
#
# ⚠ Not publishable as it stands: `image.digest` is still the 0.11.x build,
# which declares `endpoints[].tee` required and therefore refuses to boot on
# the document this version renders — so 0.12.0 would ship as a chart that
# cannot install on its own defaults. Re-pin `image.digest` to a router image
# built from confidential-router#107 on, in the change that publishes this
# version. A listing must move to this chart version and to such an image
# together, and its own `image.digest` override does not make the chart safe.
#
# 0.12.1 (SUP-300) is that change: it re-pins the router API and its egress
# sidecar to `main-82769ff`, so the ⚠ above is cleared and 0.12.x becomes
# installable on its own defaults. That head carries the whole test-group
# train — the TEE label read from published evidence (SUP-260, the build
# 0.12.0's document requires), the sidecar that no longer reuses an upstream
# connection the far end has closed (SUP-289), the installer's PATH line,
# field-level sign-up refusals and a non-empty external evidence export
# (SUP-295), and CLI messages that confirm what happened, where and what to run
# next (SUP-300). No template change on top of 0.12.0 and no values change
# besides the two digests; anyone pinning a deployment's evidence digest
# re-pins once for 0.12.0's dropped line and the new images together.
#
# 0.13.0 (SUP-409) adds `mail.replyTo`, written to the Secret as
# `mail-reply-to` and read as `CR_API_MAIL__REPLY_TO`. The sender on a
# deployment is a no-reply address on a domain that need not receive mail at
# all — `router.superprotocol.com` has no MX, and a probe against Google's MX
# returned 5.1.3 for every address on it — so without this a reply, or a bounce
# a human returns by hand, reaches nothing. Unset writes no key and sends no
# header, so a deployment that says nothing sends what it sent before.
#
# The value is not optional for the chart's own default, which is why this is a
# minor and not a patch: `image.digest` moves to `main-5de9e7d`, the first
# router build whose config schema knows the key. The schema is strict, so the
# two must move together — 0.12.1's image refuses to boot on a Secret carrying
# `mail-reply-to`, the same trap 0.12.0's ⚠ above described. Riding along from
# the same head, because an image is a head and not a cherry-pick: the lifted
# 5s upstream deadline and 1 MiB `/v1` body cap (SUP-339) and a documentation
# fix in the console's VS Code steps. The gatekeeper sidecar does not move.
#
# 0.13.1 (SUP-434) re-pins the router API and its egress sidecar to
# `main-37ed4ba`, the head of the deploy train this version exists to carry. No
# template change and no values change besides the two digests, so this is a
# patch: the rendered documents are 0.13.0's, and only what runs inside them
# moves.
#
# The sidecar is the reason the train leaves at all, and it is the first time
# this chart has moved it since 0.12.1. A re-attestation that failed latched the
# gatekeeper into deny until the next five-minute tick, so a six-second upstream
# blip cost ten minutes of refusals; it now re-attests on demand when a request
# meets a denial (SUP-422). The server-side half of that fix is this container
# and nothing else, which is why a reconfigure could never have delivered it.
#
# Arriving from the same head, because an image is a head and not a cherry-pick:
# an invite-only deployment no longer mails a sign-in code to an address it would
# refuse to register (SUP-410), and evidence coverage no longer reads 0% for a
# generation served through an external model endpoint, with no ratio shown
# where no request was coverable (SUP-421, SUP-429, SUP-430). `mail.replyTo`
# arrived in 0.13.0 and is unchanged here.
#
# 0.13.2 (SUP-424) re-pins the router API to `main-7b7aaba`. The metering a
# user is billed against is now honest: every streamed first token is timed
# even when the stream opens with a tool call rather than text, a rate nothing
# could measure reads as absent instead of as a fabricated number — a
# two-token completion no longer claims 2000 tok/s — and a ledger usage row is
# priced to four decimals, so a sub-cent charge is a number and not `-$0.00`.
#
# A patch, and the second one in this train: 0.13.1 was published and the chart
# repository is append-only, so SUP-424 arriving after that merge is a new
# version rather than an edit. No template change and no values change besides
# the one digest. The egress sidecar does not move — `7b7aaba` changes no Go
# code at all, so release `0.3.2` is the same gatekeeper source this head would
# produce.
version: 0.13.2
appVersion: "0.4.1"
dependencies:
  # Three PostgreSQL instances under Patroni, one per node, with synchronous
  # replication — because a tenant volume on this platform lives on the node's
  # per-boot-ephemeral disk, so a single-instance database does not survive the node
  # it is on being rebooted (SUP-179), and routine TCB updates reboot nodes.
  #
  # 0.2.0 keeps Patroni's leader lock in its own in-namespace etcd and puts a TCP
  # router in front of the leader. 0.1.0 used the Kubernetes API, which a cluster
  # space's confinement blocks: it deployed cleanly and never elected anybody
  # (SUP-215).
  #
  # Aliased to `postgresql` so the values key an application sets is the one it
  # always was. Off for a deployment that brings its own database: set
  # `postgresql.enabled: false` and point `database.*` at it.
  - name: patroni-postgresql
    version: 0.2.2
    repository: "file://../patroni-postgresql"
    alias: postgresql
    condition: postgresql.enabled
