apiVersion: v2
name: confidential-router-api
description: The Confidential Router's OpenAI-compatible gateway and console GraphQL API, with the replicated PostgreSQL it stores generations and sessions in.
type: application
# 0.8.0 adds the attested egress: a second container in the API pod, the
# gatekeeper's own core, verifying an external model endpoint before anything is
# proxied to it (ADR-008). Off unless `externalEndpoints.enabled` says otherwise,
# and a re-pin rollout for anyone pinning this deployment's digest when it is on.
version: 0.8.0
appVersion: "0.4.0"
dependencies:
  # Three PostgreSQL instances under Patroni, one per node, with synchronous
  # replication — because a tenant volume on this platform lives on the node's
  # per-boot-ephemeral disk, so a single-instance database does not survive the node
  # it is on being rebooted (SUP-179), and routine TCB updates reboot nodes.
  #
  # 0.2.0 keeps Patroni's leader lock in its own in-namespace etcd and puts a TCP
  # router in front of the leader. 0.1.0 used the Kubernetes API, which a cluster
  # space's confinement blocks: it deployed cleanly and never elected anybody
  # (SUP-215).
  #
  # Aliased to `postgresql` so the values key an application sets is the one it
  # always was. Off for a deployment that brings its own database: set
  # `postgresql.enabled: false` and point `database.*` at it.
  - name: patroni-postgresql
    version: 0.2.1
    repository: "file://../patroni-postgresql"
    alias: postgresql
    condition: postgresql.enabled
