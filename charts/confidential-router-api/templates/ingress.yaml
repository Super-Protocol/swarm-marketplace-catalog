{{- if .Values.ingress.enabled }}
{{- /*
Only the paths a client outside the cluster needs — `ingress.paths` says which,
and why each one is there. `/health` and `/docs` stay inside.

Without `ingressClassName` the object is created, the cloud registers the
hostname and writes its DNS, and nothing serves it — the controller only picks up
what names it.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "confidential-router-api.fullname" . }}
  labels:
    {{- include "confidential-router-api.labels" . | nindent 4 }}
  annotations:
    # The hostname is the one thing that differs between two deployments of this
    # version, and a digest that varied with it would be a digest nobody else
    # could ever match (SUP-211). Declared in the listing's `evidence.exclude` as
    # well — that is what the marketplace reads to show the exclusion beside the
    # digest.
    #
    # The TLS host is the same hostname again, so it is listed too when the chart
    # terminates TLS itself. This listing does not: the cloud holds the
    # certificate, `ingress.tls.enabled` is false, and the rendered value is the
    # single `/spec/rules/0/host` the definition declares.
    swarm.io/exclude-evidence-fields: {{ (printf "/spec/rules/0/host%s" (ternary ",/spec/tls/0/hosts/0" "" .Values.ingress.tls.enabled)) | quote }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "apiHostname must be set" .Values.apiHostname | quote }}
      secretName: {{ required "ingress.tls.secretName must be set when ingress.tls.enabled is" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ required "apiHostname must be set" .Values.apiHostname | quote }}
      http:
        paths:
          {{- range .Values.ingress.paths }}
          - path: {{ . | quote }}
            pathType: {{ $.Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "confidential-router-api.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
{{- end }}
