{{- include "confidential-router-api.validate" . -}}
{{- $modelNames := include "confidential-router-api.selectedModels" . | fromJsonArray -}}
{{- $endpointNames := include "confidential-router-api.referencedEndpoints" . | fromJsonArray -}}
{{- /*
`conf/router.yaml` for the router API, rendered from this chart's values.

Secrets are never written here. Every one of them is a `${…}` placeholder that
the config loader substitutes from the process environment, and the environment
is filled from a Secret by the Deployment — so this object stays readable to
anyone who can read the namespace without handing them the signing key.

Neither is a hostname, for a different reason: this document is attested, and a
hostname interpolated into it made the deployment's evidence digest a property of
the name the operator chose, so no two deployments could agree on one
`expectedDigest` (SUP-210). The five `ROUTER_PUBLIC_*` / `ROUTER_*_URL`
placeholders below are filled from `configmap-public.yaml`, which is excluded
from the snapshot while this document stays in it in full. Which is the whole
point: what the router is configured to do remains attested; only where it
answers is left out, and the listing discloses that it is.

The placeholder names deliberately do not start with `CR_API_`: that prefix is
also the environment *configuration* layer, and `CR_API_DATABASE_URL` would be
read as a top-level `databaseUrl` key and fail the boot on a strict schema.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "confidential-router-api.fullname" . }}
  labels:
    {{- include "confidential-router-api.labels" . | nindent 4 }}
data:
  router.yaml: |
    version: 1

    server:
      port: {{ .Values.service.targetPort | int64 }}
      host: 0.0.0.0
      publicBaseUrl: "${ROUTER_PUBLIC_BASE_URL}"
      # CORS, and Better Auth's trusted origins. The console calls this API from
      # the browser with `credentials: 'include'`, so its origin has to be here —
      # and so does the campaign landing page's, which looks an invitation code up
      # from the browser before anyone has signed in at all.
      #
      # One scalar rather than a list: the router's schema splits a
      # comma-separated string back into the list, and a placeholder per index
      # would mean rendering how many origins there are — which is itself
      # hostname-derived, since the second one exists only when a campaign named
      # a landing page.
      validClientOrigins: "${ROUTER_VALID_CLIENT_ORIGINS}"

    database:
      type: postgres
      url: ${ROUTER_DATABASE_URL}
      # The init container owns the schema; replicas must not race each other.
      migrationsRun: false

    backends:
      litellm:
        baseUrl: {{ .Values.litellmUrl | quote }}
        {{- if or .Values.litellm.apiKey .Values.litellm.existingSecret }}
        apiKey: ${ROUTER_LITELLM_API_KEY}
        {{- end }}
        connectTimeout: {{ .Values.litellm.connectTimeout | quote }}
        readTimeout: {{ .Values.litellm.readTimeout | quote }}

    {{- if $endpointNames }}

    endpoints:
      {{- range $name := $endpointNames }}
      {{- $endpoint := get $.Values.endpoints $name }}
      - name: {{ $name | quote }}
        {{- /*
        This deployment's own API hostname unless the endpoint named another: the
        router fetches an endpoint's evidence bundle from it. The default is the
        placeholder rather than the value, so an endpoint that did not name a
        hostname does not put one in an attested document; an endpoint that did
        is a parameter, and parameters belong in the digest.
        */}}
        hostname: {{ $endpoint.hostname | default "${ROUTER_PUBLIC_HOSTNAME}" | quote }}
        tee: {{ required (printf "endpoints.%s.tee must be set" $name) $endpoint.tee | quote }}
        {{- if $endpoint.evidenceUrl }}
        evidenceUrl: {{ $endpoint.evidenceUrl | quote }}
        {{- end }}
      {{- end }}
    {{- else }}

    # Every model is switched off, so there is nothing to attest and nothing to
    # serve: /v1 answers model_not_found until one is turned on.
    endpoints: []
    {{- end }}

    {{- if $modelNames }}

    # `litellmModel` is the catalogue key, which is the Ollama model name and the
    # name LiteLLM publishes: one string, all the way down.
    models:
      {{- range $name := $modelNames }}
      {{- $model := get $.Values.modelCatalog $name }}
      - id: {{ required (printf "modelCatalog.%q.id must be set" $name) $model.id | quote }}
        name: {{ required (printf "modelCatalog.%q.name must be set" $name) $model.name | quote }}
        litellmModel: {{ $name | quote }}
        endpoint: {{ $model.endpoint | quote }}
        contextLength: {{ required (printf "modelCatalog.%q.contextLength must be set" $name) $model.contextLength | int64 }}
        capabilities: [{{ join ", " ($model.capabilities | default (list "chat" "completions")) }}]
        pricing:
          promptPer1mMicros: {{ $model.pricing.promptPer1mMicros | int64 }}
          completionPer1mMicros: {{ $model.pricing.completionPer1mMicros | int64 }}
      {{- end }}
    {{- else }}

    models: []
    {{- end }}

    evidence:
      pollInterval: {{ .Values.evidence.pollInterval | quote }}
      freshnessWindow: {{ .Values.evidence.freshnessWindow | quote }}

    rateLimits:
      requestsPerMinute: {{ .Values.rateLimits.requestsPerMinute | int64 }}
      tokensPerMinute: {{ .Values.rateLimits.tokensPerMinute | int64 }}

    auth:
      baseUrl: "${ROUTER_PUBLIC_BASE_URL}"
      secret: ${ROUTER_AUTH_SECRET}
      sessionMaxAge: {{ .Values.auth.sessionMaxAge | quote }}
      {{- if .Values.auth.github.clientId }}
      github:
        clientId: {{ .Values.auth.github.clientId | quote }}
        clientSecret: ${ROUTER_GITHUB_CLIENT_SECRET}
      {{- end }}
      {{- if .Values.auth.google.clientId }}
      google:
        clientId: {{ .Values.auth.google.clientId | quote }}
        clientSecret: ${ROUTER_GOOGLE_CLIENT_SECRET}
      {{- end }}
      magicLink:
        mailer: {{ .Values.auth.magicLink.mailer | quote }}
        from: {{ .Values.auth.magicLink.from | quote }}
        {{- if eq .Values.auth.magicLink.mailer "resend" }}
        resendApiKey: ${ROUTER_RESEND_API_KEY}
        {{- end }}
      {{- if .Values.auth.password.enabled }}
      # Rendered only while it is on, for the same reason `bootstrapToken` is:
      # the router's config schema is strict, so an image that predates SUP-112
      # would refuse to boot on the key rather than ignore it.
      password:
        enabled: true
        minLength: {{ .Values.auth.password.minLength | int64 }}
      {{- end }}
      {{- if .Values.auth.requireInviteForSignUp }}
      # Invite-only registration (SUP-173): no sign-up path creates an account
      # without an invitation code that is valid and unredeemed. Rendered only
      # while it is on, the same seam rule as `password` above — an image that
      # predates the key would refuse to boot on it rather than ignore it, and an
      # explicit `false` would buy nothing the default does not.
      requireInviteForSignUp: true
      {{- end }}

    # This section is the one place the chart does *not* keep itself bootable on an
    # older image. `maxTopUpMicros` is unconditional, so on a router that predates
    # SUP-167 — whose config schema is strict — every mode is a boot refusal, not
    # just `disabled`. That is deliberate and is the safe direction: the image that
    # would accept this chart without the key is the image that mints credit from a
    # signed link, and a pod that will not start is a better outcome than one that
    # quietly publishes a free-credit button. The chart version bump is the marker
    # that the two have to move together.
    billing:
      {{- if eq .Values.billing.mode "disabled" }}
      # Named rather than left to the API's fallback, which was to bind the minting
      # provider whenever `stripe` was absent (SUP-167). Conditional because the
      # value is only meaningful for this mode, not to keep an older image booting.
      provider: disabled
      {{- end }}
      minTopUpMicros: {{ .Values.billing.minTopUpMicros | int64 }}
      maxTopUpMicros: {{ .Values.billing.maxTopUpMicros | int64 }}
      allowOverdraftMicros: {{ .Values.billing.allowOverdraftMicros | int64 }}
      checkoutReturnUrl: "${ROUTER_CHECKOUT_RETURN_URL}"
      autoTopUpCooldown: {{ .Values.billing.autoTopUpCooldown | quote }}
      {{- if eq .Values.billing.mode "stripe" }}
      stripe:
        secretKey: ${ROUTER_STRIPE_SECRET_KEY}
        webhookSecret: ${ROUTER_STRIPE_WEBHOOK_SECRET}
        currency: {{ .Values.billing.stripe.currency | quote }}
      {{- end }}

    {{- if .Values.invites.landingHostname }}

    # Where the codes are handed out: the origin the generated invitation URLs
    # point at, and — through `validClientOrigins` above — the one page allowed to
    # look a code up. Rendered only when a landing page was named, so an image
    # that predates the feature still boots on this chart rather than refusing a
    # key its schema has never heard of.
    invites:
      landingBaseUrl: "${ROUTER_LANDING_BASE_URL}"
      lookupsPerMinute: {{ .Values.invites.lookupsPerMinute | int64 }}
    {{- end }}

    log:
      level: {{ .Values.log.level | quote }}
      pretty: {{ .Values.log.pretty }}

    graphql:
      path: {{ .Values.graphql.path | quote }}
      introspection: {{ .Values.graphql.introspection }}

    gatekeeper:
      repo: {{ .Values.gatekeeper.repo | quote }}
      apiBaseUrl: {{ .Values.gatekeeper.apiBaseUrl | quote }}
      cacheTtl: {{ .Values.gatekeeper.cacheTtl | quote }}
      requestTimeout: {{ .Values.gatekeeper.requestTimeout | quote }}

    swagger:
      enabled: {{ .Values.swagger.enabled }}
      path: {{ .Values.swagger.path | quote }}
