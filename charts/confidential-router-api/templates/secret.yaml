{{- include "confidential-router-api.validate" . -}}
{{- /*
Everything the rendered config refers to with a `${…}` placeholder, in one
object. A deployment that already keeps its secrets somewhere else points the
matching `existingSecret` value at that object instead, and this chart writes one
key fewer — down to no object at all when every one of them is external.

The bundled PostgreSQL reads its password from here too (`postgresql.auth.
existingSecret`), which is why there is exactly one place to change it.
*/ -}}
{{- $data := dict -}}
{{- if not .Values.auth.existingSecret -}}
{{- $_ := set $data "auth-secret" .Values.auth.secret -}}
{{- end -}}
{{- if .Values.postgresql.enabled -}}
{{- /*
The database chart reads three passwords out of this object, under the keys named in
`postgresql.auth.secretKeys`: the superuser's, the replication role's, and the
application's. They are one value.

That is a decision and not an oversight. This database serves one application inside
one namespace, and three distinct values would be three things to rotate, three
things a reconfigure could regenerate inconsistently, and three ways for a standby to
stop streaming — against an attacker who, having any one of them, is already inside
the namespace the other two live in.
*/ -}}
{{- $_ := set $data "postgres-password" .Values.database.password -}}
{{- $_ := set $data "replication-password" .Values.database.password -}}
{{- $_ := set $data "password" .Values.database.password -}}
{{- else if and .Values.database.password (not .Values.database.existingSecret) -}}
{{- $_ := set $data "password" .Values.database.password -}}
{{- end -}}
{{- if .Values.database.url -}}
{{- $_ := set $data "database-url" .Values.database.url -}}
{{- end -}}
{{- if and .Values.litellm.apiKey (not .Values.litellm.existingSecret) -}}
{{- $_ := set $data "litellm-api-key" .Values.litellm.apiKey -}}
{{- end -}}
{{- if and (eq .Values.billing.mode "stripe") (not .Values.billing.stripe.existingSecret) -}}
{{- $_ := set $data "stripe-secret-key" .Values.billing.stripe.secretKey -}}
{{- $_ := set $data "stripe-webhook-secret" .Values.billing.stripe.webhookSecret -}}
{{- end -}}
{{- if and (eq .Values.auth.magicLink.mailer "resend") (not .Values.auth.magicLink.resendApiKeyExistingSecret) -}}
{{- $_ := set $data "resend-api-key" .Values.auth.magicLink.resendApiKey -}}
{{- end -}}
{{- if and .Values.auth.bootstrapToken (not .Values.auth.bootstrapTokenExistingSecret) -}}
{{- $_ := set $data "bootstrap-token" .Values.auth.bootstrapToken -}}
{{- end -}}
{{- /*
None of these three is a credential. They are here because the alternative is an
attested object — the rendered ConfigMap, or the container's own env list — both
of which are readable inside the deployment's published evidence: an address
there is public and makes the evidence digest a property of who deployed it, and
a write-only ingest key there is a project anyone can write events into. A
Secret has its `/data` lifted out of the snapshot the platform attests, which is
what makes it the right place for a value that is neither secret nor
publishable.

The bootstrap address is the same string as the admin list — the marketplace
fills both from the account deploying the listing — and it reached the pod as a
plain `value:` until SUP-241, so one copy was protected and the other published.
*/ -}}
{{- if and .Values.auth.bootstrapEmail (not .Values.auth.bootstrapEmailExistingSecret) -}}
{{- $_ := set $data "bootstrap-email" .Values.auth.bootstrapEmail -}}
{{- end -}}
{{- if and .Values.auth.adminEmails (not .Values.auth.adminEmailsExistingSecret) -}}
{{- $_ := set $data "admin-emails" (join "," .Values.auth.adminEmails) -}}
{{- end -}}
{{- /*
The one reversible credential this deployment holds: the AES-256 data key an
external endpoint's upstream API key is sealed under (ADR-008 §6). Here rather
than in the rendered config for the hardest version of the SUP-124 reason — that
ConfigMap is attested and published, so a key written into it would be handed out
with the evidence bundle, along with every upstream credential it opens.
*/ -}}
{{- if and .Values.externalEndpoints.enabled .Values.externalEndpoints.secretsKey (not .Values.externalEndpoints.existingSecret) -}}
{{- $_ := set $data "secrets-key" .Values.externalEndpoints.secretsKey -}}
{{- end -}}
{{- if and .Values.analytics.posthog.projectKey (not .Values.analytics.posthog.existingSecret) -}}
{{- $_ := set $data "posthog-project-key" .Values.analytics.posthog.projectKey -}}
{{- end -}}
{{- if .Values.auth.github.clientId -}}
{{- $_ := set $data "github-client-secret" (required "auth.github.clientSecret must be set when auth.github.clientId is" .Values.auth.github.clientSecret) -}}
{{- end -}}
{{- if .Values.auth.google.clientId -}}
{{- $_ := set $data "google-client-secret" (required "auth.google.clientSecret must be set when auth.google.clientId is" .Values.auth.google.clientSecret) -}}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "confidential-router-api.secretName" . }}
  labels:
    {{- include "confidential-router-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key := (keys $data | sortAlpha) }}
  {{ $key }}: {{ get $data $key | quote }}
  {{- end }}
{{- end }}
