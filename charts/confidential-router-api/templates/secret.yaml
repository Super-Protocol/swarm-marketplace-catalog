{{- include "confidential-router-api.validate" . -}}
{{- /*
Everything the rendered config refers to with a `${…}` placeholder, in one
object. A deployment that already keeps its secrets somewhere else points the
matching `existingSecret` value at that object instead, and this chart writes one
key fewer — down to no object at all when every one of them is external.

The bundled PostgreSQL reads its password from here too (`postgresql.auth.
existingSecret`), which is why there is exactly one place to change it.
*/ -}}
{{- $data := dict -}}
{{- if not .Values.auth.existingSecret -}}
{{- $_ := set $data "auth-secret" .Values.auth.secret -}}
{{- end -}}
{{- if .Values.postgresql.enabled -}}
{{- /*
Bitnami's chart takes the superuser password and the application user's from the
same secret, under the two keys named in `postgresql.auth.secretKeys`. This
database serves one application inside one namespace, so they are the same value
rather than a second thing to rotate.
*/ -}}
{{- $_ := set $data "postgres-password" .Values.database.password -}}
{{- $_ := set $data "password" .Values.database.password -}}
{{- else if and .Values.database.password (not .Values.database.existingSecret) -}}
{{- $_ := set $data "password" .Values.database.password -}}
{{- end -}}
{{- if .Values.database.url -}}
{{- $_ := set $data "database-url" .Values.database.url -}}
{{- end -}}
{{- if and .Values.litellm.apiKey (not .Values.litellm.existingSecret) -}}
{{- $_ := set $data "litellm-api-key" .Values.litellm.apiKey -}}
{{- end -}}
{{- if and (eq .Values.billing.mode "stripe") (not .Values.billing.stripe.existingSecret) -}}
{{- $_ := set $data "stripe-secret-key" .Values.billing.stripe.secretKey -}}
{{- $_ := set $data "stripe-webhook-secret" .Values.billing.stripe.webhookSecret -}}
{{- end -}}
{{- if and (eq .Values.auth.magicLink.mailer "resend") (not .Values.auth.magicLink.resendApiKeyExistingSecret) -}}
{{- $_ := set $data "resend-api-key" .Values.auth.magicLink.resendApiKey -}}
{{- end -}}
{{- if and .Values.auth.bootstrapToken (not .Values.auth.bootstrapTokenExistingSecret) -}}
{{- $_ := set $data "bootstrap-token" .Values.auth.bootstrapToken -}}
{{- end -}}
{{- if .Values.auth.github.clientId -}}
{{- $_ := set $data "github-client-secret" (required "auth.github.clientSecret must be set when auth.github.clientId is" .Values.auth.github.clientSecret) -}}
{{- end -}}
{{- if .Values.auth.google.clientId -}}
{{- $_ := set $data "google-client-secret" (required "auth.google.clientSecret must be set when auth.google.clientId is" .Values.auth.google.clientSecret) -}}
{{- end -}}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "confidential-router-api.secretName" . }}
  labels:
    {{- include "confidential-router-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key := (keys $data | sortAlpha) }}
  {{ $key }}: {{ get $data $key | quote }}
  {{- end }}
{{- end }}
