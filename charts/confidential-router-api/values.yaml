# The router's own image. Pinned by digest, not by tag: the evidence bundle a
# deployment publishes names the images it is running, and a digest is the only
# reference that stays computable from what the cluster actually pulled
# (marketplace spec §2.7). `tag` exists for a development build and is ignored
# whenever `digest` is set.
image:
  registry: ghcr.io
  repository: super-protocol/confidential-router/router-api
  digest: sha256:e46f47c286d6b978e2a28b06c868f804bc72608597647c081874d3cc4d06ea45
  tag: ""
  pullPolicy: IfNotPresent

# The published images live in a private package of the Super-Protocol org, so a
# cluster needs a pull secret naming a token with `read:packages`.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Where this API answers, and where the console that talks to it answers. Both
# are hostnames, not URLs: `publicScheme` decides the rest. The console origin is
# not decoration — it goes into `server.validClientOrigins`, which is both the
# CORS allow-list and Better Auth's trusted origins, and the console signs in
# through the browser with `credentials: 'include'`.
apiHostname: ""
consoleHostname: ""
publicScheme: https

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# Every path a client outside the cluster reaches, and no more.
#
#   /v1        the OpenAI-compatible gateway — this is what API clients call
#   /graphql   the console's data layer, called from the browser
#   /auth      Better Auth (ADR-004), called from the browser
#   /billing   Stripe's webhook, and the manual provider's checkout return link
#   /activity  the Logs screen's CSV download, a browser navigation
#   /exports   the evidence zip, opened from a signed link that may be handed on
#
# `/health` is for the kubelet and `/docs` is Swagger: neither belongs on a
# public hostname, and leaving them off is what keeps this list a decision rather
# than a leftover.
ingress:
  enabled: true
  className: nginx
  paths:
    - /v1
    - /graphql
    - /auth
    - /billing
    - /activity
    - /exports
  pathType: Prefix
  annotations:
    # Chat completions stream token by token over a long-lived connection, which
    # the default 60-second read timeout cuts off mid-sentence.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Server-sent events are worthless through a buffering proxy: the client gets
    # the whole answer at once, at the end.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
  tls:
    enabled: false
    secretName: ""

# The LiteLLM proxy in front of the model servers. The default is the service the
# confidential-router-litellm chart creates in this namespace.
litellmUrl: http://confidential-router-litellm:4000
litellm:
  # Optional. Must match `masterKey` in the confidential-router-litellm chart
  # when that one is set.
  apiKey: ""
  existingSecret: ""
  existingSecretKey: litellm-api-key
  # The router aborts a request that has produced no response headers within
  # `connectTimeout`, and a non-streaming answer produces none until it is
  # finished — so against Ollama this is not a TCP deadline, it is the budget for
  # a cold model load plus the whole generation. The 5s of the reference config
  # is sized for a backend that is already serving; a model Ollama has to read
  # off disk first takes tens of seconds, which is why the litellm chart keeps
  # models resident (`keepAlive`) and why this is 60s and not 5s.
  connectTimeout: 60s
  # CPU inference of a long answer is slow, and the whole answer arrives at once.
  readTimeout: 300s

# The DSN, in pieces. `url` overrides all of them — use it when the password
# contains characters that would have to be percent-encoded, which the pieces do
# not encode for you.
database:
  url: ""
  host: ""
  port: 5432
  name: router
  user: router
  password: ""
  # An external database's credentials. Setting this requires
  # `postgresql.enabled: false`: the bundled server would be a second, empty
  # database nothing reads.
  existingSecret: ""
  existingSecretKey: password
  sslmode: disable

# Applied by an init container on the API pod, before the server starts —
# `router-api migrate`, which is `node /app/cli/run-migrations.js`. It is
# idempotent, so a pod that restarts pays a second and prints "No pending
# migrations". `database.migrationsRun` stays off in the rendered config so the
# server process never migrates on its own.
migrations:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

# `manual` mints credit from a signed link and is what a demo or an evaluation
# runs on; `stripe` takes real payments. The API refuses to boot the manual
# provider under NODE_ENV=production (ADR-005 §4), so `mode: manual` runs the
# container outside production mode — see `nodeEnv` below.
billing:
  mode: manual
  minTopUpMicros: 5000000
  allowOverdraftMicros: 0
  autoTopUpCooldown: 1h
  stripe:
    secretKey: ""
    webhookSecret: ""
    currency: usd
    existingSecret: ""
    secretKeyKey: stripe-secret-key
    webhookSecretKey: stripe-webhook-secret

# Signing and sign-in. This section is the seam the stage-2 auth decision lands
# on: everything below is passed straight through to `auth.*` in the router
# config, so a new provider is a values change and a template block, not a
# redesign of the chart.
auth:
  # Signs session cookies and magic-link tokens. Rotating it invalidates every
  # session. Required unless `existingSecret` is set; at least 32 characters.
  secret: ""
  existingSecret: ""
  existingSecretKey: auth-secret
  sessionMaxAge: 720h
  magicLink:
    # `console` writes the sign-in link to the log — fine for an evaluation,
    # refused under NODE_ENV=production. `resend` is the only implemented mailer
    # that sends anything; `smtp` is in the config schema but not implemented.
    mailer: console
    from: no-reply@confidential-router.local
    resendApiKey: ""
    resendApiKeyExistingSecret: ""
    resendApiKeyExistingSecretKey: resend-api-key
  github:
    clientId: ""
    clientSecret: ""
  google:
    clientId: ""
    clientSecret: ""

# Which models this deployment serves. One boolean per catalogue entry; the
# rendered `models[]` and `endpoints[]` are built from whichever are on, and the
# confidential-router-litellm chart takes the same booleans so the two agree on
# what exists.
models:
  llama32_3b: true
  llama31_8b: false
  qwen25_7b: false
  qwen25_coder_7b: false
  mistral_7b: false
  gemma2_9b: false
  phi4_14b: false
  deepseek_r1_14b: false

# What each boolean means. `litellmModel` is the name LiteLLM publishes and is
# the one string that has to match this chart's litellm sibling exactly; keeping
# it equal to the Ollama model name is what makes that checkable by eye.
# Prices are micro-USD per 1M tokens: 30000 is $0.03.
modelCatalog:
  llama32_3b:
    id: meta/llama-3.2-3b-instruct:tee
    name: Llama 3.2 3B Instruct
    litellmModel: llama3.2:3b
    endpoint: confidential-router
    contextLength: 131072
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 30000
      completionPer1mMicros: 50000
  llama31_8b:
    id: meta/llama-3.1-8b-instruct:tee
    name: Llama 3.1 8B Instruct
    litellmModel: llama3.1:8b
    endpoint: confidential-router
    contextLength: 131072
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 60000
      completionPer1mMicros: 90000
  qwen25_7b:
    id: alibaba/qwen2.5-7b-instruct:tee
    name: Qwen2.5 7B Instruct
    litellmModel: qwen2.5:7b
    endpoint: confidential-router
    contextLength: 32768
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 50000
      completionPer1mMicros: 80000
  qwen25_coder_7b:
    id: alibaba/qwen2.5-coder-7b-instruct:tee
    name: Qwen2.5-Coder 7B
    litellmModel: qwen2.5-coder:7b
    endpoint: confidential-router
    contextLength: 32768
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 50000
      completionPer1mMicros: 80000
  mistral_7b:
    id: mistral/mistral-7b-instruct:tee
    name: Mistral 7B Instruct
    litellmModel: mistral:7b
    endpoint: confidential-router
    contextLength: 32768
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 50000
      completionPer1mMicros: 80000
  gemma2_9b:
    id: google/gemma-2-9b-it:tee
    name: Gemma 2 9B
    litellmModel: gemma2:9b
    endpoint: confidential-router
    contextLength: 8192
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 70000
      completionPer1mMicros: 110000
  phi4_14b:
    id: microsoft/phi-4:tee
    name: Phi-4 14B
    litellmModel: phi4:14b
    endpoint: confidential-router
    contextLength: 16384
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 90000
      completionPer1mMicros: 140000
  deepseek_r1_14b:
    id: deepseek/deepseek-r1-14b:tee
    name: DeepSeek R1 14B
    litellmModel: deepseek-r1:14b
    endpoint: confidential-router
    contextLength: 65536
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 120000
      completionPer1mMicros: 180000

# The endpoints the catalogue entries name. Only those an enabled model refers to
# are rendered, so turning every model off renders no endpoints at all. An empty
# `hostname` means `apiHostname`: in this listing every model is served by the
# one confidential deployment this chart is part of, and that is the host the
# platform publishes evidence for.
#
# `tee` is an operator-declared label. It is what the console prints next to a
# model; it is never a verdict, and nothing verifies it (ADR-002).
endpoints:
  confidential-router:
    hostname: ""
    tee: Intel TDX + H100 CC
    # An operator-only override for where the evidence bundle is fetched from.
    # Empty means `https://<hostname>/.well-known/swarm-evidence`.
    evidenceUrl: ""

evidence:
  pollInterval: 5m
  freshnessWindow: 24h

rateLimits:
  requestsPerMinute: 600
  tokensPerMinute: 2000000

log:
  level: info
  pretty: false

graphql:
  path: /graphql
  introspection: false

swagger:
  enabled: false
  path: docs

# Where the console's Gatekeeper screen reads its download links from.
gatekeeper:
  repo: Super-Protocol/confidential-router
  apiBaseUrl: https://api.github.com
  cacheTtl: 15m
  requestTimeout: 5s

# Empty means "production when billing runs on Stripe, development otherwise".
# The manual payment provider is refused under NODE_ENV=production because it
# creates credit out of nothing, so a `mode: manual` deployment has to run
# outside production mode — which also turns on the console mailer and pretty
# logs. Set this explicitly only if you know which half you want.
nodeEnv: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}

# The bundled database. `auth.existingSecret` points at the secret this chart
# creates, so the password lives in exactly one place; changing
# `fullnameOverride` means changing this too, and the templates say so rather
# than letting the two drift.
postgresql:
  enabled: true
  fullnameOverride: confidential-router-postgresql
  auth:
    username: router
    database: router
    existingSecret: confidential-router-api
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  global:
    security:
      allowInsecureImages: true
  image:
    registry: docker.io
    # public.ecr.aws/bitnami is gone; the legacy mirror is what still serves
    # these tags.
    repository: bitnamilegacy/postgresql
    tag: 17.3.0-debian-12-r1
  rbac:
    create: false
  serviceAccount:
    create: true
  networkPolicy:
    enabled: false
  primary:
    resourcesPreset: none
    persistence:
      size: 8Gi
    # A cluster space isolates the namespace already, and a deployment that
    # ships its own network policy is refused. This chart moved the switch under
    # `primary`, so the top-level one above no longer reaches it.
    networkPolicy:
      enabled: false
