# The router's own image. Pinned by digest, not by tag: the evidence bundle a
# deployment publishes names the images it is running, and a digest is the only
# reference that stays computable from what the cluster actually pulled
# (marketplace spec §2.7). `tag` exists for a development build and is ignored
# whenever `digest` is set.
image:
  registry: ghcr.io
  repository: super-protocol/confidential-router/router-api
  digest: sha256:081f99911e0d288d6df6ada72730ffcf79158373d7e417169db9db44dd3769fc
  tag: ""
  pullPolicy: IfNotPresent

# The published images are a public package now, so a cluster that can reach
# ghcr.io needs nothing here. It stays for a deployment that mirrors them into a
# registry of its own.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Where this API answers, and where the console that talks to it answers. Both
# are hostnames, not URLs: `publicScheme` decides the rest. The console origin is
# not decoration — it goes into `server.validClientOrigins`, which is both the
# CORS allow-list and Better Auth's trusted origins, and the console signs in
# through the browser with `credentials: 'include'`.
apiHostname: ""
consoleHostname: ""
publicScheme: https

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

# Every path a client outside the cluster reaches, and no more.
#
#   /v1        the OpenAI-compatible gateway — this is what API clients call
#   /graphql   the console's data layer, called from the browser
#   /auth      Better Auth (ADR-004), called from the browser
#   /billing   Stripe's webhook, and the manual provider's checkout return link
#   /activity  the Logs screen's CSV download, a browser navigation
#   /exports   the evidence zip, opened from a signed link that may be handed on
#
# `/health` is for the kubelet and `/docs` is Swagger: neither belongs on a
# public hostname, and leaving them off is what keeps this list a decision rather
# than a leftover.
ingress:
  enabled: true
  className: nginx
  paths:
    - /v1
    - /graphql
    - /auth
    - /billing
    - /activity
    - /exports
  pathType: Prefix
  annotations:
    # Chat completions stream token by token over a long-lived connection, which
    # the default 60-second read timeout cuts off mid-sentence.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Server-sent events are worthless through a buffering proxy: the client gets
    # the whole answer at once, at the end.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
  tls:
    enabled: false
    secretName: ""

# The LiteLLM proxy in front of the model servers. The default is the service the
# confidential-router-litellm chart creates in this namespace.
litellmUrl: http://confidential-router-litellm:4000
litellm:
  # Optional. Must match `masterKey` in the confidential-router-litellm chart
  # when that one is set.
  apiKey: ""
  existingSecret: ""
  existingSecretKey: litellm-api-key
  # The router aborts a request that has produced no response headers within
  # `connectTimeout`, and a non-streaming answer produces none until it is
  # finished — so against Ollama this is not a TCP deadline, it is the budget for
  # a cold model load plus the whole generation. The 5s of the reference config
  # is sized for a backend that is already serving; a model Ollama has to read
  # off disk first takes tens of seconds, which is why the litellm chart keeps
  # models resident (`keepAlive`) and why this is 60s and not 5s.
  connectTimeout: 60s
  # CPU inference of a long answer is slow, and the whole answer arrives at once.
  readTimeout: 300s

# The DSN, in pieces. `url` overrides all of them — use it when the password
# contains characters that would have to be percent-encoded, which the pieces do
# not encode for you.
database:
  url: ""
  host: ""
  port: 5432
  name: router
  user: router
  password: ""
  # An external database's credentials. Setting this requires
  # `postgresql.enabled: false`: the bundled server would be a second, empty
  # database nothing reads.
  existingSecret: ""
  existingSecretKey: password
  sslmode: disable

# Applied by an init container on the API pod, before the server starts —
# `router-api migrate`, which is `node /app/cli/run-migrations.js`. It is
# idempotent, so a pod that restarts pays a second and prints "No pending
# migrations". `database.migrationsRun` stays off in the rendered config so the
# server process never migrates on its own.
migrations:
  enabled: true
  # A cluster space's LimitRange refuses a container under 100m CPU or 128Mi, and
  # its request/limit ratio is 1, so the two have to be the same number (SUP-238).
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      nvidia.com/gpu: "0"
    limits:
      cpu: 100m
      memory: 128Mi
      nvidia.com/gpu: "0"

# `disabled` sells no credit at all: checkout is refused outright and the console
# hides its buy panel, which is the honest shape for a deployment whose credit
# arrives from invitation codes and grants. `stripe` takes real payments.
#
# `manual` is the third provider the API implements and this chart refuses it: it
# mints credit from a signed link, so the API will only bind it on a loopback
# publicBaseUrl, and every hostname this chart renders is a public one. A router
# deployment that shipped it published a free-credit button to every account
# holder (SUP-167). Use `docker/docker-compose.yml` in the router repository for a
# stack that can mint.
billing:
  mode: disabled
  minTopUpMicros: 5000000
  # Ceiling on one checkout. Not a business rule but a blast radius: whatever the
  # console's mutation accepts is what a single call can ask a provider for.
  maxTopUpMicros: 10000000000
  allowOverdraftMicros: 0
  autoTopUpCooldown: 1h
  stripe:
    secretKey: ""
    webhookSecret: ""
    currency: usd
    existingSecret: ""
    secretKeyKey: stripe-secret-key
    webhookSecretKey: stripe-webhook-secret

# Signing and sign-in. This section is the seam the stage-2 auth decision lands
# on: everything below is passed straight through to `auth.*` in the router
# config, so a new provider is a values change and a template block, not a
# redesign of the chart.
auth:
  # Signs session cookies and magic-link tokens. Rotating it invalidates every
  # session. Required unless `existingSecret` is set; at least 32 characters.
  secret: ""
  existingSecret: ""
  existingSecretKey: auth-secret
  sessionMaxAge: 720h
  magicLink:
    # `none` switches magic-link sign-in off altogether, which is the honest
    # setting for a deployment with nowhere to send mail: the console then stops
    # offering a link it cannot deliver. It is the default because the container
    # runs in production mode and `password.enabled` below already gives everyone
    # a way in. `console` writes the link to the API log, where anyone with log
    # access can use it, so it is refused in production — deliberate readers of
    # the pod log set `nodeEnv: development` as well. `resend` is the only
    # implemented mailer that sends anything; `smtp` is in the config schema but
    # not implemented.
    mailer: none
    from: no-reply@confidential-router.local
    resendApiKey: ""
    resendApiKeyExistingSecret: ""
    resendApiKeyExistingSecretKey: resend-api-key
  # Email and password — the one sign-in path that needs nothing outside the
  # cluster (SUP-112). On by default, because that is what makes a deployment
  # with no mail provider usable by anyone but its first administrator: the
  # bootstrap token below creates exactly one account, and before this everyone
  # after that was offered a magic link nobody could deliver.
  #
  # There is no email verification and no password reset: both are a mail round
  # trip, and a deployment that has a mailer would be signing in with the link
  # instead. Rendered **only when it is enabled**, so the same chart still boots
  # an image that predates the key — the same rule `bootstrapToken` follows.
  #
  # Anyone who can reach the console can create an account while this is on. The
  # account arrives with its own empty workspace, no credit and no access to
  # anyone else's keys, but it is a row in the database: turn this off on a
  # deployment whose console is reachable by people it is not for.
  password:
    enabled: true
    # Better Auth hashes with scrypt, so length is the rule worth having;
    # composition rules buy less than the characters they cost. 8–128; the
    # console reads it back from the API and enforces the same number.
    minLength: 12
  # Invite-only registration: while this is on, **no** sign-up path — password,
  # magic link or OAuth — creates an account unless the request carries an
  # invitation code that is valid and unredeemed at that moment. Sign-in to an
  # existing account is unaffected, and so is the first-sign-in token below:
  # nobody mails the operator a code for their own cluster.
  #
  # Off by default, which is what a demo or an evaluation wants — there a wrong
  # code costs the $100 grant and never the account. Turn it on for a campaign
  # running grants-only, where an account that cannot be credited is an account
  # that should not exist.
  #
  # Rendered **only when it is on**, the same seam rule `password` and
  # `bootstrapToken` follow: the router's config schema is strict, so an image
  # that predates the key would refuse to boot on it.
  #
  # Turning it on with no codes generated closes registration completely. Mint the
  # campaign first (`invites generate`), then reconfigure.
  requireInviteForSignUp: false
  github:
    clientId: ""
    clientSecret: ""
  google:
    clientId: ""
    clientSecret: ""
  # First sign-in for a deployment that has neither a mail provider nor an OAuth
  # app — a marketplace install, where nobody has an inbox on the cluster yet.
  # While it is set and no user exists, `POST /auth/bootstrap` trades this token
  # for the first account; the endpoint is a 404 the rest of the time.
  #
  # Added by SUP-95 and present in the pinned image. The templates still render
  # it **only when it is set**: the router's config schema is strict, so an
  # older image would refuse to boot on an empty key, and a seam that broke
  # every existing deployment would not be a seam.
  bootstrapToken: ""
  bootstrapTokenExistingSecret: ""
  bootstrapTokenExistingSecretKey: bootstrap-token
  # The address the bootstrapped account is created under. The variable is
  # rendered only alongside a token — on its own this configures nothing, though
  # the Secret below carries the key either way.
  #
  # Delivered to the pod as CR_API_AUTH__BOOTSTRAP_EMAIL out of the Secret below
  # rather than as a literal in the container's env list, for the same reason
  # `adminEmails` is: a marketplace deployment fills this from the account
  # deploying the listing, and the env list is attested. As a plain value it was
  # published at `/.well-known/swarm-evidence` and made the evidence digest a
  # property of who deployed it — the same address was already sealed two entries
  # down, so one copy was protected and the other was not (SUP-241).
  bootstrapEmail: ""
  bootstrapEmailExistingSecret: ""
  bootstrapEmailExistingSecretKey: bootstrap-email
  # Who may read the operator-only console queries — today the invitation-campaign
  # aggregates and the fraud-watch numbers behind them. Empty means nobody, which
  # is the right default for a deployment that has not named its operators and the
  # wrong one for a deployment running a campaign: there is no second way in, because
  # `invites stats` is a CLI that needs the database and a published cluster space
  # has no exec.
  #
  # An address list rather than a role, because the `user` table belongs to Better
  # Auth and nothing may add a column to it (ADR-004 §2). Matched
  # case-insensitively against the address the caller is signed in as.
  #
  # Delivered to the pod as CR_API_AUTH__ADMIN_EMAILS out of the Secret below
  # rather than written into the rendered `router.yaml`: that ConfigMap is attested
  # and readable inside the deployment's published evidence bundle, so an operator
  # address there would both be public and make the evidence digest a property of
  # who deployed it (SUP-124).
  adminEmails: []
  adminEmailsExistingSecret: ""
  adminEmailsExistingSecretKey: admin-emails

# Which models this deployment serves: a plain list of Ollama model names. This
# is the array the listing's multiselect parameter hands over (spec extension
# SUP-98), passed through unchanged — the chart adds no encoding of its own for
# the listing to have to match.
#
# `models[]` and `endpoints[]` in the rendered config are built from it, and the
# confidential-router-litellm chart takes the same list, so the two cannot
# advertise different catalogues without the difference being visible in one
# line of values.
models:
  - "llama3.2:3b"

# What each name means to the router. Keyed by the Ollama model name, which is
# therefore also `litellmModel` — the string a client sends, the string the
# router forwards and the string Ollama loads are one string, and the litellm
# chart needs no catalogue of its own to agree with this one.
#
# Prices are micro-USD per 1M tokens: 30000 is $0.03. They are sized by
# parameter count, which is the only thing that separates these five.
modelCatalog:
  "gemma2:2b":
    id: google/gemma-2-2b-it:tee
    name: Gemma 2 2B
    endpoint: confidential-router
    contextLength: 8192
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 20000
      completionPer1mMicros: 30000
  "llama3.2:3b":
    id: meta/llama-3.2-3b-instruct:tee
    name: Llama 3.2 3B Instruct
    endpoint: confidential-router
    contextLength: 131072
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 30000
      completionPer1mMicros: 50000
  "mistral:7b":
    id: mistral/mistral-7b-instruct:tee
    name: Mistral 7B Instruct
    endpoint: confidential-router
    contextLength: 32768
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 50000
      completionPer1mMicros: 80000
  "phi3.5:3.8b":
    id: microsoft/phi-3.5-mini-instruct:tee
    name: Phi-3.5 Mini 3.8B
    endpoint: confidential-router
    contextLength: 131072
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 35000
      completionPer1mMicros: 55000
  "qwen2.5:3b":
    id: alibaba/qwen2.5-3b-instruct:tee
    name: Qwen2.5 3B Instruct
    endpoint: confidential-router
    contextLength: 32768
    capabilities: [chat, completions]
    pricing:
      promptPer1mMicros: 30000
      completionPer1mMicros: 50000

# The endpoints the catalogue entries name. Only those an enabled model refers to
# are rendered, so turning every model off renders no endpoints at all. An empty
# `hostname` means `apiHostname`: in this listing every model is served by the
# one confidential deployment this chart is part of, and that is the host the
# platform publishes evidence for.
#
# `tee` is an operator-declared label. It is what the console prints next to a
# model; it is never a verdict, and nothing verifies it (ADR-002).
endpoints:
  confidential-router:
    hostname: ""
    tee: Intel TDX + H100 CC
    # An operator-only override for where the evidence bundle is fetched from.
    # Empty means `https://<hostname>/.well-known/swarm-evidence`.
    evidenceUrl: ""

# The attesting egress (ADR-008). A model may live in **another** deployment or
# another swarm cloud: an administrator registers it in the console at run time,
# and nothing is proxied to it until its evidence has been verified and its TLS
# leaf pinned. The verification is the gatekeeper's own core, run as a second
# container in this pod rather than ported into the API — one verification
# pipeline, the same binary a client runs on their own machine.
#
# Off by default, the same seam rule `auth.password` and `auth.bootstrapToken`
# follow: `externalEndpoints` is a key the router's strict config schema has only
# from the image this chart version pins, so an older image would refuse to boot
# on it rather than ignore it. A deployment that registers no external endpoint
# also has no reason to run the second container.
#
# Switching it on changes the pod, and therefore the deployment's canonical
# snapshot: ADR-008 calls that out as a re-pin rollout for every pinned user —
# pin the old digest and the new one, deploy, then remove the old (ADR-003 §3).
externalEndpoints:
  enabled: false

  # The gatekeeper core, packaged for a cluster. The same `CGO_ENABLED=0` binary
  # the GitHub Releases carry; the entrypoint is the supervisor that watches the
  # rendered config and SIGHUPs the gatekeeper in place. Pinned by digest for the
  # reason every image here is: it is inside the snapshot a user verifies, so the
  # egress verifier is part of what they pin.
  #
  # The build has to be one whose supervisor *waits* while the rendered file has
  # no endpoint (confidential-router SUP-229, `main-481445c` or later): a fresh
  # deployment renders exactly that, and an older build exits on it and keeps
  # the API pod un-Ready (SUP-248). `charts/tests/sidecar_boot.sh` checks it.
  image:
    registry: ghcr.io
    repository: super-protocol/confidential-router/gatekeeper
    digest: sha256:15e1691a39e124fc9888ff6f41763cf577939b69557c7e7148b2563f1772412a
    tag: ""
    pullPolicy: IfNotPresent

  # The shared `emptyDir` both containers mount, and the only thing between them
  # besides loopback: router-api renders `config.yaml` into it on boot and after
  # every admin mutation, the sidecar watches the file and reloads itself on a
  # real change. Nothing secret is written here — the upstream API keys stay in
  # the database, sealed, and are injected on the egress leg one request at a
  # time.
  # One value rather than a directory and a filename: the mount point is derived
  # from it, so the two containers cannot be pointed at different paths.
  configPath: /var/run/gatekeeper/config.yaml

  # How often the sidecar's entrypoint examines the rendered file. Far below the
  # re-attest interval it feeds, so it is never the slow part of applying an
  # admin's edit.
  watchInterval: 2s

  # The sidecar's admin API, which router-api polls for verdicts. Loopback only —
  # the two containers share a network namespace, nothing else can reach it, and
  # local-only is the whole of its access control. It is read-only by design.
  adminPort: 9465

  # Background full re-verification of every registered upstream. The router's
  # schema bounds this to [1m, 1h] and refuses a longer one at boot: an hour was
  # named as the acceptable worst case, not as a preference.
  reattestInterval: 10m

  # How often router-api reads `/verdicts` and `/status` back off the admin API
  # and projects them onto the endpoint rows and the event timeline.
  statusPollInterval: 5s

  # The egress leg's own timeouts, separate from `litellm.*` above: a refusal to
  # connect here means the sidecar has not started that listener yet, which is a
  # different fault with a different fix — and the patience an external model
  # deserves is a property of that model and of the network between two clouds,
  # not of this deployment's own workers.
  connectTimeout: 5s
  readTimeout: 120s

  # The AES-256 data key the stored upstream API keys are sealed under, delivered
  # as `CR_API_SECRETS_KEY`. A Secret and never the rendered `router.yaml`: that
  # ConfigMap is attested and readable inside the deployment's published evidence
  # bundle, so a key written there would be published with it (SUP-124). The
  # router accepts it base64url-unpadded (43 characters), base64 (44) or hex (64);
  # whatever the spelling it has to decode to exactly 32 bytes.
  #
  # Rotating it makes every stored upstream key unreadable — they are re-entered,
  # not recovered.
  secretsKey: ""
  existingSecret: ""
  existingSecretKey: secrets-key

  # Requests and limits for the second container. A ~30 MiB static binary holding
  # a verdict per endpoint and one connection pool per verified upstream; it
  # parses evidence bundles and rebuilds an OVMF launch measurement on each
  # re-attestation, which is the one thing here that wants a whole core for a
  # moment.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      nvidia.com/gpu: "0"
    limits:
      cpu: 100m
      memory: 128Mi
      nvidia.com/gpu: "0"

evidence:
  pollInterval: 5m
  freshnessWindow: 24h

rateLimits:
  requestsPerMinute: 600
  tokensPerMinute: 2000000

# Invitation codes that grant credit on sign-up. The codes themselves are minted
# by `invites generate` against the database; what a deployment configures is the
# campaign landing page that hands them out, which is a site somewhere else
# entirely. Empty means this deployment runs no campaign and none of it is
# rendered.
invites:
  # Hostname only, no scheme — `publicScheme` decides that. Two settings follow
  # from it, and they are why this is one value rather than two that can drift:
  #
  #   * the origin joins `server.validClientOrigins`, because the landing page
  #     calls `GET /v1/invites/<code>` from the browser to tell a visitor the
  #     credit is already theirs. Without it the API answers without
  #     `Access-Control-Allow-Origin`, the browser drops the answer, and the page
  #     silently shows its generic line instead (SUP-154).
  #   * `invites.landingBaseUrl` is the origin `invites generate` writes into the
  #     URLs it mints — where a mailing actually sends people.
  landingHostname: ""
  # Per-source-address budget on the public lookup. Low on purpose: the landing
  # makes one call per visit, and a code is 59 bits, so anything higher only helps
  # someone enumerating a campaign.
  lookupsPerMinute: 30

# Product analytics (ADR-006). The console makes no third-party request of its
# own — its browser events are posted to this API, which captures them alongside
# the ones the database already knows. Without a project key the sink is disabled
# and every event is dropped, so the server half of a funnel is recorded nowhere
# until this is set.
analytics:
  posthog:
    # The `phc_…` project key. A write-only ingest key rather than a secret — it
    # can add events and read nothing back — but it still arrives as
    # POSTHOG_PROJECT_KEY out of the Secret rather than in the rendered
    # `router.yaml`, because that ConfigMap is readable inside the published
    # evidence bundle and a key anyone can read is a project anyone can write to.
    projectKey: ""
    existingSecret: ""
    existingSecretKey: posthog-project-key
    # Empty means the router's own default, PostHog's EU cloud. Set it for a
    # self-hosted project.
    host: ""

log:
  level: info
  pretty: false

graphql:
  path: /graphql
  introspection: false

swagger:
  enabled: false
  path: docs

# Where the console's Gatekeeper screen reads its download links from.
gatekeeper:
  repo: Super-Protocol/confidential-router
  apiBaseUrl: https://api.github.com
  cacheTtl: 15m
  requestTimeout: 5s

# Empty means `production`, which is what a cluster deployment is. It used to mean
# "development unless billing runs on Stripe", and that is how the credit-minting
# manual provider came to be live on a public router (SUP-167) — so the provider
# no longer follows from this value in either direction.
#
# The one reason to set `development` here is a deployment that deliberately reads
# its sign-in links out of the pod log (`auth.magicLink.mailer: console`), which
# production mode refuses.
nodeEnv: ""

resources:
  requests:
    cpu: 250m
    memory: 1Gi
    nvidia.com/gpu: "0"
  limits:
    cpu: 250m
    memory: 1Gi
    nvidia.com/gpu: "0"

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}

# The bundled database: three PostgreSQL instances under Patroni, spread one per
# node, with synchronous replication. `database.*` above points at the master
# Service this creates, and Patroni keeps that Service's endpoints on whichever
# instance is currently the leader — so a node rebooting is a switchover and not an
# outage, and not the silent data loss a single node-pinned volume used to be
# (SUP-179).
#
# `auth.existingSecret` points at the secret this chart creates, so there is one
# password in one place; changing `fullnameOverride` means changing
# `database.host`'s default with it, and the templates say so rather than letting
# the two drift.
postgresql:
  enabled: true
  # Also the Patroni scope, and therefore the master Service's name: the name the
  # router has had in its DSN since the Bitnami chart, kept deliberately.
  fullnameOverride: confidential-router-postgresql
  replicaCount: 3
  auth:
    username: router
    database: router
    existingSecret: confidential-router-api
    secretKeys:
      superuserPasswordKey: postgres-password
      replicationPasswordKey: replication-password
      userPasswordKey: password
  # The router connects in the clear, so the server has to accept that.
  #
  # Not a preference: the API builds a DSN with `?sslmode=...` and hands it to
  # TypeORM, which parses the URL with a regex of its own and discards the query
  # string — so `database.sslmode` above has never reached the driver, and the
  # connection has always been plaintext. Spilo's default `pg_hba.conf` ends in
  # `hostnossl all all all reject`, which would refuse it, and the symptom would be
  # an API that cannot reach a database that is perfectly healthy.
  #
  # The link is pod-to-pod inside one cluster space, which is the boundary the
  # previous bundled server trusted too. Making it TLS is a change to the router's
  # own connection options rather than to this chart.
  requireSsl: false
  persistence:
    size: 8Gi
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
      nvidia.com/gpu: "0"
    limits:
      cpu: 250m
      memory: 768Mi
      nvidia.com/gpu: "0"
