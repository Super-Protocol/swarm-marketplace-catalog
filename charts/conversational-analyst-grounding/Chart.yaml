apiVersion: v2
name: conversational-analyst-grounding
description: Turns the datasets bound to the agent into everything it needs to answer questions about them — a model in the registry, registered data sources, an annotated schema catalogue and a domain briefing.
type: application
# 0.4.0 is a rewrite, not a bump, because the thing the 0.3.x job built no longer exists.
#
# Agent 1.17 has no knowledge graph: `knowledge_base_providers` and
# `tenant_knowledge_bases` are not tables any more, Neo4j is not a backend the api knows,
# and what a tenant knows is the schema catalogue, the semantic model and its documents —
# all in PostgreSQL. The 0.3.x job's inserts would fail on the first missing table.
#
# It also stopped writing SQL. Registration, annotation and the model registry are driven
# through the api's own admin API, which is the only way the work has its intended effect:
# registering a source ENQUEUES the catalogue read, and an annotation re-projects the
# knowledge index that schema search actually looks in. The same rows written by hand leave
# an agent that cannot find a table it can see.
# 0.5.0 is three things the stand found by running this Job instead of rendering it
# (SUP-711), and the first two mean it had never finished on agent 1.17:
#
#   * `PaginationInput` on 1.17 is `limit`/`offset`. The Job asked for `page`/`pageSize`,
#     the api answered 400 on the first query, and urllib hid the reason — so there was no
#     model row, no data source, no schema catalogue and no system prompt in any deployment
#     of 4.0.x. A refused query now says what the api said.
#   * The tenant is chosen by ALIAS. It used to be `organizations[0]`, which is Keycloak's
#     order and not the deployment's; a second organisation sorting above the first would
#     have bound one party's data to another's tenant with nothing raised.
#   * The result policy is in a ConfigMap, so it is in the evidence snapshot. A Job is not
#     collected, so until now how large a result has to be before the model sees a preview
#     instead of the rows was a fact no data owner could read out of the signed bundle.
# 0.5.1 is where the Job gets past the model registry. `LlmProvider` is an enum on
# 1.17 and its values are UPPER case, so `provider: openai` was refused — the next
# layer under 0.5.0's pagination fix, and visible in one read because of 0.5.0's
# other half. Its lower-case neighbour `SchemaAnnotationTarget` stays as it is.
# The Job's name now keys off the whole policy rather than `thresholds` alone, so a
# changed context window, memory budget or summarisation threshold re-runs it.
# 0.6.0 is the move to agent 1.22.1 and the Job's work is unchanged, which was
# checked rather than assumed (SUP-896). Every one of the 18 admin operations
# `ground.py` issues has a byte-identical signature in 1.22.1's
# `apps/api/schema.graphql`, as do all eight of its input types, `PaginationInput`
# (still `limit`/`offset`), `LlmProvider` (still UPPER case `OPENAI`) and
# `SchemaAnnotationTarget` (still lower case `table`/`column`). The schema diff
# across the 51 commits is additive apart from two dashboard field signatures the
# Job does not call.
version: 0.6.0
appVersion: "1.22.1"
