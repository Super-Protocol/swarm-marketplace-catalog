{{- /*
Everything per-deployment arrives as environment from a Secret; the script and the system
prompt are a ConfigMap and are attested in full.

0.3.x put the bindings in a Secret — they carry dataset credentials — and then rendered the
internal credential, the model key and the embeddings key into the Job's `env` as literal
values. A pod spec is not a safe place for either: it travels in the deployment bundle in
clear, and `env` is read by anybody who can read the bundle. The Secret below is the whole
set, and the pod takes it with `envFrom`.
*/ -}}
{{- $api := required "api.url must be set: the job drives the agent's own admin API" .Values.api.url }}
{{- if not .Values.model.name }}{{ fail "model.name must be set: it is the row this job creates in the installation's model registry, and the deployment answers nothing without one" }}{{ end }}
{{- if not .Values.model.id }}{{ fail "model.id must be set: the model the configured endpoint serves" }}{{ end }}
{{- if not .Values.model.baseUrl }}{{ fail "model.baseUrl must be set: the OpenAI-compatible endpoint the agent talks to" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: analyst-grounding
type: Opaque
stringData:
  # One object per bound dataset, with its connection and the schema its publisher declared.
  BINDINGS: {{ .Values.bindings | quote }}
  # The service account the job reads the realm with, to learn which organisation is the
  # tenant and which subject administers it.
  KEYCLOAK_CLIENT_SECRET: {{ required "keycloak.clientSecret must be set" .Values.keycloak.clientSecret | quote }}
  # The model endpoint's access key, which this job writes into the registry row.
  MODEL_API_KEY: {{ .Values.model.apiKey | default "" | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analyst-grounding-scripts
data:
{{ (.Files.Glob "files/*").AsConfig | indent 2 }}
---
{{/*
The result policy, in a ConfigMap, because these four numbers have to be ATTESTED.

A Job is applied like any other object and is deliberately NOT collected into the evidence
snapshot (SUP-416), so while these values reached the Job's `env` and nowhere else, a data
owner reading the signed snapshot could not see how large a result has to be before it is
set aside, nor how much of it the model is shown. With the model inside the perimeter those
numbers stop being a confidentiality control and become a context-budget one — which is
exactly the kind of "what changes for you" fact the snapshot exists to carry, and the one
SUP-711 found missing from it.

So the policy lives here, the Job reads it with `envFrom`, and the two cannot disagree. The
agent does not read this object; the registry row the Job writes from it is what the api
reads. `memoryTokenBudget` and `summarizeTokenThreshold` ride along because they are the
same kind of fact and the Job wants them from one place.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: analyst-grounding-model-policy
data:
  LARGE_DATA_ROW_THRESHOLD: {{ .Values.model.thresholds.largeDataRowThreshold | quote }}
  LARGE_DATA_SIZE_THRESHOLD: {{ .Values.model.thresholds.largeDataSizeThreshold | quote }}
  PREVIEW_ROW_COUNT: {{ .Values.model.thresholds.previewRowCount | quote }}
  CONTEXT_WINDOW_SIZE: {{ .Values.model.contextWindowSize | quote }}
  MEMORY_TOKEN_BUDGET: {{ .Values.model.memoryTokenBudget | quote }}
  SUMMARIZE_TOKEN_THRESHOLD: {{ .Values.model.summarizeTokenThreshold | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # A Job's pod template is immutable, so reconfiguring with a different set of datasets has
  # to produce a different Job. Keying the name off the bindings and the model is what makes
  # rebinding data a normal operation rather than a redeploy; the superseded Job is pruned
  # with the old bundle.
  # The WHOLE policy and the tenant are in the key as well as the bindings and the model: a
  # changed number has to produce a new Job, or the registry row keeps the superseded one and
  # nothing says so. `thresholds` alone was not the whole of it — `contextWindowSize`,
  # `memoryTokenBudget` and `summarizeTokenThreshold` are policy too, and changing only those
  # left the Job untouched (CTO review of #94). The model's own key is deliberately NOT in the
  # key: a regenerated credential is not a reason to re-ground, and the Secret's own checksum
  # is not this object's business.
  name: analyst-grounding-{{ printf "%s|%s|%s|%s|%s" (.Values.bindings | toString) .Values.model.name .Values.model.id (.Values.tenantAlias | toString) (omit .Values.model "apiKey" | toYaml) | sha256sum | trunc 8 }}
spec:
  # This waits on the rest of the deployment from inside, so a retry here means the wait
  # itself ran out — rare, and worth a few more attempts before the Job is called failed.
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ground
          image: {{ .Values.image | quote }}
          command: [python3, /scripts/ground.py]
          envFrom:
            - secretRef:
                name: analyst-grounding
            # The attested policy above, rather than six literals in a pod spec that no
            # verifier can read.
            - configMapRef:
                name: analyst-grounding-model-policy
          env:
            - name: API_URL
              value: {{ $api | quote }}
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloak.url | quote }}
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_CLIENT_ID
              value: {{ .Values.keycloak.clientId | quote }}
            - name: MODEL_NAME
              value: {{ .Values.model.name | quote }}
            - name: MODEL_ID
              value: {{ .Values.model.id | quote }}
            - name: MODEL_BASE_URL
              value: {{ .Values.model.baseUrl | quote }}
            - name: MODEL_TEMPERATURE
              value: {{ .Values.model.temperature | quote }}
            # Which organisation's tenant the data and the model belong to. An alias, not a
            # position: the Job used to take whichever organisation Keycloak listed first.
            - name: TENANT_ALIAS
              value: {{ required "tenantAlias must be set: the alias of the organisation whose tenant this deployment's data and model belong to" .Values.tenantAlias | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: analyst-grounding-scripts
