{{- if include "confidential-router-ollama.models" . | fromJsonArray }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "confidential-router-ollama.fullname" . }}
  labels:
    {{- include "confidential-router-ollama.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "confidential-router-ollama.selectorLabels" . | nindent 4 }}
{{- end }}
