{{- if .Values.auth.proxy }}
{{- /*
The proxy's configuration. It challenges every request — including the page itself, which Control
Center does not — and passes the credentials through, so the console still authenticates the user
and still applies its roles.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cp.console.name" . }}-proxy
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ""      "";
    }

    server {
      listen 8080;

      # The same realm Control Center uses, so a browser holds one credential for this origin
      # rather than one per challenger.
      auth_basic "c3";
      auth_basic_user_file /etc/nginx/auth/auth;

      # Answers stream over long-lived connections; the defaults cut them off mid-flight.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      client_max_body_size 10m;

      # Unauthenticated on purpose and nothing but a word: the kubelet cannot hold a password, and
      # a readiness probe aimed at a protected path would be refused and the pod never ready.
      location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
      }

      {{- /*
      What a browser fetches anonymously, and therefore must not be challenged.

      A web app manifest is requested in "omit credentials" mode unless its link carries
      crossorigin="use-credentials" — Control Center's does not — and the icons it lists are
      fetched the same way. A password prompt for one of those is unanswerable: the browser cannot
      attach credentials to a request made in that mode, so it asks, retries anonymously, and asks
      again. That is the loop, and it is why the right password appears not to work.

      Nothing is given away by leaving them open. They are the application's own branding, and
      Control Center serves them to anyone with or without this proxy.
      */}}
      location = /dist/manifest.webmanifest {
        auth_basic off;
        proxy_pass http://127.0.0.1:9021;
      }

      location = /dist/yandex-browser-manifest.json {
        auth_basic off;
        proxy_pass http://127.0.0.1:9021;
      }

      location = /favicon.ico {
        auth_basic off;
        proxy_pass http://127.0.0.1:9021;
      }

      location ~* ^/dist/.+\.(png|ico|svg|webp)$ {
        auth_basic off;
        proxy_pass http://127.0.0.1:9021;
      }

      location / {
        proxy_pass http://127.0.0.1:9021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
{{- end }}
