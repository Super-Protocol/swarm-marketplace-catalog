{{- if .Values.auth.proxy }}
{{- /*
The proxy's configuration. It challenges every request — including the page itself, which Control
Center does not — and passes the credentials through, so the console still authenticates the user
and still applies its roles.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cp.console.name" . }}-proxy
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ""      "";
    }

    server {
      listen 8080;

      # The same realm Control Center uses, so a browser holds one credential for this origin
      # rather than one per challenger.
      auth_basic "c3";
      auth_basic_user_file /etc/nginx/auth/auth;

      # Answers stream over long-lived connections; the defaults cut them off mid-flight.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      client_max_body_size 10m;

      # Unauthenticated on purpose and nothing but a word: the kubelet cannot hold a password, and
      # a readiness probe aimed at a protected path would be refused and the pod never ready.
      location = /healthz {
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
      }

      location / {
        proxy_pass http://127.0.0.1:9021;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
{{- end }}
