{{- $name := include "cp.kafka.name" . -}}
{{- $console := include "cp.console.name" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
---
{{- /*
A headless service as well, because the controller quorum is addressed by the pod's own stable DNS
name rather than through a load-balanced service: a voter has to name itself, and a ClusterIP that
happens to resolve to the same pod today is not that name.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: controller
      port: 29093
      targetPort: controller
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ $name }}-headless
  # One broker, deliberately: see the licensing note in values.yaml.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        # The Confluent images run as uid 1000; the volume has to be owned by that group or the
        # broker cannot write its log directory.
        fsGroup: 1000
      containers:
        - name: kafka
          image: {{ .Values.images.server | quote }}
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 29093
          env:
            - name: CLUSTER_ID
              value: {{ include "cp.clusterId" . | quote }}
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@{{ $name }}-0.{{ $name }}-headless.{{ .Release.Namespace }}.svc.cluster.local:29093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093"
            {{- /*
            Advertised as the service name, which is how everything else in the namespace reaches
            it. Nothing outside the namespace does: the broker speaks a raw TCP protocol with no
            authentication here, and the only thing this deployment publishes is the console.
            */}}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ $name }}:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            {{- /* Every internal topic has one replica because there is one broker to hold it. */}}
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            {{- if .Values.schemaRegistry.enabled }}
            - name: KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL
              value: "http://{{ include "cp.schemaRegistry.name" . }}:8081"
            {{- end }}
            {{- /*
            Control Center 2.x reads its metrics from Prometheus, not from a Kafka topic: the broker
            pushes them over OTLP to the Prometheus running beside the console. Without this the
            console comes up and shows an empty cluster.
            */}}
            - name: KAFKA_METRIC_REPORTERS
              value: "io.confluent.telemetry.reporter.TelemetryReporter"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_TYPE
              value: "http"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_ENABLED
              value: "true"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_BASE_URL
              value: "http://{{ $console }}:9090/api/v1/otlp"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_COMPRESSION
              value: "gzip"
            {{- /* The endpoint is inside the namespace and unauthenticated; the exporter insists on
            being given a key regardless, so it is given the same placeholder Confluent uses. */}}
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_KEY
              value: "dummy"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_SECRET
              value: "dummy"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_PENDING_BATCHES_MAX
              value: "80"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_BATCH_ITEMS_MAX
              value: "4000"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_INFLIGHT_SUBMISSIONS_MAX
              value: "10"
            - name: KAFKA_CONFLUENT_TELEMETRY_METRICS_COLLECTOR_INTERVAL_MS
              value: "60000"
            {{- /* Would have the broker fetch configuration from Confluent's own service. */}}
            - name: KAFKA_CONFLUENT_TELEMETRY_REMOTECONFIG_CONFLUENT_ENABLED
              value: "false"
            - name: KAFKA_CONFLUENT_CONSUMER_LAG_EMITTER_ENABLED
              value: "true"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_METRICS_INCLUDE
              value: {{ .Values.telemetryMetricsInclude | quote }}
            - name: KAFKA_HEAP_OPTS
              value: {{ .Values.kafka.heapOpts | quote }}
            {{- if .Values.license }}
            - name: KAFKA_CONFLUENT_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.fullname" . }}-license
                  key: license
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.kafka.storageClass }}
        storageClassName: {{ .Values.kafka.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage | quote }}
