{{- $name := include "cp.kafka.name" . -}}
{{- $console := include "cp.console.name" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
  selector:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ $name }}
  # One broker, deliberately: see the licensing note in values.yaml.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        # The Confluent images run as uid 1000; the volume has to be owned by that group or the
        # broker cannot write its log directory.
        fsGroup: 1000
      containers:
        - name: kafka
          image: {{ .Values.images.server | quote }}
          ports:
            - name: kafka
              containerPort: 9092
          env:
            - name: CLUSTER_ID
              value: {{ include "cp.clusterId" . | quote }}
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            {{- /*
            The controller listens on loopback and nothing else. This cluster is one broker — the
            licence sees to that — so the quorum only ever talks to itself, and a controller port
            reachable from the namespace would be a second door into the cluster's metadata with a
            different (and weaker) notion of who is calling.
            */}}
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@127.0.0.1:29093"
            - name: KAFKA_LISTENERS
              value: "CLIENT://0.0.0.0:9092,CONTROLLER://127.0.0.1:29093"
            {{- /*
            Advertised as the service name, which is how everything else in the namespace reaches
            it. Nothing outside the namespace does: the broker speaks a raw TCP protocol with no
            authentication here, and the only thing this deployment publishes is the console.
            */}}
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "CLIENT://{{ $name }}:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,CLIENT:SASL_PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "CLIENT"
            - name: KAFKA_SASL_ENABLED_MECHANISMS
              value: "PLAIN"
            - name: KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL
              value: "PLAIN"
            - name: KAFKA_AUTHORIZER_CLASS_NAME
              value: "org.apache.kafka.metadata.authorizer.StandardAuthorizer"
            {{- /*
            ANONYMOUS is the principal the broker presents to its own controller over the loopback
            listener, which has no authentication to present anything better. It is a superuser
            because the controller refuses CONTROLLER_REGISTRATION otherwise and the broker never
            finishes starting; it is safe only because that listener is bound to 127.0.0.1 and
            nothing outside this container can reach it.
            */}}
            - name: KAFKA_SUPER_USERS
              value: "User:admin;User:ANONYMOUS"
            - name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND
              value: "false"
            - name: KAFKA_OPTS
              value: "-Djava.security.auth.login.config=/etc/kafka/jaas/kafka.jaas"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            {{- /* Every internal topic has one replica because there is one broker to hold it. */}}
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_CONFLUENT_LICENSE_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_CONFLUENT_BALANCER_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            {{- if .Values.schemaRegistry.enabled }}
            - name: KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL
              value: "http://{{ include "cp.schemaRegistry.name" . }}:8081"
            {{- end }}
            {{- /*
            Control Center 2.x reads its metrics from Prometheus, not from a Kafka topic: the broker
            pushes them over OTLP to the Prometheus running beside the console. Without this the
            console comes up and shows an empty cluster.
            */}}
            - name: KAFKA_METRIC_REPORTERS
              value: "io.confluent.telemetry.reporter.TelemetryReporter"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_TYPE
              value: "http"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_ENABLED
              value: "true"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_BASE_URL
              value: "http://{{ $console }}:9090/api/v1/otlp"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_CLIENT_COMPRESSION
              value: "gzip"
            {{- /* The endpoint is inside the namespace and unauthenticated; the exporter insists on
            being given a key regardless, so it is given the same placeholder Confluent uses. */}}
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_KEY
              value: "dummy"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_API_SECRET
              value: "dummy"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_PENDING_BATCHES_MAX
              value: "80"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_BATCH_ITEMS_MAX
              value: "4000"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_BUFFER_INFLIGHT_SUBMISSIONS_MAX
              value: "10"
            - name: KAFKA_CONFLUENT_TELEMETRY_METRICS_COLLECTOR_INTERVAL_MS
              value: "60000"
            {{- /* Would have the broker fetch configuration from Confluent's own service. */}}
            - name: KAFKA_CONFLUENT_TELEMETRY_REMOTECONFIG_CONFLUENT_ENABLED
              value: "false"
            - name: KAFKA_CONFLUENT_CONSUMER_LAG_EMITTER_ENABLED
              value: "true"
            - name: KAFKA_CONFLUENT_TELEMETRY_EXPORTER_C3PLUSPLUS_METRICS_INCLUDE
              value: {{ .Values.telemetryMetricsInclude | quote }}
            - name: KAFKA_HEAP_OPTS
              value: {{ .Values.kafka.heapOpts | quote }}
            {{- if .Values.license }}
            - name: KAFKA_CONFLUENT_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ include "cp.fullname" . }}-license
                  key: license
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: jaas
              mountPath: /etc/kafka/jaas
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 120
            periodSeconds: 30
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
      volumes:
        - name: jaas
          secret:
            secretName: {{ include "cp.fullname" . }}-sasl
            items:
              - key: kafka.jaas
                path: kafka.jaas
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.kafka.storageClass }}
        storageClassName: {{ .Values.kafka.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage | quote }}
