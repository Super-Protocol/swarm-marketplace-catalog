apiVersion: v2
name: patroni-postgresql
description: A replicated PostgreSQL cluster that survives losing a node — Patroni on the Zalando Spilo image, with its own in-namespace etcd as the leader election store and a TCP router in front of the leader. No operator, no CRDs, and no call to the Kubernetes API.
type: application
version: 0.2.2
# The PostgreSQL the pinned Spilo image ships. Patroni is 4.0.4.
appVersion: "17.5"
keywords:
  - postgresql
  - patroni
  - replication
  - high-availability
