{{- /*
The second half of the leader election store.

`<scope>-config` is an Endpoints object holding the cluster-wide Patroni
configuration — the live `synchronous_mode`, `ttl` and PostgreSQL parameters, as
opposed to the bootstrap defaults in the StatefulSet's environment. An Endpoints
object with no Service in front of it is something Kubernetes may clean up, so
Patroni creates this Service itself if it can.

It is rendered here instead. Two reasons, and the second is the real one: the chart
should not need `create` on Services for a cluster to come up, and an object Patroni
creates at run time is an object that appears in the deployment's attested snapshot
some time after the deployment was measured.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patroni-postgresql.configServiceName" . }}
  labels:
    {{- include "patroni-postgresql.labels" . | nindent 4 }}
    {{- include "patroni-postgresql.dcsLabels" . | nindent 4 }}
spec:
  clusterIP: None
