{{- if not .Values.auth.existingSecret }}
{{- /*
The passwords, when nothing else holds them.

The intended arrangement is the other one: an application that deploys this chart
already writes a Secret with its own database password in it, points
`auth.existingSecret` at that object, and there is one password in one place. This
exists for a standalone install — and for the chart to have something to render when
`helm lint` runs it with no values at all.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "patroni-postgresql.fullname" . }}
  labels:
    {{- include "patroni-postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKeys.superuserPasswordKey }}: {{ .Values.auth.superuser.password | quote }}
  {{ .Values.auth.secretKeys.replicationPasswordKey }}: {{ .Values.auth.replication.password | quote }}
  {{- if include "patroni-postgresql.hasAppRole" . }}
  {{ .Values.auth.secretKeys.userPasswordKey }}: {{ .Values.auth.password | quote }}
  {{- end }}
{{- end }}
