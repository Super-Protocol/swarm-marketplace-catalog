{{- if .Values.service.replica.enabled }}
{{- include "patroni-postgresql.validate" . -}}
{{- /*
Every instance that is not the leader, for a reader that can tolerate replication lag.

The same router pods as the master Service, on their other listener: that one checks
Patroni's `/replica`, which answers 200 only on a standby that is streaming — so a
standby still cloning itself from the leader is not in it.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patroni-postgresql.replicaServiceName" . }}
  labels:
    {{- include "patroni-postgresql.labels" . | nindent 4 }}
  {{- with .Values.service.replica.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "patroni-postgresql.routerSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: standby
      protocol: TCP
{{- end }}
