{{- include "patroni-postgresql.validate" . -}}
{{- /*
The DCS's only Service: stable per-member DNS, and nothing else.

`publishNotReadyAddresses` is what makes the cluster able to form at all. A member is
not ready until it has a quorum, a quorum needs the other members, and the other
members are found by the names this Service publishes — so a Service that waited for
readiness would be waiting for the thing it is a prerequisite of.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patroni-postgresql.etcdFullname" . }}
  labels:
    {{- include "patroni-postgresql.etcdLabels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "patroni-postgresql.etcdSelectorLabels" . | nindent 4 }}
  ports:
    - name: client
      port: {{ .Values.etcd.clientPort }}
      targetPort: client
      protocol: TCP
    - name: peer
      port: {{ .Values.etcd.peerPort }}
      targetPort: peer
      protocol: TCP
