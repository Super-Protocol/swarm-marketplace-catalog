{{- /*
The StatefulSet's governing Service: stable per-pod DNS.

This is what the router's backends are named against — one entry per instance, by the
name it will always have — and `publishNotReadyAddresses` is what makes that work from
the first second: an instance that is still cloning has to be resolvable for the
router to be able to health-check it and find out that it is not ready yet.

Patroni does not use it. Its members find each other through the DCS, and an
application goes to the master or the replica Service.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patroni-postgresql.headlessServiceName" . }}
  labels:
    {{- include "patroni-postgresql.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "patroni-postgresql.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: postgresql
      protocol: TCP
    - name: patroni
      port: {{ .Values.patroni.apiPort }}
      targetPort: patroni
      protocol: TCP
