{{- include "patroni-postgresql.validate" . -}}
{{- /*
The address an application connects to, and the only one it needs.

It selects the router's pods, not the database's. Which instance is the leader is a
question only Patroni can answer; the router asks it on every check and keeps exactly
one backend up, and the router's own readiness fails while there is no leader at all —
so this name resolves to a proxy that has somewhere to send the connection, or to
nothing.

It used to have no selector, and the Endpoints object behind it used to be Patroni's
leader lock: the lock moved and the Service followed, because the two were one write.
That is what the Kubernetes DCS bought, and it is what a confined cluster space cannot
have (SUP-215).
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patroni-postgresql.scope" . }}
  labels:
    {{- include "patroni-postgresql.labels" . | nindent 4 }}
  {{- with .Values.service.master.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "patroni-postgresql.routerSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: primary
      protocol: TCP
