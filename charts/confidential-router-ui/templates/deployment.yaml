apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "confidential-router-ui.fullname" . }}
  labels:
    {{- include "confidential-router-ui.labels" . | nindent 4 }}
  annotations:
    # `checksum/public-config` below is a hash of the hostname-derived ConfigMap,
    # so it varies with the hostname exactly as that object's `/data` does and is
    # excluded for the same reason (SUP-211). `/` inside a JSON Pointer token is
    # `~1` (RFC 6901), which is what makes this one token and not three.
    swarm.io/exclude-evidence-fields: "/spec/template/metadata/annotations/checksum~1public-config"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "confidential-router-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # `envFrom` is read once, when the container starts, so without this a
        # hostname reconfigure updates the ConfigMap and the running console keeps
        # calling the old origin.
        checksum/public-config: {{ include (print $.Template.BasePath "/configmap-public.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "confidential-router-ui.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: router-ui
          image: {{ include "confidential-router-ui.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # `ROUTER_UI_API_ORIGIN` and `ROUTER_UI_GRAPHQL_HTTP` — the two values
          # that carry the API hostname, and the reason they are not in the list
          # below (SUP-211). One pinned digest still serves any hostname
          # (SUP-100); the hostname simply no longer reaches an attested object.
          envFrom:
            - configMapRef:
                name: {{ include "confidential-router-ui.publicConfigName" . }}
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: HOSTNAME
              value: 0.0.0.0
            - name: ROUTER_UI_AUTH_CALLBACK_URL
              value: {{ .Values.authCallbackUrl | quote }}
          # `/login` rather than `/`: it is the one route the console serves
          # without a session cookie, so a healthy pod answers 200 and not a
          # redirect.
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            # Next.js writes its cache under the app directory; the root
            # filesystem is read-only otherwise.
            - name: cache
              mountPath: /app/apps/router-ui/.next/cache
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
