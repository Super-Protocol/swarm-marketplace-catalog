{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "confidential-router-ui.fullname" . }}
  labels:
    {{- include "confidential-router-ui.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  # Without a class the object is created, the cloud registers the hostname and
  # writes its DNS, and nothing serves it: the controller only picks up what
  # names it.
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "consoleHostname must be set" .Values.consoleHostname | quote }}
      secretName: {{ required "ingress.tls.secretName must be set when ingress.tls.enabled is" .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ required "consoleHostname must be set" .Values.consoleHostname | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "confidential-router-ui.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
