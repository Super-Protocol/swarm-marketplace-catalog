apiVersion: v2
name: confidential-router-ui
description: The Confidential Router console — the Next.js app served on the deployment's console hostname.
type: application
# 0.2.1 is the same chart with a newer console pinned: the admin section for
# external endpoints and the trust list (ADR-008 §7). The chart repository is
# append-only, so a default that moves moves the version with it.
#
# 0.2.3 pins the console from `main-5efa452` (SUP-251, SUP-252): the trust-list
# form asks for a cloud launch measurement, and the endpoint dossier offers
# copy-measurement, a Registry-signed badge and the two-factor approvals.
#
# 0.2.4 pins the console from `main-f23d2d6` (SUP-255): no "External" tag on
# user surfaces, a green "Verified by this router", hex-only digests everywhere,
# and the Gatekeeper screen folded into "How to connect" on API Keys (with VS Code
# and OpenCode examples); `/gatekeeper` redirects there.
#
# 0.2.5 pins the console from `main-4dc62d8` (SUP-262): the chat toolbar is one row of
# controls with the tier caveat and the external-model note behind popovers, the
# Models count is a table footer, "How to connect" steps lead with one line, the
# dossier's explainers sit behind ⓘ and its pinned certificate renders as hex.
#
# 0.2.6 pins the console carrying SUP-263: the theme menu offers Light / Dark /
# System only (the mockup's accent switcher is gone, indigo fixed) and the header
# leads with the Super Protocol logo; the tab carries the Super Protocol favicon.
#
# 0.2.7 (SUP-266) pins what 0.2.6 only described: 0.2.6 shipped the 0.16.1
# console digest, the SUP-263 change had not been built yet. This is
# `main-9e86c41` (confidential-router#98, containing #97), which also carries the
# Profile screen's set-password card (SUP-267).
#
# 0.2.8 (SUP-268) pins `main-b885b86`: the Administration → Invitations section
# and the evidence-derived TEE label (SUP-270). No template change.
#
# 0.2.9 (SUP-269) pins `main-44708f9`: sign-in and sign-up by emailed code — no
# password screens — the invitation codes CSV export/import (SUP-272) and the
# data migration screen (SUP-271). No template change.
#
# 0.2.10 (SUP-300) pins `main-82769ff`: the console's gatekeeper setup block no
# longer promises `~/.config/confidential-gatekeeper/config.yaml`, which is not
# where the file lands on macOS or Windows — the step says "your user
# configuration directory" and the CLI prints the path it actually resolved
# (SUP-300). It also carries the field-level sign-up refusals and the key-form
# copy (SUP-295) and the evidence-derived TEE label everywhere it is shown
# (SUP-260). No template change.
#
# 0.2.11 (SUP-434) pins `main-37ed4ba`: the console half of evidence coverage —
# a generation served through a verified external model endpoint counts as
# covered, and a page with nothing coverable on it says so instead of showing
# 0% (SUP-421, SUP-429, SUP-430). The profile heatmap stops reading 0 signed
# days for an account served entirely by external endpoints. No template change.
#
# 0.2.12 (SUP-424) pins `main-7b7aaba`: the console reads the metering the API
# now records honestly. A streamed turn that opens with a tool call shows a
# TTFT instead of an em dash, a Speed cell nothing could measure shows an em
# dash instead of a fabricated rate, and a ledger amount is rendered to four
# decimals so a sub-cent charge is not displayed as `-$0.00`. The Activity
# tile's hint names its sample sizes. No template change.
#
# 0.2.13 (SUP-459) pins `main-c668239` for the second production train. The
# console half of it is the admin data-migration screen, which now reports the
# API keys an export carries and an import restored (SUP-445); the rest of the
# train is API behaviour the console reads unchanged. No template change.
#
# 0.2.14 (SUP-459) pins `main-e670363`. The console's half of the three
# analytics fixes that joined the train while it was held: the feedback card
# and prompt emit the funnel events that had no call site (SUP-465), and the
# browser posts its events to `/v1/console-events` instead of a path an
# ad-blocker rule cancelled (SUP-463). No template change.
#
# 0.2.15 (SUP-522) pins `main-5bf6f33`. SUP-497 is API and server-common
# logging, so the console's own code does not change — but both halves ship
# from one revision, and a console built from a head the API is not pinned to
# is a question nobody should have to ask at an incident. No template change.
#
# 0.2.16 (SUP-578) pins `main-91922ec`. The console's own code moves in
# SUP-542's event taxonomy — the explainer video click is named and the
# waitlist click it was already sending is written down — together with the
# router-ui test that watches the path the feedback click really posts to
# (SUP-486). No template change.
version: 0.2.16
appVersion: "0.4.1"
