name: confidential-router-ui
description: The Confidential Router console — the Next.js app served on the deployment's console hostname.
type: application
# 0.2.1 is the same chart with a newer console pinned: the admin section for
# external endpoints and the trust list (ADR-008 §7). The chart repository is
# append-only, so a default that moves moves the version with it.
#
# 0.2.3 pins the console from `main-5efa452` (SUP-251, SUP-252): the trust-list
# form asks for a cloud launch measurement, and the endpoint dossier offers
# copy-measurement, a Registry-signed badge and the two-factor approvals.
#
# 0.2.4 pins the console from `main-f23d2d6` (SUP-255): no "External" tag on
# user surfaces, a green "Verified by this router", hex-only digests everywhere,
# and the Gatekeeper screen folded into "How to connect" on API Keys (with VS Code
# and OpenCode examples); `/gatekeeper` redirects there.
#
# 0.2.5 pins the console from `main-4dc62d8` (SUP-262): the chat toolbar is one row of
# controls with the tier caveat and the external-model note behind popovers, the
# Models count is a table footer, "How to connect" steps lead with one line, the
# dossier's explainers sit behind ⓘ and its pinned certificate renders as hex.
#
# 0.2.6 pins the console carrying SUP-263: the theme menu offers Light / Dark /
# System only (the mockup's accent switcher is gone, indigo fixed) and the header
# leads with the Super Protocol logo.
version: 0.2.6
appVersion: "0.4.1"
