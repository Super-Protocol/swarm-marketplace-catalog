# Pinned by digest (marketplace spec §2.7), so what this chart renders and what
# the cluster pulls are the same thing and the deployment's evidence digest stays
# computable from the definition that installs it.
image:
  registry: ghcr.io
  repository: super-protocol/confidential-router/router-ui
  digest: sha256:2c315c97b599cc57f51c7d0f0490a674bf7eb37c93b79119272a58d666413123
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Where the console answers, and where the API it calls answers.
consoleHostname: ""
apiHostname: ""
publicScheme: https

# Where Better Auth returns the browser after a magic-link or social sign-in.
authCallbackUrl: /

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

ingress:
  enabled: true
  className: nginx
  path: /
  pathType: Prefix
  annotations:
    # The console proxies nothing that streams today, but it shares a controller
    # and a hostname pattern with the API and the two drifting apart is how one
    # of them ends up with a 60-second cut-off nobody remembers configuring.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 100m
    memory: 512Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
