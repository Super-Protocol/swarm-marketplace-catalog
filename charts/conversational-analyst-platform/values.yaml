# The one credential every in-namespace backing service shares. The deployment's namespace is
# the trust boundary: nothing outside it can reach these services, and the agent's own
# configuration has to carry the password in plaintext anyway, so splitting it into six
# separate secrets would buy appearance rather than isolation.
internalSecret: ""

# One-shot that creates the databases and roles the agent expects. Same LimitRange rule as
# every other container: request equals limit.
postgresBootstrap:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 100m
      memory: 256Mi

# Container registry credentials for the agent's private images. The secret this creates is
# named `regcred` and is referenced by the identity and agent components.
imagePullSecret:
  registry: ghcr.io
  username: ""
  password: ""

neo4j:
  image: neo4j:5.26.21-community
  storage: 10Gi
  heap:
    initial: 1G
    max: 2G
  pagecache: 1G
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      cpu: 500m
      memory: 4Gi

postgresql:
  fullnameOverride: analyst-postgresql
  global:
    security:
      allowInsecureImages: true
  image:
    registry: docker.io
    # public.ecr.aws/bitnami is gone; the legacy mirror is what still serves these tags.
    repository: bitnamilegacy/postgresql
    tag: 17.3.0-debian-12-r1
  rbac:
    create: false
  serviceAccount:
    create: true
  networkPolicy:
    enabled: false
  primary:
    resourcesPreset: none
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 250m
        memory: 512Mi
    persistence:
      size: 8Gi
    # Network policy belongs to the cluster space, which already isolates the namespace; a
    # deployment that ships its own is refused. This chart moved the switch under `primary`,
    # so the top-level one above no longer reaches it.
    networkPolicy:
      enabled: false

redis:
  fullnameOverride: analyst-redis
  global:
    security:
      allowInsecureImages: true
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.4.2-debian-12-r2
  architecture: standalone
  rbac:
    create: false
  serviceAccount:
    create: true
  networkPolicy:
    enabled: false
  master:
    resourcesPreset: none
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 100m
        memory: 256Mi
    persistence:
      size: 8Gi

nats:
  fullnameOverride: analyst-nats
  container:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 100m
        memory: 256Mi
  # The reloader container has no resources field of its own; `merge` is how this chart
  # adds one. Without it LimitRange fills a default limit above the request and the pod
  # is rejected (maxLimitRequestRatio is 1).
  reloader:
    merge:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 10m
          memory: 32Mi
  # Debug toolbox. Its chart renders `resources: {}`, which LimitRange then rejects.
  natsBox:
    container:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 10m
          memory: 32Mi
  config:
    monitor:
      enabled: true
      port: 8222
    jetstream:
      enabled: true
      memoryStore:
        enabled: true
        maxSize: 1Gi
      fileStore:
        pvc:
          size: 10Gi

minio:
  fullnameOverride: analyst-minio
  mode: standalone
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: 250m
      memory: 1Gi
  # The bucket Job only sets a memory request upstream. A missing CPU request and missing
  # limits are filled by LimitRange and then rejected.
  makeBucketJob:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 50m
        memory: 128Mi
  # Upstream ships a default console user, so this container is created too, and its
  # chart only sets a memory request.
  makeUserJob:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 50m
        memory: 128Mi
  persistence:
    size: 20Gi
  rootUser: root
  ingress:
    enabled: false
  consoleIngress:
    enabled: false
  metrics:
    serviceMonitor:
      enabled: false
  buckets:
    - name: agent
      policy: none
      purge: false
      versioning: false
      objectlocking: false
