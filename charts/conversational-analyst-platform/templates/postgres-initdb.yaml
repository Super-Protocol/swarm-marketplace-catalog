{{- /*
Databases and users the agent expects to already exist.

Delivered as a ConfigMap rather than inline chart values so the password never travels through a
values file that a chart repository, a rendered blueprint or a support ticket might carry.

Every statement is guarded. The chart creates a database and a user of its own from
`auth.database` / `auth.username` before this runs, so a bare `CREATE DATABASE` meets one that
already exists — and psql runs init scripts with ON_ERROR_STOP, so the *next* statement never
runs either. That is how a Keycloak configured with the right password still failed to
authenticate: its user had never been created, because a statement two lines above it aborted
the script.
*/ -}}
{{- $secret := include "platform.internalSecret" . -}}
{{- $owners := dict "keycloak" "keycloak_user" "retail_ai" "retail_ai_user" "retail_ai_checkpointer" "checkpointer_user" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: analyst-postgres-initdb
data:
  create_databases.sql: |
    {{- range $database, $owner := $owners }}
    SELECT 'CREATE DATABASE {{ $database }}'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ $database }}')\gexec

    DO $$
    BEGIN
      IF EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ $owner }}') THEN
        ALTER ROLE {{ $owner }} WITH LOGIN ENCRYPTED PASSWORD '{{ $secret }}';
      ELSE
        CREATE ROLE {{ $owner }} WITH LOGIN ENCRYPTED PASSWORD '{{ $secret }}';
      END IF;
    END
    $$;

    GRANT ALL PRIVILEGES ON DATABASE {{ $database }} TO {{ $owner }};
    {{- end }}
    {{- range $database, $owner := $owners }}

    \c {{ $database }}
    ALTER SCHEMA public OWNER TO {{ $owner }};
    GRANT ALL ON SCHEMA public TO {{ $owner }};
    GRANT USAGE, CREATE ON SCHEMA public TO {{ $owner }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ $owner }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ $owner }};
    {{- end }}
