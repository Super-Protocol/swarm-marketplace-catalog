# Confidential RAG — the listing's own half of the deployment.
#
# What is NOT here, because it is a component of its own: the generation endpoint
# (charts/swarm-model-server), the embedder and the reranker (charts/text-embeddings-server),
# and the vector store (charts/milvus-standalone). This chart is the pipeline, the front door
# and the corpus indexer, and it reaches those four by Service name.
#
# Service names, not namespaced FQDNs, on purpose: everything is in one cluster space, and a
# name carrying the namespace is a value that differs between two deployments of one version —
# which is a digest that is a property of the deployment rather than of the version.

name: confidential-rag

# The one public address. The only object it appears in is the Ingress, which is what makes a
# single evidence exclusion enough.
hostname: ""

ingress:
  # Without this the Ingress is created, its hostname registered, its DNS written — and nothing
  # serves it. It looks like a DNS fault for an hour.
  className: nginx

image:
  registry: ghcr.io
  repository: super-protocol/confidential-rag/rag-server
  digest: sha256:ec7a6c221f835e73834f74615a5a061f91a8c6d890afc2392feb840a9a078966
  tag: 2.6.2-sp.f118cd8
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------------------------
# The front door
# ---------------------------------------------------------------------------------------------
console:
  title: Confidential RAG
  # Required. The console refuses to start without it rather than publish an open door.
  password: ""
  # Signs the session cookie. Generated per deployment, lives in a Secret, and therefore costs
  # the attested digest nothing.
  sessionKey: ""
  sessionTtlSeconds: 43200
  # What the console tells a user about the deployment they are using. Every value is rendered
  # from the listing's own parameters, so the panel and the signed evidence describe the same
  # thing.
  about:
    sourceRepo: https://github.com/Super-Protocol/confidential-rag
  # Request equals limit, in both dimensions, and neither is below 100m / 128Mi. A cluster
  # space's LimitRange sets `maxLimitRequestRatio: 1` and those floors, and a container
  # breaking either is refused at admission — so the pod never exists, and nothing an
  # operator looks at says why (SUP-238). The public door of the Conversational Analyst
  # deployment was not admitted for exactly this reason.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
      nvidia.com/gpu: "0"
    limits:
      cpu: 500m
      memory: 512Mi
      nvidia.com/gpu: "0"

# ---------------------------------------------------------------------------------------------
# The pipeline
# ---------------------------------------------------------------------------------------------
server:
  # uvicorn workers. Each one holds its own clients to the four endpoints, so this is a memory
  # multiplier as much as a concurrency one.
  #
  # It is also why the reranker's verdict is written to a file the whole pod shares
  # (`RERANKER_STATUS_PATH` below): the worker that answers `/v1/health` is usually not the
  # worker that served the query, so a per-process record would report a degradation on a coin
  # flip.
  workers: 2
  collection: documents
  # Uploaded documents, in a collection of their own. The gated corpus is DROPPED and rewritten
  # whenever it moves — a document its owner deleted has to leave the index — so one collection
  # for both would mean every corpus refresh deleting every file anybody submitted. The
  # rag-server retrieves from both in one query, so the split costs an answer nothing.
  #
  # Empty switches uploads off: the console says the deployment reads its gated source only,
  # rather than offering a button that answers 503.
  uploadCollection: documents_uploads
  # ---------------------------------------------------------------------------------------------
  # Candidates out of the vector store, which is what the reranker then orders.
  #
  # TWELVE, and the first number here was 40, which made the reranker do nothing at all on every
  # single query. Measured, because the symptom pointed somewhere else entirely:
  #
  #   * Text Embeddings Inference refuses a client batch larger than
  #     `--max-client-batch-size`, which the reranker preset sets to 32, with
  #     `413 {"error":"batch size 40 > maximum allowed batch size 32"}`. Instantly — it is a
  #     validation error, not a timeout. The adapter caught it, fell back to the retriever's
  #     own order as it is designed to, and the only trace outside the log was citations whose
  #     `relevance_score` was absent and therefore read 0.0. The answers stayed correct, which
  #     is why this survived a review.
  #   * And the time budget, on the two cores the reranker gets, for chunks this listing's size
  #     (`corpus.chunkChars`): 8 passages 24.4 s, 16 passages 48.4 s, 24 passages 73.3 s. The
  #     adapter waits 60 s. So 16 would have worked and spent 80% of the budget; 24 would not.
  #
  # Twelve is ~36 s of a 60 s budget and a third of the batch ceiling. `topK` is therefore
  # bounded by BOTH numbers, and `crag.validate` refuses a render that breaks the first — the
  # two live in different charts and nothing checked that they agreed.
  topK: 12
  # Milvus refuses a search whose top-k is larger than its candidate list, so `ef` is the other
  # ceiling over `topK`.
  ef: 100
  # What survives reranking and reaches the prompt.
  rerankerTopK: 6
  # Vector-distance floor, before reranking.
  scoreThreshold: 0.25
  # A cross-encoder's score is a probability in [0, 1] here, not the unbounded logit a NeMo
  # Retriever reranker returns — so a threshold carried over from a NIM deployment means
  # something else. Zero: let the reranker order, and let `rerankerTopK` do the cutting.
  #
  # And it means a third thing on a reranker FALLBACK. When the reranker is unreachable or
  # refuses the batch, the scores the filter sees are the retriever's own — `(1 + cos) / 2`
  # off the dense search — which is a different scale from the cross-encoder's probability
  # and is centred near 0.5 rather than spread across [0, 1]. A value tuned against the
  # cross-encoder would therefore cut a different, usually larger, set of passages on the
  # degraded path than it does on the healthy one. Harmless at zero, which is why this is
  # documented here rather than special-cased in the pipeline: at zero nothing is filtered
  # on either path. Raise it and the degraded path is the case to check — the answer says
  # `citations.reranker.degraded` and `score_source: retriever` when it is on that path
  # (SUP-893).
  rerankerScoreThreshold: 0.0
  maxTokens: 1024
  temperature: 0
  topP: 1.0
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
      nvidia.com/gpu: "0"
    limits:
      cpu: "2"
      memory: 4Gi
      nvidia.com/gpu: "0"
  persistence:
    # The filesystem object store. Multimodal content would live here; a text corpus writes
    # almost nothing, and the backend is `filesystem` precisely so that this listing does not
    # have to stand up an S3-compatible store to hold nothing.
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# ---------------------------------------------------------------------------------------------
# What this chart composes, by Service name
# ---------------------------------------------------------------------------------------------
inference:
  # charts/swarm-model-server, ingress disabled, in this namespace.
  url: http://swarm-model-server:8000/v1
  model: ""
  licence: ""
  apiKey: ""

embeddings:
  url: http://confidential-rag-embeddings/v1
  model: ""
  licence: ""
  # The width the embedder really returns. The collection's vector field is created from it.
  dimensions: 1024
  apiKey: ""

reranker:
  enabled: true
  # No `/v1`: Text Embeddings Inference serves reranking at `/rerank`, at the root.
  url: http://confidential-rag-reranker
  model: ""
  licence: ""
  apiKey: ""
  # Mirrors `--max-client-batch-size` from the reranker preset in charts/text-embeddings-server,
  # because the server refuses a bigger batch with a 413 and the client falls back silently. It
  # is duplicated here only so this chart can refuse the render instead; the two are held equal
  # by `charts/tests/rag_reranker_budget.py`, which reads the preset.
  maxClientBatchSize: 32

# ---------------------------------------------------------------------------------------------
# Document extraction, for files submitted through the console
# ---------------------------------------------------------------------------------------------
ingest:
  # charts/swarm-doc-ingest (SUP-874): Docling, TableFormer and RapidOCR, CPU-only, no NIM and
  # no NGC credential. Cluster-internal, no Ingress of its own, and it authenticates — a
  # namespace is not a trust boundary once a second workload is in it.
  enabled: true
  url: http://swarm-doc-ingest:8080
  apiKey: ""
  # What the component is, for the console's "who touched your data" panel. A tenant should not
  # have to read the listing page to know what read their documents.
  stack: Docling + TableFormer + RapidOCR
  licence: Apache-2.0 (models MIT / Apache-2.0 / CDLA-Permissive-2.0)
  # Megabytes. Mirrored into the console and the indexer so a file too large is refused in the
  # browser rather than after it has crossed the namespace. The extractor's own ceiling is
  # 256 MiB; this is the console's, and it is lower because the console holds the whole document
  # in 512Mi of memory while it hands it over.
  maxUploadMb: 64
  # Seconds for one extraction. Measured on four cores: 2.6 s for HTML or DOCX, 13.1 s for a
  # fifteen-page PDF with a text layer, 52.6 s for the same pages as a 200-dpi scan through OCR.
  # The budget is long because ONE document is extracted at a time and the rest queue, so this
  # has to cover a queue and not just a document.
  timeoutSeconds: 900

vectorStore:
  url: http://milvus:19530
  username: root
  password: ""
  # HNSW, not GPU_CAGRA: the card belongs to the generation engine, and a vector store that
  # claimed it would leave the engine Pending on a GPU quota of one for ever.
  indexType: HNSW

# ---------------------------------------------------------------------------------------------
# The summary-status store
# ---------------------------------------------------------------------------------------------
cache:
  # Valkey, BSD-3-Clause, in place of Redis Stack — which is under RSALv2/SSPL and is therefore
  # not something this listing may deploy. It holds document-summarisation status keys with a
  # 24-hour expiry and nothing else.
  #
  # It runs without a credential, and that is upstream's constraint rather than a choice: the
  # client in `nvidia_rag.utils.summary_status_handler` constructs its connection pool from a
  # host, a port and a database number, and takes no password. So it is ClusterIP, on no
  # Ingress, in protected mode. Giving it `requirepass` would mean the rag-server could not
  # reach it at all.
  enabled: true

  # ---------------------------------------------------------------------------------------------
  # The pod runs AS the image's own user, rather than as root and letting the image get there.
  #
  # Measured, and it is the whole reason this block exists. The Valkey image's entrypoint starts
  # as root, chowns its data directory and drops privileges with
  # `setpriv --reuid=valkey --regid=valkey`. `setpriv` needs CAP_SETUID and CAP_SETGID, and this
  # chart drops every capability — so the container exited on every start and the pod sat in
  # CrashLoopBackOff. Reproduced locally: `setpriv: setresuid failed: Operation not permitted`;
  # in the cluster it was ten restarts before it was understood.
  #
  # Naming the uid skips that path entirely: the entrypoint sees it is not root and execs the
  # server. `fsGroup` is what then makes a fresh volume writable, since the chown the entrypoint
  # would have done cannot happen either. 999 and 1000 are the image's own `valkey` user and
  # group.
  #
  # Dropping every capability AND running as a non-root uid is the better posture; what was wrong
  # was asking for both and expecting the image to bridge them.
  securityContext:
    runAsUser: 999
    runAsGroup: 1000
    runAsNonRoot: true
  podSecurityContext:
    fsGroup: 1000
  image:
    registry: docker.io
    repository: valkey/valkey
    digest: sha256:e706d1213aaba6896c162bb6a3a9e1894e1a435f28f8f856d14fab2e10aa098b
    tag: 8.1.4-alpine
    pullPolicy: IfNotPresent
  # Request equals limit: `maxLimitRequestRatio: 1` in the space's LimitRange.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
      nvidia.com/gpu: "0"
    limits:
      cpu: 500m
      memory: 1Gi
      nvidia.com/gpu: "0"
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# ---------------------------------------------------------------------------------------------
# The gated document source
# ---------------------------------------------------------------------------------------------
corpus:
  # The resolved `corpus` data slot, as JSON. A Secret and nowhere else: for an ungated dataset
  # it carries the owner's own credentials, and it is the one value that differs between two
  # deployments of this version — both of which are reasons for it to be in the one place the
  # platform lifts out before the snapshot is taken.
  bindingJson: ""
  # The indexer's own bearer token, presented by the console and by nothing else. Every route
  # on :8085 but `/healthz` requires it: two of them WRITE the collection whose answers are
  # cited beside the gated corpus, and a ClusterIP Service is not a trust boundary once a
  # second workload is in the namespace. Generated per deployment by the listing and carried
  # in the Secret, so it costs the attested digest nothing. `/healthz` is exempt because the
  # kubelet carries no credential, and from 0.1.10 it answers `{"ok": true}` and nothing else
  # — it used to answer the whole status, so the one unkeyed route described the corpus
  # (SUP-897).
  apiKey: ""
  table: documents
  idColumn: doc_id
  titleColumn: title
  textColumn: text
  updatedColumn: updated_at
  # Characters, not tokens: the embedder truncates server-side and this container has no
  # tokenizer that has to agree with whichever checkpoint is being served. Set from the
  # embedder's own window by the listing.
  chunkChars: 1800
  chunkOverlapChars: 200
  rowLimit: 20000
  pollSeconds: 60
  # Chunks per embedding call. Four rather than sixteen: the embedder has two cores, and a
  # batch that holds them for half a minute is a batch its health endpoint cannot answer
  # during — which is how a reindex became a loop that never finished. Smaller calls make the
  # same total work, in pieces the endpoint stays answerable through.
  embedBatch: 4
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
      nvidia.com/gpu: "0"
    limits:
      cpu: "1"
      memory: 2Gi
      nvidia.com/gpu: "0"

logLevel: INFO

podSecurityContext: {}
securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
