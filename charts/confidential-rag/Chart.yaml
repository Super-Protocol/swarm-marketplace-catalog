apiVersion: v2
name: confidential-rag
description: >-
  The ported RAG pipeline — retrieval, reranking and grounded generation over a tenant's own
  documents — with its own authenticating console, the indexer that reads the gated document
  source and indexes submitted files, and the summary-status store. Composes an embedder, a
  reranker, a vector store, a document-extraction stage and a generation endpoint deployed
  beside it.
type: application
# 0.1.1 is one fix, found by deploying: the Valkey pod runs as the image's own uid.
# Its entrypoint starts as root and drops privileges with `setpriv`, which needs CAP_SETUID —
# and this chart drops every capability, so the container exited on every start and the pod sat
# in CrashLoopBackOff. Naming the uid skips that path; `fsGroup` makes the fresh volume writable
# in place of the chown the entrypoint can no longer do.
# 0.1.2 removes the console's ABOUT_EXPECTED_DIGEST. It was an env value in the Deployment, the
# Deployment is in the evidence snapshot, and the snapshot is what the digest is over — so a
# console displaying the digest it should match changed that digest by displaying it. The
# deployment's own digest is at the evidence URL the console already links.
# 0.1.3 gives the indexer's and the pipeline's probes the same slack the embedder's needed.
# Both spend their time on work that holds the cores their own health endpoint is served from,
# and a five-second timeout reads a busy process as a dead one — observed on the cloud as
# readiness flapping while the corpus indexed.
# 0.1.4 halves the indexer's embedding batch twice over, 16 chunks to 4: a batch that holds
# the embedder's two cores for half a minute is a batch its health endpoint cannot answer
# during, and the same total work in smaller pieces leaves it answerable.
# 0.1.5 bounds the indexer. `add_documents` embeds and inserts, either half can hang — the
# embedding client on a saturated endpoint, the insert on a flush — and both held the loop with
# `/status` frozen at the attempt that started it, which is the one state an operator cannot act
# on. Observed on the cloud as twelve minutes inside one rebuild with the embedder idle and
# nothing published. Each batch now runs under a timeout, progress is published per batch, and a
# stall is its own verdict rather than a refusal: the source served the documents, the index did
# not take them, and those want different people looking.
# 0.2.2 is the indexer's `/healthz`, which answered the whole status. It is the one route on
# :8085 that takes no credential — the kubelet carries none — and it returned `dict(STATE)`:
# the gate's verdict and its message, the bound dataset names and their interfaces, the
# document and chunk counts, both collection names, the timestamps and the uploads
# configuration. The comment above it said it returned "the probe's three fields and nothing
# about what is indexed", so the code and the comment disagreed and the comment was the one
# that got read (SUP-897). Not a regression — 0.1.8 served the same payload unkeyed on both
# `/status` and `/healthz` — but the hole left in the bearer boundary 0.2.1 drew. It answers
# `{"ok": true}` now; the probes read the status code and no field of the body, so nothing
# about them changes. `charts/tests/rag_instruments.py` asks the running handler rather than
# the source, because the source is where the wrong comment was.
#
# 0.2.1 is the document name, which 0.2.0 destroyed, plus the three items parked against the
# next re-measure of this listing's digest.
#
# `console.py` sent the submitted name as `name.encode("ascii", "replace")`, so every character
# outside ASCII became `?`. The indexer derives a document's identity from the name it is given
# and REPLACES a document of the same identity — so `Счёт.pdf` and `План.pdf` both arrived as
# `????.pdf`, hashed to one identity, and the second upload deleted every chunk of the first.
# The returned `replaced` count said so and nothing rendered it. Both documents, and every
# citation quoting them, read `????.pdf`. Cyrillic names are the normal case for these users and
# the submitted copy inside the enclave is the only copy. Now percent-encoded on the way out and
# `unquote`d before `safe_name` on the way in, so the identifier and the stored `document_name`
# both carry the real name; `safe_name` keeps doing its own work on it.
#
# `store_upload` also writes before it deletes now. It deleted the old chunks first, so a write
# that failed partway left neither version complete — and, on every ordinary resubmission, left
# the document unsearchable for as long as re-embedding it took. The superseded chunks are
# identified by the primary keys they already carry, so this needs no new metadata field and
# does not change a collection `langchain_milvus` built from its first batch.
#
# And the indexer authenticates. Every route on :8085 but `/healthz` now needs the bearer token
# the Secret carries to both pods: two of those routes write the collection whose answers are
# cited beside the gated corpus, and a ClusterIP Service is not a trust boundary once a second
# workload is in the namespace — the same argument the extraction service's key already rested
# on. `crag.validate` requires `corpus.apiKey`, so an unkeyed indexer does not render.
#
# Smaller, from the same review: the console reads one byte past `UPLOAD_MAX_BYTES` and refuses
# on the overflow instead of after the whole upload is resident in a 512Mi container, and
# `server.rerankerScoreThreshold` now says what it means on a reranker fallback, where the
# scores it filters are the retriever's similarities rather than the cross-encoder's
# probabilities.
#
# 0.2.0 is two things the pilot shipped without, and the minor bump is because the second one
# adds a component and a collection rather than correcting a number.
#
# The reranker SAYS when it is not working. 0.1.6 stopped the 413 and 0.1.7 stopped the
# timeout, and both were found by reading citations and noticing the scores were 0.0 — because
# `TEIRerank`'s fallback returned the retriever's documents with no score and told nobody. Now
# a fallback keeps the retriever's own similarity as the score, marks the documents, carries
# `citations.reranker` into the answer, and writes its verdict where `/v1/health` reads it. The
# console's "who touched your data" panel shows `degraded` with the reason beside the reranker's
# own name, and a degraded answer's citation list says the order is the retriever's. The
# verdict file is `RERANKER_STATUS_PATH` in /tmp-data of the server container, shared by its
# uvicorn workers: the worker answering a health request is not the worker that reranked.
#
# And documents can be SUBMITTED, not only read from a table. `charts/swarm-doc-ingest` does
# the extraction — Docling, TableFormer and RapidOCR, CPU-only, no NIM — and the indexer writes
# the elements into a collection of its own, `server.uploadCollection`. Its own collection
# because the gated corpus is dropped and rewritten whenever it moves, so one collection for
# both would delete every submitted file on the next refresh; `crag.validate` refuses a render
# where the two names are equal. The console gains the document management upstream's
# `ingestor-server` would have provided: submit, list, remove. A table is indexed as Markdown
# split on row boundaries with its header repeated. A chart is LOCATED, NOT TRANSCRIBED — cited
# as an image at a position on a page, by its caption, and the console and the listing both say
# its data is not searchable, because this stack reads no chart data at all.
#
# 0.1.6 is the reranker doing its job, and one blocking sleep removed.
#
# `server.topK` was 40 against the reranker's `--max-client-batch-size 32`, so Text Embeddings
# Inference refused every rerank instantly with `413 batch size 40 > maximum allowed batch size
# 32`. The adapter fell back to the retriever's order as designed, so answers stayed correct and
# the only symptom was citations with no relevance score. Now 12 — a third of the ceiling and
# ~36 s of the adapter's 60 s budget at the measured 3.0 s per passage on two cores — and
# `crag.validate` refuses a render that breaks the ceiling, because the two numbers live in
# different charts and nothing checked that they agreed.
#
# And `login()` called `time.sleep(0.5)` on the event loop: every wrong password froze the whole
# console for half a second, streaming answers included. It awaits now.
version: 0.2.2
# The upstream release this is a port of. The image is built from
# Super-Protocol/confidential-rag at branch confidential/2.6.2 — see MODIFICATIONS.md there for
# what differs, which is the open embedding, reranking and generation engines and nothing about
# the pipeline itself.
appVersion: "2.6.2"
