{{- include "crag.validate" . -}}
{{- /*
Every credential this deployment holds, and the resolved data binding, in the one place the
platform protects. A Secret is lifted out of the deployment bundle and sealed for the target
before anything is applied, and its contents are not in the evidence snapshot — which is both
why a key belongs here and why a generated or per-consumer value here costs the attested digest
nothing.

Nothing in this chart puts a credential in an env value, a command argument or a ConfigMap.
Those are rendered into the manifests, travel in the bundle in clear, and are published.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crag.name" . }}-secrets
  labels:
    {{- include "crag.labels" . | nindent 4 }}
type: Opaque
stringData:
  console-password: {{ .Values.console.password | quote }}
  console-session-key: {{ .Values.console.sessionKey | quote }}
  inference-api-key: {{ .Values.inference.apiKey | quote }}
  embeddings-api-key: {{ .Values.embeddings.apiKey | quote }}
  reranker-api-key: {{ .Values.reranker.apiKey | quote }}
  {{- if and .Values.ingest.enabled .Values.server.uploadCollection }}
  # The extraction service's own key. Rendered only when there is an extraction service: a
  # Secret entry for a component this deployment does not run is a credential nobody can
  # account for.
  ingest-api-key: {{ .Values.ingest.apiKey | quote }}
  {{- end }}
  vector-store-password: {{ .Values.vectorStore.password | quote }}
  # The resolved `corpus` slot. For a gated dataset this carries no credential at all — a local
  # address, a database name and the literal user `gateway`, which the gate replaces with the
  # publisher's own before it forwards. For an ungated one it carries the owner's read-only
  # credentials, which is the other reason it is here.
  corpus-binding.json: {{ .Values.corpus.bindingJson | default "[]" | quote }}
