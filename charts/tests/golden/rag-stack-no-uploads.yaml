# Source: confidential-rag/templates/configmap-app.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-rag-app
  labels:
    app.kubernetes.io/name: confidential-rag
    app.kubernetes.io/instance: rag
    app.kubernetes.io/managed-by: Helm
data:
  console.py: |
    #!/usr/bin/env python3
    """The deployment's front door: a sign-in form, a session cookie, and a chat over the corpus.
    
    Why this exists rather than upstream's playground: upstream's production container proxies the
    collection and document endpoints to `ingestor-server`, which this port does not deploy —
    `ingestor_server` needs `nv_ingest_client` and drives four NIM containers, which is the whole
    licence problem this listing exists to avoid. So this serves the same shape over the open
    components: ask a question and read the answer with its citations, submit a document and see
    what the extractor made of it, plus the two things upstream has no place for — who is allowed
    in, and which model and which embedder touched the data.
    
    Four things here are not incidental.
    
    **The credential is collected with a form and carried in a cookie.** HTTP Basic does not survive
    a single-page console: the manifest and the icons are fetched in a mode where the browser sends
    no credentials, so the prompt returns for ever, and ingress-nginx strips `Authorization` when it
    performs basic auth itself, so the app behind it authenticates nobody.
    
    **The session is a signed assertion, not a row.** `HMAC-SHA256(key, "v1|<expiry>")`, verified in
    constant time. No store to run, no state to lose on a restart, and nothing per-deployment in any
    rendered object: the key is in a Secret, which the platform lifts out before the evidence
    snapshot is taken.
    
    **Only `/healthz` is outside the session.** It reports liveness and nothing about the corpus,
    because it is reachable from the public hostname by anyone who finds the name.
    
    **A degraded component is reported, not smoothed over.** The status panel reads the pipeline's
    own health report, where a reranker that answered its probe and refused every actual rerank now
    says `degraded` with the reason — and the console also keeps the verdict from the last answer it
    relayed, because `Citations.reranker` cannot be missed by a worker that did not serve the query.
    A reranker doing nothing on every query is what the previous version of this listing shipped,
    and the only trace was citations reading 0.0.
    
    stdlib plus what the rag-server image already carries (fastapi, httpx) — this runs in that image,
    from a ConfigMap the cloud digests and signs, so the code serving the door is in the evidence
    beside the code answering the questions.
    """
    
    from __future__ import annotations
    
    import asyncio
    import hashlib
    import hmac
    import json
    import logging
    import os
    import secrets
    import time
    import urllib.parse
    
    import httpx
    from fastapi import FastAPI, File, Form, Request, Response, UploadFile
    from fastapi.responses import HTMLResponse, JSONResponse, RedirectResponse, StreamingResponse
    
    logging.basicConfig(level=os.environ.get("LOG_LEVEL", "INFO"))
    logger = logging.getLogger("console")
    
    PASSWORD = os.environ.get("CONSOLE_PASSWORD", "")
    SESSION_KEY = os.environ.get("CONSOLE_SESSION_KEY", "").encode()
    SESSION_TTL = int(os.environ.get("CONSOLE_SESSION_TTL_SECONDS", 12 * 3600))
    COOKIE = "crag_session"
    
    RAG_URL = os.environ.get("RAG_SERVER_URL", "http://127.0.0.1:8081").rstrip("/")
    SYNC_URL = os.environ.get("CORPUS_SYNC_URL", "").rstrip("/")
    # The indexer authenticates from 0.1.9 — `POST /documents` and `DELETE /documents/<id>` on
    # its port are writes into the index whose answers are cited beside the gated corpus, and a
    # namespace is not a trust boundary once a second workload is in it (SUP-895). Same Secret,
    # same key, both pods.
    SYNC_API_KEY = os.environ.get("CORPUS_API_KEY", "")
    COLLECTION = os.environ.get("COLLECTION_NAME", "documents")
    UPLOAD_COLLECTION = os.environ.get("UPLOAD_COLLECTION_NAME", "")
    UI_DIR = os.environ.get("UI_DIR", "/opt/console")
    # What a browser may hand over, mirrored from the indexer's own ceiling so the refusal happens
    # here rather than after the bytes have crossed the namespace.
    UPLOAD_MAX_BYTES = int(os.environ.get("UPLOAD_MAX_BYTES", 64 * 1024 * 1024))
    # Extraction is one document at a time on four CPU cores: 13.1 s for a fifteen-page PDF with a
    # text layer, 52.6 s for the same pages as a 200-dpi scan through OCR, and a queue in front of
    # it when somebody submits two.
    UPLOAD_TIMEOUT_SECONDS = float(os.environ.get("UPLOAD_TIMEOUT_SECONDS", 960))
    
    # What the deployment says about itself. Every value is rendered from the listing's own
    # parameters, so the panel a user reads and the digest the cloud signed describe the same thing.
    ABOUT = {
        "title": os.environ.get("CONSOLE_TITLE", "Confidential RAG"),
        "generationModel": os.environ.get("ABOUT_GENERATION_MODEL", ""),
        "generationLicence": os.environ.get("ABOUT_GENERATION_LICENCE", ""),
        "embeddingModel": os.environ.get("ABOUT_EMBEDDING_MODEL", ""),
        "embeddingLicence": os.environ.get("ABOUT_EMBEDDING_LICENCE", ""),
        "rerankerModel": os.environ.get("ABOUT_RERANKER_MODEL", ""),
        "rerankerLicence": os.environ.get("ABOUT_RERANKER_LICENCE", ""),
        "collection": COLLECTION,
        "uploadCollection": UPLOAD_COLLECTION,
        "extractionStack": os.environ.get("ABOUT_EXTRACTION_STACK", ""),
        "extractionLicence": os.environ.get("ABOUT_EXTRACTION_LICENCE", ""),
        "uploadsEnabled": bool(UPLOAD_COLLECTION and SYNC_URL),
        "uploadMaxBytes": UPLOAD_MAX_BYTES,
        "sourceRepo": os.environ.get("ABOUT_SOURCE_REPO", ""),
        "expectedDigest": os.environ.get("ABOUT_EXPECTED_DIGEST", ""),
    }
    
    # The last thing an answer said about its own reranking. One process, one replica, and no
    # store: a restarted console simply has nothing to say until the next answer or the next
    # health report, which is the honest state rather than a stale one.
    LAST_RERANKING: dict[str, object] = {}
    
    if not PASSWORD or not SESSION_KEY:
        # Refuse to start rather than serve an open door. A console that came up without a
        # password would pass every probe in the chart and publish the corpus to the internet.
        raise SystemExit(
            "console: CONSOLE_PASSWORD and CONSOLE_SESSION_KEY are required; refusing to serve "
            "an unauthenticated interface on a public hostname"
        )
    
    app = FastAPI(docs_url=None, redoc_url=None, openapi_url=None)
    
    
    def sync_headers(extra: dict[str, str] | None = None) -> dict[str, str]:
        """What the console presents to the indexer. Its bearer token, plus whatever else."""
        headers = dict(extra or {})
        if SYNC_API_KEY:
            headers["Authorization"] = f"Bearer {SYNC_API_KEY}"
        return headers
    
    
    def document_name_header(name: str) -> str:
        """A submitted file name, in a form an HTTP header carries without losing any of it.
    
        Percent-encoded, and that is the whole of SUP-895. 0.1.8 sent
        `name.encode("ascii", "replace")`, which turns every character outside ASCII into `?` —
        so `Счёт.pdf` and `План.pdf` both arrived at the indexer as `????.pdf`. The indexer
        derives a document's identity from the name it was given and REPLACES a document of the
        same identity, so the second of those two uploads deleted every chunk of the first, and
        both read `????.pdf` in the console and in every citation quoting them. Cyrillic file
        names are the normal case for this deployment's users, and the submitted copy inside the
        enclave is the only copy.
    
        A header is latin-1 on the wire, so the name cannot simply be sent as it is. Percent
        encoding is reversible, is ASCII, and leaves nothing for the indexer's filter-expression
        checks to have to care about; `urllib.parse.unquote` on the other side gets the real name
        back before anything is derived from it.
        """
        return urllib.parse.quote(name, safe="")
    
    
    def issue(ttl: int = SESSION_TTL) -> str:
        expiry = int(time.time()) + ttl
        payload = f"v1|{expiry}"
        mac = hmac.new(SESSION_KEY, payload.encode(), hashlib.sha256).hexdigest()
        return f"{payload}|{mac}"
    
    
    def valid(token: str | None) -> bool:
        if not token:
            return False
        parts = token.split("|")
        if len(parts) != 3 or parts[0] != "v1":
            return False
        payload, mac = f"{parts[0]}|{parts[1]}", parts[2]
        expected = hmac.new(SESSION_KEY, payload.encode(), hashlib.sha256).hexdigest()
        if not hmac.compare_digest(expected, mac):
            return False
        try:
            return int(parts[1]) > time.time()
        except ValueError:
            return False
    
    
    def signed_in(request: Request) -> bool:
        return valid(request.cookies.get(COOKIE))
    
    
    def page(name: str) -> str:
        with open(os.path.join(UI_DIR, name), encoding="utf-8") as handle:
            return handle.read()
    
    
    LOGIN_PAGE = """<!doctype html>
    <html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>__TITLE__</title>
    <style>
     :root{color-scheme:dark}
     body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0e14;color:#e6e6e6;
          font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
     form{width:min(92vw,22rem);padding:2rem;background:#141925;border:1px solid #232a3a;border-radius:12px}
     h1{margin:0 0 .25rem;font-size:1.15rem}
     p{margin:0 0 1.5rem;color:#8b94a7;font-size:.86rem}
     label{display:block;margin-bottom:.4rem;font-size:.8rem;color:#8b94a7}
     input{width:100%;box-sizing:border-box;padding:.6rem .7rem;background:#0b0e14;color:#e6e6e6;
           border:1px solid #2b3448;border-radius:8px;font-size:.95rem}
     button{margin-top:1.1rem;width:100%;padding:.65rem;border:0;border-radius:8px;background:#3b82f6;
            color:#fff;font-size:.95rem;font-weight:600;cursor:pointer}
     .err{margin:.9rem 0 0;color:#f87171;font-size:.84rem}
    </style></head>
    <body><form method="post" action="/login">
     <h1>__TITLE__</h1>
     <p>This deployment answers questions over your own documents. Sign in to continue.</p>
     <label for="password">Access password</label>
     <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
     <button type="submit">Sign in</button>
     __ERROR__
    </form></body></html>
    """
    
    
    def login_page(error: str = "") -> HTMLResponse:
        markup = LOGIN_PAGE.replace("__TITLE__", ABOUT["title"])
        markup = markup.replace(
            "__ERROR__", '<p class="err">That password was not accepted.</p>' if error else ""
        )
        # 401 on a failed attempt, 200 on a first visit: a monitor should be able to tell the
        # difference without parsing the body.
        return HTMLResponse(markup, status_code=401 if error else 200)
    
    
    @app.get("/healthz")
    async def healthz() -> JSONResponse:
        """Liveness, and nothing about the corpus. Reachable by anybody who finds the hostname."""
        return JSONResponse({"status": "ok"})
    
    
    @app.get("/")
    async def root(request: Request) -> HTMLResponse:
        if not signed_in(request):
            return login_page()
        return HTMLResponse(page("index.html"))
    
    
    @app.post("/login")
    async def login(response: Response, password: str = Form("")) -> Response:
        # Constant-time, so a wrong answer takes as long as a right one.
        if not hmac.compare_digest(password.encode(), PASSWORD.encode()):
            # A deliberate, fixed delay. Not rate limiting — one process cannot do that honestly —
            # but enough that an online guess against this door is not free.
            #
            # `asyncio.sleep` and not `time.sleep`: this handler runs on the event loop, and a
            # blocking sleep here stops the whole console for half a second — including an answer
            # streaming to somebody already signed in. Two wrong passwords a second from anyone who
            # finds the hostname would be a denial of service against every legitimate user, which
            # is a worse bargain than the brute-force cost it buys.
            await asyncio.sleep(0.5)
            return login_page(error="bad")
        redirect = RedirectResponse("/", status_code=303)
        redirect.set_cookie(
            COOKIE,
            issue(),
            max_age=SESSION_TTL,
            httponly=True,
            # The deployment is served over TLS by the cloud's gateway and on no other scheme.
            secure=True,
            samesite="lax",
            path="/",
        )
        return redirect
    
    
    @app.post("/logout")
    async def logout() -> Response:
        redirect = RedirectResponse("/", status_code=303)
        redirect.delete_cookie(COOKIE, path="/")
        return redirect
    
    
    @app.get("/api/about")
    async def about(request: Request) -> JSONResponse:
        if not signed_in(request):
            return JSONResponse({"error": "not signed in"}, status_code=401)
        return JSONResponse(ABOUT)
    
    
    def reranker_panel(pipeline: object) -> dict[str, object]:
        """What to say about reranking, out of the two places that know.
    
        `degraded` is reported if EITHER the pipeline's health report says so or the last answer
        this console relayed said so. Not "the most recent of the two": a health report from a
        worker that has reranked nothing says `healthy` quite correctly, and letting that
        overwrite a degradation a query actually hit is how this failure stayed invisible in the
        first place. A recovery clears it, because the next successful answer and the next health
        report both say so.
        """
        panel: dict[str, object] = {"degraded": False, "reason": "", "source": "none"}
    
        if isinstance(pipeline, dict):
            for service in pipeline.get("nim") or []:
                if not isinstance(service, dict):
                    continue
                if str(service.get("service") or "").lower() != "ranking":
                    continue
                panel["model"] = service.get("model") or ""
                panel["status"] = service.get("status") or ""
                if str(service.get("status") or "").lower() == "degraded":
                    panel.update(
                        degraded=True,
                        reason=str(service.get("message") or ""),
                        source="health",
                    )
                break
    
        if LAST_RERANKING.get("degraded") and not panel["degraded"]:
            panel.update(
                degraded=True,
                reason=str(LAST_RERANKING.get("reason") or ""),
                source="answer",
                observedAt=LAST_RERANKING.get("at"),
            )
        return panel
    
    
    @app.get("/api/status")
    async def status(request: Request) -> JSONResponse:
        """What the corpus and the pipeline are doing, as the deployment itself sees it."""
        if not signed_in(request):
            return JSONResponse({"error": "not signed in"}, status_code=401)
    
        out: dict[str, object] = {}
        async with httpx.AsyncClient(timeout=30.0) as client:
            if SYNC_URL:
                try:
                    answer = await client.get(
                        f"{SYNC_URL}/status", headers=sync_headers()
                    )
                    out["corpus"] = answer.json()
                except Exception as error:  # noqa: BLE001 — the panel reports, it does not fail
                    out["corpus"] = {"error": str(error)}
            try:
                # `check_dependencies` is what makes this answer about the four endpoints rather
                # than about the server's own process — without it the report is three empty
                # lists, which is a panel that always says nothing.
                answer = await client.get(
                    f"{RAG_URL}/v1/health", params={"check_dependencies": "true"}
                )
                out["pipeline"] = answer.json()
            except Exception as error:  # noqa: BLE001
                out["pipeline"] = {"error": str(error)}
        # Two sources for one fact, and both are needed. The health report is the one an operator
        # can read with no query in flight; the verdict carried by the last answer is the one that
        # cannot be missed, because `/v1/health` is served by whichever uvicorn worker takes the
        # request and not necessarily the one that reranked.
        out["reranker"] = reranker_panel(out.get("pipeline"))
        return JSONResponse(out)
    
    
    def sse_error(message: str) -> StreamingResponse:
        """One server-sent error event, which is what the console's chat renders.
    
        The alternative — a 4xx with a JSON body — reaches a reader as "the pipeline
        returned no answer", because the page is reading an event stream by then.
        """
    
        async def once():
            yield f"data: {json.dumps({'error': message})}\n\n".encode()
    
        return StreamingResponse(
            once(),
            media_type="text/event-stream",
            headers={"Cache-Control": "no-store", "X-Accel-Buffering": "no"},
        )
    
    
    async def live_collections() -> list[str] | None:
        """The collections a question may name, as the indexer sees them.
    
        `None` means the indexer could not be asked, which is a different answer
        from "there are none": the first is a reason to try the gated collection and
        see, the second is a deployment with nothing indexed, and a question is
        worth attempting in one case and not the other.
        """
        if not SYNC_URL:
            return None
        try:
            async with httpx.AsyncClient(timeout=5.0) as client:
                answer = await client.get(
                    f"{SYNC_URL}/collections", headers=sync_headers()
                )
            return [
                name
                for name in (answer.json().get("collections") or [])
                if isinstance(name, str) and name
            ]
        except Exception:  # noqa: BLE001
            logger.warning("could not ask the indexer which collections exist")
            return None
    
    
    def reranking_watcher():
        """A coroutine fed raw SSE bytes, recording what each event said about reranking.
    
        Written as a generator rather than a parse-at-the-end because the answer is streamed and
        the citations arrive in the middle of it. It keeps only the last verdict: one answer, one
        reranking.
        """
        buffer = ""
        while True:
            chunk = yield
            buffer += chunk.decode("utf-8", "replace")
            while "\n\n" in buffer:
                block, buffer = buffer.split("\n\n", 1)
                for line in block.split("\n"):
                    if not line.startswith("data:"):
                        continue
                    body = line[5:].strip()
                    if not body or body == "[DONE]":
                        continue
                    try:
                        event = json.loads(body)
                    except ValueError:
                        continue
                    citations = event.get("citations") if isinstance(event, dict) else None
                    report = (citations or {}).get("reranker") if isinstance(citations, dict) else None
                    if isinstance(report, dict):
                        LAST_RERANKING.clear()
                        LAST_RERANKING.update(
                            degraded=bool(report.get("degraded")),
                            reason=str(report.get("reason") or ""),
                            scoreSource=str(report.get("score_source") or ""),
                            at=time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                        )
            # A buffer that never completes an event is an answer that never ended; bound it
            # rather than grow it for the life of the request.
            if len(buffer) > 1_000_000:
                buffer = buffer[-4096:]
    
    
    @app.post("/api/ask")
    async def ask(request: Request) -> Response:
        """Put a question to the ported pipeline: retrieve, rerank, generate, cite.
    
        Proxied rather than called from the browser, for one reason that matters: the rag-server is
        on no Ingress and has no authentication of its own, so the only thing standing between the
        retriever and the internet is this session check. A browser-side call would need the
        rag-server published.
        """
        if not signed_in(request):
            return JSONResponse({"error": "not signed in"}, status_code=401)
    
        try:
            body = await request.json()
        except Exception:  # noqa: BLE001
            return JSONResponse({"error": "expected a JSON body"}, status_code=400)
    
        question = (body.get("question") or "").strip()
        if not question:
            return JSONResponse({"error": "question is required"}, status_code=400)
        if len(question) > 8000:
            return JSONResponse({"error": "question is too long"}, status_code=413)
    
        # Only collections that EXIST may be named: the rag-server answers 400 for the whole
        # query if one does not, rather than skipping it. So the indexer is asked, per question —
        # two existence checks, no embedding — instead of this guessing from configuration, which
        # would be wrong on a deployment whose corpus has not indexed yet and right again ten
        # minutes later.
        collections = await live_collections()
        if collections is None:
            # The indexer could not be asked. Try the gated collection, which is the one a
            # deployment with a dataset attached has.
            collections = [COLLECTION]
        elif not collections:
            # Nothing is indexed at all, and relaying the rag-server's `400 Collection …
            # does not exist. Ensure a collection is created using POST /collection` would
            # tell a tenant to call an endpoint this listing does not publish.
            return sse_error(
                "There is nothing to search yet: no dataset is attached and no document has "
                "been submitted. The panels on the right say which."
            )
    
        payload = {
            "messages": [{"role": "user", "content": question}],
            "use_knowledge_base": True,
            "collection_names": collections,
            "enable_citations": True,
            "stream": True,
        }
    
        async def relay():
            timeout = httpx.Timeout(10.0, read=300.0)
            async with httpx.AsyncClient(timeout=timeout) as client:
                async with client.stream("POST", f"{RAG_URL}/v1/generate", json=payload) as answer:
                    if answer.status_code != 200:
                        detail = (await answer.aread()).decode("utf-8", "replace")[:2000]
                        yield f"data: {json.dumps({'error': detail})}\n\n".encode()
                        return
                    # Forwarded byte for byte, and read in passing. The thing being read is
                    # `citations.reranker`: whether the answer going past was reranked at all.
                    # Recording it here is what lets the status panel say so between queries,
                    # which is the one window in which nobody is looking at a citation.
                    watcher = reranking_watcher()
                    next(watcher)
                    async for chunk in answer.aiter_raw():
                        try:
                            watcher.send(chunk)
                        except Exception:  # noqa: BLE001 — never spoil an answer to read it
                            logger.debug("could not read the reranking verdict", exc_info=True)
                        yield chunk
    
        return StreamingResponse(
            relay(),
            media_type="text/event-stream",
            headers={"Cache-Control": "no-store", "X-Accel-Buffering": "no"},
        )
    
    
    # ---------------------------------------------------------------------------------------------
    # Documents
    #
    # The collection and document management upstream's `ingestor-server` provides, over the
    # components this port actually deploys: the extraction stage is `swarm-doc-ingest`, and the
    # indexer beside this console is what writes the chunks. Every one of these is behind the
    # session, because a document a person submits is the same data the corpus is.
    # ---------------------------------------------------------------------------------------------
    
    
    @app.get("/api/documents")
    async def list_documents(request: Request) -> JSONResponse:
        if not signed_in(request):
            return JSONResponse({"error": "not signed in"}, status_code=401)
        if not SYNC_URL:
            return JSONResponse({"documents": [], "enabled": False})
        try:
            async with httpx.AsyncClient(timeout=30.0) as client:
                answer = await client.get(
                    f"{SYNC_URL}/documents", headers=sync_headers()
                )
            return JSONResponse(answer.json(), status_code=answer.status_code)
        except Exception as error:  # noqa: BLE001
            return JSONResponse({"error": str(error)}, status_code=502)
    
    
    @app.post("/api/documents")
    async def submit_document(request: Request, file: UploadFile = File(...)) -> JSONResponse:
        """Hand one file to the indexer, which extracts it and writes its chunks.
    
        The bytes are read into memory here rather than streamed through, and that is a bounded
        decision rather than an oversight: `UPLOAD_MAX_BYTES` is the bound, this container has
        512Mi, and the alternative — a chunked relay — would mean this console deciding what to do
        with half an uploaded document when the indexer refuses the second half.
        """
        if not signed_in(request):
            return JSONResponse({"error": "not signed in"}, status_code=401)
        if not (SYNC_URL and UPLOAD_COLLECTION):
            return JSONResponse(
                {
                    "error": "this deployment has no extraction service, so it reads documents "
                    "from its gated source only"
                },
                status_code=503,
            )
    
        name = os.path.basename((file.filename or "").replace("\\", "/")).strip()
        if not name:
            return JSONResponse({"error": "the file has no name"}, status_code=400)
    
        # One byte past the ceiling and no further: the refusal has to happen on bytes already
        # read rather than after the whole upload is resident in a 512Mi container (SUP-893).
        # `UploadFile.read` takes a size, so this costs nothing but the argument.
        blob = await file.read(UPLOAD_MAX_BYTES + 1)
        if not blob:
            return JSONResponse(
                {"error": "an empty document has nothing to index"}, status_code=400
            )
        if len(blob) > UPLOAD_MAX_BYTES:
            # The size is not reported, because this never read it: what is known is that the
            # document is larger than the limit, and the limit is the actionable half.
            return JSONResponse(
                {
                    "error": f"{name} is larger than the {UPLOAD_MAX_BYTES} bytes this "
                    "deployment accepts"
                },
                status_code=413,
            )
    
        try:
            async with httpx.AsyncClient(timeout=UPLOAD_TIMEOUT_SECONDS) as client:
                answer = await client.post(
                    f"{SYNC_URL}/documents",
                    content=blob,
                    headers=sync_headers({
                        "Content-Type": "application/octet-stream",
                        "X-Document-Name": document_name_header(name),
                    }),
                )
        except httpx.TimeoutException:
            return JSONResponse(
                {
                    "error": "extraction did not finish in time. One document is extracted at a "
                    "time and the rest queue; the document panel shows it once it lands."
                },
                status_code=504,
            )
        except Exception as error:  # noqa: BLE001
            return JSONResponse({"error": str(error)}, status_code=502)
        try:
            return JSONResponse(answer.json(), status_code=answer.status_code)
        except ValueError:
            return JSONResponse(
                {"error": answer.text[:400] or "the indexer answered nothing"},
                status_code=502,
            )
    
    
    @app.delete("/api/documents/{upload_id}")
    async def remove_document(request: Request, upload_id: str) -> JSONResponse:
        if not signed_in(request):
            return JSONResponse({"error": "not signed in"}, status_code=401)
        if not SYNC_URL:
            return JSONResponse({"error": "no indexer to ask"}, status_code=503)
        try:
            async with httpx.AsyncClient(timeout=60.0) as client:
                answer = await client.delete(
                    f"{SYNC_URL}/documents/{upload_id}", headers=sync_headers()
                )
            return JSONResponse(answer.json(), status_code=answer.status_code)
        except Exception as error:  # noqa: BLE001
            return JSONResponse({"error": str(error)}, status_code=502)
    
    
    # A nonce is generated per process and is not used for anything a reader should trust; it exists
    # so a restarted console is distinguishable in its own logs.
    logger.info("console up (instance %s)", secrets.token_hex(4))
    
  index.html: |
    <!doctype html>
    <!--
      The console, behind the session cookie.
    
      The panes on the right are the point of the listing as much as the chat is:
      "Who touched your data" names the generation model, the embedder and the reranker with their
      licences AND whether each of them is actually doing its job, and "Your corpus" shows the
      gate's own verdict on the last read. When a data owner withdraws approval, this is where it is
      visible — the corpus pane turns red and quotes the refusal, rather than questions silently
      getting worse. The same applies to the reranker: a reranker that answers its health probe and
      refuses every actual rerank reads "degraded" here with the reason, because the previous
      version of this listing shipped exactly that and the only trace was citations reading 0.0.
    
      "Your documents" is the document management half: submit a file, see what the extractor made
      of it, remove it. Tables are extracted as structure and are searchable; a chart is LOCATED,
      not transcribed — it is cited as an image at a position on a page, and the panel says so,
      because implying a chart's numbers are searchable would be a promise this stack cannot keep.
    
      No build step, no dependency, no network except this deployment: the whole interface is this
      file, and it is rendered into a ConfigMap the cloud digests and signs.
    -->
    <html lang="en"><head><meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Confidential RAG</title>
    <style>
     :root{color-scheme:dark}
     *{box-sizing:border-box}
     body{margin:0;height:100vh;display:flex;flex-direction:column;background:#0b0e14;color:#e6e6e6;
          font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
     header{display:flex;align-items:center;gap:1rem;padding:.8rem 1.2rem;border-bottom:1px solid #1d2432;
            background:#0f1320}
     header h1{margin:0;font-size:1rem;font-weight:650;letter-spacing:.01em}
     header .spacer{flex:1}
     header form{margin:0}
     header button{background:none;border:1px solid #2b3448;color:#8b94a7;border-radius:7px;
                   padding:.3rem .7rem;font-size:.8rem;cursor:pointer}
     main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 20rem;min-height:0}
     @media (max-width:860px){main{grid-template-columns:1fr}aside{display:none}}
     #chat{display:flex;flex-direction:column;min-height:0}
     #log{flex:1;overflow-y:auto;padding:1.2rem;display:flex;flex-direction:column;gap:1rem}
     .msg{max-width:52rem}
     .msg.you{align-self:flex-end;background:#1b2436;border:1px solid #273349;
              border-radius:12px 12px 2px 12px;padding:.6rem .9rem;white-space:pre-wrap}
     .msg.answer{white-space:pre-wrap}
     .cites{margin-top:.7rem;border-top:1px solid #1d2432;padding-top:.6rem}
     .cites h3{margin:0 0 .4rem;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:#8b94a7}
     .cite{margin-bottom:.5rem;font-size:.84rem}
     .cite .src{color:#60a5fa;word-break:break-all}
     .cite .txt{color:#9aa4b8;display:block;max-height:4.6em;overflow:hidden}
     .err{color:#f87171;font-size:.88rem;white-space:pre-wrap}
     form#askbox{display:flex;gap:.6rem;padding:1rem 1.2rem;border-top:1px solid #1d2432;background:#0f1320}
     form#askbox input{flex:1;padding:.7rem .8rem;background:#0b0e14;color:#e6e6e6;border:1px solid #2b3448;
                       border-radius:9px;font-size:.95rem}
     form#askbox button{padding:.7rem 1.2rem;border:0;border-radius:9px;background:#3b82f6;color:#fff;
                        font-weight:600;cursor:pointer}
     form#askbox button[disabled]{background:#2b3448;cursor:default}
     aside{border-left:1px solid #1d2432;overflow-y:auto;padding:1.1rem;background:#0d111b}
     aside section{margin-bottom:1.6rem}
     aside h2{margin:0 0 .6rem;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:#8b94a7}
     .row{display:flex;justify-content:space-between;gap:.6rem;font-size:.84rem;padding:.25rem 0;
          border-bottom:1px solid #161c28}
     .row span:first-child{color:#8b94a7;flex:0 0 auto}
     .row span:last-child{text-align:right;word-break:break-word}
     .lic{font-size:.74rem;color:#6b7488}
     .pill{display:inline-block;padding:.1rem .45rem;border-radius:999px;font-size:.7rem;font-weight:650}
     .ok{background:#143324;color:#4ade80}
     .bad{background:#3a1620;color:#f87171}
     .wait{background:#2a2410;color:#fbbf24}
     code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.8rem}
     .note{font-size:.76rem;color:#6b7488;margin:.5rem 0 0}
     .doc{display:flex;align-items:baseline;gap:.5rem;font-size:.82rem;padding:.3rem 0;
          border-bottom:1px solid #161c28}
     .doc .nm{flex:1;word-break:break-word}
     .doc .ct{color:#6b7488;font-size:.74rem;white-space:nowrap}
     .doc button{background:none;border:1px solid #2b3448;color:#8b94a7;border-radius:6px;
                 padding:.1rem .4rem;font-size:.7rem;cursor:pointer}
     .doc button:hover{color:#f87171;border-color:#3a1620}
     #droplabel{display:block;margin-top:.6rem;padding:.6rem;border:1px dashed #2b3448;
                border-radius:8px;text-align:center;font-size:.8rem;color:#8b94a7;cursor:pointer}
     #droplabel:hover{border-color:#3b82f6;color:#e6e6e6}
     #upfile{display:none}
     .cite .meta{color:#6b7488;font-size:.74rem}
    </style></head>
    <body>
    <header>
      <h1 id="title">Confidential RAG</h1>
      <span class="spacer"></span>
      <form method="post" action="/logout"><button type="submit">Sign out</button></form>
    </header>
    <main>
      <div id="chat">
        <div id="log">
          <div class="msg answer" style="color:#8b94a7">
            Ask a question about the documents this deployment is bound to. Answers are generated
            only from what the retriever found, and every one carries its citations.
          </div>
        </div>
        <form id="askbox" autocomplete="off">
          <input id="q" name="q" placeholder="Ask a question about your documents…" required>
          <button id="send" type="submit">Ask</button>
        </form>
      </div>
      <aside>
        <section>
          <h2>Who touched your data</h2>
          <div id="about"></div>
        </section>
        <section>
          <h2>Your corpus</h2>
          <div id="corpus"></div>
        </section>
        <section id="docsec">
          <h2>Your documents</h2>
          <div id="docs"></div>
          <label id="droplabel" for="upfile">Submit a document</label>
          <input id="upfile" type="file"
                 accept=".pdf,.docx,.pptx,.xlsx,.html,.htm,.md,.txt,.png,.jpg,.jpeg,.tiff,.tif,.bmp">
          <p class="note" id="upnote">
            PDF, Office, HTML, Markdown, text and scans. Tables are extracted as structure and are
            searchable; charts are cited as images at their position on the page — their data is not
            read and not searchable.
          </p>
        </section>
        <section>
          <h2>Pipeline</h2>
          <div id="pipeline"></div>
        </section>
      </aside>
    </main>
    <script>
    const $ = (id) => document.getElementById(id);
    let ABOUT = {};
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const row = (k, v) => `<div class="row"><span>${esc(k)}</span><span>${v}</span></div>`;
    
    async function about() {
      const r = await fetch("/api/about");
      if (!r.ok) { location.reload(); return; }
      const a = await r.json();
      $("title").textContent = a.title || "Confidential RAG";
      document.title = a.title || "Confidential RAG";
      const model = (name, licence) => name
        ? `${esc(name)}<br><span class="lic">${esc(licence || "licence not declared")}</span>`
        : "<span class='lic'>not configured</span>";
      ABOUT = a;
      $("about").innerHTML =
        row("Generation", model(a.generationModel, a.generationLicence)) +
        row("Embedding", model(a.embeddingModel, a.embeddingLicence)) +
        row("Reranking", model(a.rerankerModel, a.rerankerLicence)) +
        `<div id="rerankstate"></div>` +
        (a.extractionStack
          ? row("Extraction", model(a.extractionStack, a.extractionLicence)) : "") +
        row("Collection", `<code>${esc(a.collection)}</code>`) +
        (a.uploadCollection
          ? row("Uploads", `<code>${esc(a.uploadCollection)}</code>`) : "") +
        (a.expectedDigest ? row("Listing digest", `<code>${esc(a.expectedDigest.slice(0, 16))}…</code>`) : "");
      if (!a.uploadsEnabled) {
        $("docsec").innerHTML = `<h2>Your documents</h2><p class="note">This deployment has no
          extraction service, so it answers from its gated document source only.</p>`;
      }
    }
    
    // The reranker's own verdict, beside the model that is supposed to be doing the work. A red
    // pill here is the thing nothing reported in 0.1.7: the component was reachable, attested and
    // reserved two cores, and did nothing on any query.
    function rerankPane(r) {
      if (!r || !r.degraded) {
        if (!r || r.source === "none") return "";
        return row("", `<span class="pill ok">reranking</span>`);
      }
      return row("", `<span class="pill bad">degraded</span>`) +
        row("", `<span class="lic">${esc(r.reason || "the last rerank fell back to the " +
          "retriever's own order; citation scores are retriever similarities")}</span>`);
    }
    
    function corpusPane(c) {
      if (!c || c.error) {
        return `<div class="err">${esc((c && c.error) || "no corpus service")}</div>`;
      }
      const verdictPill = { admitted: "ok", refused: "bad", stalled: "bad", pending: "wait" }[c.verdict] || "wait";
      let html = row("Last read", `<span class="pill ${verdictPill}">${esc(c.verdict || "pending")}</span>`);
      if (c.message) html += row("", `<span class="lic">${esc(c.message)}</span>`);
      html += row("Indexed chunks", esc(c.chunks ?? "—"));
      html += row("Documents", esc(c.documents ?? "—"));
      if (c.lastSuccessAt) html += row("Last success", esc(c.lastSuccessAt));
      for (const s of c.sources || []) {
        html += row(s.dataset || "source",
          `<code>${esc(s.database)}.${esc(s.table)}</code><br><span class="lic">${
            s.gated ? "through the gatekeeper" : "direct credentials"}</span>`);
      }
      return html;
    }
    
    function pipelinePane(p) {
      if (!p || p.error) return `<div class="err">${esc((p && p.error) || "unavailable")}</div>`;
      const services = [].concat(p.nim || [], p.databases || [], p.object_storage || []);
      if (!services.length) return row("Health", `<span class="pill ok">reachable</span>`);
      return services.map((s) => {
        const good = String(s.status || "").toLowerCase() === "healthy";
        return row(s.service || "service",
          `<span class="pill ${good ? "ok" : "bad"}">${esc(s.status || "?")}</span>`);
      }).join("");
    }
    
    async function status() {
      try {
        const r = await fetch("/api/status");
        if (!r.ok) return;
        const s = await r.json();
        $("corpus").innerHTML = corpusPane(s.corpus);
        $("pipeline").innerHTML = pipelinePane(s.pipeline);
        const state = $("rerankstate");
        if (state) state.innerHTML = rerankPane(s.reranker);
        if (ABOUT.uploadsEnabled) docsPane((s.corpus && s.corpus.uploadedDocuments) || []);
      } catch (e) { /* the panel reports, it does not break the chat */ }
    }
    
    function docsPane(documents) {
      const target = $("docs");
      if (!target) return;
      if (!documents.length) {
        target.innerHTML = `<p class="note">No document submitted yet.</p>`;
        return;
      }
      target.innerHTML = documents.map((d) =>
        `<div class="doc"><span class="nm">${esc(d.name)}</span>
         <span class="ct">${esc(d.chunks)} chunks</span>
         <button data-id="${esc(d.id)}" title="Remove from the index">remove</button></div>`
      ).join("");
      for (const button of target.querySelectorAll("button")) {
        button.addEventListener("click", async () => {
          button.disabled = true;
          try {
            const r = await fetch(`/api/documents/${encodeURIComponent(button.dataset.id)}`,
                                  { method: "DELETE" });
            if (!r.ok) note((await r.json()).error || "could not remove that document", true);
          } catch (error) { note(String(error), true); }
          status();
        });
      }
    }
    
    function note(message, bad) {
      const target = $("upnote");
      if (!target) return;
      target.textContent = message;
      target.style.color = bad ? "#f87171" : "#8b94a7";
    }
    
    // A citation names its document, what KIND of thing it was and where on the page it sat.
    // The kind matters here more than in most consoles: a table is extracted as structure and its
    // content is what was searched, while an image is cited by its caption and position and its
    // contents were never read. A reader has to be able to tell those apart.
    function citations(cites, reranking) {
      if (!cites || !cites.length) return "";
      const items = cites.map((c) => {
        const src = c.source || c.document_name || "document";
        const txt = (c.content || (c.metadata && c.metadata.description) || "").slice(0, 320);
        const meta = (c.metadata && c.metadata.content_metadata) || {};
        const kind = { structured: "table", image: "image (located, not read)" }[meta.element_type]
          || "";
        const page = (c.metadata && c.metadata.page_number) || 0;
        const box = (c.metadata && c.metadata.location) || [];
        const where = [
          kind,
          page ? `p. ${esc(page)}` : "",
          box.length === 4 ? `at ${box.map((v) => Math.round(v)).join(", ")}` : "",
          typeof c.score === "number" ? `score ${c.score.toFixed(3)}` : "",
        ].filter(Boolean).join(" · ");
        return `<div class="cite"><span class="src">${esc(src)}</span>
                ${where ? `<span class="meta">${where}</span>` : ""}
                <span class="txt">${esc(txt)}</span></div>`;
      }).join("");
      const caveat = reranking && reranking.degraded
        ? `<p class="note" style="color:#f87171">Reranking did not run for this answer, so these
           scores are the retriever's own similarities and this order is the retriever's.
           ${esc(reranking.reason || "")}</p>`
        : "";
      return `<div class="cites"><h3>Citations</h3>${caveat}${items}</div>`;
    }
    
    $("askbox").addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = $("q").value.trim();
      if (!question) return;
      $("q").value = "";
      $("send").disabled = true;
    
      const mine = document.createElement("div");
      mine.className = "msg you";
      mine.textContent = question;
      $("log").appendChild(mine);
    
      const answer = document.createElement("div");
      answer.className = "msg answer";
      answer.textContent = "…";
      $("log").appendChild(answer);
      $("log").scrollTop = $("log").scrollHeight;
    
      let text = "";
      let cites = null;
      let reranking = null;
      try {
        const response = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (response.status === 401) { location.reload(); return; }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          // Server-sent events: one event per blank-line-delimited block.
          let cut;
          while ((cut = buffer.indexOf("\n\n")) >= 0) {
            const block = buffer.slice(0, cut);
            buffer = buffer.slice(cut + 2);
            for (const line of block.split("\n")) {
              if (!line.startsWith("data:")) continue;
              const body = line.slice(5).trim();
              if (!body || body === "[DONE]") continue;
              let event;
              try { event = JSON.parse(body); } catch (e) { continue; }
              if (event.error) {
                answer.className = "msg err";
                answer.textContent = typeof event.error === "string"
                  ? event.error : JSON.stringify(event.error);
                continue;
              }
              const choice = (event.choices || [])[0] || {};
              const piece = (choice.message && choice.message.content) ||
                            (choice.delta && choice.delta.content) || "";
              if (piece) { text += piece; answer.textContent = text; }
              if (event.citations && event.citations.results) cites = event.citations.results;
              if (event.citations && event.citations.reranker) reranking = event.citations.reranker;
              $("log").scrollTop = $("log").scrollHeight;
            }
          }
        }
        if (!text && answer.className === "msg answer") {
          answer.className = "msg err";
          answer.textContent = "The pipeline returned no answer. The corpus panel on the right " +
            "says whether the documents are reachable.";
        } else if (cites) {
          answer.insertAdjacentHTML("beforeend", citations(cites, reranking));
        }
      } catch (error) {
        answer.className = "msg err";
        answer.textContent = String(error);
      } finally {
        $("send").disabled = false;
        $("q").focus();
        status();
      }
    });
    
    // Submitting a document. One at a time by construction — the extraction service does one and
    // queues the rest — so the control is disabled while it runs rather than queueing here too.
    const upload = $("upfile");
    if (upload) {
      upload.addEventListener("change", async () => {
        const file = upload.files && upload.files[0];
        if (!file) return;
        const label = $("droplabel");
        label.textContent = `Extracting ${file.name}…`;
        upload.disabled = true;
        note("One document is extracted at a time. A fifteen-page scan through OCR is about a " +
             "minute on the cores this deployment gives it.");
        try {
          const form = new FormData();
          form.append("file", file);
          const r = await fetch("/api/documents", { method: "POST", body: form });
          const body = await r.json().catch(() => ({}));
          if (!r.ok) {
            note(body.error || `the indexer answered ${r.status}`, true);
          } else {
            const e = body.elements || {};
            const charts = e.charts
              ? `, ${e.charts} chart/image${e.charts === 1 ? "" : "s"} located (${e.chartsIndexed}` +
                ` with a caption; their data is not searchable)`
              : "";
            // A document of the same name REPLACES the one already indexed, and until 0.1.9 it
            // did so without saying anything. The number was in the indexer's answer all along;
            // nothing rendered it, which made a replacement indistinguishable from a first
            // upload — and, while non-ASCII names were being collapsed to `????`, made a
            // DIFFERENT document's deletion look like an ordinary success (SUP-895).
            const replaced = body.replaced
              ? ` It replaced the ${body.replaced} chunks of an earlier ${body.name}.`
              : "";
            note(`${body.name}: ${body.chunks} chunks indexed — ${e.text || 0} text, ` +
                 `${e.tables || 0} table${e.tables === 1 ? "" : "s"}${charts}.${replaced}`);
          }
        } catch (error) {
          note(String(error), true);
        } finally {
          upload.value = "";
          upload.disabled = false;
          label.textContent = "Submit a document";
          status();
        }
      });
    }
    
    about();
    status();
    // Every refresh probes the four endpoints behind the pipeline, so this is a
    // slower cadence than a cosmetic poll would want.
    setInterval(status, 30000);
    </script>
    </body></html>
    
  corpus_sync.py: |
    #!/usr/bin/env python3
    """Index what this deployment is allowed to read, and report what the gate decided.
    
    Two sources, two collections, one indexer. That shape is the first thing to know, and it is not
    tidiness:
    
    * the **gated source** — a ClickHouse document table the data owner approved — is REBUILT on
      every change: dropped and rewritten, because a document the owner deleted has to leave the
      index and a diff against a source we may be refused tomorrow is a diff we cannot trust;
    * **uploaded documents** — a file a person put through the console, extracted by
      `swarm-doc-ingest` — are ADDITIVE and live in a collection of their own.
    
    One collection for both would mean every refresh of the gated corpus silently deleted every
    uploaded file. The rag-server retrieves from both collections in one query, so the split costs
    nothing a reader of the answers can see.
    
    **What it is.** A loop plus a small HTTP service. Read the document rows from whatever the
    deployment's `corpus` slot is bound to, chunk them, embed them with the deployment's own embedder,
    and write them into the collection the rag-server retrieves from. Then wait, re-read the source's
    own count and high-water mark, and re-index only when those moved. Beside that, serve the console's
    document management: submit a file, list what has been submitted, remove one.
    
    **Why it reads ClickHouse over HTTP and not object storage.** Because that is the only thing
    the marketplace gatekeeper can carry. The gate injects `x-clickhouse-user` / `x-clickhouse-key`
    into every request it forwards and rewrites the database the caller named, so a gated dataset
    reaches this deployment as a plain local address with no credential in it at all — which is the
    whole point: a consumer who reads every object in their own namespace learns the shape of the
    data and no way to reach it outside the gate. A document corpus in a bucket is not gateable
    today, whatever a dataset's `access.mode` says.
    
    **Why the verdict is a first-class output and not a log line.** Withdrawing approval is the
    thing the gate exists to do, and from inside the deployment it looks like an HTTP error on the
    next read. If that only reached the log, a tenant whose access was cut would see answers quietly
    get worse. So every attempt's verdict — `admitted`, `refused`, or `pending` — is served on
    `/status`, with the gate's own message, and the console shows it.
    
    **Why the collection is created through the rag-server's own code.** `MilvusVDB` and its
    `get_langchain_vectorstore` decide the field names, the index parameters, the token derivation
    and the search parameters. Writing the collection with anything else would mean this file and
    the retriever agreeing about the schema by coincidence; importing the retriever's own path means
    they cannot disagree. It is also what keeps `nv-ingest` out of the picture: upstream's
    `create_collection` needs `nv_ingest_client`, and `langchain_milvus` creating the collection
    from the first batch is the documented alternative the rag-server's citation code already
    handles ("if langchain is used for ingestion, the source is a string").
    
    **Why every chunk carries the same metadata keys, including the empty ones.**
    `langchain_milvus` creates the collection's fields from the FIRST batch it is given, so a key
    that appears only on a later document is a key the collection has no field for. A table chunk
    therefore carries an empty `image_metadata` and a text chunk carries an empty `table_metadata`,
    and that is load-bearing rather than sloppy.
    
    **What an uploaded document gets indexed, and what it does not.** `swarm-doc-ingest` returns
    nv-ingest elements: text, tables as cell grids and Markdown, and pictures with their bounding
    boxes. Text and tables are indexed and searchable — a table as its Markdown, split on row
    boundaries with its header repeated, because a table cut in half mid-grid is a chunk no model can
    read. A **picture is located, not transcribed**: this stack reads no chart data, so a chart is
    indexed by its caption and its position, and a chart with no caption is counted and not indexed
    at all. Writing a chunk that claimed to be a chart's contents would be the same kind of lie as
    the reranker scores this listing's previous version shipped.
    """
    
    from __future__ import annotations
    
    import hashlib
    import hmac
    import json
    import logging
    import os
    import re
    import threading
    import time
    import urllib.parse
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from typing import Any
    
    import requests
    from langchain_core.documents import Document
    
    from nvidia_rag.utils.configuration import NvidiaRAGConfig
    from nvidia_rag.utils.embedding import get_embedding_model
    from nvidia_rag.utils.vdb.milvus.milvus_vdb import MilvusVDB
    
    logging.basicConfig(
        level=os.environ.get("LOG_LEVEL", "INFO"),
        format="%(asctime)s %(levelname)s %(name)s %(message)s",
    )
    logger = logging.getLogger("corpus-sync")
    
    COLLECTION = os.environ.get("COLLECTION_NAME", "documents")
    # Uploaded files, in a collection of their own. The gated corpus is rebuilt from
    # scratch whenever it moves, so one collection for both would mean a refresh of
    # the corpus deleting every file anybody submitted.
    UPLOAD_COLLECTION = os.environ.get("UPLOAD_COLLECTION_NAME", "")
    INGEST_URL = os.environ.get("INGEST_URL", "").rstrip("/")
    INGEST_API_KEY = os.environ.get("INGEST_API_KEY", "")
    # Extraction is CPU work on a pod that does one document at a time and queues the
    # rest: a 15-page 200-dpi scan through OCR is 52.6 s measured, and a queue in
    # front of it makes that a wait rather than a failure.
    INGEST_TIMEOUT = float(os.environ.get("INGEST_TIMEOUT_SECONDS", 900))
    # What the console presents to reach this service, as a bearer token. The same argument the
    # extraction service's own key rests on, one step further in: this process WRITES the index
    # whose answers are cited beside the gated corpus, and `POST /documents` /
    # `DELETE /documents/<id>` on this port took anything that could reach them. A namespace is
    # not a trust boundary once a second workload is in it (SUP-895). `/healthz` stays open —
    # the kubelet carries no credential — and from 0.1.10 it reports liveness and nothing about
    # the corpus, which is what this comment claimed while the route answered `dict(STATE)`
    # (SUP-897). See `LIVENESS`.
    CORPUS_API_KEY = os.environ.get("CORPUS_API_KEY", "")
    UPLOAD_MAX_BYTES = int(os.environ.get("UPLOAD_MAX_BYTES", 64 * 1024 * 1024))
    # How many chunk rows the listing and the delete will read in one query. A document of a
    # hundred pages is a few hundred chunks, so this is two hundred such documents.
    UPLOAD_LIST_LIMIT = int(os.environ.get("UPLOAD_LIST_LIMIT", 16384))
    # What this service issues as a document identifier, and therefore all it will accept: the
    # value is interpolated into a Milvus filter expression.
    UPLOAD_ID_PATTERN = re.compile(r"^[A-Za-z0-9_-]{1,64}$")
    try:
        # The name `langchain_milvus` gives the primary key it generates, read from the library
        # rather than written here: replacing a document deletes the OLD chunks by their keys,
        # and a key field this file guessed would be a guess about a collection the retriever's
        # own code path created.
        from langchain_milvus.utils.constant import PRIMARY_FIELD as UPLOAD_PK_FIELD
    except ImportError:  # the image carries it; a render test that stubs the library does not
        UPLOAD_PK_FIELD = "pk"
    BINDING_PATH = os.environ.get("CORPUS_BINDING_FILE", "/etc/corpus/binding.json")
    TABLE = os.environ.get("CORPUS_TABLE", "documents")
    COL_ID = os.environ.get("CORPUS_ID_COLUMN", "doc_id")
    COL_TITLE = os.environ.get("CORPUS_TITLE_COLUMN", "title")
    COL_TEXT = os.environ.get("CORPUS_TEXT_COLUMN", "text")
    COL_UPDATED = os.environ.get("CORPUS_UPDATED_COLUMN", "updated_at")
    CHUNK_CHARS = int(os.environ.get("CORPUS_CHUNK_CHARS", 1800))
    CHUNK_OVERLAP = int(os.environ.get("CORPUS_CHUNK_OVERLAP_CHARS", 200))
    ROW_LIMIT = int(os.environ.get("CORPUS_ROW_LIMIT", 20000))
    POLL_SECONDS = int(os.environ.get("CORPUS_POLL_SECONDS", 60))
    BATCH = int(os.environ.get("CORPUS_EMBED_BATCH", 16))
    STATUS_PORT = int(os.environ.get("CORPUS_STATUS_PORT", 8085))
    HTTP_TIMEOUT = float(os.environ.get("CORPUS_HTTP_TIMEOUT", 60))
    # How long one batch of chunks may take to embed and write before this gives up on it and
    # reports a stall. Not a performance knob: it is the difference between a slow reindex and a
    # loop that is wedged, and without it there is no way to tell them apart from outside.
    BATCH_TIMEOUT = float(os.environ.get("CORPUS_BATCH_TIMEOUT", 300))
    # Passed to the embedding client. The OpenAI client defaults to ten minutes with two retries,
    # so one unanswered call can hold this loop for half an hour with nothing to show for it.
    EMBED_TIMEOUT = float(os.environ.get("CORPUS_EMBED_TIMEOUT", 120))
    
    # Everything `/status` reports, replaced wholesale under the lock after each attempt.
    STATE: dict[str, Any] = {
        "verdict": "pending",
        "message": "no read attempted yet",
        "sources": [],
        "documents": None,
        "chunks": None,
        "lastAttemptAt": None,
        "lastSuccessAt": None,
        "collection": COLLECTION,
        # Whether this deployment accepts a file at all, so the console can say
        # "not configured" rather than offering a button that answers 503.
        "uploads": {
            "enabled": bool(UPLOAD_COLLECTION and INGEST_URL),
            "collection": UPLOAD_COLLECTION,
            "maxBytes": UPLOAD_MAX_BYTES,
        },
    }
    STATE_LOCK = threading.Lock()
    
    # What `/healthz` answers, and the whole of it.
    #
    # `/healthz` is the one route on :8085 that takes no credential, because the kubelet carries
    # none. Until 0.1.10 it answered `dict(STATE)` — the gate's verdict and its message, the bound
    # dataset names and their interfaces, the document and chunk counts, both collection names, the
    # timestamps and the uploads configuration — which is the corpus described to anything in the
    # namespace that can reach the port, and to whoever the probe path is exposed to beyond that.
    # The comment on it said it returned "the probe's three fields and nothing about what is
    # indexed"; the code returned everything (SUP-897).
    #
    # Liveness is all a probe reads. The startup, readiness and liveness probes in this chart are
    # `httpGet` on this path and act on the STATUS CODE — no field of this body reaches a decision —
    # so there is nothing for a payload to carry, and `{"ok": true}` is enough for a person curling
    # it to tell this server from a proxy answering for it. Everything the console shows stays on
    # `/status`, behind the key with every other route.
    #
    # A new key here is a disclosure, not a feature: anything added to this dict is published
    # unauthenticated. `charts/tests/rag_instruments.py` asserts the served body against this.
    LIVENESS: dict[str, Any] = {"ok": True}
    
    # One embedder, two cores, and two things that want it: the gated corpus rebuild
    # and an upload. They write different collections, so they do not race over the
    # index — but a batch that holds the embedder for half a minute is a batch its
    # own health endpoint cannot answer during, which is how an earlier version of
    # this file turned a reindex into a loop that never finished. So they take turns.
    INDEX_LOCK = threading.Lock()
    
    
    def publish(**fields: Any) -> None:
        with STATE_LOCK:
            STATE.update(fields)
    
    
    def now() -> str:
        return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
    
    
    # --------------------------------------------------------------------------------------
    # The bound source
    # --------------------------------------------------------------------------------------
    
    
    def bindings() -> list[dict[str, Any]]:
        """The resolved `corpus` slot, as the marketplace wrote it into the Secret.
    
        A slot with `multiple: true` resolves to a list. An empty or absent file is a supported
        state and not an error: a deployment with nothing attached is a deployment waiting for its
        data owner to approve it, which is exactly the state the gate is for.
        """
        try:
            with open(BINDING_PATH, encoding="utf-8") as handle:
                raw = handle.read().strip()
        except FileNotFoundError:
            return []
        if not raw:
            return []
        parsed = json.loads(raw)
        if isinstance(parsed, dict):
            # A single binding, or the `{count, items}` shape — accept both rather than guess.
            if "items" in parsed and isinstance(parsed["items"], list):
                return [item for item in parsed["items"] if isinstance(item, dict)]
            return [parsed]
        if isinstance(parsed, list):
            return [item for item in parsed if isinstance(item, dict)]
        return []
    
    
    def connection(binding: dict[str, Any]) -> dict[str, Any]:
        return binding.get("connection") or {}
    
    
    def is_gated(binding: dict[str, Any]) -> bool:
        """A gated binding carries no password, because the gate holds the publisher's own.
    
        `connection.host` is `<releasePrefix>-gatekeeper-egress` and `username` is the literal
        `gateway`, which the gate replaces before it forwards. So the absence of a password is the
        reliable signal, not the hostname.
        """
        return not connection(binding).get("password")
    
    
    def endpoint(binding: dict[str, Any]) -> str:
        conn = connection(binding)
        scheme = "https" if conn.get("tls") else "http"
        return f"{scheme}://{conn.get('host')}:{int(conn.get('port') or 8123)}/"
    
    
    def query(binding: dict[str, Any], sql: str) -> list[dict[str, Any]]:
        """One ClickHouse HTTP query, through the gate when the dataset is gated.
    
        The database is passed as a query parameter rather than written into the SQL: the gate
        rewrites the database the caller named, and a name baked into the statement is a name it
        cannot rewrite.
        """
        conn = connection(binding)
        params = {"database": conn.get("database") or "default", "default_format": "JSONEachRow"}
        headers: dict[str, str] = {"Content-Type": "text/plain; charset=utf-8"}
        if not is_gated(binding):
            # An ungated dataset hands over the owner's own read-only credentials.
            headers["x-clickhouse-user"] = str(conn.get("username") or "")
            headers["x-clickhouse-key"] = str(conn.get("password") or "")
    
        url = endpoint(binding) + "?" + urllib.parse.urlencode(params)
        response = requests.post(url, data=sql.encode("utf-8"), headers=headers, timeout=HTTP_TIMEOUT)
        if response.status_code != 200:
            # ClickHouse and the gate both answer with a readable body. It is the most useful thing
            # a tenant whose access was just withdrawn can be shown, so it is carried, trimmed.
            raise RuntimeError(
                f"{response.status_code} from {conn.get('host')}: "
                f"{response.text.strip()[:400] or 'no message'}"
            )
        rows = []
        for line in response.text.splitlines():
            line = line.strip()
            if line:
                rows.append(json.loads(line))
        return rows
    
    
    def quote(identifier: str) -> str:
        """A ClickHouse identifier, back-quoted. Refuses anything that is not one."""
        if not identifier.replace("_", "").isalnum():
            raise ValueError(
                f"{identifier!r} is not an identifier: the table and column names come from the "
                "listing's parameters and are not a place to build SQL from"
            )
        return f"`{identifier}`"
    
    
    def watermark(binding: dict[str, Any]) -> tuple[int, str]:
        """How many rows the source has and how recently it changed — two numbers, one query.
    
        Re-reading these is what makes the loop cheap: a corpus that has not moved is not
        re-embedded, and a corpus that has is picked up without anybody triggering anything.
        """
        sql = (
            f"SELECT count() AS rows, max({quote(COL_UPDATED)}) AS high "
            f"FROM {quote(TABLE)}"
        )
        rows = query(binding, sql)
        if not rows:
            return 0, ""
        return int(rows[0].get("rows") or 0), str(rows[0].get("high") or "")
    
    
    def documents(binding: dict[str, Any]) -> list[dict[str, Any]]:
        sql = (
            f"SELECT {quote(COL_ID)} AS id, {quote(COL_TITLE)} AS title, {quote(COL_TEXT)} AS text "
            f"FROM {quote(TABLE)} "
            f"ORDER BY {quote(COL_UPDATED)} DESC "
            f"LIMIT {int(ROW_LIMIT)}"
        )
        return query(binding, sql)
    
    
    # --------------------------------------------------------------------------------------
    # Chunking and indexing
    # --------------------------------------------------------------------------------------
    
    
    def chunks(text: str) -> list[str]:
        """Fixed-width character chunks with an overlap, split on a boundary where one is near.
    
        Deliberately not a token splitter. The embedder truncates anything over its own window
        server-side (`--auto-truncate`), the chunk width here is set from the model's window in the
        listing, and a character split needs no tokenizer in this container — which is one fewer
        thing that has to agree with the model being served.
        """
        text = (text or "").strip()
        if not text:
            return []
        out: list[str] = []
        start = 0
        while start < len(text):
            end = min(start + CHUNK_CHARS, len(text))
            if end < len(text):
                # Prefer a paragraph, then a sentence, then a word — but only if one is in the
                # last fifth of the window, so a document without them still makes progress.
                window = text[start:end]
                floor = int(CHUNK_CHARS * 0.8)
                for marker in ("\n\n", ". ", "\n", " "):
                    cut = window.rfind(marker)
                    if cut >= floor:
                        end = start + cut + len(marker)
                        break
            out.append(text[start:end].strip())
            if end >= len(text):
                break
            start = max(end - CHUNK_OVERLAP, start + 1)
        return [chunk for chunk in out if chunk]
    
    
    def vector_store(collection: str = ""):
        """The retriever's own vector store, built through the retriever's own code path."""
        collection = collection or COLLECTION
        config = NvidiaRAGConfig()
        embedder = get_embedding_model(
            model=config.embeddings.model_name,
            url=config.embeddings.server_url,
            config=config,
        )
        # The retriever's own factory does not take a timeout, and its default is the OpenAI
        # client's: ten minutes, twice. Set it here rather than forking the factory — a longer
        # wait than this is not patience, it is a loop nobody can see into.
        for attribute, value in (("request_timeout", EMBED_TIMEOUT), ("max_retries", 1)):
            try:
                setattr(embedder, attribute, value)
            except Exception:  # noqa: BLE001 — an older client may not carry the field
                logger.warning("could not set %s on the embedding client", attribute)
        vdb = MilvusVDB(
            collection_name=collection,
            milvus_uri=config.vector_store.url,
            embedding_model=embedder,
            config=config,
            dense_dim=config.embeddings.dimensions,
            # CPU Milvus. GPU_CAGRA needs a card this pod does not have and must not take.
            gpu_index=False,
            gpu_search=False,
            username=config.vector_store.username,
            password=(
                config.vector_store.password.get_secret_value()
                if config.vector_store.password is not None
                else ""
            ),
        )
        return vdb, vdb.get_langchain_vectorstore(collection)
    
    
    def write_batch(store: Any, batch: list[Document]) -> None:
        """One batch, in a thread, so a wedged client is a reported stall and not a silence.
    
        `add_documents` embeds and inserts. Either half can hang — the embedding client on a
        saturated endpoint, the insert on a flush — and both held this loop with `/status` frozen
        at the attempt that started it, which is the one state an operator cannot act on. Observed
        on the gpu-blueprints cloud: twelve minutes inside one rebuild with the embedder idle and
        nothing published.
        """
        error: list[BaseException] = []
    
        def run() -> None:
            try:
                store.add_documents(batch)
            except BaseException as problem:  # noqa: BLE001 — re-raised on the caller's thread
                error.append(problem)
    
        worker = threading.Thread(target=run, name="embed-batch", daemon=True)
        worker.start()
        worker.join(BATCH_TIMEOUT)
        if worker.is_alive():
            raise TimeoutError(
                f"a batch of {len(batch)} chunks did not finish embedding and writing within "
                f"{BATCH_TIMEOUT:.0f}s — the endpoint is saturated or the index is not accepting"
            )
        if error:
            raise error[0]
    
    
    def write_all(store: Any, documents: list[Document], progress=None) -> int:
        """Embed and write every document, in batches, reporting after each one."""
        pending: list[Document] = []
        written = 0
        for document in documents:
            pending.append(document)
            if len(pending) >= BATCH:
                write_batch(store, pending)
                written += len(pending)
                pending = []
                if progress is not None:
                    progress(written)
        if pending:
            write_batch(store, pending)
            written += len(pending)
            if progress is not None:
                progress(written)
        return written
    
    
    def index(rows: list[dict[str, Any]], binding: dict[str, Any]) -> int:
        """Rebuild the collection from these rows. Returns the number of chunks written.
    
        A rebuild rather than an update, and the reason is the gate: a document the owner deleted
        has to leave the index, and a diff against a source we may be refused access to tomorrow is
        a diff we cannot trust. Dropping and rewriting a corpus of this size costs a minute.
        """
        vdb, store = vector_store()
        conn = connection(binding)
        dataset = binding.get("dataset") or "corpus"
        database = conn.get("database") or "default"
    
        if vdb.check_collection_exists(COLLECTION):
            logger.info("dropping the previous %s collection before the rebuild", COLLECTION)
            vdb.delete_collections([COLLECTION])
            # The store was built against the old collection; build it again so langchain
            # re-creates the collection from the first batch.
            vdb, store = vector_store()
    
        documents: list[Document] = []
        for row in rows:
            doc_id = str(row.get("id") or "")
            title = str(row.get("title") or "")
            for position, piece in enumerate(chunks(str(row.get("text") or ""))):
                documents.append(
                    Document(
                        page_content=piece,
                        metadata={
                            # A string, which is the shape the rag-server's citation code reads
                            # when langchain did the ingestion. It names where the chunk came
                            # from in a form a reader can act on.
                            "source": f"{dataset}:{database}.{TABLE}#{doc_id}",
                            "title": title,
                            "content_metadata": {
                                "type": "text",
                                # Rows have no pages. Zero is what the citation model defaults
                                # to and what the console then does not display.
                                "page_number": 0,
                                "chunk": position,
                            },
                        },
                    )
                )
    
        # Published per batch, not at the end. A rebuild of a real corpus takes minutes, and a
        # status that only moves when it finishes is a status that says nothing while the only
        # interesting thing is happening.
        def progress(written: int) -> None:
            publish(chunks=written, message=f"indexing: {written} chunks written")
    
        return write_all(store, documents, progress)
    
    
    # --------------------------------------------------------------------------------------
    # Uploaded documents
    # --------------------------------------------------------------------------------------
    #
    # A file a person submits through the console, extracted by `swarm-doc-ingest` — layout,
    # table structure and OCR on open components, CPU-only, no NIM and no NGC credential — and
    # indexed into a collection of its own.
    #
    # `swarm-doc-ingest` answers `POST /v1/extract` with nv-ingest `MetadataSchema` elements, and
    # the three kinds are not treated alike:
    #
    #   text        indexed as text, chunked like any prose;
    #   structured  a table. Indexed as the Markdown rendering, which is what a model reads well,
    #               split on ROW boundaries with the header repeated — a table cut mid-grid is a
    #               chunk nothing can read. `table_metadata.table_location` carries the box;
    #   image       a picture or a chart. LOCATED, NOT TRANSCRIBED: this stack reads no chart
    #               data, so what is indexed is the caption and the position, and a picture with
    #               no caption is counted and not indexed at all. A chunk claiming to hold a
    #               chart's numbers would be a lie of exactly the kind this version exists to fix.
    
    
    def uploads_enabled() -> bool:
        return bool(UPLOAD_COLLECTION and INGEST_URL)
    
    
    def safe_name(name: str) -> str:
        """A submitted filename, reduced to something that can be stored and displayed.
    
        The name arrives from a browser. It reaches a Milvus field, a log line and the console's
        citation list, so the path is dropped, control characters go, and the length is bounded.
        Refused rather than silently renamed if nothing is left: a document stored as `_` is a
        document nobody can find again.
        """
        base = os.path.basename((name or "").replace("\\", "/")).strip()
        base = "".join(character for character in base if character.isprintable())
        base = base.replace('"', "'")
        if not base or base in (".", ".."):
            raise ValueError(f"{name!r} is not a usable file name")
        return base[:200]
    
    
    def received_name(header: str) -> str:
        """The name `X-Document-Name` carried, decoded before anything is derived from it.
    
        The console percent-encodes it, because an HTTP header is latin-1 on the wire and these
        names are routinely Cyrillic. Decoding has to happen HERE, ahead of `safe_name` and
        ahead of the identifier, or the mangling SUP-895 is about moves rather than going away:
        0.1.8 received `????.pdf` for every non-ASCII name, hashed that into one identity, and
        replaced one tenant's document with another's. `safe_name` still does its own work after
        the decode — the path goes, control characters go, the length is bounded — on the real
        name instead of on a row of question marks.
    
        The console and this indexer ship from the same ConfigMap and are therefore always the
        same version, so there is no window where an un-encoded name arrives here. A name that
        contains a literal `%` survives the round trip: the console encodes it to `%25`.
        """
        return safe_name(urllib.parse.unquote(header or "", errors="replace"))
    
    
    def upload_identifier(filename: str) -> str:
        """A submitted document's identity.
    
        The hash of the NAME and not of the content, so submitting a corrected version of a
        document replaces it instead of leaving two copies of nearly the same text competing in
        every search. The extractor's own `source_id` is a per-request uuid and would make every
        resubmission a new document.
    
        Because it is the name's hash, the name has to reach this undamaged — which is what
        `received_name` is for, and what 0.1.8 did not do.
        """
        return hashlib.sha256(filename.encode("utf-8")).hexdigest()[:32]
    
    
    def extract(filename: str, blob: bytes) -> dict[str, Any]:
        """One document through `swarm-doc-ingest`, returning its elements.
    
        The key is a bearer token even though the service answers only inside this namespace: a
        namespace is not a trust boundary once a second workload is in it.
        """
        headers = {}
        if INGEST_API_KEY:
            headers["Authorization"] = f"Bearer {INGEST_API_KEY}"
        response = requests.post(
            f"{INGEST_URL}/v1/extract",
            files={"file": (filename, blob, "application/octet-stream")},
            headers=headers,
            timeout=INGEST_TIMEOUT,
        )
        if response.status_code != 200:
            raise RuntimeError(
                f"{response.status_code} from the extraction service: "
                f"{response.text.strip()[:400] or 'no message'}"
            )
        body = response.json()
        if not isinstance(body, dict) or not isinstance(body.get("elements"), list):
            raise RuntimeError(
                "the extraction service answered something that is not "
                "{source_id, source_name, elements, stats}"
            )
        return body
    
    
    def table_chunks(markdown: str) -> list[str]:
        """A Markdown table, in pieces a model can still read.
    
        The header and its separator go onto every piece. Without that, the second half of a
        twenty-row table is a grid of numbers with no column names — which embeds, retrieves and
        answers questions wrongly rather than failing.
        """
        lines = [line for line in (markdown or "").splitlines() if line.strip()]
        if len(lines) <= 2:
            return [markdown.strip()] if markdown.strip() else []
        header, separator, rows = lines[0], lines[1], lines[2:]
        preamble = f"{header}\n{separator}\n"
        if len(markdown) <= CHUNK_CHARS:
            return [markdown.strip()]
    
        out: list[str] = []
        current = preamble
        for row in rows:
            if len(current) + len(row) + 1 > CHUNK_CHARS and current != preamble:
                out.append(current.rstrip())
                current = preamble
            current += row + "\n"
        if current != preamble:
            out.append(current.rstrip())
        return out
    
    
    def element_documents(
        elements: list[dict[str, Any]], upload_id: str, filename: str
    ) -> tuple[list[Document], dict[str, int]]:
        """nv-ingest elements to chunks, and a count of what became of each kind.
    
        Every chunk carries the same metadata KEYS, empty ones included: `langchain_milvus`
        creates the collection's fields from the first batch, so a key that first appears on a
        later document has no field to go into.
        """
        counts = {
            "text": 0,
            "tables": 0,
            "charts": 0,
            "chartsIndexed": 0,
            "chunks": 0,
        }
        documents: list[Document] = []
    
        def add(
            content: str,
            *,
            kind: str,
            subtype: str,
            page: int,
            position: int,
            table_metadata: dict[str, Any],
            image_metadata: dict[str, Any],
            searchable: bool,
        ) -> None:
            documents.append(
                Document(
                    page_content=content,
                    metadata={
                        # A string, which is the shape the rag-server's citation code reads when
                        # langchain did the ingestion.
                        "source": f"upload:{filename}#{upload_id}",
                        "title": filename,
                        # Scalars, so the listing and the delete can filter on them.
                        "upload_id": upload_id,
                        "document_name": filename,
                        "content_metadata": {
                            # `text`, because that is the branch of the rag-server's citation
                            # code that cites content it already has. The real kind of the
                            # element is beside it, and the console shows that.
                            "type": "text",
                            "page_number": page,
                            "chunk": position,
                            "element_type": kind,
                            "subtype": subtype,
                            # False for a picture: what is indexed is its caption, not the data
                            # drawn in it. The console and the listing both say so.
                            "searchable_content": searchable,
                        },
                        "table_metadata": table_metadata,
                        "image_metadata": image_metadata,
                    },
                )
            )
    
        position = 0
        for element in elements:
            if not isinstance(element, dict):
                continue
            content_metadata = element.get("content_metadata") or {}
            kind = str(content_metadata.get("type") or "")
            page = int(content_metadata.get("page_number") or 0)
            table_metadata = element.get("table_metadata") or {}
            image_metadata = element.get("image_metadata") or {}
            content = str(element.get("content") or "")
    
            if kind == "structured":
                counts["tables"] += 1
                for piece in table_chunks(table_metadata.get("table_content") or content):
                    add(
                        piece,
                        kind="structured",
                        subtype=str(content_metadata.get("subtype") or "table"),
                        page=page,
                        position=position,
                        table_metadata={
                            "table_location": list(table_metadata.get("table_location") or []),
                            "table_location_max_dimensions": list(
                                table_metadata.get("table_location_max_dimensions") or []
                            ),
                            "caption": str(table_metadata.get("caption") or ""),
                        },
                        image_metadata={},
                        searchable=True,
                    )
                    position += 1
                continue
    
            if kind == "image":
                counts["charts"] += 1
                # `content` for a picture is a base64 crop when the extractor is asked for one,
                # and is never text. The caption is the only thing here that can be embedded.
                caption = str(
                    image_metadata.get("caption") or content_metadata.get("description") or ""
                ).strip()
                if not caption:
                    continue
                counts["chartsIndexed"] += 1
                add(
                    caption,
                    kind="image",
                    subtype="",
                    page=page,
                    position=position,
                    table_metadata={},
                    image_metadata={
                        "image_location": list(image_metadata.get("image_location") or []),
                        "image_location_max_dimensions": list(
                            image_metadata.get("image_location_max_dimensions") or []
                        ),
                        "caption": caption,
                    },
                    searchable=False,
                )
                position += 1
                continue
    
            if not content.strip():
                continue
            counts["text"] += 1
            for piece in chunks(content):
                add(
                    piece,
                    kind="text",
                    subtype="",
                    page=page,
                    position=position,
                    table_metadata={},
                    image_metadata={},
                    searchable=True,
                )
                position += 1
    
        counts["chunks"] = len(documents)
        return documents, counts
    
    
    def store_upload(filename: str, blob: bytes) -> dict[str, Any]:
        """Extract, chunk and index one submitted file. Returns what became of it.
    
        Under `INDEX_LOCK`: this and the gated rebuild share one embedder with two cores, and a
        batch that holds them both for half a minute is a batch its own health endpoint cannot
        answer during.
        """
        if not uploads_enabled():
            raise RuntimeError(
                "this deployment has no extraction service configured, so it reads documents "
                "from its gated source only"
            )
        if len(blob) > UPLOAD_MAX_BYTES:
            raise ValueError(
                f"{filename} is {len(blob)} bytes and the limit is {UPLOAD_MAX_BYTES}"
            )
    
        upload_id = upload_identifier(filename)
        extracted = extract(filename, blob)
        documents, counts = element_documents(
            extracted.get("elements") or [], upload_id, filename
        )
        if not documents:
            raise ValueError(
                f"nothing in {filename} could be indexed: the extractor found "
                f"{counts['charts']} picture(s) with no caption and no text or tables at all"
            )
    
        with INDEX_LOCK:
            # Replace rather than add to: submitting the same file twice should leave one copy,
            # not two sets of chunks competing in every search.
            #
            # Write first, then drop the version it replaces. 0.1.8 deleted first, so a
            # `write_all` that failed partway left NEITHER version complete — and, less
            # dramatically but on every single resubmission, left the document unsearchable for
            # however long re-embedding it took. The old chunks are identified by the primary
            # keys they already carry, which needs no new metadata field and so does not change
            # a collection `langchain_milvus` built from the first batch it was given.
            superseded = upload_chunk_keys(upload_id)
            _, store = vector_store(UPLOAD_COLLECTION)
            try:
                written = write_all(store, documents)
            except BaseException:
                # Half a new version plus a whole old one is two answers to one question, so
                # the half goes back out: whatever is there now and was not there before.
                previous = set(superseded)
                discard_chunk_keys(
                    [key for key in upload_chunk_keys(upload_id) if key not in previous]
                )
                raise
            removed = discard_chunk_keys(superseded)
    
        logger.info(
            "indexed %s: %d chunks (%d text, %d tables, %d pictures of which %d captioned)%s",
            filename,
            written,
            counts["text"],
            counts["tables"],
            counts["charts"],
            counts["chartsIndexed"],
            f", replacing {removed} chunks of an earlier submission" if removed else "",
        )
        return {
            "id": upload_id,
            "name": filename,
            "chunks": written,
            "replaced": removed,
            "elements": counts,
            "stats": extracted.get("stats") or {},
            "at": now(),
        }
    
    
    def upload_client():
        """The Milvus client for the uploads collection, or None if there is not one yet.
    
        `MilvusVDB.get_documents` is not used for the listing below: it reads a document-info
        collection that upstream's ingestor writes and this listing never does, so it would
        answer an empty list for documents that are in the index.
        """
        vdb, _ = vector_store(UPLOAD_COLLECTION)
        if not vdb.check_collection_exists(UPLOAD_COLLECTION):
            return None
        return vdb
    
    
    def uploaded_documents() -> list[dict[str, Any]]:
        """What has been submitted, read back out of the index itself.
    
        The index is the registry on purpose: a list held in this pod's memory would be empty
        after a restart while the chunks were still being searched, which is a console that
        disagrees with the answers beside it.
        """
        if not uploads_enabled():
            return []
        try:
            vdb = upload_client()
            if vdb is None:
                return []
            rows = vdb._client.query(  # noqa: SLF001 — see upload_client
                collection_name=UPLOAD_COLLECTION,
                filter='upload_id != ""',
                output_fields=["upload_id", "document_name"],
                limit=UPLOAD_LIST_LIMIT,
            )
        except Exception as error:  # noqa: BLE001 — the panel reports, it does not fail
            logger.warning("could not list the uploaded documents: %s", error)
            return []
    
        counted: dict[str, dict[str, Any]] = {}
        for row in rows:
            key = str(row.get("upload_id") or "")
            if not key:
                continue
            entry = counted.setdefault(
                key, {"id": key, "name": str(row.get("document_name") or ""), "chunks": 0}
            )
            entry["chunks"] += 1
        return sorted(counted.values(), key=lambda entry: entry["name"].lower())
    
    
    def upload_chunk_keys(upload_id: str) -> list[Any]:
        """The primary keys of every chunk of one submitted document, as they stand now.
    
        Taken before a replacement is written so the old version can be dropped after the new
        one is whole. `auto_id` is on, so these are keys Milvus generated and nothing else in
        this file has any use for.
        """
        if not UPLOAD_ID_PATTERN.match(upload_id or ""):
            raise ValueError(
                f"{upload_id!r} is not a document identifier — 1 to 64 characters of "
                "[A-Za-z0-9_-], which is what this service issues"
            )
        vdb = upload_client()
        if vdb is None:
            return []
        rows = vdb._client.query(  # noqa: SLF001 — see upload_client
            collection_name=UPLOAD_COLLECTION,
            filter=f'upload_id == "{upload_id}"',
            output_fields=[UPLOAD_PK_FIELD],
            limit=UPLOAD_LIST_LIMIT,
        )
        return [
            row[UPLOAD_PK_FIELD] for row in rows if row.get(UPLOAD_PK_FIELD) is not None
        ]
    
    
    def discard_chunk_keys(keys: list[Any]) -> int:
        """Delete exactly these chunks. Returns how many went.
    
        By key rather than by filter expression: the filter would also match the chunks written
        a moment ago, which is the whole point of writing before deleting.
        """
        if not keys:
            return 0
        vdb = upload_client()
        if vdb is None:
            return 0
        vdb._client.delete(  # noqa: SLF001 — see upload_client
            collection_name=UPLOAD_COLLECTION, ids=list(keys)
        )
        vdb._client.flush(collection_name=UPLOAD_COLLECTION)  # noqa: SLF001
        return len(keys)
    
    
    def remove_upload(upload_id: str) -> int:
        """Drop every chunk of one submitted document. Returns how many went.
    
        The identifier is checked rather than escaped: it is interpolated into a Milvus filter
        expression, and a filter is as much a query language as SQL is.
        """
        if not UPLOAD_ID_PATTERN.match(upload_id or ""):
            raise ValueError(
                f"{upload_id!r} is not a document identifier — 1 to 64 characters of "
                "[A-Za-z0-9_-], which is what this service issues"
            )
        vdb = upload_client()
        if vdb is None:
            return 0
        before = vdb._client.query(  # noqa: SLF001 — see upload_client
            collection_name=UPLOAD_COLLECTION,
            filter=f'upload_id == "{upload_id}"',
            output_fields=["upload_id"],
            limit=UPLOAD_LIST_LIMIT,
        )
        if not before:
            return 0
        vdb._client.delete(  # noqa: SLF001
            collection_name=UPLOAD_COLLECTION, filter=f'upload_id == "{upload_id}"'
        )
        vdb._client.flush(collection_name=UPLOAD_COLLECTION)  # noqa: SLF001
        return len(before)
    
    
    def live_collections() -> list[str]:
        """The collections that exist, which is what a query may name.
    
        The rag-server refuses a question naming a collection that does not exist — with a 400
        for the whole query, not a skipped collection — so the console asks here first. A
        deployment whose corpus has never indexed and which has no uploads has neither.
        """
        out: list[str] = []
        try:
            vdb, _ = vector_store()
            for collection in (COLLECTION, UPLOAD_COLLECTION):
                if collection and vdb.check_collection_exists(collection):
                    out.append(collection)
        except Exception as error:  # noqa: BLE001
            logger.warning("could not list the collections: %s", error)
        return out
    
    
    # --------------------------------------------------------------------------------------
    # The loop and the status endpoint
    # --------------------------------------------------------------------------------------
    
    
    class Service(ThreadingHTTPServer):
        """Threaded, because indexing one upload must not block the status panel.
    
        `HTTPServer` serves one request at a time, and an upload holds its request for as long
        as extraction takes — 52.6 s measured for a fifteen-page scan through OCR. On a
        single-threaded server that is a minute in which `/status` does not answer, which is a
        readiness probe failing and the pod being restarted mid-upload.
        """
    
        daemon_threads = True
    
    
    class Status(BaseHTTPRequestHandler):
        """The console's only way in, and from 0.1.9 it has to prove it is the console.
    
        This is a ClusterIP Service on no Ingress, and until 0.1.9 that was the whole of the
        argument: the console authenticates its users, the console is the only caller, and the
        rag-server answers this namespace without a credential either. The hole in it is that
        `POST /documents` and `DELETE /documents/<id>` here are WRITES into the index whose
        answers are cited beside the gated corpus — so anything in the namespace that could
        reach port 8085 could add a document a tenant would read as their own, or delete one.
        A namespace is not a trust boundary once a second workload is in it, which is the
        argument the extraction service's own key already rested on (SUP-895).
    
        So every route but `/healthz` now needs the bearer token the chart generates and gives
        to the console and to this pod from the same Secret. `/healthz` stays open because the
        kubelet carries no credential, and from 0.1.10 it reports liveness and nothing about the
        corpus — until then it answered the whole of `STATE`, so the one route that took no
        credential published the gate's verdict, the bound dataset names and the counts
        (SUP-897). `LIVENESS` is what it answers now.
        """
    
        protocol_version = "HTTP/1.1"
    
        def admitted(self) -> bool:
            """Whether this request carries the key, answering the caller itself if it does not.
    
            Constant-time, because `==` on a secret leaks its prefix by timing. Fails CLOSED
            when no key is configured: an indexer without its credential serves nothing rather
            than serving everything, and `crag.validate` refuses to render it that way at all.
            """
            if not CORPUS_API_KEY:
                self.close_connection = True
                self.respond(
                    503,
                    {
                        "error": "this indexer has no API key configured, so it accepts "
                        "nothing but its own health check"
                    },
                )
                return False
            scheme, _, presented = (self.headers.get("Authorization") or "").partition(" ")
            if scheme.lower() != "bearer" or not hmac.compare_digest(
                presented.strip(), CORPUS_API_KEY
            ):
                # The connection goes with the refusal: a POST refused before its body is read
                # leaves bytes in the pipe that the next request on a kept-alive connection
                # would be parsed from.
                self.close_connection = True
                self.respond(401, {"error": "a bearer token is required"})
                return False
            return True
    
        def respond(self, status: int, payload: dict[str, Any]) -> None:
            body = json.dumps(payload).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.send_header("Cache-Control", "no-store")
            self.end_headers()
            self.wfile.write(body)
    
        def route(self) -> str:
            return self.path.split("?")[0].rstrip("/") or "/"
    
        def do_GET(self) -> None:  # noqa: N802 — BaseHTTPRequestHandler's own naming
            route = self.route()
            if route == "/healthz":
                # Open, and liveness only — see `LIVENESS` for why it is this and not `STATE`.
                # `/status`, which carries the gate's verdict, the counts and the document list,
                # is behind the key with everything else.
                self.respond(200, dict(LIVENESS))
                return
            if not self.admitted():
                return
            if route == "/status":
                with STATE_LOCK:
                    payload = dict(STATE)
                payload["uploadedDocuments"] = uploaded_documents()
                self.respond(200, payload)
                return
            if route == "/collections":
                # Which collections a query may name. Cheap: two existence checks, no embedding.
                self.respond(200, {"collections": live_collections()})
                return
            if route == "/documents":
                self.respond(200, {"documents": uploaded_documents()})
                return
            self.send_error(404)
    
        def do_POST(self) -> None:  # noqa: N802
            """`POST /documents` — one file, raw, with its name percent-encoded in
            `X-Document-Name`.
    
            Raw bytes and a header rather than a multipart body: the console has already parsed
            the browser's multipart form, and parsing it a second time here would mean a
            multipart parser in a `BaseHTTPRequestHandler`, which is a place to put a bug rather
            than a feature.
    
            Percent-encoded because a header is latin-1 and these names are routinely Cyrillic.
            See `received_name`: decoding before the identifier is derived is what keeps two
            different names from being one document (SUP-895).
            """
            if self.route() != "/documents":
                self.send_error(404)
                return
            if not self.admitted():
                return
            if not uploads_enabled():
                self.respond(
                    503,
                    {
                        "error": "this deployment has no extraction service, so it reads "
                        "documents from its gated source only"
                    },
                )
                return
            try:
                length = int(self.headers.get("Content-Length") or 0)
            except ValueError:
                self.respond(400, {"error": "Content-Length is required"})
                return
            if length <= 0:
                self.respond(400, {"error": "an empty document has nothing to index"})
                return
            if length > UPLOAD_MAX_BYTES:
                self.respond(
                    413,
                    {
                        "error": f"{length} bytes; this deployment accepts up to "
                        f"{UPLOAD_MAX_BYTES}"
                    },
                )
                return
            try:
                name = received_name(self.headers.get("X-Document-Name") or "")
            except ValueError as error:
                self.respond(400, {"error": str(error)})
                return
    
            blob = self.rfile.read(length)
            try:
                result = store_upload(name, blob)
            except ValueError as error:
                self.respond(400, {"error": str(error)})
                return
            except TimeoutError as error:
                self.respond(504, {"error": str(error)})
                return
            except Exception as error:  # noqa: BLE001 — the caller is told, the pod stays up
                logger.exception("indexing the submitted document failed")
                self.respond(502, {"error": str(error)[:400]})
                return
            self.respond(201, result)
    
        def do_DELETE(self) -> None:  # noqa: N802
            """`DELETE /documents/<id>` — every chunk of one submitted document."""
            route = self.route()
            if not route.startswith("/documents/"):
                self.send_error(404)
                return
            if not self.admitted():
                return
            upload_id = route[len("/documents/") :]
            try:
                with INDEX_LOCK:
                    removed = remove_upload(upload_id)
            except ValueError as error:
                self.respond(400, {"error": str(error)})
                return
            except Exception as error:  # noqa: BLE001
                logger.exception("removing the submitted document failed")
                self.respond(502, {"error": str(error)[:400]})
                return
            if not removed:
                self.respond(404, {"error": "no such document"})
                return
            self.respond(200, {"id": upload_id, "chunks": removed})
    
        def log_message(self, fmt: str, *args: Any) -> None:
            logger.debug("status %s", fmt % args)
    
    
    def describe(bound: list[dict[str, Any]]) -> list[dict[str, Any]]:
        return [
            {
                "dataset": binding.get("dataset"),
                "title": binding.get("title"),
                "interface": binding.get("interface"),
                "database": connection(binding).get("database"),
                "table": TABLE,
                "gated": is_gated(binding),
            }
            for binding in bound
        ]
    
    
    def loop() -> None:
        last: tuple[int, str] | None = None
        while True:
            bound = bindings()
            publish(sources=describe(bound), lastAttemptAt=now())
    
            if not bound:
                publish(
                    verdict="pending",
                    message=(
                        "no dataset is attached to the corpus slot — attach one and this "
                        "deployment indexes it without being restarted"
                    ),
                    documents=0,
                    chunks=0,
                )
                time.sleep(POLL_SECONDS)
                continue
    
            # One source today. The slot accepts several and the loop would index each into the
            # same collection; indexing the first is what is measured, so it is what is done.
            binding = bound[0]
            try:
                mark = watermark(binding)
            except Exception as error:  # noqa: BLE001 — the verdict is the product here
                logger.warning("the source refused the read: %s", error)
                publish(verdict="refused", message=str(error))
                time.sleep(POLL_SECONDS)
                continue
    
            if mark == last:
                publish(
                    verdict="admitted",
                    message=f"{mark[0]} rows, unchanged since the last read",
                    lastSuccessAt=now(),
                )
                time.sleep(POLL_SECONDS)
                continue
    
            try:
                rows = documents(binding)
                # The same lock an upload takes: one embedder, two cores, and two kinds of work
                # that would otherwise saturate it together.
                with INDEX_LOCK:
                    written = index(rows, binding)
            except TimeoutError as error:
                # Said apart from a refusal: the source served the documents and the index did not
                # take them. An operator reading this needs to look at the embedder, not the gate.
                logger.warning("indexing stalled: %s", error)
                publish(verdict="stalled", message=str(error)[:400])
                time.sleep(POLL_SECONDS)
                continue
            except Exception as error:  # noqa: BLE001
                logger.exception("indexing failed")
                publish(verdict="refused" if "clickhouse" in str(error).lower() else "pending",
                        message=str(error)[:400])
                time.sleep(POLL_SECONDS)
                continue
    
            last = mark
            logger.info("indexed %d chunks from %d documents", written, len(rows))
            publish(
                verdict="admitted",
                message=f"{mark[0]} rows read and indexed",
                documents=len(rows),
                chunks=written,
                lastSuccessAt=now(),
            )
            time.sleep(POLL_SECONDS)
    
    
    def main() -> None:
        if not CORPUS_API_KEY:
            # Said once and loudly rather than refused: the gated-corpus loop below is this
            # pod's other half and has to run regardless. What a missing key costs is the API —
            # every route but `/healthz` answers 503 — so the console reports "not configured"
            # instead of a door standing open.
            logger.error(
                "CORPUS_API_KEY is not set: every route but /healthz will refuse. The chart "
                "renders this key from the deployment's Secret and crag.validate requires it."
            )
        server = Service(("0.0.0.0", STATUS_PORT), Status)
        threading.Thread(target=server.serve_forever, name="status", daemon=True).start()
        logger.info("status on :%d, polling every %ds", STATUS_PORT, POLL_SECONDS)
        loop()
    
    
    if __name__ == "__main__":
        main()
---
