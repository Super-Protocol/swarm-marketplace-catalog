# Source: confidential-rag/templates/corpus.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-rag-corpus
  labels:
    app.kubernetes.io/name: confidential-rag
    app.kubernetes.io/instance: rag
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: corpus
spec:
  replicas: 1
  # Two indexers rebuilding one collection would race. `Recreate` costs one gap of a few
  # seconds in the status panel on an upgrade and removes that entirely.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-rag
      app.kubernetes.io/instance: rag
      app.kubernetes.io/component: corpus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: confidential-rag
        app.kubernetes.io/instance: rag
        app.kubernetes.io/component: corpus
    spec:
      containers:
        - name: corpus
          image: "ghcr.io/super-protocol/confidential-rag/rag-server@sha256:ec7a6c221f835e73834f74615a5a061f91a8c6d890afc2392feb840a9a078966"
          imagePullPolicy: IfNotPresent
          command: [python3, /opt/app/corpus_sync.py]
          # The pipeline's own configuration, so the embedder, the vector store and the
          # collection this writes are by construction the ones the retriever reads.
          envFrom:
            - configMapRef:
                name: confidential-rag-config
          env:
            - name: APP_EMBEDDINGS_APIKEY
              valueFrom:
                secretKeyRef: { name: confidential-rag-secrets, key: embeddings-api-key }
            - name: APP_VECTORSTORE_PASSWORD
              valueFrom:
                secretKeyRef: { name: confidential-rag-secrets, key: vector-store-password }
            - name: CORPUS_API_KEY
              valueFrom:
                secretKeyRef: { name: confidential-rag-secrets, key: corpus-api-key }
            - name: CORPUS_BINDING_FILE
              value: /etc/corpus/corpus-binding.json
            - name: CORPUS_TABLE
              value: "documents"
            - name: CORPUS_ID_COLUMN
              value: "doc_id"
            - name: CORPUS_TITLE_COLUMN
              value: "title"
            - name: CORPUS_TEXT_COLUMN
              value: "text"
            - name: CORPUS_UPDATED_COLUMN
              value: "updated_at"
            - name: CORPUS_CHUNK_CHARS
              value: "1800"
            - name: CORPUS_CHUNK_OVERLAP_CHARS
              value: "200"
            - name: CORPUS_ROW_LIMIT
              value: "20000"
            - name: CORPUS_POLL_SECONDS
              value: "60"
            - name: CORPUS_EMBED_BATCH
              value: "4"
            - name: CORPUS_STATUS_PORT
              value: "8085"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
          # `/healthz` answers as soon as the status server is up — which is before the first
          # read of the source, deliberately: a deployment whose data owner has not approved it
          # yet is a healthy deployment waiting, not a broken one.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          # Slack for the same reason as the embedder's: this pod spends its time chunking and
          # embedding, both of which hold the one core it has, and `/status` is served by a
          # thread in the same process. A five-second timeout reads a working indexer as a
          # dead one — which was observed on the cloud as readiness flapping while it indexed.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: "0"
            requests:
              cpu: "1"
              memory: 2Gi
              nvidia.com/gpu: "0"
          volumeMounts:
            - name: app
              mountPath: /opt/app
              readOnly: true
            - name: binding
              mountPath: /etc/corpus
              readOnly: true
            - name: scratch
              mountPath: /tmp-data
      volumes:
        - name: app
          configMap:
            name: confidential-rag-app
        - name: binding
          secret:
            secretName: confidential-rag-secrets
            items:
              - key: corpus-binding.json
                path: corpus-binding.json
        - name: scratch
          emptyDir: {}
