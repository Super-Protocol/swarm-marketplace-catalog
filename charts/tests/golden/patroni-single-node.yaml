# Source: patroni-postgresql/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: patroni-postgresql
  labels:
    helm.sh/chart: patroni-postgresql-0.1.0
    app.kubernetes.io/name: patroni-postgresql
    app.kubernetes.io/instance: pg
    app.kubernetes.io/version: "17.5"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  serviceName: patroni-postgresql-pods
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: patroni-postgresql
      app.kubernetes.io/instance: pg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patroni-postgresql
        app.kubernetes.io/instance: pg
        cluster-name: "patroni-postgresql"
        application: "spilo"
    spec:
      enableServiceLinks: false
      serviceAccountName: patroni-postgresql
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 103
      containers:
        - name: postgresql
          image: ghcr.io/zalando/spilo-17@sha256:b7db9e8f62e809ebd9a0679fbdba147a811fdd240ab78380ea4720a46a017184
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
              - CHOWN
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
              drop:
              - ALL
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
            - name: patroni
              containerPort: 8008
              protocol: TCP
          env:
            - name: SCOPE
              value: "patroni-postgresql"
            - name: PGPORT
              value: "5432"
            - name: APIPORT
              value: "8008"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DCS_ENABLE_KUBERNETES_API
              value: "true"
            - name: KUBERNETES_BYPASS_API_SERVICE
              value: "false"
            - name: KUBERNETES_LABELS
              value: "{\"application\":\"spilo\"}"
            - name: KUBERNETES_SCOPE_LABEL
              value: "cluster-name"
            - name: KUBERNETES_ROLE_LABEL
              value: "spilo-role"
            - name: KUBERNETES_LEADER_LABEL_VALUE
              value: "master"
            - name: KUBERNETES_STANDBY_LEADER_LABEL_VALUE
              value: "master"
            - name: KUBERNETES_FOLLOWER_LABEL_VALUE
              value: "replica"
            - name: PGUSER_SUPERUSER
              value: "postgres"
            - name: PGPASSWORD_SUPERUSER
              valueFrom:
                secretKeyRef:
                  name: patroni-postgresql
                  key: postgres-password
            - name: PGUSER_STANDBY
              value: "standby"
            - name: PGPASSWORD_STANDBY
              valueFrom:
                secretKeyRef:
                  name: patroni-postgresql
                  key: replication-password
            - name: SPILO_CONFIGURATION
              value: |
                bootstrap:
                  dcs:
                    loop_wait: 10
                    maximum_lag_on_failover: 33554432
                    retry_timeout: 10
                    synchronous_mode: false
                    synchronous_mode_strict: false
                    ttl: 30
                  post_init: /etc/patroni/scripts/post-init.sh zalandos
          livenessProbe:
            httpGet:
              path: /liveness
              port: patroni
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readiness
              port: patroni
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readiness
              port: patroni
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          resources:
            limits:
              cpu: 250m
              memory: 768Mi
            requests:
              cpu: 250m
              memory: 768Mi
          volumeMounts:
            - name: pgdata
              mountPath: /home/postgres/pgdata
            - name: scripts
              mountPath: /etc/patroni/scripts
              readOnly: true
            - name: credentials
              mountPath: /etc/patroni/credentials
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: scripts
          configMap:
            name: patroni-postgresql-scripts
            defaultMode: 0555
        - name: credentials
          secret:
            secretName: patroni-postgresql
            defaultMode: 0440
            items:
              - key: password
                path: app-password
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: patroni-postgresql
          app.kubernetes.io/instance: pg
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "8Gi"