apiVersion: v1
kind: Service
metadata:
  name: rapids-singlecell-notebook
  labels:
    helm.sh/chart: rapids-singlecell-notebook-0.1.0
    app.kubernetes.io/name: rapids-singlecell-notebook
    app.kubernetes.io/instance: sc
    app.kubernetes.io/version: "26.02"
