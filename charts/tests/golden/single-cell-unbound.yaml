  01_preprocessing.ipynb: |
    {
     "cells": [
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "> **Ported for confidential execution.** This is NVIDIA's [Single-Cell Analysis Blueprint](https://github.com/NVIDIA-AI-Blueprints/single-cell-analysis-blueprint) notebook, Apache-2.0, with its download step replaced by `sc_workspace.load_matrix()` and its hard-coded `obs` column names replaced by this deployment's own. Nothing else is changed. `PROVENANCE.md` lists every edit.\n"
       ],
       "id": "sc000"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "# GPU Demo Part 1 - Basic GPU E2E Workflow\n",
        "\n",
        "**Author:** [Severin Dicks](https://github.com/Intron7)\n",
        "**Copyright** [scverse](https://scverse.org)\n",
        "\n",
        "This notebook is the a demo End-to-End workflow, using RAPIDS-singlecell to accelerate \n",
        "1. Load and Preprocess the data\n",
        "1. Preprocess the data by:\n",
        "    1. QC cells visually to understand the data\n",
        "    1. Filter unusual cells\n",
        "    1. Remove unwanted sources of variation\n",
        "1. Cluster and visualize the data by:\n",
        "    1. Batch Correction and analysis\n",
        "    1. Explore the biological information from the data\n",
        "\n",
        "We then take our output file to do further decoupling analysis in **[GPU Demo Part 2 - Decoupler-GPU: Accelerated Transcriptional Regulatory Analysis](02_scRNA_analysis_extended.ipynb)**\n",
        "\n",
        "**Let's begin!**"
       ],
       "id": "sc001"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {
        "tags": []
       },
       "outputs": [],
       "source": [
        "import scanpy as sc\n",
        "import cupy as cp\n",
        "\n",
        "import time\n",
        "import rapids_singlecell as rsc\n",
        "\n",
        "import warnings\n",
        "\n",
        "warnings.filterwarnings(\"ignore\")"
       ],
       "id": "sc002"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "import rmm\n",
        "from rmm.allocators.cupy import rmm_cupy_allocator\n",
        "\n",
        "rmm.reinitialize(\n",
        "    managed_memory=False,  # Allows oversubscription\n",
        "    pool_allocator=True,  # default is False\n",
        "    devices=0,  # GPU device IDs to register. By default registers only GPU 0.\n",
        ")\n",
        "cp.cuda.set_allocator(rmm_cupy_allocator)"
       ],
       "id": "sc003"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "## Load and Prepare Data"
       ],
       "id": "sc004"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "Let's start by creating our dataset."
       ],
       "id": "sc005"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {
        "scrolled": true
       },
       "outputs": [],
       "source": [
        "# Ported: upstream downloaded a public example corpus from\n",
        "# exampledata.scverse.org here. This deployment reads the matrix the operator\n",
        "# bound to it — a marketplace dataset, or a file uploaded into /workspace/data —\n",
        "# and nothing in this notebook reaches the network.\n",
        "import sc_workspace as scw\n",
        "\n",
        "print(scw.describe_binding())\n",
        "adata = scw.load_matrix()\n",
        "\n",
        "# Which column is the batch, and which carries an annotation. Asked now, with\n",
        "# the column list in the error, rather than forty cells later inside Harmony.\n",
        "batch = scw.batch_key(adata)\n",
        "label = scw.label_key(adata)\n",
        "print(f\"batch column: {batch!r}; annotation column: {label!r}; {adata.n_obs} cells x {adata.n_vars} genes\")\n",
        "\n",
        "# The batch column is required and raised above if it was wrong. The annotation\n",
        "# is not required by the workflow — but every cell that compares this notebook's\n",
        "# own clustering against a known cell type needs it, and without it they fail on\n",
        "# a bare KeyError from scanpy a long way below. Said here instead.\n",
        "if label is None:\n",
        "    print(\n",
        "        f\"\n",
        "NOTE: no annotation column. This deployment names {scw.LABEL_KEY!r} and the matrix\n",
        "\"\n",
        "        f\"      has none of it. Everything up to the clustering runs; the cells that colour or\n",
        "\"\n",
        "        f\"      group by the annotation will raise KeyError({scw.LABEL_KEY!r}).\n",
        "\"\n",
        "        f\"      Available: {', '.join(map(str, adata.obs.columns))}\n",
        "\"\n",
        "        f\"      Fix it by reconfiguring the deployment, or set scw.LABEL_KEY here.\"\n",
        "    )\n"
       ],
       "id": "sc006"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "We load the sparse count matrix from an `h5ad` file using Scanpy. The sparse count matrix will then be placed on the GPU. "
       ],
       "id": "sc007"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "data_load_start = time.time()"
       ],
       "id": "sc008"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "# Ported: the matrix is already in memory — the cell above read it from the\n",
        "# dataset this deployment is bound to. Upstream re-read the file it had just\n",
        "# downloaded.\n",
        "adata\n"
       ],
       "id": "sc009"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {
        "tags": []
       },
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.get.anndata_to_GPU(adata)"
       ],
       "id": "sc010"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "data_load_time = time.time()\n",
        "print(\"Total data load and format time: %s\" % (data_load_time - data_load_start))"
       ],
       "id": "sc011"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "## Preprocessing"
       ],
       "id": "sc012"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "preprocess_start = time.time()"
       ],
       "id": "sc013"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "# Ported: guarded. `feature_name` is a column of the corpus upstream downloads;\n",
        "# a tenant's own matrix is already indexed by gene name more often than not.\n",
        "if \"feature_name\" in adata.var:\n",
        "    adata.var_names = adata.var.feature_name.astype(str).to_numpy()\n"
       ],
       "id": "sc014"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Quality Control"
       ],
       "id": "sc015"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "We calculate quality control (QC) metrics to assess cell and gene quality. These include:  \n",
        "\n",
        "- **Per cell metrics**:  \n",
        "  - Total counts per cell (library size)  \n",
        "  - Number of detected genes per cell  \n",
        "  - Percentage of counts from mitochondrial (`MT`) and ribosomal (`RIBO`) genes  \n",
        "\n",
        "- **Per gene metrics** (gene space):  \n",
        "  - Total counts per gene  \n",
        "  - Number of cells expressing each gene  \n",
        "\n",
        "These metrics help identify low-quality or stressed cells and ensure a meaningful feature set for downstream analysis."
       ],
       "id": "sc016"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.flag_gene_family(adata, gene_family_name=\"MT\", gene_family_prefix=\"MT\")"
       ],
       "id": "sc017"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.flag_gene_family(adata, gene_family_name=\"RIBO\", gene_family_prefix=\"RPS\")"
       ],
       "id": "sc018"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.calculate_qc_metrics(adata, qc_vars=[\"MT\", \"RIBO\"])"
       ],
       "id": "sc019"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "To visualize the quality control (QC) metrics, we generate the following plots:\n",
        "\n",
        "1. **Scatter plot: Total counts vs. Mitochondrial percentage**  \n",
        "   - This plot shows the relationship between the total UMI counts per cell and the percentage of mitochondrial (`MT`) gene expression.  \n",
        "   - Cells with high mitochondrial percentages may indicate stressed or dying cells.\n",
        "\n",
        "2. **Scatter plot: Total counts vs. Number of detected genes**  \n",
        "   - This plot displays the correlation between the total UMI counts per cell and the number of detected genes.  \n",
        "   - A strong correlation is expected, but outliers with low gene counts might indicate empty droplets or dead cells.\n",
        "\n",
        "3. **Violin plot: Number of detected genes per cell**  \n",
        "   - This violin plot visualizes the distribution of the number of detected genes per cell.  \n",
        "   - It helps identify cells with abnormally low or high gene counts, which could be filtered out.\n",
        "\n",
        "4. **Violin plot: Total counts per cell**  \n",
        "   - This plot shows the distribution of total counts per cell, indicating library size variation.  \n",
        "   - Extreme values may suggest low-quality or overly dominant cells.\n",
        "\n",
        "5. **Violin plot: Percentage of mitochondrial counts per cell**  \n",
        "   - This plot illustrates the distribution of mitochondrial gene expression across all cells.  \n",
        "   - High mitochondrial content could be a sign of cell stress or apoptosis.\n",
        "\n",
        "These visualizations help assess dataset quality and guide decisions on filtering low-quality cells."
       ],
       "id": "sc020"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {
        "scrolled": true
       },
       "outputs": [],
       "source": [
        "sc.pl.scatter(adata, x=\"total_counts\", y=\"pct_counts_MT\")\n",
        "sc.pl.scatter(adata, x=\"total_counts\", y=\"n_genes_by_counts\")"
       ],
       "id": "sc021"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "sc.pl.violin(adata, \"n_genes_by_counts\", jitter=0.4, groupby=scw.BATCH_KEY)\n",
        "sc.pl.violin(adata, \"total_counts\", jitter=0.4, groupby=scw.BATCH_KEY)\n",
        "sc.pl.violin(adata, \"pct_counts_MT\", jitter=0.4, groupby=scw.BATCH_KEY)"
       ],
       "id": "sc022"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Filter"
       ],
       "id": "sc023"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "We filter the count matrix to remove cells with an extreme number of genes expressed.\n",
        "We also filter out cells with a mitchondrial content of more than 20%."
       ],
       "id": "sc024"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "adata = adata[adata.obs[\"n_genes_by_counts\"] < 5000]\n",
        "adata = adata[adata.obs[\"pct_counts_MT\"] < 20]"
       ],
       "id": "sc025"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "We also filter out genes that are expressed in less than 3 cells."
       ],
       "id": "sc026"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {
        "scrolled": true
       },
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.filter_genes(adata, min_cells=3)"
       ],
       "id": "sc027"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "The size of our count matrix is now reduced."
       ],
       "id": "sc028"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "adata.shape"
       ],
       "id": "sc029"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Normalize"
       ],
       "id": "sc030"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "We normalize the count matrix so that the total counts in each cell sum to 1e4. This will help remove some technical variability due to sequencing depth."
       ],
       "id": "sc031"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.normalize_total(adata, target_sum=1e4)"
       ],
       "id": "sc032"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "Next, we data transform the count matrix."
       ],
       "id": "sc033"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.log1p(adata)"
       ],
       "id": "sc034"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Select Most Variable Genes"
       ],
       "id": "sc035"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "We now search for highly variable genes, which help focus our analysis on the most informative genes while improving computational efficiency. This function supports the flavors `cell_ranger`, `seurat`, `seurat_v3`, and `pearson_residuals`.  \n",
        "As in Scanpy, you can either filter based on variance cutoffs or select the `n_top_genes`. Additionally, you can use a `batch_key` to correct for batch effects.  \n",
        "\n",
        "In this example, we use the `cell_ranger` method, which selects highly variable genes based on the log-normalized counts stored in `.X`.\n"
       ],
       "id": "sc036"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.highly_variable_genes(adata, n_top_genes=5000, flavor=\"cell_ranger\")"
       ],
       "id": "sc037"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "Now we save this version of the AnnData as adata.raw. "
       ],
       "id": "sc038"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "adata.raw = adata"
       ],
       "id": "sc039"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "We now restrict our AnnData object to only the highly variable genes.  \n",
        "This step reduces the number of features, focusing the analysis on the most informative genes while improving computational efficiency."
       ],
       "id": "sc040"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.filter_highly_variable(adata)"
       ],
       "id": "sc041"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "Next, we regress out the effects of total counts per cell and mitochondrial content.  \n",
        "This helps remove technical variation that could bias downstream analyses.  \n",
        "\n",
        "As in Scanpy, you can regress out any numerical column from `.obs`, allowing for the correction of batch effects, sequencing depth, or other confounding factors.\n",
        "\n",
        "For more complex data sets, these steps may overcorrect and remove potentially useful information and need to be carefully used."
       ],
       "id": "sc042"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.regress_out(adata, keys=[\"total_counts\", \"pct_counts_MT\"])"
       ],
       "id": "sc043"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Scale"
       ],
       "id": "sc044"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "Finally, we scale the count matrix to obtain a z-score transformation, standardizing gene expression across cells.  \n",
        "To prevent extreme values from dominating the analysis, we apply a cutoff of 10 standard deviations.  \n",
        "This ensures that highly expressed genes do not disproportionately influence downstream computations."
       ],
       "id": "sc045"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.scale(adata, max_value=10)"
       ],
       "id": "sc046"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Total Preprocessing Time\n",
        "Now let's see how long the total preprocesssing time takes"
       ],
       "id": "sc047"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "preprocess_time = time.time()\n",
        "print(\"Total Preprocessing time: %s\" % (preprocess_time - preprocess_start))"
       ],
       "id": "sc048"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "## Clustering and Visualization"
       ],
       "id": "sc049"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Principal component analysis"
       ],
       "id": "sc050"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "We use Principal Component Analysis (PCA) to reduce the dimensionality of the gene expression matrix to its top 100 principal components.  \n",
        "This step captures the most important sources of variation in the data while reducing computational complexity.  \n",
        "\n",
        "We use the GPU-accelerated PCA implementation from cuML, which significantly speeds up computation compared to CPU-based methods."
       ],
       "id": "sc051"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.tl.pca(adata, n_comps=100)"
       ],
       "id": "sc052"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "We can use scanpy `pca_variance_ratio` plot to inspect the contribution of single PCs to the total variance in the data."
       ],
       "id": "sc053"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "sc.pl.pca_variance_ratio(adata, log=True, n_pcs=100)"
       ],
       "id": "sc054"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "Now, we transfer the `.X` matrix back to host (CPU) memory to free up GPU resources.  \n",
        "\n",
        "Since some downstream analyses or visualizations may not require GPU acceleration, this step helps optimize memory usage,  \n",
        "preventing unnecessary GPU load while still keeping the processed data accessible for further analysis."
       ],
       "id": "sc055"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "rsc.get.anndata_to_CPU(adata)"
       ],
       "id": "sc056"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Computing the neighborhood graph and UMAP"
       ],
       "id": "sc057"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "Next, we compute the neighborhood graph using `rsc`.  \n",
        "\n",
        "Scanpy’s CPU-based implementation of nearest neighbor search uses an approximation, while the GPU-accelerated RAPIDS implementation computes the exact graph.  \n",
        "Both methods are valid, but small differences in results can occur.  \n",
        "\n",
        "The following approximate nearest neighbor (ANN) algorithms are also supported:  \n",
        "- **`ivfflat`**: Uses an inverted file index for fast approximate search, suitable for very large datasets.  \n",
        "- **`ivfpq`**: A variant of `ivfflat` that compresses data for even more efficient memory usage, trading off some accuracy.  \n",
        "- **`cagra`**: A graph-based ANN method optimized for fast, high-accuracy queries on GPUs.  \n",
        "- **`nn_descent`**: A graph-based method that incrementally refines the nearest neighbor search and works well for large, high-dimensional datasets.  \n",
        "\n",
        "Since our dataset is relatively small, we will use the default **brute-force (`brute`)** search underneath neighbors to ensure exact results."
       ],
       "id": "sc058"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.neighbors(adata, n_neighbors=15, n_pcs=40)"
       ],
       "id": "sc059"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "Next, we calculate the UMAP embedding using RAPIDS.  \n",
        "\n",
        "UMAP (Uniform Manifold Approximation and Projection) is a dimensionality reduction technique that preserves local and global structure in the data.  \n",
        "The RAPIDS implementation accelerates UMAP computation on GPUs, making it significantly faster than the standard CPU version."
       ],
       "id": "sc060"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.tl.umap(adata)"
       ],
       "id": "sc061"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Clustering"
       ],
       "id": "sc062"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "Next, we use the **Louvain** and **Leiden** algorithms for graph-based clustering with RAPIDS.  \n",
        "\n",
        "Both methods detect communities (clusters) in the neighborhood graph by optimizing modularity:  \n",
        "- **Louvain**: A hierarchical clustering algorithm that iteratively refines clusters for optimal modularity.  \n",
        "- **Leiden**: An improved version of Louvain that guarantees well-connected, more stable clusters.  \n",
        "\n",
        "Using RAPIDS accelerates the clustering process on GPUs, making it significantly faster than traditional CPU implementations."
       ],
       "id": "sc063"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.tl.louvain(adata, resolution=0.6)"
       ],
       "id": "sc064"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.tl.leiden(adata, resolution=0.6)"
       ],
       "id": "sc065"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "sc.pl.umap(adata, color=[\"louvain\", \"leiden\"], legend_loc=\"on data\")"
       ],
       "id": "sc066"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "fig = sc.pl.umap(adata, color=[scw.LABEL_KEY, scw.BATCH_KEY], return_fig=True)\n",
        "ax = fig.axes[0]\n",
        "ax.legend_.set_title(scw.LABEL_KEY)\n",
        "ax.legend_.set_bbox_to_anchor((-0.2, -0.4))\n"
       ],
       "id": "sc067"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Batch Correction  \n",
        "\n",
        "In the previous UMAP, we observed strong batch effects between assay types.  \n",
        "To correct for this, we apply **Harmony**, a method that aligns different batches while preserving biological variation.  \n",
        "\n",
        "After applying Harmony, we will redo:  \n",
        "- **Neighborhood search** to recompute the k-nearest neighbor graph  \n",
        "- **UMAP** to visualize the corrected embedding  \n",
        "- **Graph-based clustering** to identify cell populations without batch-driven artifacts  \n",
        "\n",
        "This ensures that batch effects do not drive clustering results while retaining meaningful biological structure.\n"
       ],
       "id": "sc068"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.harmony_integrate(adata, key=scw.BATCH_KEY, dtype=cp.float32)"
       ],
       "id": "sc069"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.pp.neighbors(\n",
        "    adata, n_neighbors=15, n_pcs=40, use_rep=\"X_pca_harmony\", key_added=\"harmony\"\n",
        ")\n",
        "rsc.tl.umap(adata, neighbors_key=\"harmony\", key_added=\"X_umap_harmony\")\n",
        "rsc.tl.louvain(\n",
        "    adata, resolution=0.6, neighbors_key=\"harmony\", key_added=\"louvain_harmony\"\n",
        ")\n",
        "rsc.tl.leiden(\n",
        "    adata, resolution=0.6, neighbors_key=\"harmony\", key_added=\"leiden_harmony\"\n",
        ")"
       ],
       "id": "sc070"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "sc.pl.embedding(\n",
        "    adata,\n",
        "    basis=\"X_umap_harmony\",\n",
        "    color=[\"louvain_harmony\", \"leiden_harmony\"],\n",
        "    legend_loc=\"on data\",\n",
        ")"
       ],
       "id": "sc071"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "fig = sc.pl.embedding(\n",
        "    adata, basis=\"X_umap_harmony\", color=[scw.LABEL_KEY, scw.BATCH_KEY], return_fig=True\n",
        ")\n",
        "ax = fig.axes[0]\n",
        "ax.legend_.set_title(scw.LABEL_KEY)\n",
        "ax.legend_.set_bbox_to_anchor((-0.2, -0.4))"
       ],
       "id": "sc072"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### TSNE"
       ],
       "id": "sc073"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "Next, we use **t-distributed Stochastic Neighbor Embedding (t-SNE)** to visualize cells in two dimensions.  \n",
        "t-SNE is a non-linear dimensionality reduction technique that preserves local structure and reveals complex patterns in the data.  \n",
        "\n",
        "We leverage the RAPIDS GPU implementation of t-SNE, which is significantly faster than CPU-based methods.  \n",
        "This allows us to efficiently process large datasets while maintaining high-quality embeddings.  \n",
        "\n"
       ],
       "id": "sc074"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.tl.tsne(\n",
        "    adata,\n",
        "    n_pcs=40,\n",
        "    perplexity=30,\n",
        "    early_exaggeration=12,\n",
        "    learning_rate=200,\n",
        "    use_rep=\"X_pca_harmony\",\n",
        ")"
       ],
       "id": "sc075"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "fig = sc.pl.tsne(adata, color=[scw.LABEL_KEY, scw.BATCH_KEY], return_fig=True)\n",
        "ax = fig.axes[0]\n",
        "ax.legend_.set_title(scw.LABEL_KEY)\n",
        "ax.legend_.set_bbox_to_anchor((-0.2, -0.4))"
       ],
       "id": "sc076"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "## Differential expression analysis"
       ],
       "id": "sc077"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "To identify key marker genes for each cell type, we use **logistic regression** to compute a ranking of highly differential genes.  \n",
        "Unlike traditional statistical tests, logistic regression models the probability of a gene being highly expressed in a given cluster  \n",
        "while accounting for all genes simultaneously, making it more robust for complex datasets.  \n",
        "\n",
        "We rank the top 50 genes that best distinguish each **cell type**, helping to characterize biological differences between clusters.  "
       ],
       "id": "sc078"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.tl.rank_genes_groups(adata, groupby=scw.LABEL_KEY, method  = \"wilcoxon_binned\", use_raw=False)"
       ],
       "id": "sc079"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "sc.pl.rank_genes_groups(adata)"
       ],
       "id": "sc080"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "post_time = time.time()"
       ],
       "id": "sc081"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "print(\"Total Postprocessing time: %s\" % (post_time - preprocess_time))"
       ],
       "id": "sc082"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Diffusion Map Embedding  \n",
        "\n",
        "Next, we compute **Diffusion Maps**, a nonlinear dimensionality reduction method that preserves the continuous structure of the data.  \n",
        "Unlike UMAP and t-SNE, Diffusion Maps are well-suited for capturing **trajectory-like** relationships in single-cell data.  \n",
        "\n",
        "We use the batch-corrected neighborhood graph (`neighbors_key=\"harmony\"`) to ensure that the embedding is not influenced by batch effects.  "
       ],
       "id": "sc083"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.tl.diffmap(adata, neighbors_key=\"harmony\")\n",
        "# Due to an issue with plotting in Scanpy, we need to shift the first component of the diffusion map by removing the first column:\n",
        "adata.obsm[\"X_diffmap\"] = adata.obsm[\"X_diffmap\"][:, 1:]"
       ],
       "id": "sc084"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "sc.pl.diffmap(adata, color=scw.LABEL_KEY)"
       ],
       "id": "sc085"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "print(\"Total Processing time: %s\" % (time.time() - preprocess_start))"
       ],
       "id": "sc086"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "# Ported: upstream wrote h5/dli_decoupler.h5ad next to the downloaded corpus.\n",
        "# /workspace/derived is the volume that survives a restart, and is where\n",
        "# 02_regulatory_activity.ipynb reads this file from.\n",
        "adata.write(scw.derived(\"preprocessed.h5ad\"))\n"
       ],
       "id": "sc087"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "## Next steps\n",
        "\n",
        "The preprocessed matrix is now at `/workspace/derived/preprocessed.h5ad`. **[02_regulatory_activity.ipynb](02_regulatory_activity.ipynb)** picks it up from there.\n"
       ],
       "id": "sc088"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "# These notebooks are very GPU memory intensive!\n",
        "# In order to free up GPU memory, we'll kill this kernel prior to proceeding.  You will get a message.  This is expected.\n",
        "# If you have a CUDA or an Out Of Memory (OOM) error, please kill all kernels to free up your GPU memory and try again!\n",
        "# You can comment this out if you want to continue exploring the notebook.\n",
        "# Please consult the README for more tips and tricks.\n",
        "\n",
        "import IPython\n",
        "\n",
        "IPython.Application.instance().kernel.do_shutdown(True)"
       ],
       "id": "sc089"
      },
      {
