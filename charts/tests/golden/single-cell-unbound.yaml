       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "sc.pl.embedding(acts,basis=\"X_umap_harmony\", color=[scw.LABEL_KEY, \"GATA3\"], cmap='RdBu_r',ncols=1)\n",
        "sc.pl.violin(acts, keys=['GATA3'], groupby=scw.LABEL_KEY, rotation=90, size = 0)\n"
       ],
       "id": "sc012"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Transcription Factor Activity Inference with MLM  \n",
        "\n",
        "Next, we infer transcription factor (TF) activity using the **Multivariate Linear Model (MLM)** from **Decoupler**.  \n",
        "Unlike **ULM**, which considers each TF independently, **MLM** accounts for multiple TFs simultaneously,  \n",
        "providing a more comprehensive estimation of regulatory influences. "
       ],
       "id": "sc013"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {
        "scrolled": true,
        "tags": []
       },
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.dcg.mlm(adata, collectri, verbose=True, raw = False, pre_load=True)"
       ],
       "id": "sc014"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Transcription Factor Activity Inference with AUCell  \n",
        "\n",
        "Next, we infer transcription factor (TF) activity using **AUCell** from **Decoupler**.  \n",
        "AUCell estimates TF activity based on the **enrichment of TF target genes within the top-expressed genes** in each cell.  \n",
        "Unlike regression-based methods (**ULM**, **MLM**), AUCell is a **rank-based approach** that does not assume linear relationships. "
       ],
       "id": "sc015"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {
        "scrolled": true,
        "tags": []
       },
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.dcg.aucell(adata, collectri, verbose=True, raw = False, pre_load=True)"
       ],
       "id": "sc016"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "acts = dc.pp.get_obsm(adata=adata, key=\"score_aucell\")"
       ],
       "id": "sc017"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
