  02_regulatory_activity.ipynb: |
    {
     "cells": [
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "> **Ported for confidential execution.** This is NVIDIA's [Single-Cell Analysis Blueprint](https://github.com/NVIDIA-AI-Blueprints/single-cell-analysis-blueprint) notebook, Apache-2.0, with its download step replaced by `sc_workspace.load_matrix()` and its hard-coded `obs` column names replaced by this deployment's own. Nothing else is changed. `PROVENANCE.md` lists every edit.\n"
       ],
       "id": "sc000"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "# **GPU Demo Part 2 - Decoupler-GPU: Accelerated Transcriptional Regulatory Analysis**  \n",
        "\n",
        "**Author:** [Severin Dicks](https://github.com/Intron7)\n",
        "**Copyright** [scverse](https://scverse.org)\n",
        "\n",
        "**Please run [GPU Demo Part 1 - Basic GPU E2E Workflow](01_demo_gpu_e2e.ipynb) before running this notebook as this notebook continues some analysis of that notebook's output.**\n",
        "\n",
        "In this notebook, we explore the updated [**Decoupler**](https://decoupler-py.readthedocs.io/en/latest/) functions for inferring transcriptional regulatory activity, leveraging the **GPU-accelerated** implementation from **rapids-singlecell**.  \n",
        "\n",
        "By running these analyses on GPUs, we achieve **faster computation** and **scalability** for large single-cell datasets. We will apply **Decoupler** methods to estimate **transcription factor (TF) activity** and **pathway activity**, utilizing curated regulatory networks such as **Dorothea** and **PROGENy**."
       ],
       "id": "sc001"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "import rapids_singlecell as rsc\n",
        "import scanpy as sc\n",
        "import rmm\n",
        "import cupy as cp\n",
        "import pandas as pd\n",
        "import anndata as ad\n",
        "import decoupler as dc\n",
        "from rmm.allocators.cupy import rmm_cupy_allocator\n",
        "rmm.reinitialize(\n",
        "    managed_memory=False, # Allows oversubscription\n",
        "    pool_allocator=True, # default is False\n",
        ")\n",
        "cp.cuda.set_allocator(rmm_cupy_allocator)"
       ],
       "id": "sc002"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "# Ported: upstream read ./h5/dli_decoupler.h5ad, written beside the corpus it\n",
        "# had downloaded. 01_preprocessing.ipynb writes the same matrix to the\n",
        "# workspace volume instead.\n",
        "import sc_workspace as scw\n",
        "\n",
        "adata = scw.load_matrix(path=scw.derived(\"preprocessed.h5ad\"))\n",
        "adata\n"
       ],
       "id": "sc003"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "adata = adata.raw.to_adata()"
       ],
       "id": "sc004"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "rsc.get.anndata_to_GPU(adata)"
       ],
       "id": "sc005"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Retrieving Transcription Factor (TF) Regulons with Dorothea  \n",
        "\n",
        "We start by retrieving the **Dorothea** gene regulatory network, which provides curated transcription factor (TF) target interactions.  \n",
        "Dorothea assigns confidence levels (`A`, `B`, `C`, `D`, `E`), where `A` represents the highest confidence interactions.  \n",
        "Here, we filter for **high-confidence** (`A`, `B`, `C`) interactions in human data:  "
       ],
       "id": "sc006"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "> **This notebook reaches the network, and it is the only one that does.**\n",
        "> The next cell calls `decoupler.op.collectri()`, which downloads the CollecTRI\n",
        "> regulon table from Zenodo (~6 MB of public reference data: transcription\n",
        "> factors and their targets). **No data of yours leaves the deployment** — the\n",
        "> request carries nothing but a GET — but it does mean this notebook needs\n",
        "> outbound HTTPS, and that the table is not covered by the attested\n",
        "> `requirements.lock`, so it is whatever Zenodo serves that day.\n",
        ">\n",
        "> In a deployment with no egress the call fails. Two ways round it: upload the\n",
        "> CSV into `/workspace/data` yourself and read it with `pandas.read_csv`\n",
        "> (`decoupler` takes any frame with `source`, `target` and `weight` columns), or\n",
        "> leave this notebook for a deployment that is allowed out. `01_preprocessing`\n",
        "> and `03_pearson_residuals` touch nothing outside the workspace.\n"
       ],
       "id": "sc007"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "collectri = dc.op.collectri(organism=\"human\",license=\"commercial\")"
       ],
       "id": "sc008"
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "### Transcription Factor Activity Inference with ULM  \n",
        "\n",
        "To infer transcription factor (TF) activity, we use the **Univariate Linear Model (ULM)** from **Decoupler**.  \n",
        "ULM estimates the regulatory influence of TFs on gene expression by fitting a linear model for each TF-gene interaction.  \n",
        "\n",
        "We apply **ULM** using the **Dorothea** regulatory network retrieved earlier. "
       ],
       "id": "sc009"
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {
        "tags": []
       },
       "outputs": [],
       "source": [
        "%%time\n",
        "rsc.dcg.ulm(adata, collectri, verbose=True, raw = False, pre_load=True)"
       ],
