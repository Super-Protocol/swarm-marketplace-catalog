# Source: confidential-vulnerability-analysis/templates/analysis.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-vuln-analysis
  labels:
    app.kubernetes.io/name: confidential-vuln-analysis
    app.kubernetes.io/instance: va
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: analysis
spec:
  replicas: 1
  # The volume is held open by the running pod, so a rolling update would leave the replacement
  # Pending on it for ever while the old pod serves.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-vuln-analysis
      app.kubernetes.io/instance: va
      app.kubernetes.io/component: analysis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: confidential-vuln-analysis
        app.kubernetes.io/instance: va
        app.kubernetes.io/component: analysis
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # The job store's directory, and the one the console writes uploads into. The image's
        # own entrypoint creates the paths the pipeline needs — it runs in the `api` container —
        # but the console does not go through it, and `nat serve` opens its SQLite job store
        # before anything has made a directory for it.
        - name: prepare
          image: "ghcr.io/super-protocol/confidential-vulnerability-analysis/analysis-server@sha256:c3ce8fc1c30af80e502a77ab076e7da94fdbea64f58ee30e0273b995bfb71697"
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - mkdir -p /data/state /data/rootfs /data/outputs /data/home
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests: { cpu: 100m, memory: 128Mi, nvidia.com/gpu: "0" }
            limits: { cpu: 100m, memory: 128Mi, nvidia.com/gpu: "0" }
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        # -------------------------------------------------------------------
        - name: api
          image: "ghcr.io/super-protocol/confidential-vulnerability-analysis/analysis-server@sha256:c3ce8fc1c30af80e502a77ab076e7da94fdbea64f58ee30e0273b995bfb71697"
          imagePullPolicy: IfNotPresent
          args:
            - nat
            - serve
            - --config_file=/etc/vuln-analysis/config.yml
            - --host=127.0.0.1
            - --port=26466
            - --db_url=sqlite+aiosqlite:////data/state/job_store.db
            - --max_running_async_jobs=1
            - --dask_worker_memory_limit=0.4
          env:
            # The key the model calls carry. By reference: an env *value* is rendered into the
            # Deployment and published in the evidence snapshot, a `secretKeyRef` is a pointer
            # to something the platform sealed. The OpenAI client reads this variable when the
            # configuration names no key, which is why the attested config can name none.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: confidential-vuln-analysis-secrets, key: inference-api-key }
            # Every HTTP client in this container goes through the guard. `httpx` — which is
            # what both the OpenAI SDK and the OSV tool use — honours these, and NO_PROXY is
            # what keeps the engine call inside the cluster space: routed through the guard it
            # would be refused, since the guard admits one external host and the engine is not
            # it.
            - name: HTTPS_PROXY
              value: "http://127.0.0.1:3128"
            - name: HTTP_PROXY
              value: "http://127.0.0.1:3128"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,::1,.svc,.svc.cluster.local,.cluster.local,swarm-model-server"
            # Pinned to the cores this container is granted, not to the host's. The chart
            # convention from SUP-882: a library that sizes its pool from `nproc` starts a
            # thread per host core inside the quota and spends the request being throttled.
            - name: OMP_NUM_THREADS
              value: "6"
            - name: MKL_NUM_THREADS
              value: "6"
            - name: RAYON_NUM_THREADS
              value: "6"
            - name: NUMEXPR_MAX_THREADS
              value: "6"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            # Says, in the attested snapshot, that this deployment runs without web research —
            # and makes `/preflight` agree. Upstream requires both NVIDIA_API_KEY and
            # TAVILY_API_KEY unconditionally, so a deployment serving open weights on its own
            # endpoint with no Tavily account reported `ready: false` for ever and the route
            # answered 503 with it, which is a client that preflights and then refuses to
            # submit anything at all. Our fork makes each vendor credential required only when
            # the provider is in use; this variable is the half of that signal a configuration
            # file cannot carry.
            - name: VULN_ANALYSIS_WEB_RESEARCH
              value: "off"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          # No `ports:` and no Service. The API listens on loopback, so there is nothing to
          # declare and nothing for another pod to reach.
          #
          # And the probes are `exec` for the same reason: a kubelet httpGet probe connects to
          # the POD's address, which this process does not listen on, so an httpGet probe here
          # would fail every time while the API answered the console perfectly. `curl` is in the
          # image.
          startupProbe:
            exec:
              command: [curl, -sf, --max-time, "10", "http://127.0.0.1:26466/health"]
            periodSeconds: 10
            failureThreshold: 60
          # `/ready` is NAT, the Dask scheduler and at least one worker. Slack on the timeouts:
          # the readiness endpoint is served by the same process that is running an agent loop,
          # and a busy process answering slowly is not a dead one — the RAG port lost a deploy
          # cycle to exactly this (SUP-840).
          readinessProbe:
            exec:
              command: [curl, -sf, --max-time, "15", "http://127.0.0.1:26466/ready"]
            periodSeconds: 20
            timeoutSeconds: 20
            failureThreshold: 4
          livenessProbe:
            exec:
              command: [curl, -sf, --max-time, "20", "http://127.0.0.1:26466/health"]
            periodSeconds: 30
            timeoutSeconds: 25
            failureThreshold: 6
          resources:
            limits:
              cpu: "6"
              memory: 20Gi
              nvidia.com/gpu: "0"
            requests:
              cpu: "6"
              memory: 20Gi
              nvidia.com/gpu: "0"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/vuln-analysis
              readOnly: true
        # -------------------------------------------------------------------
        - name: console
          image: "ghcr.io/super-protocol/confidential-vulnerability-analysis/analysis-server@sha256:c3ce8fc1c30af80e502a77ab076e7da94fdbea64f58ee30e0273b995bfb71697"
          imagePullPolicy: IfNotPresent
          # The image's entrypoint prepares the pipeline's own writable paths and is not this
          # process's business; the init container above made what the console writes to.
          command: [uvicorn]
          args:
            - console:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            # One worker: the session is a signed assertion rather than a stored row, so more
            # would be free — but an upload is a stream to one volume and a second worker would
            # only add a way to race it.
            - --workers
            - "1"
            # An upload is a PUT with a multi-gigabyte body, and the default keep-alive and
            # header timeouts are not what cuts it off — this is the one that does, on a slow
            # link.
            - --timeout-keep-alive
            - "75"
          env:
            - name: PYTHONPATH
              value: /opt/app
            - name: CONSOLE_TITLE
              value: "Confidential Vulnerability Analysis"
            - name: CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef: { name: confidential-vuln-analysis-secrets, key: console-password }
            - name: CONSOLE_SESSION_KEY
              valueFrom:
                secretKeyRef: { name: confidential-vuln-analysis-secrets, key: console-session-key }
            - name: CONSOLE_SESSION_TTL_SECONDS
              value: "43200"
            - name: ANALYSIS_API_URL
              value: "http://127.0.0.1:26466"
            - name: EGRESS_GUARD_URL
              value: "http://127.0.0.1:3128"
            - name: DATA_ROOT
              value: /data
            - name: UI_DIR
              value: /opt/app
            - name: UPLOAD_MAX_GIB
              value: "8"
            - name: UPLOAD_KEEP
              value: "6"
            # What the console tells a user about the deployment they are using. Plain
            # configuration, not a credential, and attested with everything else — so the panel
            # and the signed evidence describe the same deployment.
            - name: ABOUT_GENERATION_MODEL
              value: "qwen3-coder-30b-a3b-instruct-fp8"
            - name: ABOUT_GENERATION_LICENCE
              value: "Apache-2.0"
            - name: ABOUT_CONTEXT_WINDOW
              value: "65536"
            - name: ABOUT_EGRESS_HOST
              value: "api.osv.dev"
            - name: ABOUT_EGRESS_PORT
              value: "443"
            - name: ABOUT_SOURCE_REPO
              value: "https://github.com/Super-Protocol/confidential-vulnerability-analysis"
            - name: ABOUT_UPSTREAM
              value: https://github.com/NVIDIA-AI-Blueprints/vulnerability-analysis
            # There is deliberately no ABOUT_EXPECTED_DIGEST here. That env value would be
            # rendered into this Deployment, the Deployment is in the evidence snapshot, and the
            # snapshot is what the digest is OVER — so a console displaying the digest it should
            # match changes that digest by displaying it. It cost the RAG port a deploy cycle to
            # notice. The deployment's own digest is at the evidence URL the console links.
            - name: LOG_LEVEL
              value: "INFO"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The one route outside the session, and it reports liveness and nothing about any
          # finding — it is reachable from the public hostname by anybody who finds the name.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
              nvidia.com/gpu: "0"
            requests:
              cpu: 500m
              memory: 512Mi
              nvidia.com/gpu: "0"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: app
              mountPath: /opt/app
              readOnly: true
        # -------------------------------------------------------------------
        - name: egress
          image: "ghcr.io/super-protocol/confidential-vulnerability-analysis/analysis-server@sha256:c3ce8fc1c30af80e502a77ab076e7da94fdbea64f58ee30e0273b995bfb71697"
          imagePullPolicy: IfNotPresent
          command: [python, /opt/app/egress_guard.py]
          env:
            - name: EGRESS_LISTEN_ADDRESS
              value: "127.0.0.1"
            - name: EGRESS_LISTEN_PORT
              value: "3128"
            - name: EGRESS_ALLOW_HOST
              value: "api.osv.dev"
            - name: EGRESS_ALLOW_PORT
              value: "443"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          # Loopback, so the probe is `exec` for the same reason the api's are — and it asks the
          # guard's own status route, which is the one non-CONNECT request the guard answers.
          startupProbe:
            exec:
              command: [curl, -sf, --max-time, "5", "--noproxy", "*", "http://127.0.0.1:3128/_guard/status"]
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command: [curl, -sf, --max-time, "5", "--noproxy", "*", "http://127.0.0.1:3128/_guard/status"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
              nvidia.com/gpu: "0"
            requests:
              cpu: 250m
              memory: 256Mi
              nvidia.com/gpu: "0"
          volumeMounts:
            - name: app
              mountPath: /opt/app
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: confidential-vuln-analysis-data
        - name: app
          configMap:
            name: confidential-vuln-analysis-app
        - name: config
          configMap:
            name: confidential-vuln-analysis-config
---
# Source: confidential-vulnerability-analysis/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: confidential-vuln-analysis
  labels:
    app.kubernetes.io/name: confidential-vuln-analysis
    app.kubernetes.io/instance: va
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Declared on the object as well as in the listing's `evidence.exclude`. The annotation is
    # what the cloud reads when it digests the namespace; the definition's copy is what the
    # listing page shows. A digest displayed beside "no exclusions" answers the only question
    # that matters about it wrongly.
    swarm.io/exclude-evidence-fields: "/spec/rules/0/host"
    # A root filesystem is uploaded through this hostname. Without the body size the default
    # 1 MiB limit refuses every real archive with a 413 that comes from nginx rather than from
    # the deployment; without the timeouts, a multi-gigabyte upload or a report fetch is cut
    # off mid-stream and reads as a broken console.
    nginx.ingress.kubernetes.io/proxy-body-size: "8192m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: "nginx"
  rules:
    - host: "vuln.conf-apps.superprotocol.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: confidential-vuln-analysis-console
                port:
                  number: 80