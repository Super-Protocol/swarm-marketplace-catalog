apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-router-postgresql-scripts
  labels:
    helm.sh/chart: patroni-postgresql-0.2.1
    app.kubernetes.io/name: patroni-postgresql
    app.kubernetes.io/instance: pg
    app.kubernetes.io/version: "17.5"
    app.kubernetes.io/managed-by: Helm
data:
  post-init.sh: |
    #!/bin/bash
    #
    # Patroni's post_init hook. A non-zero exit aborts the bootstrap and Patroni
    # starts over with an empty data directory, so everything here has to be
    # idempotent and has to fail loudly rather than half-way.
    #
    #   $1  the "human" role Spilo's own hook creates
    #   $2  the connection string Patroni appends
    #
    # Patroni runs this with PGOPTIONS=-c synchronous_commit=local, which is what
    # keeps it from blocking on a synchronous standby that does not exist yet.
    set -Eeuo pipefail

    human_role="$1"
    connstring="$2"

    # Spilo's own hook first: the admin and cron_admin roles, the log foreign
    # tables, and the extensions every Spilo cluster is expected to have.
    /scripts/post_init.sh "$human_role" "$connstring"

    password_file=/etc/patroni/credentials/app-password
    if [ ! -r "$password_file" ]; then
      echo "post-init: $password_file is not readable" >&2
      exit 1
    fi

    # The password reaches psql through psql's own backtick substitution, not
    # through an argument and not through this file: an argument is visible in `ps`,
    # and a password pasted into SQL text is one escaping mistake away from being
    # executed. `:'name'` then interpolates it as a correctly quoted literal.
    psql -Xd "$connstring" <<'SQL'
    \set ON_ERROR_STOP on
    \set app_user 'router'
    \set app_database 'router'
    \set app_password `cat /etc/patroni/credentials/app-password`

    SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
      WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = :'app_user')
    \gexec

    -- Separately, and unconditionally: a role that already existed is a cluster
    -- being re-bootstrapped over a restored dump, and its password is the one this
    -- deployment was given rather than the one in the dump.
    SELECT format('ALTER ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
    \gexec

    SELECT format('CREATE DATABASE %I OWNER %I', :'app_database', :'app_user')
      WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_database WHERE datname = :'app_database')
    \gexec
    SQL
---
# Source: patroni-postgresql/templates/etcd-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-router-postgresql-etcd
  labels:
    helm.sh/chart: patroni-postgresql-0.2.1
    app.kubernetes.io/name: patroni-postgresql-etcd
    app.kubernetes.io/instance: pg
    app.kubernetes.io/component: dcs
    app.kubernetes.io/managed-by: Helm
data:
  bootstrap.sh: |
    #!/bin/sh
    set -eu

    data_dir=/var/lib/etcd/data
    output=/run/etcd/etcd.conf.yml
    self=${POD_NAME}.confidential-router-postgresql-etcd.${POD_NAMESPACE}.svc.cluster.local
    peers="confidential-router-postgresql-etcd-0.confidential-router-postgresql-etcd.${POD_NAMESPACE}.svc.cluster.local confidential-router-postgresql-etcd-1.confidential-router-postgresql-etcd.${POD_NAMESPACE}.svc.cluster.local confidential-router-postgresql-etcd-2.confidential-router-postgresql-etcd.${POD_NAMESPACE}.svc.cluster.local "

    # etcd's v3 API over its gRPC gateway, which is plain JSON over HTTP and reachable
    # with the `wget` this image has. `member remove` and `member add` need a quorum, so
    # a failure here exits non-zero and the kubelet tries the whole decision again —
    # which is the right behaviour for "the cluster is in the middle of something".
    post() {
      wget -q -T 10 -O - --post-data "$2" --header 'Content-Type: application/json' "$1"
    }

    state=new
    if [ -d "$data_dir/member" ]; then
      # This member's own write-ahead log is here, which is what etcd restarts from: it
      # ignores every initial-cluster setting when a log is present, and the membership
      # it rejoins with is the one recorded in the log rather than the one below.
      state=existing
      echo "dcs-bootstrap: $POD_NAME has its own write-ahead log" >&2
    else
      # Swept three times rather than once, because this verdict is taken exactly once
      # per pod and the etcd container crash-loops on a wrong one. A probe that failed
      # for three seconds while the cluster was in fact alive would otherwise cost a
      # pod delete to undo — and the init container, having already exited, would not
      # be the thing that noticed. A genuine cold start pays for the extra sweeps in
      # unresolvable names and refused connections, both of which fail immediately.
      serving=
      attempt=1
      while [ -z "$serving" ] && [ "$attempt" -le 3 ]; do
        [ "$attempt" -eq 1 ] || sleep 3
        for peer in $peers; do
          case "$peer" in "$POD_NAME".*) continue ;; esac
          # `/health` and not `/version`: a member answers it 200 only once it has a
          # quorum. A member that is up but waiting for peers is a cluster that does
          # not exist yet, and this member is one of the peers it is waiting for.
          if wget -q -T 3 -O /dev/null "http://$peer:2379/health" 2>/dev/null; then
            serving=$peer
            break
          fi
        done
        attempt=$((attempt + 1))
      done

      if [ -n "$serving" ]; then
        state=existing
        old=$(post "http://$serving:2379/v3/cluster/member/list" '{}' \
                | sed 's/},{/}\n{/g' | grep "\"name\":\"$POD_NAME\"" \
                | sed -n 's/.*"ID":"\([0-9]*\)".*/\1/p' || true)
        if [ -n "$old" ]; then
          echo "dcs-bootstrap: $POD_NAME lost its volume; retiring member $old" >&2
          post "http://$serving:2379/v3/cluster/member/remove" "{\"ID\":\"$old\"}" >/dev/null
        fi
        echo "dcs-bootstrap: admitting $POD_NAME at $self through $serving" >&2
        post "http://$serving:2379/v3/cluster/member/add" \
          "{\"peerURLs\":[\"http://$self:2380\"]}" >/dev/null
      fi
    fi

    echo "dcs-bootstrap: $POD_NAME starts with initial-cluster-state=$state" >&2
    cat > "$output" <<CONFIG
    name: $POD_NAME
    data-dir: $data_dir
    listen-client-urls: http://0.0.0.0:2379
    advertise-client-urls: http://$self:2379
    listen-peer-urls: http://0.0.0.0:2380
    initial-advertise-peer-urls: http://$self:2380
    initial-cluster: confidential-router-postgresql-etcd-0=http://confidential-router-postgresql-etcd-0.confidential-router-postgresql-etcd.${POD_NAMESPACE}.svc.cluster.local:2380,confidential-router-postgresql-etcd-1=http://confidential-router-postgresql-etcd-1.confidential-router-postgresql-etcd.${POD_NAMESPACE}.svc.cluster.local:2380,confidential-router-postgresql-etcd-2=http://confidential-router-postgresql-etcd-2.confidential-router-postgresql-etcd.${POD_NAMESPACE}.svc.cluster.local:2380
    initial-cluster-token: confidential-router-postgresql-etcd
    initial-cluster-state: $state
    auto-compaction-mode: periodic
    auto-compaction-retention: "1h"
    quota-backend-bytes: 268435456
    log-level: warn
    CONFIG
---
# Source: patroni-postgresql/templates/router-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-router-postgresql-router
  labels:
    helm.sh/chart: patroni-postgresql-0.2.1
    app.kubernetes.io/name: patroni-postgresql-router
    app.kubernetes.io/instance: pg
    app.kubernetes.io/component: router
    app.kubernetes.io/managed-by: Helm
data:
  haproxy.cfg: |
    global
      log stdout format raw local0 info
      maxconn 2048
      # No chroot and no stats socket. Nothing in this configuration writes to the
      # filesystem, which is what lets the container's root filesystem be read-only.

    defaults
      mode tcp
      log global
      option tcplog
      option dontlognull
      timeout connect 5s
      # Long, on purpose: a proxy in the connection path must not be the thing that
      # closes an idle pooled connection. See `router.timeouts` in values.yaml.
      timeout client 7d
      timeout server 7d
      timeout check 3s
      retries 2

    resolvers kubernetes
      # The pod's own resolver. Without a `resolvers` section HAProxy resolves each
      # backend once, at startup, and keeps the address — so the first instance to
      # restart onto a new pod IP would be an instance the router never finds again.
      parse-resolv-conf
      hold valid 5s
      hold nx 5s
      hold other 5s
      hold refused 5s
      hold timeout 5s
      resolve_retries 3
      timeout resolve 1s
      timeout retry 1s

    # The router's own readiness, which deliberately fails while no instance is
    # leading: an application then meets a Service with no endpoints and a refused
    # connection, instead of a connection that is accepted and reset. During a
    # failover that is the difference between a client that retries and a client that
    # reports a database error.
    frontend health
      mode http
      bind :8404
      monitor-uri /healthz
      acl no_primary nbsrv(primary) lt 1
      monitor fail if no_primary
      option dontlog-normal

    listen primary
      bind :5432
      option httpchk GET /primary
      http-check expect status 200
      # Exactly one instance answers 200, so there is nothing to balance; `first`
      # makes which one it is a function of the check rather than of chance.
      balance first
      # `shutdown-sessions` is the load-bearing half: a leader that has been demoted
      # still holds TCP connections that are now talking to a standby in recovery, and
      # the client finds out by having a write fail rather than by reconnecting.
      default-server check port 8008 inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers kubernetes init-addr none
      server confidential-router-postgresql-0 confidential-router-postgresql-0.confidential-router-postgresql-pods.${POD_NAMESPACE}.svc.cluster.local:5432
      server confidential-router-postgresql-1 confidential-router-postgresql-1.confidential-router-postgresql-pods.${POD_NAMESPACE}.svc.cluster.local:5432
      server confidential-router-postgresql-2 confidential-router-postgresql-2.confidential-router-postgresql-pods.${POD_NAMESPACE}.svc.cluster.local:5432

    listen standby
      bind :5433
      option httpchk GET /replica
      http-check expect status 200
      balance leastconn
      default-server check port 8008 inter 3s fall 3 rise 2 on-marked-down shutdown-sessions resolvers kubernetes init-addr none
      server confidential-router-postgresql-0 confidential-router-postgresql-0.confidential-router-postgresql-pods.${POD_NAMESPACE}.svc.cluster.local:5432
      server confidential-router-postgresql-1 confidential-router-postgresql-1.confidential-router-postgresql-pods.${POD_NAMESPACE}.svc.cluster.local:5432
      server confidential-router-postgresql-2 confidential-router-postgresql-2.confidential-router-postgresql-pods.${POD_NAMESPACE}.svc.cluster.local:5432
---
