            - name: ETCD3_PROTOCOL
              value: http
            - name: ETCD3_HOSTS
              value: "confidential-router-postgresql-etcd-0.confidential-router-postgresql-etcd.$(POD_NAMESPACE).svc.cluster.local:2379,confidential-router-postgresql-etcd-1.confidential-router-postgresql-etcd.$(POD_NAMESPACE).svc.cluster.local:2379,confidential-router-postgresql-etcd-2.confidential-router-postgresql-etcd.$(POD_NAMESPACE).svc.cluster.local:2379"
            - name: ALLOW_NOSSL
              value: "true"
            - name: PGUSER_SUPERUSER
              value: "postgres"
            - name: PGPASSWORD_SUPERUSER
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: postgres-password
            - name: PGUSER_STANDBY
              value: "standby"
            - name: PGPASSWORD_STANDBY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: replication-password
            - name: SPILO_CONFIGURATION
              value: |
                bootstrap:
                  dcs:
                    failsafe_mode: true
                    loop_wait: 10
                    maximum_lag_on_failover: 33554432
                    retry_timeout: 10
                    synchronous_mode: true
                    synchronous_mode_strict: false
                    synchronous_node_count: 1
                    ttl: 30
                  post_init: /etc/patroni/scripts/post-init.sh zalandos
                postgresql:
                  callbacks:
                    on_role_change: /scripts/on_role_change.sh zalandos true
                    on_start: /bin/true
                    on_stop: /bin/true
          livenessProbe:
            httpGet:
              path: /liveness
              port: patroni
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readiness
              port: patroni
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readiness
              port: patroni
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          resources:
            limits:
              cpu: 250m
              memory: 768Mi
              nvidia.com/gpu: "0"
            requests:
              cpu: 250m
              memory: 768Mi
              nvidia.com/gpu: "0"
          volumeMounts:
            - name: pgdata
              mountPath: /home/postgres/pgdata
            - name: scripts
              mountPath: /etc/patroni/scripts
              readOnly: true
            - name: credentials
              mountPath: /etc/patroni/credentials
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: scripts
          configMap:
            name: confidential-router-postgresql-scripts
            defaultMode: 0555
        - name: credentials
          secret:
            secretName: confidential-router-api
            defaultMode: 0440
            items:
              - key: password
                path: app-password
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: pgdata
        labels:
          app.kubernetes.io/name: patroni-postgresql
          app.kubernetes.io/instance: pg
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "8Gi"