# Source: confidential-router-api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-router-api
  labels:
    helm.sh/chart: confidential-router-api-0.8.1
    app.kubernetes.io/name: confidential-router-api
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.4.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
  annotations:
    # `checksum/public-config` below is a hash of the hostname-derived ConfigMap,
    # so it varies with the hostname exactly as that object's `/data` does and is
    # excluded for the same reason (SUP-211). `/` inside a JSON Pointer token is
    # `~1` (RFC 6901), which is what makes this one token and not three.
    #
    # `checksum/config` is deliberately *not* excluded: `router.yaml` carries no
    # hostname any more, so that hash is a property of the version and the
    # parameters — which is precisely what the digest should attest.
    swarm.io/exclude-evidence-fields: "/spec/template/metadata/annotations/checksum~1public-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-router-api
      app.kubernetes.io/instance: cr
  template:
    metadata:
      annotations:
        # A catalogue change is a config change, and the config is a file: without
        # this the ConfigMap is updated and the running pods keep the old models.
        checksum/config: 98d073c97b6823450008991428ee227b33093642a6e1de932f91cfa359750050
        # And a hostname reconfigure is a config change the pod cannot see at all:
        # `envFrom` is read once, when the container starts, so without this the
        # ConfigMap is updated and the running router keeps advertising the old
        # origin.
        checksum/public-config: b6ab9951b18b5581bfdeae30b07e35cd3e49c334cbd2575951ef30aa813b5ae9
      labels:
        app.kubernetes.io/name: confidential-router-api
        app.kubernetes.io/instance: cr
    spec:
      securityContext:
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      initContainers:
        # `migrate` is the image's entry point for `node /app/cli/run-migrations.js`
        # — Better Auth's four tables, then the service's ten. Idempotent, so a
        # restart prints "No pending migrations" and exits 0. It also fails until
        # PostgreSQL accepts connections, which is exactly the wait this pod needs
        # and is why there is no separate wait-for-database container.
        - name: migrate
          image: ghcr.io/super-protocol/confidential-router/router-api@sha256:081f99911e0d288d6df6ada72730ffcf79158373d7e417169db9db44dd3769fc
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: confidential-router-api-public
          env:
            - name: NODE_ENV
              value: "production"
            - name: CR_API_CONFIG_FILE
              value: /etc/confidential-router/router.yaml
            - name: ROUTER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: password
            - name: ROUTER_DATABASE_URL
              value: "postgres://router:$(ROUTER_DATABASE_PASSWORD)@confidential-router-postgresql:5432/router?sslmode=disable"
            - name: ROUTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: auth-secret
            - name: CR_API_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: secrets-key
          volumeMounts:
            - name: config
              mountPath: /etc/confidential-router
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
            - name: gatekeeper-config
              mountPath: "/var/run/gatekeeper"
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
              nvidia.com/gpu: "0"
            requests:
              cpu: 100m
              memory: 128Mi
              nvidia.com/gpu: "0"
      containers:
        - name: router-api
          image: ghcr.io/super-protocol/confidential-router/router-api@sha256:081f99911e0d288d6df6ada72730ffcf79158373d7e417169db9db44dd3769fc
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: confidential-router-api-public
          env:
            - name: NODE_ENV
              value: "production"
            - name: CR_API_CONFIG_FILE
              value: /etc/confidential-router/router.yaml
            - name: ROUTER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: password
            - name: ROUTER_DATABASE_URL
              value: "postgres://router:$(ROUTER_DATABASE_PASSWORD)@confidential-router-postgresql:5432/router?sslmode=disable"
            - name: ROUTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: auth-secret
            - name: CR_API_SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: secrets-key
          # `/health` does a real database round trip, so an unready pod is one
          # that cannot serve rather than one that has merely started.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/confidential-router
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
            - name: gatekeeper-config
              mountPath: "/var/run/gatekeeper"
          resources:
            limits:
              cpu: 250m
              memory: 1Gi
              nvidia.com/gpu: "0"
            requests:
              cpu: 250m
              memory: 1Gi
              nvidia.com/gpu: "0"
        # The attested egress (ADR-008 §2): the gatekeeper's own core, verifying
        # an external model endpoint's evidence and pinning its TLS leaf before
        # the container above proxies a prompt to it. A second container rather
        # than a second implementation — the user-side gatekeeper and this run
        # the same binary, so there is no verification logic that can diverge.
        #
        # It is driven through a file and read back over loopback, and that is
        # the whole seam. It needs no Service (the listeners are on 127.0.0.1,
        # which only this pod has), no kube-apiserver access (the confinement
        # that cost the database an election is not in play here — SUP-215), and
        # nothing writable: a static binary on a read-only root filesystem,
        # running as the image's own non-root uid rather than the API's.
        - name: gatekeeper
          image: ghcr.io/super-protocol/confidential-router/gatekeeper@sha256:15e1691a39e124fc9888ff6f41763cf577939b69557c7e7148b2563f1772412a
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            # 65532, the conventional "nonroot" id this image creates and `USER`s
            # to. The pod-wide 1001 is the API image's user and does not exist
            # here.
            #
            # The *group* stays the pod's, and that is load-bearing rather than
            # an omission: router-api writes the rendered configuration 0640,
            # owned by its own uid and gid, so sharing the group is the only
            # thing that lets this container read it. Give it a group of its own
            # and the egress comes up, waits for a file it can see and cannot
            # open, and serves nothing — with both containers Ready.
            runAsUser: 65532
          env:
            # Not a mount of its own: the entrypoint waits for this path to
            # appear, so starting before router-api has rendered anything is the
            # expected order rather than a crash loop.
            - name: GATEKEEPER_CONFIG
              value: "/var/run/gatekeeper/config.yaml"
            - name: GATEKEEPER_WATCH_INTERVAL
              value: "2s"
          # No ports, and that is the point: every listener this process opens —
          # the per-endpoint egress ones and the admin API — is bound to
          # loopback, which is shared with the container above and with nothing
          # else. A containerPort here would advertise a reachability that does
          # not exist.
          #
          # No probe either. "Is it serving?" is not a question this container
          # can answer about itself without a verdict, and a probe that reported
          # healthy while every endpoint was fail-closed would be worse than
          # none; the API polls the admin socket for exactly that and shows it in
          # the console.
          volumeMounts:
            - name: gatekeeper-config
              mountPath: "/var/run/gatekeeper"
              readOnly: true
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
              nvidia.com/gpu: "0"
            requests:
              cpu: 100m
              memory: 128Mi
              nvidia.com/gpu: "0"
      volumes:
        - name: config
          configMap:
            name: confidential-router-api
        # The root filesystem is read-only; these two are the only paths the
        # process writes to. `data/` is the SQLite default, unused on PostgreSQL,
        # and still has to exist.
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
        # The rendered sidecar configuration, and nothing else. router-api writes
        # it — atomically, into a temporary file in this directory and then a
        # rename — on boot and after every admin mutation; the sidecar reads it
        # and SIGHUPs itself when the bytes actually change. It holds no secret:
        # an upstream's API key stays sealed in the database and is injected on
        # the egress leg one request at a time.
        - name: gatekeeper-config
          emptyDir: {}
