# Source: confidential-s3/templates/configmap-garage.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-s3-garage
  labels:
    helm.sh/chart: confidential-s3-0.1.1
    app.kubernetes.io/name: confidential-s3
    app.kubernetes.io/instance: cs3
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-s3
    app.kubernetes.io/component: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"

    db_engine = "sqlite"

    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    # One node talking to itself. A pod address would be a second thing to keep
    # true across a reschedule, for a cluster that has no peer to announce to.
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
---
# Source: confidential-s3/templates/configmap-gateway.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-s3-gateway
  labels:
    helm.sh/chart: confidential-s3-0.1.1
    app.kubernetes.io/name: confidential-s3
    app.kubernetes.io/instance: cs3
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-s3
    app.kubernetes.io/component: gateway
data:
  gateway.yaml: |
    server:
      host: "0.0.0.0"
      port: 9100
      # Path style only. An unlisted domain must never have its first host label
      # read as a bucket name, and the wildcard record virtual-host addressing
      # needs is not one the marketplace writes.
      s3_domains: []

    database:
      max_connections: 16
      connect_timeout_seconds: 10
      # Also how long a console change takes to reach the data plane: there is no
      # invalidation channel between the two.
      cache_ttl_seconds: 5
      cache_max_entries: 10000

    internal_engine:
      endpoint: "http://confidential-s3-garage:3900"
      region: garage
      provision_ttl_seconds: 3600
      provision_max_entries: 10000

    evidence:
      ttl_seconds: 300
      max_entries: 10000
      timeout_seconds: 5

    encryption:
      chunk_size: 4194304
