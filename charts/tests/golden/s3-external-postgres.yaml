            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: confidential-s3
                  key: garage-admin-token
          # `/health` answers 200 as soon as the process is serving — including
          # before any layout exists, where it says "Garage is fully operational"
          # over an engine that cannot store a byte. Verified against a real
