apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-s3-api
  labels:
    helm.sh/chart: confidential-s3-0.1.1
    app.kubernetes.io/name: confidential-s3
    app.kubernetes.io/instance: cs3
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-s3
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-s3
      app.kubernetes.io/instance: cs3
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: confidential-s3
        app.kubernetes.io/instance: cs3
        app.kubernetes.io/component: api
    spec:
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: api
          image: ghcr.io/super-protocol/confidential-s3/api@sha256:2222222222222222222222222222222222222222222222222222222222222222
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: confidential-s3
                  key: database-url
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-s3
                  key: master-key
            - name: BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: confidential-s3
                  key: bootstrap-token
            # From the Secret, not as a literal: it names the consumer, and a
            # consumer-varying string in an attested manifest makes the evidence
            # digest a property of who deployed this rather than of the version.
            - name: BOOTSTRAP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: confidential-s3
                  key: bootstrap-admin-email
            - name: BOOTSTRAP_WORKSPACE_NAME
              value: "Default"
            - name: BOOTSTRAP_TOKEN_TTL_HOURS
              value: "720"
            - name: INVITE_TOKEN_TTL_HOURS
              value: "168"
            - name: SESSION_TTL_HOURS
              value: "12"
            # The console's file browser reads and writes objects through the
            # gateway rather than around it, and the control plane is what signs
            # those requests. Without this the console still manages buckets,
            # keys and users, and browsing answers 503.
            - name: GATEWAY_S3_ENDPOINT
              value: "http://confidential-s3-gateway:9100"
          # `/readyz` does a real database round trip, so an unready pod is one
          # that cannot serve rather than one that has merely started. The
          # startup budget covers the migrations, which run before the first
          # answer on a fresh database.
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
