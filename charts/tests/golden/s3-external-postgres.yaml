apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-s3-console
  labels:
    helm.sh/chart: confidential-s3-0.1.1
    app.kubernetes.io/name: confidential-s3
    app.kubernetes.io/instance: cs3
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-s3
    app.kubernetes.io/component: console
  annotations:
    # The one place outside an Ingress where the operator's chosen hostname
    # reaches a manifest: the console prints this endpoint for a service account,
    # so it is the public S3 address rather than the one this pod dials. Without
    # the exclusion every deployment of this version would attest a different
    # digest — which is not a render failure, and so is exactly the kind of thing
    # that is found once and then guarded. `charts/tests/run.sh` renders the
    # chart as two consumers and fails if anything but the declared exclusions
    # differs.
    #
    # The index is deterministic because this template writes the list: PORT,
    # HOSTNAME, API_BASE_URL, S3_PUBLIC_ENDPOINT.
    swarm.io/exclude-evidence-fields: "/spec/template/spec/containers/0/env/3/value"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-s3
      app.kubernetes.io/instance: cs3
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: confidential-s3
        app.kubernetes.io/instance: cs3
        app.kubernetes.io/component: console
    spec:
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: console
          image: ghcr.io/super-protocol/confidential-s3/console@sha256:3333333333333333333333333333333333333333333333333333333333333333
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 4300
              protocol: TCP
          env:
            - name: PORT
              value: "4300"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: API_BASE_URL
              value: "http://confidential-s3-api:3000/api"
            # The endpoint the console prints for a service account: the address
            # an S3 client outside the cluster is pointed at, not the one this
            # pod reaches the gateway on.
            - name: S3_PUBLIC_ENDPOINT
              value: "https://s3.confidential-s3.example"
          # `/login` is the one route served without a session cookie, so a
          # healthy console answers it with a 200 rather than a redirect.
          startupProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # Next writes its image cache and its build traces under `.next`, and
            # the root filesystem is read-only.
            - name: next-cache
              mountPath: /app/apps/console/.next/cache
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
