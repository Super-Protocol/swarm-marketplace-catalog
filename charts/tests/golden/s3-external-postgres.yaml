          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          args: ["/etc/confidential-s3/gateway.yaml"]
          ports:
            - name: s3
              containerPort: 9100
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: confidential-s3
                  key: database-url
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-s3
                  key: master-key
            - name: INTERNAL_ENGINE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-s3
                  key: engine-access-key
            - name: INTERNAL_ENGINE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-s3
                  key: engine-secret-key
          # `/readyz` reaches the database and the engine; `/healthz` only reports
          # the process. The startup budget is generous because the gateway comes
          # up before the bootstrap Job has necessarily finished with Garage.
          startupProbe:
            httpGet: { path: /readyz, port: s3 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: s3 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: s3 }
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/confidential-s3
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: confidential-s3-gateway
        # The root filesystem is read-only; this is the only path the process
        # writes to.
        - name: tmp
          emptyDir: {}
