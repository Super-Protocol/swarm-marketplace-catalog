        "> **Ported for confidential execution.** This is NVIDIA's [transaction-foundation-model developer example](https://github.com/NVIDIA-AI-Blueprints/transaction-foundation-model) notebook, Apache-2.0, with its download of a public corpus replaced by `tfm_workspace.load_transactions()`, its paths pointed at this deployment's workspace, its `%pip install` lines removed (the environment is in the image, pinned by sha256) and a vocabulary-coverage check added before anything is extracted from the shipped checkpoint. Nothing else is changed. `PROVENANCE.md` lists every edit.\n"
