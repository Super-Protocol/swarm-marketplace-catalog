        "3. **Your columns are where this deployment was told they are.** The mapping comes from the\n",
        "   deployment's parameters; a column named here that your data does not have is a message in\n",
        "   this notebook rather than a `KeyError` in the middle of a corpus build.\n",
        "4. **Your data lands inside that vocabulary.** This is the one that has no counterpart\n",
