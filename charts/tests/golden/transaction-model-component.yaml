        "\n",
        "GPU-accelerated tokenization via cuDF + HuggingFace model inference with last-token pooling. The training split uses a balanced subsample (\\~1M rows, \\~2.5% fraud) to match the downstream XGBoost training setup in notebook 05. Val and test use the 100k stratified subsets saved in notebook 01 (`val_eval.parquet` and `test_eval.parquet`) for faster, apples-to-apples comparisons.\n"
