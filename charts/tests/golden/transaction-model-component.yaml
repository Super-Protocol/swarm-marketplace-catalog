        "   card-transaction corpus: US states, 3-digit ZIP prefixes, a fixed list of merchant category\n",
        "   codes, dollar-amount buckets and customer indices 0\u20132999. Transactions from outside that\n",
        "   world tokenise entirely to catch-alls \u2014 `STATE_XX`, `MCC_-1`, `CAT_GENERAL` \u2014 and every\n",
        "   notebook downstream still produces embeddings, a UMAP and an AUROC from them.\n",
        "\n",
        "If the last check fails, nothing is broken and you have not wasted the deployment: notebook 03\n",
        "pretrains with a vocabulary built from **your** fields and does not use the shipped weights at\n",
