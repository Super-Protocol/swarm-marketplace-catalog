        "import time\n",
        "import cudf\n",
        "\n",
        "# ==============================================================================\n",
        "# Configuration\n",
        "# ==============================================================================\n",
        "BATCH_SIZE = 1024\n",
        "MAX_LENGTH = 128\n",
        "MERCHANT_HASH_SIZE = 2000  # Aligned with corpus generation (notebook 02)\n",
