       "source": [
        "---\n",
        "\n",
        "## The data this notebook reads\n",
        "\n",
        "Upstream's version of this notebook downloads the public IBM TabFormer corpus \u2014 2.2 GB of\n",
        "synthetic US card transactions \u2014 and works on that. This deployment does not: it reads the\n",
        "transactions bound to it, through `tfm_workspace.load_transactions()`, and nothing in these\n",
        "five notebooks reaches the network.\n",
        "\n",
        "Three things worth knowing before you run anything:\n",
        "\n",
        "- **The columns are yours, renamed.** This deployment was told which of your columns is the\n",
        "  customer, the amount, the merchant, the timestamp and the rest; the next cell prints that\n",
        "  mapping, and a column it names that your extract does not have is an error there rather than a\n",
        "  `KeyError` forty cells in.\n",
        "- **The shipped checkpoint knows TabFormer's world, not necessarily yours.** Its 6,251-token\n",
        "  vocabulary enumerates US states, 3-digit ZIP prefixes, a fixed list of merchant category codes,\n",
        "  dollar-amount buckets and customer indices 0-2999. The coverage check below measures how much\n",
        "  of your data lands inside it and refuses to continue below this deployment's floor. If your\n",
        "  data does not fit, `03_foundation_model_training.ipynb` trains with a vocabulary built from\n",
        "  your own fields and does not depend on those weights.\n",
        "- **This notebook and 05 need a fraud label.** 02, 03 and 04 do not.\n"
       ]
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "# Ported: upstream downloaded the public IBM TabFormer corpus \u2014 2.2 GB of\n",
        "# synthetic US card transactions \u2014 from IBM Box here, and extracted it beside the\n",
        "# checkout. This deployment has transactions of its own: a marketplace dataset\n",
        "# bound to it, or a .csv/.parquet extract uploaded into /workspace/data. Nothing\n",
        "# in this notebook reaches the network.\n",
        "#\n",
        "# What is printed below is the whole of what this deployment was told: where the\n",
        "# data comes from, what the columns are called, and which checkpoint is in the\n",
        "# image.\n",
        "import tfm_workspace as tfm\n",
        "\n",
        "print(tfm.describe_binding())\n",
        "print(tfm.describe_checkpoint())\n",
        "print()\n",
        "print(tfm.describe_columns())\n"
       ]
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "---\n",
        "\n",
        "## 0. Setup and Imports"
       ]
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "# Ported: upstream installed this notebook's dependencies here, with\n",
        "# `%pip install`. The environment is in the image instead \u2014 every wheel pinned\n",
        "# by sha256 in the fork's deploy/requirements.lock \u2014 because a package fetched\n",
        "# after the pod starts is not part of what the deployment attests to.\n"
       ]
      },
      {
       "cell_type": "code",
       "execution_count": null,
       "metadata": {},
       "outputs": [],
       "source": [
        "import time\n",
        "import random\n",
        "import warnings\n",
