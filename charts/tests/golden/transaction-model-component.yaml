        "# overrides it deliberately \u2014 and if you do that, nothing downstream means what\n",
        "# it appears to mean.\n",
        "report = tfm.check_coverage(frame)\n",
        "\n",
        "print()\n",
        "print(\"ready. Run 01_dataset_baseline.ipynb next\" if report[\"labelled\"] else\n",
        "      \"ready. No fraud label, so start at 02_seq_preproc_tokenization.ipynb: \"\n",
        "      \"01 and 05 score fraud detection and have nothing to score.\")"
       ]
      },
      {
       "cell_type": "markdown",
       "metadata": {},
       "source": [
        "## If the coverage check failed\n",
        "\n",
        "Read the per-field numbers it printed; they say which part of the vocabulary your data missed.\n",
        "\n",
        "| What missed | What it means | What to do |\n",
        "|---|---|---|\n",
        "| `state` | the field is not a US state abbreviation | If you have a region column that is one, name it in the deployment's **State column**. Otherwise this field tokenises to `STATE_XX` for every row \u2014 one token, no information. |\n",
        "| `mcc` | your category codes are not in the corpus's fixed MCC list | Map your scheme onto ISO 18245 MCCs in a cell of your own, write the result to `/workspace/derived`, and read that. Or accept `MCC_-1` and pretrain in 03. |\n",
