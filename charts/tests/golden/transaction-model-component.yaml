    app.kubernetes.io/name: transaction-model-notebook
    app.kubernetes.io/instance: tfm
---
# Source: transaction-model-notebook/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-model-notebook
  labels:
    helm.sh/chart: transaction-model-notebook-0.1.3
    app.kubernetes.io/name: transaction-model-notebook
    app.kubernetes.io/instance: tfm
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: notebook
spec:
  # One. A second replica would want a second card, and the workspace volume is
  # ReadWriteOnce.
  replicas: 1
  strategy:
    # The card is held by the running pod until it exits, so a rolling update
    # would leave the new pod Pending on a GPU quota of one for ever.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: transaction-model-notebook
      app.kubernetes.io/instance: tfm
  template:
    metadata:
      annotations:
        # The loader and the notebooks are mounted, not baked, so a change to
        # either has to roll the pod for anything to notice.
        checksum/workspace: 7bc45b0d16d1fd238cf53bbb1780b778ba12b3a283d2644513b6e3b01534315e
      labels:
        app.kubernetes.io/name: transaction-model-notebook
        app.kubernetes.io/instance: tfm
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      runtimeClassName: nvidia
      containers:
        # ---------------------------------------------------------------------
        # The workbench, and the only container in this pod.
        # ---------------------------------------------------------------------
        - name: notebook
          image: ghcr.io/super-protocol/confidential-transaction-model/transaction-workbench@sha256:5e27d69e16319e352d88cded7fe0b93420acfe3d0fb99ba602ae42803d4ffdeb
          imagePullPolicy: IfNotPresent
          # The image's own entrypoint puts the conda environment on PATH; its
          # command is the part being replaced, and it is replaced because the
          # RAPIDS base image's command starts JupyterLab with
          # `--NotebookApp.token=''`.
          command: [/home/rapids/entrypoint.sh]
          args: [bash, /opt/tfm-chart/bootstrap.sh]
          env:
            # jupyter_server reads this by itself and demands it on the login
            # form. By reference, never as an argument.
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: transaction-model-notebook
                  key: token
            # Read by the NVIDIA container runtime before the container starts,
            # not by anything inside it. See `gpu.requireCuda` in values.yaml:
            # the image's inherited condition is stricter than this estate's
            # driver, and the runtime refuses the container rather than letting
            # it start and fail.
            - name: NVIDIA_REQUIRE_CUDA
              value: "cuda>=13.0"
            - name: TFM_BINDING_FILE
              value: /etc/tfm/binding.json
            # The notebooks' own working directories, on the volume.
            - name: TFM_DATA_DIR
              value: /workspace/data
            - name: TFM_DERIVED_DIR
              value: /workspace/derived
            # Which table inside the bound dataset holds the transactions, and
            # how many of its rows one frame may hold.
            - name: TFM_TABLE
              value: "transactions"
            - name: TFM_MAX_ROWS
              value: "25000000"
            # Which of the tenant's columns is which. Not secret, and the same
            # for every deployment that reads the same schema.
            - name: TFM_COL_AMOUNT
              value: "Amount"
            - name: TFM_COL_CARD
              value: "Card"
            - name: TFM_COL_CITY
              value: "Merchant City"
            - name: TFM_COL_ENTRYMODE
              value: "Use Chip"
            - name: TFM_COL_LABEL
              value: "Is Fraud?"
            - name: TFM_COL_MCC
              value: "MCC"
            - name: TFM_COL_MERCHANT
              value: "Merchant Name"
            - name: TFM_COL_STATE
              value: "Merchant State"
            - name: TFM_COL_TIMESTAMP
              value: "Year,Month,Day,Time"
            - name: TFM_COL_USER
              value: "User"
            - name: TFM_COL_ZIP
              value: "Zip"
            # How much of the data has to tokenise into something the shipped
            # checkpoint's vocabulary actually contains before the notebooks
            # will extract embeddings from it.
            - name: TFM_MIN_COVERAGE
              value: "0.5"
            # /opt/tfm-chart FIRST, deliberately. `tfm_workspace` is the
            # chart's and is imported from there, so a fix to it reaches an
            # existing deployment when the pod rolls; then the image's own
            # roots, so `src.tokenizer` resolves; /workspace/notebooks last so a
            # tenant's own modules beside their notebooks still import. Reverse
            # the order and a copy of the loader left on the volume shadows the
            # chart's for the life of the deployment.
            - name: PYTHONPATH
              value: /opt/tfm-chart:/opt/tfm:/opt/tfm/src:/workspace/notebooks
            # Telemetry off, and no model downloads: a deployment working on a
            # bank's transaction history should not be reporting anything about
            # itself, and the checkpoint it needs is already in the image.
            - name: DO_NOT_TRACK
              value: "1"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: JUPYTER_PLATFORM_DIRS
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          # `/login` — the one route jupyter_server serves without a credential,
          # which is what makes it usable as a probe at all. `/api/status` looks
          # like the obvious choice and is not: jupyter_server answers it 403 to
          # an unauthenticated caller, so a probe on it marks the pod unready for
          # ever while the server behind it is serving perfectly (measured on the
          # single-cell chart's image, 2026-11-22).
          #
          # The startup probe has room for the first pull and the seeding, not
          # for an environment install: this image carries the environment, so
          # the server is up in seconds once the image is on the node. The
          # generous failureThreshold is for the pull — 9 GB of compressed layers
          # the first time a node sees them.
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: chart
              mountPath: /opt/tfm-chart
              readOnly: true
            - name: notebooks
              mountPath: /opt/tfm-notebooks
              readOnly: true
            - name: binding
              mountPath: /etc/tfm
              readOnly: true
            - name: shm
              mountPath: /dev/shm
          resources:
            # requests and limits are one map: a tenant cluster space sets
            # `maxLimitRequestRatio: 1`, so a pod whose request differs from its
            # limit is refused at admission and never exists.
            requests:
              cpu: "8"
              memory: "56Gi"
              # Named in request AND limit, and named even when it is zero. A
              # cluster space raised with a GPU carries a ResourceQuota on
              # `nvidia.com/gpu`, and a container that leaves it unsaid takes the
              # namespace default — which is how SUP-890 spent three GPU
              # deployments on one pod stuck at 0/1 for an hour.
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "56Gi"
              nvidia.com/gpu: "1"
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: transaction-model-notebook-workspace
        - name: chart
          configMap:
            name: transaction-model-notebook
            defaultMode: 0555
        - name: notebooks
          configMap:
            name: transaction-model-notebook-notebooks
        - name: binding
          secret:
            secretName: transaction-model-notebook
            items:
              - key: binding.json
                path: binding.json
            # The slot may be empty — a deployment with no dataset bound reads
            # what the tenant uploads instead — and a Secret key that is not
            # there must not stop the pod from starting.
            optional: true
        # torch's DataLoader talks to its workers over /dev/shm and the 64Mi
        # default is not enough; upstream's own `docker run` line asks for 8g.
        # Memory-backed, so this counts against the container's memory limit —
        # `resources.memory` includes it.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi