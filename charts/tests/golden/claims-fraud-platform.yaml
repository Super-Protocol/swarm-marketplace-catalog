apiVersion: v1
kind: ConfigMap
metadata:
  name: cr-control-center-signin
data:
  sign_in.html: |
    {{define "sign_in.html"}}
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sign in — Control Center</title>
        <style>
          :root { color-scheme: light dark; }
          body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7; color: #16181d;
          }
          .card {
            width: 22rem; padding: 2rem; border-radius: 12px; background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
          }
          h1 { margin: 0 0 .25rem; font-size: 1.15rem; }
          p.sub { margin: 0 0 1.5rem; color: #5c6270; font-size: .875rem; }
          label { display: block; margin-bottom: .35rem; font-size: .8125rem; color: #5c6270; }
          input {
            width: 100%; box-sizing: border-box; padding: .6rem .7rem; margin-bottom: 1rem;
            border: 1px solid #d3d6dd; border-radius: 8px; font-size: .9375rem; background: #fff; color: inherit;
          }
          input:focus { outline: 2px solid #007d85; outline-offset: -1px; border-color: #007d85; }
          button {
            width: 100%; padding: .65rem; border: 0; border-radius: 8px; cursor: pointer;
            background: #007d85; color: #fff; font-size: .9375rem; font-weight: 500;
          }
          button:hover { background: #00676e; }
          .message { margin: 0 0 1rem; padding: .6rem .7rem; border-radius: 8px; background: #fdecea; color: #8f1d14; font-size: .875rem; }
          @media (prefers-color-scheme: dark) {
            body { background: #14161a; color: #e8eaed; }
            .card { background: #1d2025; box-shadow: none; border: 1px solid #2c3037; }
            p.sub, label { color: #9aa0aa; }
            input { background: #14161a; border-color: #343943; }
            .message { background: #3a1d1a; color: #f3b7b0; }
          }
        </style>
      </head>
      <body>
        <div class="card">
          <h1>Control Center</h1>
          <p class="sub">Confluent Platform, deployed from the marketplace.</p>
    
          {{ if .SignInMessage }}<p class="message">{{.SignInMessage}}</p>{{ end }}
    
          <form method="POST" action="{{.ProxyPrefix}}/sign_in">
            <input type="hidden" name="rd" value="{{.Redirect}}">
            <label for="username">User</label>
            <input type="text" name="username" id="username" autocomplete="username" autofocus>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" autocomplete="current-password">
            <button type="submit">Sign in</button>
          </form>
        </div>
      </body>
    </html>
    {{end}}
