# Source: confluent-platform/templates/provision.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cr-provision
data:
  provision.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    cat > /tmp/admin.properties <<EOF
    security.protocol=SASL_PLAINTEXT
    sasl.mechanism=PLAIN
    sasl.jaas.config=${ADMIN_JAAS}
    EOF

    BOOTSTRAP="cr-kafka:9092"

    echo "waiting for ${BOOTSTRAP}"
    until kafka-broker-api-versions --bootstrap-server "${BOOTSTRAP}" \
          --command-config /tmp/admin.properties >/dev/null 2>&1; do
      sleep 5
    done
    echo "broker is up"
    kafka-topics --bootstrap-server "${BOOTSTRAP}" --command-config /tmp/admin.properties \
      --create --if-not-exists --topic "claims" \
      --partitions 1 --replication-factor 1
    kafka-topics --bootstrap-server "${BOOTSTRAP}" --command-config /tmp/admin.properties \
      --create --if-not-exists --topic "clinical.events" \
      --partitions 1 --replication-factor 1
    kafka-acls --bootstrap-server "${BOOTSTRAP}" --command-config /tmp/admin.properties --add \
      --allow-principal User:payer --operation Write --operation Describe --topic "claims"
    kafka-acls --bootstrap-server "${BOOTSTRAP}" --command-config /tmp/admin.properties --add \
      --allow-principal User:hospital --operation Write --operation Describe --topic "clinical.events"
    kafka-acls --bootstrap-server "${BOOTSTRAP}" --command-config /tmp/admin.properties --add \
      --allow-principal User:analyst --operation Read --operation Describe --topic "fraud.alerts"
    kafka-acls --bootstrap-server "${BOOTSTRAP}" --command-config /tmp/admin.properties --add \
      --allow-principal User:analyst --operation Read --group "fraud-analyst"

    echo "topics and grants are in place"
