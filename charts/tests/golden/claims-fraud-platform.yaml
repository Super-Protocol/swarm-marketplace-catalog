# Source: confluent-platform/templates/ksqldb.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: cr-ksqldb-statements
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: submit
          image: "confluentinc/cp-ksqldb-server:8.3.1"
          command:
            - /bin/bash
            - -c
            - |
              until (echo > /dev/tcp/cr-ksqldb/8088) 2>/dev/null; do
                echo "waiting for ksqlDB"; sleep 5
              done
              ksql --file /statements/statements.sql http://cr-ksqldb:8088

              echo "checking what the engine actually has"
              streams=$(ksql --execute "SHOW STREAMS;" http://cr-ksqldb:8088 2>/dev/null)
              missing=0
              if ! echo "$streams" | grep -q "FRAUD_ALERTS"; then
                echo "MISSING: FRAUD_ALERTS was not created"
                missing=1
              fi
              if [ "$missing" -ne 0 ]; then
                echo "$streams"
                exit 1
              fi
              echo "the pipeline is in place"
          volumeMounts:
            - name: statements
              mountPath: /statements
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              nvidia.com/gpu: "0"
            limits:
              cpu: 100m
              memory: 512Mi
              nvidia.com/gpu: "0"
      volumes:
        - name: statements
          configMap:
            name: cr-ksqldb-statements
