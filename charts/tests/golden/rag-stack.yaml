  console-session-key: "SESSION-SIGNING-KEY-FOR-THE-GOLDEN-0123"
  inference-api-key: "INFERENCE-KEY-FOR-THE-GOLDEN"
  embeddings-api-key: "INFERENCE-KEY-FOR-THE-GOLDEN"
  reranker-api-key: "INFERENCE-KEY-FOR-THE-GOLDEN"
  vector-store-password: "VECTOR-STORE-PASSWORD-FOR-THE-GOLDEN"
  # The resolved `corpus` slot. For a gated dataset this carries no credential at all — a local
  # address, a database name and the literal user `gateway`, which the gate replaces with the
  # publisher's own before it forwards. For an ungated one it carries the owner's read-only
  # credentials, which is the other reason it is here.
