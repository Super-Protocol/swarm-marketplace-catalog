# Source: confidential-rag/templates/server.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-rag-server
  labels:
    app.kubernetes.io/name: confidential-rag
    app.kubernetes.io/instance: rag
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: server
spec:
  replicas: 1
  # The object store is a directory on a ReadWriteOnce volume held open by the running pod, so a
  # second pod cannot come up beside the first and a rolling update would leave the new one
  # Pending for ever while the old one serves.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-rag
      app.kubernetes.io/instance: rag
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: confidential-rag
        app.kubernetes.io/instance: rag
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: "ghcr.io/super-protocol/confidential-rag/rag-server@sha256:c68adc9c963a623256e4fe1db6be35ae6ac15fe95589504ff5b7b663ad2e06f9"
          imagePullPolicy: IfNotPresent
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8081"
            - --workers
            - "2"
          envFrom:
            - configMapRef:
                name: confidential-rag-config
          env:
            # Every credential by reference. An env *value* is rendered into the manifests and
            # published in the evidence snapshot; a `secretKeyRef` is a pointer to something the
            # platform sealed.
            - name: APP_LLM_APIKEY
              valueFrom:
                secretKeyRef: { name: confidential-rag-secrets, key: inference-api-key }
            - name: APP_EMBEDDINGS_APIKEY
              valueFrom:
                secretKeyRef: { name: confidential-rag-secrets, key: embeddings-api-key }
            - name: APP_RANKING_APIKEY
              valueFrom:
                secretKeyRef: { name: confidential-rag-secrets, key: reranker-api-key }
            - name: APP_VECTORSTORE_PASSWORD
              valueFrom:
                secretKeyRef: { name: confidential-rag-secrets, key: vector-store-password }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          # `/v1/health` without `check_dependencies` answers from the process alone, which is
          # the right question for a probe: the pipeline's four endpoints come up in their own
          # time and a readiness gate on all of them would hold this pod down for the slowest.
          # The console's status panel is where the dependencies are reported.
          startupProbe:
            httpGet: { path: /v1/health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          # A question in flight holds a worker until the model answers, so these tolerate
          # queueing: restarting a pipeline mid-answer makes the queue worse and loses the
          # answer. Same reasoning as the embedder's probes, which killed it mid-index.
          readinessProbe:
            httpGet: { path: /v1/health, port: http }
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 4
          livenessProbe:
            httpGet: { path: /v1/health, port: http }
            periodSeconds: 30
            timeoutSeconds: 20
            failureThreshold: 6
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "0"
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "0"
          volumeMounts:
            - name: objects
              mountPath: /data/objects
            # The text splitter and the HF cache write here, and the image's own /tmp-data is
            # not on a volume.
            - name: scratch
              mountPath: /tmp-data
      volumes:
        - name: objects
          persistentVolumeClaim:
            claimName: confidential-rag-objects
        - name: scratch
          emptyDir: {}
