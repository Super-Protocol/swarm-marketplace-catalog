apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-rag-cache
  labels:
    app.kubernetes.io/name: confidential-rag
    app.kubernetes.io/instance: rag
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: cache
spec:
  replicas: 1
