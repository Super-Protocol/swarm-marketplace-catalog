    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-rag
      app.kubernetes.io/instance: rag
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: confidential-rag
        app.kubernetes.io/instance: rag
        app.kubernetes.io/component: cache
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: cache
          image: "docker.io/valkey/valkey@sha256:e706d1213aaba6896c162bb6a3a9e1894e1a435f28f8f856d14fab2e10aa098b"
          imagePullPolicy: IfNotPresent
          args:
            - --dir
            - /data
            - --protected-mode
            - "yes"
            # One hundred megabytes of status keys is already far more than this holds; past it,
            # the oldest go rather than the process growing until the kubelet kills it.
            - --maxmemory
            - 100mb
            - --maxmemory-policy
            - allkeys-lru
            # Status keys are rebuildable by asking for the summary again, so an fsync per write
            # buys nothing. A periodic snapshot keeps a restart from losing an in-flight one.
            - --appendonly
            - "no"
            - --save
            - 300 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 999
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          startupProbe:
            tcpSocket: { port: valkey }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket: { port: valkey }
            periodSeconds: 20
          livenessProbe:
            tcpSocket: { port: valkey }
            periodSeconds: 30
            failureThreshold: 4
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
              nvidia.com/gpu: "0"
            requests:
              cpu: 500m
              memory: 1Gi
              nvidia.com/gpu: "0"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: confidential-rag-cache
