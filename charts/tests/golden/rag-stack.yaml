# Source: confidential-rag/templates/console.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-rag-console
  labels:
    app.kubernetes.io/name: confidential-rag
    app.kubernetes.io/instance: rag
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: console
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-rag
      app.kubernetes.io/instance: rag
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: confidential-rag
        app.kubernetes.io/instance: rag
        app.kubernetes.io/component: console
    spec:
      containers:
        - name: console
          image: "ghcr.io/super-protocol/confidential-rag/rag-server@sha256:c68adc9c963a623256e4fe1db6be35ae6ac15fe95589504ff5b7b663ad2e06f9"
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args:
            - console:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            # One worker: the session is a signed assertion rather than a stored row, so more
            # would be free — and a console in front of one pipeline pod has nothing to gain.
            - --workers
            - "1"
          env:
            - name: PYTHONPATH
              value: /opt/console
            - name: CONSOLE_TITLE
              value: "Confidential RAG"
            - name: CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef: { name: confidential-rag-secrets, key: console-password }
            - name: CONSOLE_SESSION_KEY
              valueFrom:
                secretKeyRef: { name: confidential-rag-secrets, key: console-session-key }
            - name: CONSOLE_SESSION_TTL_SECONDS
              value: "43200"
            - name: RAG_SERVER_URL
              value: "http://confidential-rag-server:8081"
            - name: CORPUS_SYNC_URL
              value: "http://confidential-rag-corpus:8085"
            - name: COLLECTION_NAME
              value: "documents"
            - name: UI_DIR
              value: /opt/console
            # What the console tells a user about the deployment they are using. Plain
            # configuration, not a credential, and attested with everything else.
            - name: ABOUT_GENERATION_MODEL
              value: "llama-3.2-3b-instruct"
            - name: ABOUT_GENERATION_LICENCE
              value: "Llama 3.2 Community License Agreement"
            - name: ABOUT_EMBEDDING_MODEL
              value: "bge-large-en-v1.5"
            - name: ABOUT_EMBEDDING_LICENCE
              value: "MIT"
            - name: ABOUT_RERANKER_MODEL
              value: "bge-reranker-v2-m3"
            - name: ABOUT_RERANKER_LICENCE
              value: "Apache-2.0"
            - name: ABOUT_SOURCE_REPO
              value: "https://github.com/Super-Protocol/confidential-rag"
            # There is deliberately no ABOUT_EXPECTED_DIGEST here, and the reason is worth
            # keeping: this env value is rendered into the Deployment, the Deployment is in the
            # evidence snapshot, and the snapshot is what the digest is OVER. So a console
            # showing the digest it is expected to match changes that digest by displaying it —
            # measure, write the number in, and it is no longer the number. It cost a deploy
            # cycle to notice.
            #
            # The deployment's OWN digest is served at the evidence URL the console links, which
            # is outside the snapshot by construction, and the version's declared digest is on
            # the listing page.
            - name: LOG_LEVEL
              value: "INFO"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The one route outside the session, and it reports liveness and nothing about the
          # corpus — it is reachable from the public hostname by anybody who finds the name.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
              nvidia.com/gpu: "0"
            requests:
              cpu: 500m
              memory: 512Mi
              nvidia.com/gpu: "0"
          volumeMounts:
            - name: app
              mountPath: /opt/console
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: confidential-rag-app
