apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-rag-config
  labels:
    app.kubernetes.io/name: confidential-rag
    app.kubernetes.io/instance: rag
    app.kubernetes.io/managed-by: Helm
data:
  # --- the vector store ---
  APP_VECTORSTORE_NAME: milvus
  APP_VECTORSTORE_URL: "http://confidential-rag-vectors:19530"
  APP_VECTORSTORE_USERNAME: "root"
  APP_VECTORSTORE_INDEXTYPE: "HNSW"
  APP_VECTORSTORE_SEARCHTYPE: dense
  APP_VECTORSTORE_ENABLEGPUINDEX: "False"
  APP_VECTORSTORE_ENABLEGPUSEARCH: "False"
  APP_VECTORSTORE_EF: "100"
  COLLECTION_NAME: "documents"
  VECTOR_DB_TOPK: "12"
  APP_RETRIEVER_SCORETHRESHOLD: "0.25"
  APP_RETRIEVER_TOPK: "6"

  # --- generation, on the open-inference component ---
  APP_LLM_MODELENGINE: openai
  APP_LLM_MODELNAME: "llama-3.2-3b-instruct"
  APP_LLM_SERVERURL: "http://swarm-model-server:8000/v1"
  LLM_MAX_TOKENS: "1024"
  LLM_TEMPERATURE: "0"
  LLM_TOP_P: "1"
  # Nemotron's reasoning budget, written through `chat_template_kwargs` an open checkpoint does
  # not read. Off, so no deployment of this listing sends it.
  LLM_ENABLE_THINKING: "false"

  # The three auxiliary LLM clients are built at start-up whether or not the features that use
  # them are switched on — `NvidiaRAG.__init__` constructs the query rewriter's and the filter
  # generator's unconditionally — so each one needs an endpoint or the process raises before it
  # serves anything. It is the same endpoint: one engine, one card.
  #
  # Found by deploying, which is the only way it shows up: every one of these is absent from
  # the compose file's "disabled" path, and the failure is a RuntimeError in the constructor,
  # not a degraded feature.
  APP_QUERYREWRITER_MODELNAME: "llama-3.2-3b-instruct"
  APP_QUERYREWRITER_SERVERURL: "http://swarm-model-server:8000/v1"
  APP_FILTEREXPRESSIONGENERATOR_MODELNAME: "llama-3.2-3b-instruct"
  APP_FILTEREXPRESSIONGENERATOR_SERVERURL: "http://swarm-model-server:8000/v1"
  SUMMARY_LLM: "llama-3.2-3b-instruct"
  SUMMARY_LLM_SERVERURL: "http://swarm-model-server:8000/v1"

  # --- embedding, on an open checkpoint ---
  APP_EMBEDDINGS_MODELENGINE: openai
  APP_EMBEDDINGS_MODELNAME: "bge-large-en-v1.5"
  APP_EMBEDDINGS_SERVERURL: "http://confidential-rag-embeddings/v1"
  APP_EMBEDDINGS_DIMENSIONS: "1024"

  # --- reranking, on an open cross-encoder ---
  ENABLE_RERANKER: "True"
  APP_RANKING_MODELENGINE: tei
  APP_RANKING_MODELNAME: "bge-reranker-v2-m3"
  APP_RANKING_SERVERURL: "http://confidential-rag-reranker"
  RERANKER_SCORE_THRESHOLD: "0"
  ENABLE_VLM_RERANKER_IMAGE_INPUT: "False"

  # --- what this deployment does not run ---
  ENABLE_QUERYREWRITER: "False"
  ENABLE_FILTER_GENERATOR: "False"
  ENABLE_REFLECTION: "False"
  ENABLE_QUERY_DECOMPOSITION: "False"
  ENABLE_AGENTIC_RAG: "False"
  ENABLE_VLM_INFERENCE: "False"
  ENABLE_GUARDRAILS: "False"
  ENABLE_CITATIONS: "True"

  # --- the object store, which is a directory ---
  # `filesystem`, so this listing does not stand up an S3-compatible store to hold the little a
  # text corpus puts here.
  OBJECTSTORE_BACKEND: filesystem
  OBJECTSTORE_LOCAL_PATH: /data/objects

  # --- the summary-status store ---
  REDIS_HOST: "confidential-rag-cache"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  LOGLEVEL: "INFO"
  LOG_LEVEL: "INFO"
---
