apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-clinical-doc
  labels:
    app.kubernetes.io/name: confidential-clinical-doc
    app.kubernetes.io/instance: ccd
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: scribe
spec:
  replicas: 1
  # The volume is held open by the running pod, so a rolling update would leave the replacement
  # Pending on it for ever while the old pod serves.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-clinical-doc
      app.kubernetes.io/instance: ccd
      app.kubernetes.io/component: scribe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: confidential-clinical-doc
        app.kubernetes.io/instance: ccd
        app.kubernetes.io/component: scribe
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        # The volume arrives owned by root on this cloud's storage class, and every container
        # here runs as 1000. `fsGroup` handles the group, but a directory the application
        # expects to create on its first write is a directory it fails to create; making them
        # here is cheaper than discovering it at the first upload.
        - name: prepare
          image: "ghcr.io/super-protocol/confidential-clinical-documentation/scribe-server@sha256:5550822b1b69cf9fa48906147f69042101566defc709f2d82931f8a68699c309"
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - mkdir -p /data/uploads /data/state/transcripts /data/state/notes
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests: { cpu: 100m, memory: 128Mi, nvidia.com/gpu: "0" }
            limits: { cpu: 100m, memory: 128Mi, nvidia.com/gpu: "0" }
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        # -------------------------------------------------------------------
        - name: scribe
          image: "ghcr.io/super-protocol/confidential-clinical-documentation/scribe-server@sha256:5550822b1b69cf9fa48906147f69042101566defc709f2d82931f8a68699c309"
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args:
            - ambient_scribe.main:app
            - --host
            - "127.0.0.1"
            - --port
            - "8000"
            # One worker. Recognition and diarization are threaded across the whole CPU
            # allocation, so a second worker would make two transcriptions slower rather than
            # one faster — and the persisted stores are loaded into each worker's memory at
            # import, so two workers would disagree about which notes exist.
            - --workers
            - "1"
            - --timeout-keep-alive
            - "75"
          env:
            - name: API_TITLE
              value: "Confidential Clinical Documentation"
            # The generation endpoint. By reference for the key: an env *value* is rendered into
            # this Deployment and published in the evidence snapshot, a `secretKeyRef` is a
            # pointer to something the platform sealed.
            - name: OPENAI_BASE_URL
              value: "http://swarm-model-server:8000/v1"
            - name: LLM_MODEL
              value: "qwen3-coder-30b-a3b-instruct-fp8"
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: confidential-clinical-doc-secrets, key: inference-api-key }
            - name: LLM_TIMEOUT_SECONDS
              value: "600"
            - name: LLM_LICENCE
              value: "Apache-2.0"
            # Recognition. A directory and never a model name: a name would make the first
            # transcription of a fresh deployment reach huggingface.co, and this deployment
            # reaches nothing. The weights are inside the image digest above.
            - name: ASR_MODEL_DIR
              value: "/models/asr"
            - name: ASR_COMPUTE_TYPE
              value: "int8"
            - name: ASR_THREADS
              value: "5"
            - name: ASR_BEAM_SIZE
              value: "1"
            - name: ASR_LANGUAGE
              value: "en"
            # Diarization, and the floors that decide whether its answer is shown. Upstream has
            # no floors and attributes unconditionally; a transcript with no speaker separation
            # still produces a fluent, well-structured note that puts the patient's symptoms in
            # the clinician's mouth.
            - name: ENABLE_SPEAKER_DIARIZATION
              value: "true"
            - name: DIARIZATION_SEGMENTATION_MODEL
              value: "/models/diarization/segmentation.onnx"
            - name: DIARIZATION_EMBEDDING_MODEL
              value: "/models/diarization/embedding.onnx"
            - name: DIARIZATION_THRESHOLD
              value: "0.5"
            - name: DIARIZATION_FLOOR_ASSIGNED_WORD_FRACTION
              value: "0.9"
            - name: DIARIZATION_FLOOR_SEGMENT_PURITY
              value: "0.85"
            - name: DIARIZATION_FLOOR_SPEECH_COVERAGE
              value: "0.3"
            - name: ENABLE_STREAMING
              value: "true"
            - name: UPLOAD_DIR
              value: /data/uploads
            - name: STATE_DIR
              value: /data/state
            # `int64` before `quote`, and it is not cosmetic. Helm parses a large number out of
            # values.yaml as a float64 and `quote` then renders it in SCIENTIFIC NOTATION —
            # `"5.24288e+08"` — which pydantic refuses as an integer and the container dies on
            # import with a validation error. The pod then never becomes ready, and on a cluster
            # space there is no pod-level visibility to read the reason out of. Found in kind
            # after fifty minutes of `ready: 0` on a real cloud; the same trap bit SUP-890.
            - name: MAX_FILE_SIZE
              value: "524288000"
            # How long a recording is kept for playback. The transcript's text and timecodes are
            # unaffected; what ages out is the audio, which is the protected health information.
            - name: AUDIO_RETENTION_HOURS
              value: "24"
            - name: RETENTION_SWEEP_SECONDS
              value: "900"
            # Empty. The UI is served by this same process, so nothing legitimate is
            # cross-origin — and the console in front of this API carries a session cookie, so a
            # wildcard here would be a cross-site request away from somebody else's page
            # reading a consultation.
            - name: CORS_ALLOW_ORIGINS
              value: ""
            - name: SYSTEM_PROMPT
              value: "You are documenting a clinical consultation from its transcript. Write only what the transcript supports. Where the transcript does not say something, say that it does not. This note is a draft for a clinician to read, correct and sign."
            # Every HTTP client in this container goes through the guard, which admits nothing.
            # NO_PROXY is what keeps the generation call inside the cluster space: routed
            # through the guard it would be refused like everything else.
            - name: HTTPS_PROXY
              value: "http://127.0.0.1:3128"
            - name: HTTP_PROXY
              value: "http://127.0.0.1:3128"
            - name: NO_PROXY
              value: "localhost,127.0.0.1,::1,.svc,.svc.cluster.local,.cluster.local,swarm-model-server"
            # Pinned to the cores this container is granted, not to the host's. The chart
            # convention from SUP-882: a library that sizes its pool from `nproc` starts a
            # thread per host core inside the quota and spends the request being throttled.
            # CTranslate2 and onnxruntime both do exactly that.
            - name: OMP_NUM_THREADS
              value: "5"
            - name: MKL_NUM_THREADS
              value: "5"
            - name: NUMEXPR_MAX_THREADS
              value: "5"
            - name: TOKENIZERS_PARALLELISM
              value: "false"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          # No `ports:` and no Service. The scribe listens on loopback, so there is nothing to
          # declare and nothing for another pod to reach.
          #
          # The probes are `exec` for the same reason: a kubelet httpGet probe connects to the
          # POD's address, which this process does not listen on, so an httpGet probe would fail
          # every time while the scribe answered the console perfectly. And they call python
          # rather than curl — there is no curl in this image, and a probe naming a binary the
          # image does not carry fails identically to a dead process.
          startupProbe:
            exec:
              command: [python3, -c, "import os,urllib.request;[os.environ.pop(k,None) for k in ('HTTP_PROXY','HTTPS_PROXY','http_proxy','https_proxy')];urllib.request.urlopen('http://127.0.0.1:8000/api/health/',timeout=10)"]
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [python3, -c, "import os,urllib.request;[os.environ.pop(k,None) for k in ('HTTP_PROXY','HTTPS_PROXY','http_proxy','https_proxy')];urllib.request.urlopen('http://127.0.0.1:8000/api/health/',timeout=15)"]
            periodSeconds: 20
            timeoutSeconds: 20
            failureThreshold: 4
          # Slack on the timeouts, deliberately: this endpoint is served by the same event loop
          # that is relaying a transcription, and a busy process answering slowly is not a dead
          # one. The RAG port lost a deploy cycle to exactly this (SUP-840). It also does NOT
          # call the model — a health check that does turns an engine still loading its weights
          # into a restarted pod.
          livenessProbe:
            exec:
              command: [python3, -c, "import os,urllib.request;[os.environ.pop(k,None) for k in ('HTTP_PROXY','HTTPS_PROXY','http_proxy','https_proxy')];urllib.request.urlopen('http://127.0.0.1:8000/api/health/',timeout=25)"]
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 6
          resources:
            limits:
              cpu: "6"
              memory: 12Gi
              nvidia.com/gpu: "0"
            requests:
              cpu: "6"
              memory: 12Gi
              nvidia.com/gpu: "0"
          volumeMounts:
            - name: data
              mountPath: /data
        # -------------------------------------------------------------------
        - name: console
          image: "ghcr.io/super-protocol/confidential-clinical-documentation/scribe-server@sha256:5550822b1b69cf9fa48906147f69042101566defc709f2d82931f8a68699c309"
          imagePullPolicy: IfNotPresent
          command: [uvicorn]
          args:
            - console:app
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            # One worker: the session is a signed assertion rather than a stored row, so more
            # would be free — but every request is a relay to one loopback process and a second
            # worker adds nothing but a way to race the corpus import.
            - --workers
            - "1"
            # An upload is a POST with a half-gigabyte body, and the default keep-alive timeout
            # is what cuts it off on a slow link.
            - --timeout-keep-alive
            - "75"
          env:
            - name: PYTHONPATH
              value: /opt/app
            - name: CONSOLE_TITLE
              value: "Confidential Clinical Documentation"
            - name: CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef: { name: confidential-clinical-doc-secrets, key: console-password }
            - name: CONSOLE_SESSION_KEY
              valueFrom:
                secretKeyRef: { name: confidential-clinical-doc-secrets, key: console-session-key }
            - name: CONSOLE_SESSION_TTL_SECONDS
              value: "43200"
            - name: SCRIBE_API_URL
              value: "http://127.0.0.1:8000"
            - name: PROXY_READ_TIMEOUT_SECONDS
              value: "3600"
            - name: EGRESS_GUARD_URL
              value: "http://127.0.0.1:3128"
            - name: EGRESS_ALLOW_HOST
              value: ""
            # The resolved transcript corpus binding. By reference, and in a Secret: for an
            # ungated dataset it carries the owner's own credentials, and it is the one value
            # that differs between two deployments of this version — both of which are reasons
            # for it to be in the one place the platform lifts out before the snapshot is taken.
            - name: CORPUS_BINDING_JSON
              valueFrom:
                secretKeyRef: { name: confidential-clinical-doc-secrets, key: corpus-binding }
            - name: CORPUS_TABLE
              value: "transcripts"
            - name: CORPUS_ID_COLUMN
              value: "transcript_id"
            - name: CORPUS_SPEAKER_COLUMN
              value: "speaker"
            - name: CORPUS_START_COLUMN
              value: "start_seconds"
            - name: CORPUS_END_COLUMN
              value: "end_seconds"
            - name: CORPUS_TEXT_COLUMN
              value: "text"
            - name: CORPUS_RECORDED_AT_COLUMN
              value: "recorded_at"
            # What the console tells a clinician about the deployment they are using. Plain
            # configuration, not a credential, and attested with everything else — so the panel
            # and the signed evidence describe the same deployment.
            - name: ABOUT_GENERATION_MODEL
              value: "qwen3-coder-30b-a3b-instruct-fp8"
            - name: ABOUT_GENERATION_LICENCE
              value: "Apache-2.0"
            - name: ABOUT_ASR_MODEL
              value: "Distil-Whisper large-v3 (faster-whisper, int8, CPU)"
            - name: ABOUT_ASR_LICENCE
              value: "MIT"
            - name: ABOUT_DIARIZATION_MODELS
              value: "sherpa-onnx with pyannote segmentation 3.0 and NVIDIA NeMo TitaNet-Large, on the CPU"
            - name: ABOUT_DIARIZATION_LICENCES
              value: "Apache-2.0 (sherpa-onnx), MIT (segmentation), CC-BY-4.0 (TitaNet-Large)"
            - name: DIARIZATION_FLOOR_ASSIGNED_WORD_FRACTION
              value: "0.9"
            - name: DIARIZATION_FLOOR_SEGMENT_PURITY
              value: "0.85"
            - name: DIARIZATION_FLOOR_SPEECH_COVERAGE
              value: "0.3"
            - name: AUDIO_RETENTION_HOURS
              value: "24"
            - name: ABOUT_SOURCE_REPO
              value: "https://github.com/Super-Protocol/confidential-clinical-documentation"
            - name: ABOUT_UPSTREAM
              value: https://github.com/NVIDIA-AI-Blueprints/ambient-provider
            # There is deliberately no ABOUT_EXPECTED_DIGEST here. That env value would be
            # rendered into this Deployment, the Deployment is in the evidence snapshot, and the
            # snapshot is what the digest is OVER — so a console displaying the digest it should
            # match changes that digest by displaying it. It cost the RAG port a deploy cycle to
            # notice. The deployment's own digest is at the evidence URL the listing links.
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The one route outside the session, and it reports liveness and nothing about any
          # consultation — it is reachable from the public hostname by anybody who finds the name.
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
              nvidia.com/gpu: "0"
            requests:
              cpu: 500m
              memory: 512Mi
              nvidia.com/gpu: "0"
          volumeMounts:
            - name: app
              mountPath: /opt/app
              readOnly: true
        # -------------------------------------------------------------------
        - name: egress
          image: "ghcr.io/super-protocol/confidential-clinical-documentation/scribe-server@sha256:5550822b1b69cf9fa48906147f69042101566defc709f2d82931f8a68699c309"
          imagePullPolicy: IfNotPresent
          command: [python3, /opt/app/egress_guard.py]
          env:
            - name: EGRESS_LISTEN_ADDRESS
              value: "127.0.0.1"
            - name: EGRESS_LISTEN_PORT
              value: "3128"
            # Empty, and `ccd.validate` refuses a value. This deployment reaches nothing.
            - name: EGRESS_ALLOW_HOST
              value: ""
            - name: EGRESS_ALLOW_PORT
              value: "443"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          # Loopback, so the probe is `exec` — and it asks the guard's own status route, which
          # is the one non-CONNECT request the guard answers.
          startupProbe:
            exec:
              command: [python3, -c, "import os,urllib.request;[os.environ.pop(k,None) for k in ('HTTP_PROXY','HTTPS_PROXY','http_proxy','https_proxy')];urllib.request.urlopen('http://127.0.0.1:3128/_guard/status',timeout=5)"]
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command: [python3, -c, "import os,urllib.request;[os.environ.pop(k,None) for k in ('HTTP_PROXY','HTTPS_PROXY','http_proxy','https_proxy')];urllib.request.urlopen('http://127.0.0.1:3128/_guard/status',timeout=5)"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
              nvidia.com/gpu: "0"
            requests:
              cpu: 250m
              memory: 256Mi
              nvidia.com/gpu: "0"
          volumeMounts:
            - name: app
              mountPath: /opt/app
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: confidential-clinical-doc-data
        - name: app
          configMap:
            name: confidential-clinical-doc-app
---
# Source: confidential-clinical-documentation/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: confidential-clinical-doc
  labels:
    app.kubernetes.io/name: confidential-clinical-doc
    app.kubernetes.io/instance: ccd
    app.kubernetes.io/managed-by: Helm
  annotations:
    # Declared on the object as well as in the listing's `evidence.exclude`. The annotation is
    # what the cloud reads when it digests the namespace; the definition's copy is what the
    # listing page shows. A digest displayed beside "no exclusions" answers the only question
    # that matters about it wrongly.
    swarm.io/exclude-evidence-fields: "/spec/rules/0/host"
    # A recording is uploaded through this hostname. Without the body size the default 1 MiB
    # limit refuses every real consultation with a 413 that comes from nginx rather than from the
    # deployment.
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    # Buffering off in both directions, and this is not a performance preference. Transcription
    # and note generation are server-sent-event streams: buffered, the browser sits blank for
    # minutes and then receives the whole transcript at once, which reads as a hung deployment.
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: "nginx"
  rules:
    - host: "scribe.conf-apps.superprotocol.dev"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: confidential-clinical-doc-console
                port:
                  number: 80