stringData:
  console-password: "ACCESS-PASSWORD-FOR-THE-GOLDEN"
  console-session-key: "SESSION-SIGNING-KEY-FOR-THE-GOLDEN-01234"
  # Authenticates this deployment to the generation endpoint beside it. That endpoint is on no
  # public address, but an unauthenticated inference endpoint is an unauthenticated inference
  # endpoint, and the client has to carry a key regardless.
  inference-api-key: "INFERENCE-KEY-FOR-THE-GOLDEN"
