metadata:
  name: analyst-keycloak-bootstrap-env
type: Opaque
stringData:
  # The realm administrator password, the OIDC client secret and the first administrator's
  # own details. `consumer.*` values land here and only here: the deploying person's address
  # has no business in a snapshot that is published, and an evidence exclusion would leave it
  # in the bundle anyway.
  KC_ADMIN_PASSWORD: "SECRET-AAAAAAAAAAAA"
  CLIENT_SECRET: "SECRET-AAAAAAAAAAAA"
  APP_URL: "https://alpha.conf-apps.superprotocol.dev"
  APP_HOST: "alpha.conf-apps.superprotocol.dev"
  ADMIN_USERNAME: "ann@alpha.example"
  ADMIN_EMAIL: "ann@alpha.example"
  ADMIN_FIRST_NAME: "Ann Alpha"
  ADMIN_LAST_NAME: ""
  ADMIN_PASSWORD: "SECRET-AAAAAAAAAAAA"
  # One `name|alias` per line, in order; the first is the administrator's own.
  ORGANIZATIONS: "Alpha Clinic|alpha"
