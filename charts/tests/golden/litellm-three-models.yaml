# Source: confidential-router-litellm/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-router-litellm
  labels:
    helm.sh/chart: confidential-router-litellm-0.2.0
    app.kubernetes.io/name: confidential-router-litellm
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "1.80.5"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-router-litellm
      app.kubernetes.io/instance: cr
  template:
    metadata:
      annotations:
        checksum/config: 242b4cbf815e918e2ab2ee9f6e781b6f1fc68fa8dbef8d581395b41e78e7fdaa
      labels:
        app.kubernetes.io/name: confidential-router-litellm
        app.kubernetes.io/instance: cr
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm@sha256:e9711f484c7c8462c028803130afef546aa54c8d2fc11120242c01bbadc12e65
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-litellm
                  key: master-key
          # `/health/liveliness` answers without touching a backend. `/health` does
          # call every model, which on a cold Ollama means loading weights on
          # every probe — not what a kubelet should be triggering.
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          resources:
            limits:
              cpu: 250m
              memory: 2Gi
              nvidia.com/gpu: "0"
            requests:
              cpu: 250m
              memory: 2Gi
              nvidia.com/gpu: "0"
      volumes:
        - name: config
          configMap:
            name: confidential-router-litellm