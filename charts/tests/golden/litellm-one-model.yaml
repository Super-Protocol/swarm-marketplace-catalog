---
# Source: confidential-router-litellm/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-router-litellm
  labels:
    helm.sh/chart: confidential-router-litellm-0.1.0
    app.kubernetes.io/name: confidential-router-litellm
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "1.80.5"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
data:
  config.yaml: |
    model_list:
      - model_name: "llama3.2:3b"
        litellm_params:
          model: "ollama_chat/llama3.2:3b"
          api_base: "http://ollama:11434"
          keep_alive: "24h"

    litellm_settings:
      drop_params: true
      turn_off_message_logging: true
---
# Source: confidential-router-litellm/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: confidential-router-litellm
  labels:
    helm.sh/chart: confidential-router-litellm-0.1.0
    app.kubernetes.io/name: confidential-router-litellm
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "1.80.5"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: confidential-router-litellm
    app.kubernetes.io/instance: cr
---
# Source: confidential-router-litellm/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-router-litellm
  labels:
    helm.sh/chart: confidential-router-litellm-0.1.0
    app.kubernetes.io/name: confidential-router-litellm
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "1.80.5"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-router-litellm
      app.kubernetes.io/instance: cr
  template:
    metadata:
      annotations:
        checksum/config: 3c460b3bb99155e2c61db855b600e30716f431175f6d67d86fa0e5ef98f4f535
      labels:
        app.kubernetes.io/name: confidential-router-litellm
        app.kubernetes.io/instance: cr
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm@sha256:e9711f484c7c8462c028803130afef546aa54c8d2fc11120242c01bbadc12e65
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/litellm/config.yaml
            - --port
            - "4000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          # `/health/liveliness` answers without touching a backend. `/health` does
          # call every model, which on a cold Ollama means loading weights on
          # every probe — not what a kubelet should be triggering.
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          resources:
            limits:
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: confidential-router-litellm