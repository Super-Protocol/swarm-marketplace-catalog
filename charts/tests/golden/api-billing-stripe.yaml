# Source: confidential-router-api/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-router-api
  labels:
    helm.sh/chart: confidential-router-api-0.1.0
    app.kubernetes.io/name: confidential-router-api
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
data:
  router.yaml: |
    version: 1

    server:
      port: 3000
      host: 0.0.0.0
      publicBaseUrl: "https://api.confidential-router.example"
      # CORS, and Better Auth's trusted origins. The console calls this API from
      # the browser with `credentials: 'include'`, so its origin has to be here.
      validClientOrigins:
        - "https://console.confidential-router.example"

    database:
      type: postgres
      url: ${ROUTER_DATABASE_URL}
      # The init container owns the schema; replicas must not race each other.
      migrationsRun: false

    backends:
      litellm:
        baseUrl: "http://confidential-router-litellm:4000"
        connectTimeout: "60s"
        readTimeout: "300s"

    endpoints:
      - name: "confidential-router"
        hostname: "api.confidential-router.example"
        tee: "Intel TDX + H100 CC"

    models:
      - id: "meta/llama-3.2-3b-instruct:tee"
        name: "Llama 3.2 3B Instruct"
        litellmModel: "llama3.2:3b"
        endpoint: "confidential-router"
        contextLength: 131072
        capabilities: [chat, completions]
        pricing:
          promptPer1mMicros: 30000
          completionPer1mMicros: 50000
      - id: "microsoft/phi-4:tee"
        name: "Phi-4 14B"
        litellmModel: "phi4:14b"
        endpoint: "confidential-router"
        contextLength: 16384
        capabilities: [chat, completions]
        pricing:
          promptPer1mMicros: 90000
          completionPer1mMicros: 140000
      - id: "alibaba/qwen2.5-7b-instruct:tee"
        name: "Qwen2.5 7B Instruct"
        litellmModel: "qwen2.5:7b"
        endpoint: "confidential-router"
        contextLength: 32768
        capabilities: [chat, completions]
        pricing:
          promptPer1mMicros: 50000
          completionPer1mMicros: 80000

    evidence:
      pollInterval: "5m"
      freshnessWindow: "24h"

    rateLimits:
      requestsPerMinute: 600
      tokensPerMinute: 2000000

    auth:
      baseUrl: "https://api.confidential-router.example"
      secret: ${ROUTER_AUTH_SECRET}
      sessionMaxAge: "720h"
      magicLink:
        mailer: "resend"
        from: "no-reply@confidential-router.example"
        resendApiKey: ${ROUTER_RESEND_API_KEY}

    billing:
      minTopUpMicros: 5000000
      allowOverdraftMicros: 0
      checkoutReturnUrl: "https://console.confidential-router.example/credits"
      autoTopUpCooldown: "1h"
      # Present means Stripe; absent means the manual provider, which is refused
      # under NODE_ENV=production.
      stripe:
        secretKey: ${ROUTER_STRIPE_SECRET_KEY}
        webhookSecret: ${ROUTER_STRIPE_WEBHOOK_SECRET}
        currency: "usd"

    log:
      level: "info"
      pretty: false

    graphql:
      path: "/graphql"
      introspection: false

    gatekeeper:
      repo: "Super-Protocol/confidential-router"
      apiBaseUrl: "https://api.github.com"
      cacheTtl: "15m"
      requestTimeout: "5s"

    swagger:
      enabled: false
      path: "docs"
