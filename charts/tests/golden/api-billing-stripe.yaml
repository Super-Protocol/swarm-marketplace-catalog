# Source: confidential-router-api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-router-api
  labels:
    helm.sh/chart: confidential-router-api-0.1.0
    app.kubernetes.io/name: confidential-router-api
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-router-api
      app.kubernetes.io/instance: cr
  template:
    metadata:
      annotations:
        # A catalogue change is a config change, and the config is a file: without
        # this the ConfigMap is updated and the running pods keep the old models.
        checksum/config: f04872c9ec3f183ada61b15eae18b03388839fd7e373aa42c685a85643752fc1
      labels:
        app.kubernetes.io/name: confidential-router-api
        app.kubernetes.io/instance: cr
    spec:
      securityContext:
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      initContainers:
        # `migrate` is the image's entry point for `node /app/cli/run-migrations.js`
        # — Better Auth's four tables, then the service's ten. Idempotent, so a
        # restart prints "No pending migrations" and exits 0. It also fails until
        # PostgreSQL accepts connections, which is exactly the wait this pod needs
        # and is why there is no separate wait-for-database container.
        - name: migrate
          image: ghcr.io/super-protocol/confidential-router/router-api@sha256:e46f47c286d6b978e2a28b06c868f804bc72608597647c081874d3cc4d06ea45
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            - name: NODE_ENV
              value: "production"
            - name: CR_API_CONFIG_FILE
              value: /etc/confidential-router/router.yaml
            - name: ROUTER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: password
            - name: ROUTER_DATABASE_URL
              value: "postgres://router:$(ROUTER_DATABASE_PASSWORD)@confidential-router-postgresql:5432/router?sslmode=disable"
            - name: ROUTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: auth-secret
            - name: ROUTER_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: stripe-secret-key
            - name: ROUTER_STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: stripe-webhook-secret
            - name: ROUTER_RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: resend-api-key
          volumeMounts:
            - name: config
              mountPath: /etc/confidential-router
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      containers:
        - name: router-api
          image: ghcr.io/super-protocol/confidential-router/router-api@sha256:e46f47c286d6b978e2a28b06c868f804bc72608597647c081874d3cc4d06ea45
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: CR_API_CONFIG_FILE
              value: /etc/confidential-router/router.yaml
            - name: ROUTER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: password
            - name: ROUTER_DATABASE_URL
              value: "postgres://router:$(ROUTER_DATABASE_PASSWORD)@confidential-router-postgresql:5432/router?sslmode=disable"
            - name: ROUTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: auth-secret
            - name: ROUTER_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: stripe-secret-key
            - name: ROUTER_STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: stripe-webhook-secret
            - name: ROUTER_RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: resend-api-key
          # `/health` does a real database round trip, so an unready pod is one
          # that cannot serve rather than one that has merely started.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/confidential-router
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: confidential-router-api
        # The root filesystem is read-only; these two are the only paths the
        # process writes to. `data/` is the SQLite default, unused on PostgreSQL,
        # and still has to exist.
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
