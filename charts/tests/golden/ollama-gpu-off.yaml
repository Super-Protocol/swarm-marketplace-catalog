# Source: ollama/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cr-ollama
  namespace: confidential-router
  labels:
    helm.sh/chart: ollama-1.85.0
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.35.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  strategy: 
    type: Recreate
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
      app.kubernetes.io/instance: cr
  template:
    metadata:
      labels:
        helm.sh/chart: ollama-1.85.0
        app.kubernetes.io/name: ollama
        app.kubernetes.io/instance: cr
        app.kubernetes.io/version: "0.35.0"
        app.kubernetes.io/managed-by: Helm
    spec:
      serviceAccountName: cr-ollama
      terminationGracePeriodSeconds: 120
      securityContext:
        {}
      containers:
        - name: ollama
          securityContext:
            {}
          image: "ollama/ollama:0.35.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
          envFrom:
          args:
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 6
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    while ! /bin/ollama ps > /dev/null 2>&1; do
                      sleep 5
                    done

                    /bin/ollama pull  llama3.2:3b
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: cr-ollama
---
# Source: ollama/templates/tests/test-connection.yaml
apiVersion: v1
kind: Pod
metadata:
  name: "cr-ollama-test-connection"
  namespace: confidential-router
  labels:
    helm.sh/chart: ollama-1.85.0
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.35.0"
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['sh', '-ec']
      args:
        - >
          wget -qO- "http://cr-ollama:11434" >/dev/null
  restartPolicy: Never
