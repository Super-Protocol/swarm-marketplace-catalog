    app.kubernetes.io/component: model-server
spec:
  type: ClusterIP
  ports:
    - name: llama
      port: 8000
      targetPort: llama
      protocol: TCP
    - name: gemma
      port: 8001
      targetPort: gemma
      protocol: TCP
  selector:
    app.kubernetes.io/name: swarm-model-server
    app.kubernetes.io/instance: ms
---
# Source: swarm-model-server/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarm-model-server
  labels:
    helm.sh/chart: swarm-model-server-0.3.0
    app.kubernetes.io/name: swarm-model-server
    app.kubernetes.io/instance: ms
    app.kubernetes.io/version: "0.22.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: model-server
spec:
  # One. A second replica would want a second card, and the weights volume is
  # ReadWriteOnce.
  replicas: 1
  strategy:
    # The card is held by the running pod until it exits, so a rolling update
    # would leave the new pod Pending on a GPU quota of one for ever.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: swarm-model-server
      app.kubernetes.io/instance: ms
  template:
    metadata:
      annotations:
        checksum/weights: dc0b4ba612924fc5eb604d5b6243dae856ed764d0d721c89aa5d1a7e94f6ca02
      labels:
        app.kubernetes.io/name: swarm-model-server
        app.kubernetes.io/instance: ms
    spec:
      runtimeClassName: nvidia
      initContainers:
        # ---------------------------------------------------------------------
        # Downloads the weights and refuses to hand over anything the manifest
        # did not name, by sha256. Idempotent: a restarted pod with a populated
        # volume re-hashes and starts in a minute instead of downloading again.
        #
        # It runs the engine image rather than a Python base, because the script
        # is stdlib-only and a second image would be a second digest to keep
        # true and a second registry to trust.
        #
        # One per engine, in the order the values name them: init containers run
        # sequentially, so two models are fetched one after the other rather
        # than two streams competing for the same link, and each one prunes
        # inside its own directory.
        # ---------------------------------------------------------------------
        - name: fetch-weights-llama
          image: docker.io/vllm/vllm-openai@sha256:0fec7ec5f3e6bc168e54899935fb0557da908a4832a1dbc88e2debcf2f889416
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /opt/engines/fetch-weights.py
          env:
            - name: WEIGHTS_MANIFEST
              value: "/opt/engines/manifest-llama.json"
            - name: WEIGHTS_DIR
              value: "/models/llama"
            - name: WEIGHTS_REPO
              value: "unsloth/Llama-3.2-3B-Instruct"
            - name: HF_ENDPOINT
              value: "https://huggingface.co"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          volumeMounts:
            - name: weights
              mountPath: /models
            - name: engines
              mountPath: /opt/engines
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: "2Gi"
              # Explicit zero, not an omitted field. A GPU cluster space's
              # LimitRange defaults a missing `nvidia.com/gpu` to the reserved
              # count, so this container would ask for the card the engine needs
              # and the pod would never schedule.
              nvidia.com/gpu: "0"
            limits:
              cpu: "2"
              memory: "2Gi"
              nvidia.com/gpu: "0"
        - name: fetch-weights-gemma
          image: docker.io/vllm/vllm-openai@sha256:0fec7ec5f3e6bc168e54899935fb0557da908a4832a1dbc88e2debcf2f889416
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /opt/engines/fetch-weights.py
          env:
            - name: WEIGHTS_MANIFEST
              value: "/opt/engines/manifest-gemma.json"
            - name: WEIGHTS_DIR
              value: "/models/gemma"
            - name: WEIGHTS_REPO
              value: "unsloth/gemma-2-2b-it"
            - name: HF_ENDPOINT
              value: "https://huggingface.co"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          volumeMounts:
            - name: weights
              mountPath: /models
            - name: engines
              mountPath: /opt/engines
              readOnly: true
          resources:
            requests:
              cpu: "2"
              memory: "2Gi"
              # Explicit zero, not an omitted field. A GPU cluster space's
              # LimitRange defaults a missing `nvidia.com/gpu` to the reserved
              # count, so this container would ask for the card the engine needs
              # and the pod would never schedule.
              nvidia.com/gpu: "0"
            limits:
              cpu: "2"
              memory: "2Gi"
              nvidia.com/gpu: "0"
      containers:
        # ---------------------------------------------------------------------
        # The container that holds the card. One for however many engines are
        # served from it: Kubernetes allocates a GPU to a container rather than
        # to a pod, so a second container asking for the same `nvidia.com/gpu: 1`
        # stays Pending for ever and engines that share a device share a process
        # tree instead (SUP-332). `files/run-engines.py` is that process tree —
        # it starts what the attested engines.json names and nothing else.
        # ---------------------------------------------------------------------
        - name: vllm
          image: docker.io/vllm/vllm-openai@sha256:0fec7ec5f3e6bc168e54899935fb0557da908a4832a1dbc88e2debcf2f889416
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /opt/engines/run-engines.py
            - /opt/engines/engines.json
          env:
            # The key the engine demands on every `/v1` request, by reference.
            # The engine's equivalent command-line flag is deliberately unused:
            # arguments are rendered into the manifests and published in the
            # evidence snapshot in clear (marketplace trap 4).
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: swarm-model-server
                  key: api-key
            # The init container decided what this deployment may serve. Offline
            # mode is what stops the engine quietly fetching a file the manifest
            # never named when something is missing or renamed.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            # Caches, on the throwaway volume. The weights volume is the one
            # whose contents are verified and pruned, so nothing else lives
            # there; and the image's default cache paths are under a root home
            # this pod should not be writing to.
            - name: HOME
              value: /cache
            - name: HF_HOME
              value: /cache/huggingface
            - name: XDG_CACHE_HOME
              value: /cache/xdg
            # Each engine's compile and Triton caches are per-engine, set by the
            # supervisor from engines.json: two engines compiling into one
            # directory is a race whose loser recompiles on every restart.
            # Telemetry off: this endpoint serves prompts inside an enclave and
            # should not be reporting anything about itself to a third party.
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
          ports:
            - name: llama
              containerPort: 8000
              protocol: TCP
            - name: gemma
              containerPort: 8001
              protocol: TCP
          # `/health` is outside the engine's authentication middleware, which is
          # what makes it usable as a probe at all. It answers only once the
          # model is loaded, and loading 29 GiB of weights and compiling the
          # graphs takes minutes — hence a startup probe with room rather than a
          # liveness probe that would restart the pod halfway through.
          #
          # Ready means *every* engine is ready. One Service and one Ingress
          # front all of them, so a pod marked Ready while the second model is
          # still loading publishes a path that answers 502 for minutes — and an
          # HTTP probe can ask about one port only.
          startupProbe:
            exec:
              command: [python3, /opt/engines/engine-health.py, /opt/engines/engines.json]
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            exec:
              command: [python3, /opt/engines/engine-health.py, /opt/engines/engines.json]
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: [python3, /opt/engines/engine-health.py, /opt/engines/engines.json]
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: weights
              mountPath: /models
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: shm
              mountPath: /dev/shm
            - name: engines
              mountPath: /opt/engines
              readOnly: true
          resources:
            requests:
              cpu: "8"
              memory: "24Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "24Gi"
              nvidia.com/gpu: "1"
      volumes:
        - name: weights
          persistentVolumeClaim:
            claimName: swarm-model-server-weights
        - name: engines
          configMap:
            name: swarm-model-server-engines
        - name: cache
          emptyDir:
            sizeLimit: 16Gi
        # vLLM's workers talk over /dev/shm and the 64Mi default is not enough.
        # Memory-backed, so this counts against the container's memory limit —
        # `resources.memory` includes it.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
