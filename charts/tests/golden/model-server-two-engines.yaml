  run-engines.py: |
    #!/usr/bin/env python3
    """Run one vLLM server per engine inside the container that holds the card.
    
    Kubernetes allocates a GPU to a container, not to a pod: two containers cannot
    share one `nvidia.com/gpu: 1`, and the second one asking for it leaves the pod
    Pending for ever. So engines that share a card share a container, and this is
    what supervises them (SUP-332).
    
    It chooses nothing. Every engine's name, port, environment and full command line
    come from the `engines.json` the chart renders into the ConfigMap the cloud
    digests and signs, so a deployment serving two models is as attested as one
    serving one.
    
    Four behaviours, each of them a failure seen in a cluster rather than a
    preference:
    
      * **Any engine exiting takes the container down.** A pod that answers for one
        model and refuses connections for the other, with its restart count at zero,
        is the outage that reads as "the model is broken" for a week. The exit status
        is the engine's own, and a *clean* exit is still a failure here — an engine
        that has stopped serving has stopped serving.
      * **SIGTERM reaches every child, and is not a failure.** Without the first, a
        delete waits out the grace period and then SIGKILLs engines in the middle of
        a request; without the second, every ordinary rollout logs a crash.
      * **Every line of output says which engine wrote it.** Two vLLM servers
        interleaving unlabelled tracebacks is the log of a deployment nobody can
        debug.
      * **An engine that cannot be started is reported as that**, rather than as a
        traceback from the supervisor.
    
    stdlib only, like the fetcher beside it.
    """
    import json
    import os
    import signal
    import subprocess
    import sys
    import threading
    
    GRACE_SECONDS = 30
    
    _stdout = threading.Lock()
    
    
    def emit(line: str) -> None:
        with _stdout:
            sys.stdout.write(line.rstrip("\n") + "\n")
            sys.stdout.flush()
    
    
    def log(message: str) -> None:
        emit(f"[engines] {message}")
    
    
    def pump(name: str, stream) -> None:
        """Label every line an engine writes, so two logs stay two logs."""
        with stream:
            for line in stream:
                emit(f"[{name}] {line.rstrip()}")
    
    
    class Engine:
        def __init__(self, spec: dict) -> None:
            self.name = spec["name"]
            self.port = spec.get("port")
            self.command = [str(part) for part in spec["command"]]
            self.env = dict(os.environ)
            self.env.update({key: str(value) for key, value in (spec.get("env") or {}).items()})
            self.process = None
            self.status = None
    
        def start(self) -> None:
            # The caches are per-engine (two engines compiling into one directory is
            # a race whose loser recompiles on every restart), and the engine does
            # not create its own parent directories.
            for variable in ("VLLM_CACHE_ROOT", "TRITON_CACHE_DIR", "TORCHINDUCTOR_CACHE_DIR"):
                if self.env.get(variable):
                    os.makedirs(self.env[variable], exist_ok=True)
            log(f"starting {self.name} on :{self.port}: {' '.join(self.command)}")
            try:
                self.process = subprocess.Popen(
                    self.command, env=self.env, stdout=subprocess.PIPE,
                    stderr=subprocess.STDOUT, text=True, bufsize=1,
                )
            except OSError as err:
                log(f"{self.name} could not be started: {err}")
                return
            threading.Thread(target=pump, args=(self.name, self.process.stdout), daemon=True).start()
    
        def send(self, number: int) -> None:
            if self.process is not None and self.process.poll() is None:
                try:
                    self.process.send_signal(number)
                except OSError as err:
                    log(f"could not signal {self.name}: {err}")
    
        def reap(self, finished: list, exited: threading.Event) -> None:
            self.status = self.process.wait()
            # In exit order, not in values order: the engine this names is the one an
            # operator will go and read the logs of.
            finished.append(self)
            exited.set()
    
    
    def main() -> int:
        manifest = sys.argv[1] if len(sys.argv) > 1 else os.environ.get(
            "ENGINES_MANIFEST", "/opt/engines/engines.json")
        with open(manifest) as handle:
            engines = [Engine(spec) for spec in json.load(handle)["engines"]]
        if not engines:
            log(f"{manifest} names no engines")
            return 1
    
        finished: list[Engine] = []
        exited = threading.Event()
        signalled = threading.Event()
    
        def forward(number, _frame):
            if not signalled.is_set():
                signalled.set()
                log(f"{signal.Signals(number).name}, forwarding it to every engine")
                for engine in engines:
                    engine.send(number)
    
        signal.signal(signal.SIGTERM, forward)
        signal.signal(signal.SIGINT, forward)
    
        for engine in engines:
            engine.start()
            if engine.process is None:
                for started in engines:
                    started.send(signal.SIGTERM)
                return 1
        for engine in engines:
            threading.Thread(target=engine.reap, args=(finished, exited), daemon=True).start()
        log(f"{len(engines)} engine(s) on one card: "
            + ", ".join(f"{engine.name} on :{engine.port}" for engine in engines))
    
        # Woken by the first engine to exit — including the exit a forwarded SIGTERM
        # causes. The timeout is what keeps the main thread available to run a signal
        # handler promptly.
        while not exited.wait(timeout=1):
            pass
    
        first = finished[0]
        if signalled.is_set():
            log(f"{first.name} exited with {first.status} while shutting down")
        else:
            log(f"{first.name} exited with {first.status}: stopping the others, because an endpoint "
                "that serves some of its models is not this deployment")
            for engine in engines:
                engine.send(signal.SIGTERM)
    
        for engine in engines:
            if engine.process is None:
                continue
            try:
                engine.process.wait(timeout=GRACE_SECONDS)
            except subprocess.TimeoutExpired:
                log(f"{engine.name} did not stop within {GRACE_SECONDS}s, killing it")
                engine.process.kill()
                engine.process.wait()
    
        if signalled.is_set():
            return 0
        # A clean exit is still an engine that stopped serving.
        return first.status or 1
    
    
    if __name__ == "__main__":
        sys.exit(main())
    
  engine-health.py: |
    #!/usr/bin/env python3
    """Ready only when every engine in this container is.
    
    A pod has one readiness answer to give, and the HTTP probe Kubernetes offers can
    ask about one port. Several engines share this pod behind one Service and one
    Ingress, so "ready" has to mean all of them: a pod marked Ready while the second
    model is still loading publishes a path that answers 502 for minutes, and a
    liveness probe that watches one port never notices the other engine wedging.
    
    `/health` is outside vLLM's authentication middleware, which is what makes it
    usable as a probe at all — and it answers only once the model is loaded.
    
    stdlib only, and no dependency on the chart: the ports come from the same
    attested engines.json the supervisor is handed.
    """
    import json
    import os
    import sys
    import urllib.error
    import urllib.request
    
    TIMEOUT = 5
    
    
    def main() -> int:
        manifest = sys.argv[1] if len(sys.argv) > 1 else os.environ.get(
            "ENGINES_MANIFEST", "/opt/engines/engines.json")
        with open(manifest) as handle:
            engines = json.load(handle)["engines"]
        if not engines:
            print(f"{manifest} names no engines")
            return 1
    
        unready = []
        for engine in engines:
            url = f"http://127.0.0.1:{engine['port']}/health"
            try:
                with urllib.request.urlopen(url, timeout=TIMEOUT) as response:
                    if response.status != 200:
                        unready.append(f"{engine['name']}: HTTP {response.status}")
            except (urllib.error.URLError, OSError, TimeoutError) as err:
                unready.append(f"{engine['name']}: {err}")
        if unready:
            print("; ".join(unready))
            return 1
        print(f"{len(engines)} engine(s) ready")
        return 0
    
    
    if __name__ == "__main__":
        sys.exit(main())
    
  fetch-weights.py: |
    #!/usr/bin/env python3
    """Fetch model weights and refuse to hand over anything the manifest did not name.
    
    Reads a manifest (repo, revision, files[].path/.size/.sha256), downloads each file from
    the Hugging Face resolve endpoint at that exact revision, and verifies the sha256 while
    writing. Idempotent: a file already on disk with the right digest is left alone, so a
    restarted pod does not re-download 29 GiB. Fails closed: any mismatch, any short read,
    any file the manifest does not name is an error and the destination is not marked ready.
    
    stdlib only, so the image that runs this can stay a plain python base.
    """
    import hashlib, json, os, sys, time, urllib.error, urllib.request
    
    CHUNK = 8 << 20
    RETRIES = 5
    UA = "swarm-marketplace-weights-fetcher/1"
    
    
    def log(msg: str) -> None:
        print(f"[weights] {msg}", flush=True)
    
    
    def digest(path: str) -> str:
        h = hashlib.sha256()
        with open(path, "rb") as fh:
            while chunk := fh.read(CHUNK):
                h.update(chunk)
        return h.hexdigest()
    
    
    def fetch(url: str, dest: str, expect_sha: str, expect_size: int) -> None:
        tmp = dest + ".part"
        h = hashlib.sha256()
        written = 0
        req = urllib.request.Request(url, headers={"User-Agent": UA})
        with urllib.request.urlopen(req, timeout=120) as resp, open(tmp, "wb") as out:
            while chunk := resp.read(CHUNK):
                out.write(chunk)
                h.update(chunk)
                written += len(chunk)
        if written != expect_size:
            os.unlink(tmp)
            raise ValueError(f"size {written} != manifest {expect_size}")
        got = h.hexdigest()
        if got != expect_sha:
            os.unlink(tmp)
            raise ValueError(f"sha256 {got} != manifest {expect_sha}")
        os.replace(tmp, dest)
    
    
    def main() -> int:
        manifest_path = os.environ.get("WEIGHTS_MANIFEST", "/etc/model/manifest.json")
        target = os.environ.get("WEIGHTS_DIR", "/models/current")
        endpoint = os.environ.get("HF_ENDPOINT", "https://huggingface.co").rstrip("/")
    
        with open(manifest_path) as fh:
            manifest = json.load(fh)
        repo, revision = manifest["repo"], manifest["revision"]
        source = os.environ.get("WEIGHTS_REPO", repo)
    
        os.makedirs(target, exist_ok=True)
        ready = os.path.join(target, ".weights-ready")
        stamp = f"{source}@{revision}"
        if os.path.exists(ready) and open(ready).read().strip() == stamp:
            log(f"already verified {stamp}")
            return 0
    
        total = manifest["totalBytes"]
        log(f"{stamp}: {len(manifest['files'])} files, {total / 2**30:.2f} GiB -> {target}")
        done = 0
        for entry in manifest["files"]:
            rel, sha, size = entry["path"], entry["sha256"], entry["size"]
            # Every component, not only the ones in a path with a separator in it:
            # a bare ".." has no "/" and would otherwise reach os.path.join.
            if rel.startswith("/") or any(part in ("", ".", "..") for part in rel.split("/")):
                log(f"refusing suspicious manifest path {rel!r}")
                return 1
            dest = os.path.join(target, rel)
            os.makedirs(os.path.dirname(dest), exist_ok=True)
            if os.path.exists(dest) and os.path.getsize(dest) == size and digest(dest) == sha:
                log(f"ok (cached)  {rel}")
                done += size
                continue
            url = f"{endpoint}/{source}/resolve/{revision}/{rel}"
            for attempt in range(1, RETRIES + 1):
                try:
                    started = time.monotonic()
                    fetch(url, dest, sha, size)
                    took = max(time.monotonic() - started, 1e-6)
                    done += size
                    log(f"ok  {rel}  {size / 2**20:.0f} MiB in {took:.0f}s "
                        f"({size / 2**20 / took:.0f} MiB/s)  [{done / total:.0%}]")
                    break
                except (urllib.error.URLError, OSError, ValueError, TimeoutError) as err:
                    log(f"attempt {attempt}/{RETRIES} failed for {rel}: {err}")
                    if attempt == RETRIES:
                        log("giving up — weights are NOT usable, failing closed")
                        return 1
                    time.sleep(min(2 ** attempt, 30))
    
        # Nothing outside the manifest may reach the serving container.
        named = {e["path"] for e in manifest["files"]}
        for root, _dirs, names in os.walk(target):
            for name in names:
                rel = os.path.relpath(os.path.join(root, name), target)
                if rel in named or rel == ".weights-ready":
                    continue
                log(f"removing unmanifested file {rel}")
                os.unlink(os.path.join(root, name))
    
        with open(ready, "w") as fh:
            fh.write(stamp + "\n")
        log(f"verified {stamp}")
        return 0
    
    
    if __name__ == "__main__":
        sys.exit(main())
    
