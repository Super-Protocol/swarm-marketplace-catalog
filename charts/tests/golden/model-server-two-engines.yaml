# Source: swarm-model-server/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swarm-model-server
  labels:
    helm.sh/chart: swarm-model-server-0.3.0
    app.kubernetes.io/name: swarm-model-server
    app.kubernetes.io/instance: ms
    app.kubernetes.io/version: "0.22.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: model-server
  annotations:
    swarm.io/exclude-evidence-fields: "/spec/rules/0/host"
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: "two-models.example"
      http:
        paths:
          - path: "/llama/v1"
            pathType: Prefix
            backend:
              service:
                name: swarm-model-server
                port:
                  number: 8000
          - path: "/gemma/v1"
            pathType: Prefix
            backend:
              service:
                name: swarm-model-server
                port:
                  number: 8001