# Source: confidential-router-ui/templates/configmap-public.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-router-ui-public
  labels:
    helm.sh/chart: confidential-router-ui-0.2.7
    app.kubernetes.io/name: confidential-router-ui
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.4.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
  annotations:
    # Both keys are the API hostname the operator chose, so all of `/data` goes.
    # Declared in the listing's `evidence.exclude` as well, which is what the
    # marketplace reads to show the exclusion beside the digest.
    swarm.io/exclude-evidence-fields: "/data"
data:
  # Read per request by the server and written into the document ahead of every
  # bundle, so the browser calls the origin this deployment was given rather than
  # one compiled into the image.
  ROUTER_UI_API_ORIGIN: "https://api.confidential-router.example"
  # Derived from the origin by the console itself; set here so a
  # `kubectl exec env` says where GraphQL is without knowing that.
  ROUTER_UI_GRAPHQL_HTTP: "https://api.confidential-router.example/graphql"
