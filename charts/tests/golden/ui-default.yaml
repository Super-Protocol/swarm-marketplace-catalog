# Source: confidential-router-ui/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-router-ui
  labels:
    helm.sh/chart: confidential-router-ui-0.2.7
    app.kubernetes.io/name: confidential-router-ui
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.4.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
  annotations:
    # `checksum/public-config` below is a hash of the hostname-derived ConfigMap,
    # so it varies with the hostname exactly as that object's `/data` does and is
    # excluded for the same reason (SUP-211). `/` inside a JSON Pointer token is
    # `~1` (RFC 6901), which is what makes this one token and not three.
    swarm.io/exclude-evidence-fields: "/spec/template/metadata/annotations/checksum~1public-config"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-router-ui
      app.kubernetes.io/instance: cr
  template:
    metadata:
      annotations:
        # `envFrom` is read once, when the container starts, so without this a
        # hostname reconfigure updates the ConfigMap and the running console keeps
        # calling the old origin.
        checksum/public-config: 84059b1bcdbdca84b865cfbe87caa60d05d20c6c50f88482f76ecd2bb7e4a2a6
      labels:
        app.kubernetes.io/name: confidential-router-ui
        app.kubernetes.io/instance: cr
    spec:
      securityContext:
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: router-ui
          image: ghcr.io/super-protocol/confidential-router/router-ui@sha256:2322434d1fc1d07f218828e9fd33c9a8d1751ea67fcf92d4944d6622a5865f88
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          # `ROUTER_UI_API_ORIGIN` and `ROUTER_UI_GRAPHQL_HTTP` — the two values
          # that carry the API hostname, and the reason they are not in the list
          # below (SUP-211). One pinned digest still serves any hostname
          # (SUP-100); the hostname simply no longer reaches an attested object.
          envFrom:
            - configMapRef:
                name: confidential-router-ui-public
          env:
            - name: PORT
              value: "3001"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: ROUTER_UI_AUTH_CALLBACK_URL
              value: "/"
          # `/login` rather than `/`: it is the one route the console serves
          # without a session cookie, so a healthy pod answers 200 and not a
          # redirect.
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            # Next.js writes its cache under the app directory; the root
            # filesystem is read-only otherwise.
            - name: cache
              mountPath: /app/apps/router-ui/.next/cache
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              cpu: 100m
              memory: 512Mi
              nvidia.com/gpu: "0"
            requests:
              cpu: 100m
              memory: 512Mi
              nvidia.com/gpu: "0"
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
# Source: confidential-router-ui/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: confidential-router-ui
  labels:
    helm.sh/chart: confidential-router-ui-0.2.7
    app.kubernetes.io/name: confidential-router-ui
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.4.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
  annotations:
    # The hostname is the one thing that differs between two deployments of this
    # version, and a digest that varied with it would be a digest nobody else
    # could ever match (SUP-211). Declared in the listing's `evidence.exclude` as
    # well — that is what the marketplace reads to show the exclusion beside the
    # digest.
    #
    # The TLS host is the same hostname again, so it is listed too when the chart
    # terminates TLS itself. This listing does not: the cloud holds the
    # certificate, `ingress.tls.enabled` is false, and the rendered value is the
    # single `/spec/rules/0/host` the definition declares.
    swarm.io/exclude-evidence-fields: "/spec/rules/0/host"
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  # Without a class the object is created, the cloud registers the hostname and
  # writes its DNS, and nothing serves it: the controller only picks up what
  # names it.
  ingressClassName: nginx
  rules:
    - host: "console.confidential-router.example"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: confidential-router-ui
                port:
                  number: 3001