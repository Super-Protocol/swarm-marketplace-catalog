# Source: confidential-router-api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-router-api
  labels:
    helm.sh/chart: confidential-router-api-0.4.4
    app.kubernetes.io/name: confidential-router-api
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.2.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-router-api
      app.kubernetes.io/instance: cr
  template:
    metadata:
      annotations:
        # A catalogue change is a config change, and the config is a file: without
        # this the ConfigMap is updated and the running pods keep the old models.
        checksum/config: 2c5f7880bd4e154f4117818f0a9cfabb7fa0b3e802473cdb708071fb99240c90
      labels:
        app.kubernetes.io/name: confidential-router-api
        app.kubernetes.io/instance: cr
    spec:
      securityContext:
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      initContainers:
        # `migrate` is the image's entry point for `node /app/cli/run-migrations.js`
        # — Better Auth's four tables, then the service's ten. Idempotent, so a
        # restart prints "No pending migrations" and exits 0. It also fails until
        # PostgreSQL accepts connections, which is exactly the wait this pod needs
        # and is why there is no separate wait-for-database container.
        - name: migrate
          image: ghcr.io/super-protocol/confidential-router/router-api@sha256:a0a63eb4ddeab9105b1741b01160fa5e061446c2152612a94eab9d9f6b4a388c
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            - name: NODE_ENV
              value: "production"
            - name: CR_API_CONFIG_FILE
              value: /etc/confidential-router/router.yaml
            - name: ROUTER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: password
            - name: ROUTER_DATABASE_URL
              value: "postgres://router:$(ROUTER_DATABASE_PASSWORD)@confidential-router-postgresql:5432/router?sslmode=disable"
            - name: ROUTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: auth-secret
          volumeMounts:
            - name: config
              mountPath: /etc/confidential-router
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
          resources:
            limits:
              cpu: 50m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 128Mi
      containers:
        - name: router-api
          image: ghcr.io/super-protocol/confidential-router/router-api@sha256:a0a63eb4ddeab9105b1741b01160fa5e061446c2152612a94eab9d9f6b4a388c
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: CR_API_CONFIG_FILE
              value: /etc/confidential-router/router.yaml
            - name: ROUTER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: password
            - name: ROUTER_DATABASE_URL
              value: "postgres://router:$(ROUTER_DATABASE_PASSWORD)@confidential-router-postgresql:5432/router?sslmode=disable"
            - name: ROUTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: auth-secret
          # `/health` does a real database round trip, so an unready pod is one
          # that cannot serve rather than one that has merely started.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/confidential-router
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
          resources:
            limits:
              cpu: 250m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: confidential-router-api
        # The root filesystem is read-only; these two are the only paths the
        # process writes to. `data/` is the SQLite default, unused on PostgreSQL,
        # and still has to exist.
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
