apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: confidential-router-api
  labels:
    helm.sh/chart: confidential-router-api-0.4.4
    app.kubernetes.io/name: confidential-router-api
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.2.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: "api.confidential-router.example"
      http:
        paths:
          - path: "/v1"
            pathType: Prefix
            backend:
              service:
                name: confidential-router-api
                port:
                  number: 3000
          - path: "/graphql"
            pathType: Prefix
            backend:
              service:
                name: confidential-router-api
                port:
                  number: 3000
          - path: "/auth"
            pathType: Prefix
            backend:
              service:
                name: confidential-router-api
                port:
                  number: 3000
          - path: "/billing"
            pathType: Prefix
            backend:
              service:
                name: confidential-router-api
                port:
                  number: 3000
          - path: "/activity"
            pathType: Prefix
            backend:
