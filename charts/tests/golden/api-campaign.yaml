# Source: confidential-router-api/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: confidential-router-api
  labels:
    helm.sh/chart: confidential-router-api-0.11.0
    app.kubernetes.io/name: confidential-router-api
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.4.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
  annotations:
    # The hostname is the one thing that differs between two deployments of this
    # version, and a digest that varied with it would be a digest nobody else
    # could ever match (SUP-211). Declared in the listing's `evidence.exclude` as
    # well — that is what the marketplace reads to show the exclusion beside the
    # digest.
    #
    # The TLS host is the same hostname again, so it is listed too when the chart
    # terminates TLS itself. This listing does not: the cloud holds the
    # certificate, `ingress.tls.enabled` is false, and the rendered value is the
    # single `/spec/rules/0/host` the definition declares.
    swarm.io/exclude-evidence-fields: "/spec/rules/0/host"
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: "api.confidential-router.example"
      http:
        paths:
          - path: "/v1"
            pathType: Prefix
            backend:
              service:
                name: confidential-router-api
                port:
                  number: 3000
          - path: "/graphql"
            pathType: Prefix
            backend:
              service:
                name: confidential-router-api
                port:
                  number: 3000
          - path: "/auth"
            pathType: Prefix
            backend:
              service:
                name: confidential-router-api
                port:
                  number: 3000
          - path: "/billing"
            pathType: Prefix
            backend:
              service:
                name: confidential-router-api
                port:
                  number: 3000
          - path: "/activity"
            pathType: Prefix
            backend:
              service:
                name: confidential-router-api
                port:
                  number: 3000
          - path: "/exports"
            pathType: Prefix
            backend:
              service:
                name: confidential-router-api
                port:
                  number: 3000