# Source: confidential-router-api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidential-router-api
  labels:
    helm.sh/chart: confidential-router-api-0.11.0
    app.kubernetes.io/name: confidential-router-api
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.4.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
  annotations:
    # `checksum/public-config` below is a hash of the hostname-derived ConfigMap,
    # so it varies with the hostname exactly as that object's `/data` does and is
    # excluded for the same reason (SUP-211). `/` inside a JSON Pointer token is
    # `~1` (RFC 6901), which is what makes this one token and not three.
    #
    # `checksum/config` is deliberately *not* excluded: `router.yaml` carries no
    # hostname any more, so that hash is a property of the version and the
    # parameters — which is precisely what the digest should attest.
    #
    # `checksum/mail` is a hash of the mail settings, which live in the Secret
    # and nowhere attested (SUP-269); it varies with them and is excluded so the
    # digest does not.
    swarm.io/exclude-evidence-fields: "/spec/template/metadata/annotations/checksum~1public-config,/spec/template/metadata/annotations/checksum~1mail"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: confidential-router-api
      app.kubernetes.io/instance: cr
  template:
    metadata:
      annotations:
        # A catalogue change is a config change, and the config is a file: without
        # this the ConfigMap is updated and the running pods keep the old models.
        checksum/config: fba7a0c99055251260fdaf479824117193ff6ca740fc278a07afb6f4bf249922
        # And a hostname reconfigure is a config change the pod cannot see at all:
        # `envFrom` is read once, when the container starts, so without this the
        # ConfigMap is updated and the running router keeps advertising the old
        # origin.
        checksum/public-config: 1b1276ffad9a5d16059c9786e059ab8102d30391fbd37bc262c87c4e1d67e0aa
        # The mail settings reach the container as env read from the Secret, once,
        # at start — so a reconfigured SMTP server or a rotated password would
        # otherwise sit in the Secret while the router keeps the old one (SUP-269).
        checksum/mail: cbc69deff9783b3456ace5a2a5efad25cc6afe2c3f2de85bf65c78e22bae4bee
      labels:
        app.kubernetes.io/name: confidential-router-api
        app.kubernetes.io/instance: cr
    spec:
      securityContext:
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
      initContainers:
        # `migrate` is the image's entry point for `node /app/cli/run-migrations.js`
        # — Better Auth's four tables, then the service's ten. Idempotent, so a
        # restart prints "No pending migrations" and exits 0. It also fails until
        # PostgreSQL accepts connections, which is exactly the wait this pod needs
        # and is why there is no separate wait-for-database container.
        - name: migrate
          image: ghcr.io/super-protocol/confidential-router/router-api@sha256:4ce9dd805f079e67835ea300934c35a2287f916cda1401ff2ad19c4e4f37ff97
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: confidential-router-api-public
          env:
            - name: NODE_ENV
              value: "production"
            - name: CR_API_CONFIG_FILE
              value: /etc/confidential-router/router.yaml
            - name: ROUTER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: password
            - name: ROUTER_DATABASE_URL
              value: "postgres://router:$(ROUTER_DATABASE_PASSWORD)@confidential-router-postgresql:5432/router?sslmode=disable"
            - name: ROUTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: auth-secret
            - name: CR_API_AUTH__ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: admin-emails
            - name: POSTHOG_PROJECT_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: posthog-project-key
            - name: CR_API_MAIL__FROM
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: mail-from
                  optional: true
            - name: CR_API_MAIL__FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: mail-from-name
                  optional: true
            - name: CR_API_MAIL__PROVIDER
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: mail-provider
                  optional: true
            - name: CR_API_MAIL__RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: mail-resend-api-key
                  optional: true
            - name: CR_API_MAIL__SMTP__HOST
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: smtp-host
                  optional: true
            - name: CR_API_MAIL__SMTP__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: smtp-password
                  optional: true
            - name: CR_API_MAIL__SMTP__PORT
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: smtp-port
                  optional: true
            - name: CR_API_MAIL__SMTP__SECURITY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: smtp-security
                  optional: true
            - name: CR_API_MAIL__SMTP__USER
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: smtp-user
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/confidential-router
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
              nvidia.com/gpu: "0"
            requests:
              cpu: 100m
              memory: 128Mi
              nvidia.com/gpu: "0"
      containers:
        - name: router-api
          image: ghcr.io/super-protocol/confidential-router/router-api@sha256:4ce9dd805f079e67835ea300934c35a2287f916cda1401ff2ad19c4e4f37ff97
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: confidential-router-api-public
          env:
            - name: NODE_ENV
              value: "production"
            - name: CR_API_CONFIG_FILE
              value: /etc/confidential-router/router.yaml
            - name: ROUTER_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: password
            - name: ROUTER_DATABASE_URL
              value: "postgres://router:$(ROUTER_DATABASE_PASSWORD)@confidential-router-postgresql:5432/router?sslmode=disable"
            - name: ROUTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: auth-secret
            - name: CR_API_AUTH__ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: admin-emails
            - name: POSTHOG_PROJECT_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: posthog-project-key
            - name: CR_API_MAIL__FROM
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: mail-from
                  optional: true
            - name: CR_API_MAIL__FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: mail-from-name
                  optional: true
            - name: CR_API_MAIL__PROVIDER
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: mail-provider
                  optional: true
            - name: CR_API_MAIL__RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: mail-resend-api-key
                  optional: true
            - name: CR_API_MAIL__SMTP__HOST
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: smtp-host
                  optional: true
            - name: CR_API_MAIL__SMTP__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: smtp-password
                  optional: true
            - name: CR_API_MAIL__SMTP__PORT
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: smtp-port
                  optional: true
            - name: CR_API_MAIL__SMTP__SECURITY
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: smtp-security
                  optional: true
            - name: CR_API_MAIL__SMTP__USER
              valueFrom:
                secretKeyRef:
                  name: confidential-router-api
                  key: smtp-user
                  optional: true
          # `/health` does a real database round trip, so an unready pod is one
          # that cannot serve rather than one that has merely started.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: config
              mountPath: /etc/confidential-router
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
          resources:
            limits:
              cpu: 250m
              memory: 1Gi
              nvidia.com/gpu: "0"
            requests:
              cpu: 250m
              memory: 1Gi
              nvidia.com/gpu: "0"
      volumes:
        - name: config
          configMap:
            name: confidential-router-api
        # The root filesystem is read-only; these two are the only paths the
        # process writes to. `data/` is the SQLite default, unused on PostgreSQL,
        # and still has to exist.
        - name: tmp
          emptyDir: {}
        - name: data
          emptyDir: {}
