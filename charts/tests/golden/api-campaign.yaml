# Source: confidential-router-api/templates/configmap-public.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-router-api-public
  labels:
    helm.sh/chart: confidential-router-api-0.11.0
    app.kubernetes.io/name: confidential-router-api
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.4.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
  annotations:
    # Every key here is derived from a hostname the operator chose, so all of
    # `/data` goes. Losing this annotation would not fail a render; it would
    # quietly make every deployment of this version attest a different digest.
    swarm.io/exclude-evidence-fields: "/data"
data:
  # `server.publicBaseUrl` and `auth.baseUrl`. One value, because they are one
  # origin: Better Auth builds its callback URLs from the second and the API
  # advertises itself with the first, and the two disagreeing is a sign-in that
  # returns the browser somewhere nothing serves.
  ROUTER_PUBLIC_BASE_URL: "https://api.confidential-router.example"
  # `endpoints[].hostname` for an endpoint that did not name one — this
  # deployment's own API hostname, which is where its evidence bundle is fetched
  # from, and the value the router matches against `server.publicBaseUrl` to
  # know which endpoint is its own (SUP-255). A hostname, not a URL, which is
  # what that field is. Present on every render the listing produces, because
  # the deployment's own endpoint is rendered whatever `models` says; absent
  # only when every rendered endpoint named a hostname of its own.
  ROUTER_PUBLIC_HOSTNAME: "api.confidential-router.example"
  # `server.validClientOrigins`, comma-separated: the router's schema splits a
  # string back into the list, so the whole allow-list travels as one value
  # rather than as a placeholder per index that would have to be rendered — and
  # a rendered index is a hostname count, which is itself hostname-derived.
  ROUTER_VALID_CLIENT_ORIGINS: "https://console.confidential-router.example,https://landing.confidential-router.example"
  # `billing.checkoutReturnUrl` — where Stripe returns the browser, which is a
  # page of the console rather than of the API.
  ROUTER_CHECKOUT_RETURN_URL: "https://console.confidential-router.example/credits"
  # `invites.landingBaseUrl`. Present only when a campaign named a landing page,
  # matching the conditional block in `router.yaml`: a placeholder with no value
  # and no default fails the boot, naming itself.
  ROUTER_LANDING_BASE_URL: "https://landing.confidential-router.example"
