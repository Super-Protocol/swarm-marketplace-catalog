# Source: confidential-router-api/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-router-api
  labels:
    helm.sh/chart: confidential-router-api-0.11.0
    app.kubernetes.io/name: confidential-router-api
    app.kubernetes.io/instance: cr
    app.kubernetes.io/version: "0.4.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: confidential-router
data:
  router.yaml: |
    version: 1

    server:
      port: 3000
      host: 0.0.0.0
      publicBaseUrl: "${ROUTER_PUBLIC_BASE_URL}"
      # CORS, and Better Auth's trusted origins. The console calls this API from
      # the browser with `credentials: 'include'`, so its origin has to be here —
      # and so does the campaign landing page's, which looks an invitation code up
      # from the browser before anyone has signed in at all.
      #
      # One scalar rather than a list: the router's schema splits a
      # comma-separated string back into the list, and a placeholder per index
      # would mean rendering how many origins there are — which is itself
      # hostname-derived, since the second one exists only when a campaign named
      # a landing page.
      validClientOrigins: "${ROUTER_VALID_CLIENT_ORIGINS}"

    database:
      type: postgres
      url: ${ROUTER_DATABASE_URL}
      # The init container owns the schema; replicas must not race each other.
      migrationsRun: false

    backends:
      litellm:
        baseUrl: "http://confidential-router-litellm:4000"
        connectTimeout: "60s"
        readTimeout: "300s"

    endpoints:
      - name: "confidential-router"
        hostname: "${ROUTER_PUBLIC_HOSTNAME}"
        tee: "Intel TDX + H100 CC"

    # `litellmModel` is the catalogue key, which is the Ollama model name and the
    # name LiteLLM publishes: one string, all the way down.
    models:
      - id: "meta/llama-3.2-3b-instruct:tee"
        name: "Llama 3.2 3B Instruct"
        litellmModel: "llama3.2:3b"
        endpoint: "confidential-router"
        contextLength: 131072
        capabilities: [chat, completions]
        pricing:
          promptPer1mMicros: 30000
          completionPer1mMicros: 50000

    evidence:
      pollInterval: "5m"
      freshnessWindow: "24h"

    rateLimits:
      requestsPerMinute: 600
      tokensPerMinute: 2000000

    auth:
      baseUrl: "${ROUTER_PUBLIC_BASE_URL}"
      secret: ${ROUTER_AUTH_SECRET}
      sessionMaxAge: "720h"
      magicLink:
        mailer: "none"
        from: "no-reply@confidential-router.local"
      # Rendered only while it is on, for the same reason `bootstrapToken` is:
      # the router's config schema is strict, so an image that predates SUP-112
      # would refuse to boot on the key rather than ignore it.
      password:
        enabled: true
        minLength: 12

    # This section is the one place the chart does *not* keep itself bootable on an
    # older image. `maxTopUpMicros` is unconditional, so on a router that predates
    # SUP-167 — whose config schema is strict — every mode is a boot refusal, not
    # just `disabled`. That is deliberate and is the safe direction: the image that
    # would accept this chart without the key is the image that mints credit from a
    # signed link, and a pod that will not start is a better outcome than one that
    # quietly publishes a free-credit button. The chart version bump is the marker
    # that the two have to move together.
    billing:
      # Named rather than left to the API's fallback, which was to bind the minting
      # provider whenever `stripe` was absent (SUP-167). Conditional because the
      # value is only meaningful for this mode, not to keep an older image booting.
      provider: disabled
      minTopUpMicros: 5000000
      maxTopUpMicros: 10000000000
      allowOverdraftMicros: 0
      checkoutReturnUrl: "${ROUTER_CHECKOUT_RETURN_URL}"
      autoTopUpCooldown: "1h"

    # Where the codes are handed out: the origin the generated invitation URLs
    # point at, and — through `validClientOrigins` above — the one page allowed to
    # look a code up. Rendered only when a landing page was named, so an image
    # that predates the feature still boots on this chart rather than refusing a
    # key its schema has never heard of.
    invites:
      landingBaseUrl: "${ROUTER_LANDING_BASE_URL}"
      lookupsPerMinute: 30

    log:
      level: "info"
      pretty: false

    graphql:
      path: "/graphql"
      introspection: false

    gatekeeper:
      repo: "Super-Protocol/confidential-router"
      apiBaseUrl: "https://api.github.com"
      cacheTtl: "15m"
      requestTimeout: "5s"

    swagger:
      enabled: false
      path: "docs"
---
