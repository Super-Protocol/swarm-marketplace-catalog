# Source: swarm-doc-ingest/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: swarm-doc-ingest
  labels:
    helm.sh/chart: swarm-doc-ingest-0.1.0
    app.kubernetes.io/name: swarm-doc-ingest
    app.kubernetes.io/instance: di
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: doc-ingest
data:
  INGEST_LAYOUT_PRESET: "layout_heron_default"
  INGEST_TABLE_MODE: "fast"
  INGEST_OCR_ENGINE: "off"
  INGEST_FORCE_FULL_PAGE_OCR: "false"
  INGEST_INCLUDE_IMAGE_CONTENT: "false"
  INGEST_MAX_UPLOAD_BYTES: "268435456"
  HF_HUB_OFFLINE: "1"
  OMP_NUM_THREADS: "4"
