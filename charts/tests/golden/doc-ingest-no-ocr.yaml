# Source: swarm-doc-ingest/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarm-doc-ingest
  labels:
    helm.sh/chart: swarm-doc-ingest-0.1.0
    app.kubernetes.io/name: swarm-doc-ingest
    app.kubernetes.io/instance: di
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: doc-ingest
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: swarm-doc-ingest
      app.kubernetes.io/instance: di
  template:
    metadata:
      labels:
        helm.sh/chart: swarm-doc-ingest-0.1.0
        app.kubernetes.io/name: swarm-doc-ingest
        app.kubernetes.io/instance: di
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: doc-ingest
      annotations:
        checksum/config: bf181e1763731adc7a2e291e13746ac2dbc9eccf1afb1625b8625f115fd78060
    spec:
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingest
          image: ghcr.io/super-protocol/swarm-doc-ingest/ingest@sha256:a114f3df285a9c0f30e96e3bf2b31b04184ba5d956b007e8df81cc4a4db704d1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: swarm-doc-ingest
          env:
            - name: INGEST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-rag-ingest-key
                  key: api-key
            - name: TMPDIR
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: "4"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: work
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 2Gi