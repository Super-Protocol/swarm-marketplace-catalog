# Source: swarm-doc-ingest/templates/configmap-notes.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: swarm-doc-ingest-extraction-notes
  labels:
    helm.sh/chart: swarm-doc-ingest-0.1.0
    app.kubernetes.io/name: swarm-doc-ingest
    app.kubernetes.io/instance: di
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: doc-ingest
data:
  extraction-notes.md: |
    # What this deployment extracts

    Layout `layout_heron_default`, table structure
    `fast`, OCR `off`.
    Model weights are baked into the image named by digest beside this document
    and are pinned there by Hugging Face commit and by sha256; nothing is
    fetched at run time.

    Tables are extracted as cell grids and as Markdown, never flattened into
    prose. **Charts are located, not transcribed**: a chart is returned as an
    image element with its bounding box, not as a table of its series.
    Transcribing one needs a vision-language model on a GPU and this component
    is CPU-only by design.

    Measured on this configuration, 8 vCPU, no accelerator: mean table F1 0.844
    over ten documents and 0.935 over the three published by the reference
    architecture this replaces. A text-only extractor on the same documents
    recovers 0 tables out of 19.
