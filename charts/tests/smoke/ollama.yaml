# otwld's chart, as the listing deploys it: CPU, ClusterIP, one small model
# pulled on first start. `gpu.enabled` is the switch the ollama-gpu-* golden
# cases pin.
image:
  tag: "0.12.11"
service:
  type: ClusterIP
ollama:
  gpu:
    enabled: false
  models:
    pull:
      - llama3.2:3b
    run: []
persistentVolume:
  enabled: true
  size: 20Gi
ingress:
  enabled: false
# The first start downloads about 2 GB of weights; the default probes give up
# long before that finishes and restart the pod into downloading it again.
readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 15
  failureThreshold: 60
livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
  failureThreshold: 60
