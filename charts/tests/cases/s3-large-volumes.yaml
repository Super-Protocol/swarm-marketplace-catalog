# The large end of the form: a 500 GB object volume, a 50 GB database, and the
# 16 MB chunk that suits whole-object reads. The engine's layout capacity is
# derived from the volume rather than set beside it, so this case is what proves
# the two cannot drift apart.
garage:
  image:
    digest: sha256:4444444444444444444444444444444444444444444444444444444444444444
  persistence:
    data:
      size: 500Gi
  chunkSize: 16777216
gateway:
  image:
    digest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  chunkSize: 16777216
postgresql:
  primary:
    persistence:
      size: 50Gi
