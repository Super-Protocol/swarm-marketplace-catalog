# Confidential Vulnerability Analysis: the analysis API, the console in front of it and the
# egress guard beside it, which is the shape every deployment of this listing has. There is no
# second shape: the model is fixed, the data arrives as an upload rather than through a data
# slot, and the one choice a tenant makes that reaches the render is how long a stage may take.
name: confidential-vuln-analysis
hostname: vuln.conf-apps.superprotocol.dev
ingress:
  className: nginx
console:
  password: ACCESS-PASSWORD-FOR-THE-GOLDEN
  sessionKey: SESSION-SIGNING-KEY-FOR-THE-GOLDEN-0123
inference:
  url: http://swarm-model-server:8000/v1
  model: qwen3-coder-30b-a3b-instruct-fp8
  licence: Apache-2.0
  apiKey: INFERENCE-KEY-FOR-THE-GOLDEN
  contextWindowTokens: 65536
