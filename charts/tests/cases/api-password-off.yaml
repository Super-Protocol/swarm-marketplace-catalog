# Passwords switched off. The `auth.password` block then disappears from the
# rendered config entirely rather than being written as `enabled: false`: the
# router's config schema is strict, so this is what keeps the chart bootable on
# an image that predates SUP-112 — the same rule `bootstrapToken` follows.
#
# A mailer that delivers comes with it, and not as decoration: the bootstrap token
# claims one account and then stops existing, so with passwords off and no mail
# there is no second way in and the chart refuses to render.
apiHostname: api.confidential-router.example
consoleHostname: console.confidential-router.example
auth:
  secret: golden-test-auth-secret-not-a-real-one
  magicLink:
    mailer: resend
    from: no-reply@confidential-router.example
    resendApiKey: re_golden_test_not_a_real_key
  password:
    enabled: false
database:
  password: golden-test-password
