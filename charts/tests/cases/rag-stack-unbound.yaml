# The same pipeline with NOTHING attached, which is a supported state and not a broken one:
# the deployment comes up and waits for its data owner to approve it.
#
# Its render must differ from `rag-stack` in the Secret alone. The Secret's values are lifted
# out of the bundle before the cloud takes the evidence snapshot, so if that holds, one
# declared digest covers both — and if it ever stops holding, the gate refuses exactly the
# deployments that mounted gated data.
name: confidential-rag
hostname: rag.conf-apps.superprotocol.dev
ingress:
  className: nginx
console:
  password: ACCESS-PASSWORD-FOR-THE-GOLDEN
  sessionKey: SESSION-SIGNING-KEY-FOR-THE-GOLDEN-0123
  about:
    expectedDigest: 4c5bb0e9b5f78a7a04ba54de3c0e9a0b2b3d1cb0ba0e4b3b57a3d7bd6cbe95c7
inference:
  url: http://swarm-model-server:8000/v1
  model: llama-3.2-3b-instruct
  licence: Llama 3.2 Community License Agreement
  apiKey: INFERENCE-KEY-FOR-THE-GOLDEN
embeddings:
  url: http://confidential-rag-embeddings/v1
  model: bge-large-en-v1.5
  licence: MIT
  dimensions: 1024
  apiKey: INFERENCE-KEY-FOR-THE-GOLDEN
reranker:
  url: http://confidential-rag-reranker
  model: bge-reranker-v2-m3
  licence: Apache-2.0
  apiKey: INFERENCE-KEY-FOR-THE-GOLDEN
vectorStore:
  url: http://confidential-rag-vectors:19530
  password: VECTOR-STORE-PASSWORD-FOR-THE-GOLDEN
corpus:
  bindingJson: "[]"
  table: documents
  idColumn: doc_id
  titleColumn: title
  textColumn: text
  updatedColumn: updated_at
