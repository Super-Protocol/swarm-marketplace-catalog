# Virtual-host addressing, which the deployment's own zone has a wildcard record
# for. The only thing it changes is `server.s3_domains` in the gateway's config —
# and that one line is the difference between an SDK that works out of the box
# and one that has to be told to use path style.
virtualHostStyle: true
