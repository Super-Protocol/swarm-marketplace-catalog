# What the marketplace listing deploys (SUP-112): email and password on, and no
# mailer at all, so the console offers the one sign-in path this deployment can
# actually complete. The bootstrap token still claims the first account; before
# this, everyone after that was offered a magic link nobody could deliver.
apiHostname: api.confidential-router.example
consoleHostname: console.confidential-router.example
auth:
  secret: golden-test-auth-secret-not-a-real-one
  magicLink:
    mailer: none
  password:
    enabled: true
    minLength: 12
  bootstrapToken: golden-test-bootstrap-token
  bootstrapEmail: admin@confidential-router.example
database:
  password: golden-test-password
