# The same deployment with a transcript corpus attached. The binding is the only value that
# differs between two deployments of this version at the same parameters, and it is in the
# Secret — which is what `attaching a transcript corpus changes nothing outside the Secret`
# below checks against this golden and the unbound one. If a patch ever put a connection into an
# env value, a ConfigMap or an argument, the declared digest would become a property of whether
# somebody attached data, and the gate would then refuse exactly the deployments that mounted it.
