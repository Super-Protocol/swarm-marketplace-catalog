# The Confidential RAG pipeline with a document corpus attached, which is the shape every
# deployment of this listing is meant to be.
#
# The binding is the resolved GATED shape: a local address, a database, the literal user
# `gateway` and no password at all — the gate holds the publisher's own credentials and adds
# them to each request it admits. It is in the Secret and nowhere else, which is what keeps
# the attested digest from being a property of whether anybody attached data.
name: confidential-rag
hostname: rag.conf-apps.superprotocol.dev
ingress:
  className: nginx
console:
  password: ACCESS-PASSWORD-FOR-THE-GOLDEN
  sessionKey: SESSION-SIGNING-KEY-FOR-THE-GOLDEN-0123
inference:
  url: http://swarm-model-server:8000/v1
  model: llama-3.2-3b-instruct
  licence: Llama 3.2 Community License Agreement
  apiKey: INFERENCE-KEY-FOR-THE-GOLDEN
embeddings:
  url: http://confidential-rag-embeddings/v1
  model: bge-large-en-v1.5
  licence: MIT
  dimensions: 1024
  apiKey: INFERENCE-KEY-FOR-THE-GOLDEN
reranker:
  url: http://confidential-rag-reranker
  model: bge-reranker-v2-m3
  licence: Apache-2.0
  apiKey: INFERENCE-KEY-FOR-THE-GOLDEN
vectorStore:
  url: http://confidential-rag-vectors:19530
  password: VECTOR-STORE-PASSWORD-FOR-THE-GOLDEN
corpus:
  bindingJson: >-
    [{"dataset":"acme-internal-knowledge-base","title":"Acme Internal Knowledge Base",
    "interface":"clickhouse-http/v1","connection":{"host":"cr-gatekeeper-egress","port":9500,
    "database":"docs","username":"gateway","tls":false}}]
  table: documents
  idColumn: doc_id
  titleColumn: title
  textColumn: text
  updatedColumn: updated_at
