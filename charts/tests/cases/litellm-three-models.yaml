# The same three models as api-three-models. `model_name` here and
# `litellmModel` there are the same strings — the same strings that are in
# `models` in both charts, which is the point of the pairing.
ollamaUrl: http://confidential-router-ollama:11434
models:
  - "llama3.2:3b"
  - "mistral:7b"
  - "gemma2:2b"
# Always set by the listing (the generated `litellmKey`), so the object list this
# case renders is the one a deployment with a selection gets.
masterKey: golden-test-master-key
