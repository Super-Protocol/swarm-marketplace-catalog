apiVersion: v2
name: conversational-analyst-agent
description: The analyst itself — backend, background worker, frontend and its supporting services.
type: application
# 0.5.0 is the 1.17 agent, and the change is not an image bump.
#
#   * The model is no longer a configuration value. `llmSmart` / `llmFast` are gone from
#     the api's own schema: a model is a row in the installation's registry, chosen per
#     dialog, and something has to put the first one there (the grounding component does).
#   * The knowledge base is no longer a graph. The schema catalog, the semantic model and
#     the knowledge index live in PostgreSQL with pgvector; Neo4j is not a backend the api
#     knows about any more.
#   * The identity service has a database of its own and will not start without it.
#   * Autopilots and signals run on background queues, which need the `worker` Deployment
#     the 0.4.x chart did not have.
#   * The configuration document is split: endpoints and thresholds attested in a
#     ConfigMap, credentials in a Secret (see charts/vendor/aivo/VENDORED.md).
# 0.5.1 fixes the configuration init container, in the vendored aivo subchart: it
# listed a ConfigMap mount as if it were a flat directory of keys and died with
# EISDIR on the kubelet's own `..data` / timestamp entries, so `agent-config`
# never started and the five services that wait for it restarted behind it
# (SUP-711).
# 0.6.0 is the 1.22.1 agent. Only the image tags move, and that is the finding
# rather than the change: the 51 commits between 1.17.0 and 1.22.1 are additive
# everywhere this chart touches the product (SUP-896).
#
#   * The platform configuration contract is unchanged. `conf/local/services.yaml.tpl`
#     gains six commented lines for the new `mcp-weather` connector and nothing
#     else; the api's own config schema gains four `dashboardRefresh` keys, all
#     with defaults, and removes none. So every key this chart writes is still
#     read, and no key it omits is now required.
#   * `identity.provider` stays `keycloak`, which is what makes 1.22's new
#     `local.derivedGroups` block — on by default upstream, deriving group paths
#     from an employer INN claim — unreachable here rather than merely inert.
#   * No new workload. 1.22's additions are dashboards, the semantic layer, the
#     library, billing UI and the signals widget, all inside the api, the worker
#     and the frontend this chart already runs. `apps/mcp-weather` ships as a
#     separate connector and is deliberately not deployed: it is an outbound
#     channel to Open-Meteo, which is the one thing this listing claims it does
#     not have.
#   * The api still has no migrations — the schema arrives through TypeORM
#     `synchronize` under an advisory lock — so a fresh deployment builds the
#     1.22.1 schema directly.
# 0.6.1 removes one env entry and nothing else. The `retail-ai` back Deployment
# defined RAI_PROCESS_ROLE twice — the vendored subchart emits it from
# `worker.enabled`, and `back.extraEnv` added a second, identical entry. Both
# values were `web`, so the container behaved correctly and the digest was
# stable; but server-side apply refuses a duplicate key, so EVERY `reconfigure`
# of a published deployment failed:
#
#   .spec.template.spec.containers[name="retail-ai"].env: duplicate entries for key
#
# That made the runbook's `unpublish -> reconfigure -> publish` impossible on a
# published stand, which is how the defect was found (SUP-896, fixed on SUP-899).
# The role is still set, by the subchart, which is the only place it should come
# from; `charts/tests/duplicate_keys.py` now fails any render that defines one
# key twice, in this chart or any other.
version: 0.6.1
appVersion: "1.22.1"
dependencies:
  - name: aivo
    version: 0.1.2
    repository: "file://../vendor/aivo"
