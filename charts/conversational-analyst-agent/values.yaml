# Object names are left to derive from the Helm release, because the subcharts address one
# another as `<release>-<subchart>` in their own templates. Pinning the names renames the objects
# and not the references to them, and the services then look each other up at addresses that no
# longer exist. Anything outside this chart that needs to reach them resolves the release name
# through `{{ components.agent.release }}` instead of guessing.
#
# Credentials, hostnames and model settings are deliberately absent: the marketplace supplies
# them per deployment, so nothing here has to be a placeholder that could be shipped by mistake.
#
# The images are pulled through a proxy of the vendor's registry; the account behind `regcred`
# is read-only and issued for the marketplace.
#
# Every tag is an immutable build number, not `latest` or `develop`. A moving tag would leave the
# manifests — and so the digest a deployment attests to — unchanged while the software behind them
# was replaced, which is the one thing this listing exists to make impossible. Raising a version
# here is therefore a deliberate act with a new measurement behind it.

aivo:
  kafka-llm-proxy:
    enabled: false

  config:
    image:
      repository: registry.aggregion.com/gh/aivoagent/agent/backend
      pullPolicy: Always
      tag: develop-452
    imagePullSecrets:
      - name: regcred
    config:
      services:
        identityService:
          clientId: identity
          endpoint: http://analyst-keycloak/auth
          realm: master
        api:
          db:
            type: postgresql
            config:
              host: analyst-postgresql
              username: retail_ai_user
              database: retail_ai
              synchronize: true
              logging: false
          redis:
            host: analyst-redis-master
            port: 6379
            db: 1
          fileStorage:
            type: s3
            config:
              region: us-east-1
              bucket: agent
              accessKeyId: root
              endpoint: http://analyst-minio:9000
          memory:
            enabled: true
            maxMessages: 5
            summarizeThreshold: 10
          embeddings:
            provider: openai
            model: text-embedding-3-small
            dimensions: 1536
          pythonExecutor:
            type: docker
            timeout: 30000
            config:
              image: aivo-python:latest
              memoryLimit: 512m
              cpuLimit: "1.0"
              network: none
              autoRemove: true
          llmSmart:
            provider: google
            temperature: 1
          llmFast:
            provider: google
            temperature: 1
          recursionLimit: 100
          fileUpload:
            maxFileSize: 10485760
          langfuse:
            tracing: false
          langsmith:
            tracing: false
          checkpointer:
            type: postgres
          nats:
            url: nats://analyst-nats:4222
          stt:
            provider: openai
            model: whisper-1
        instance:
          instanceId: analyst
          # The UI ships with a Russian and an English translation and offers both unless told
          # otherwise. A marketplace listing is read by whoever finds it, so it is served in one
          # language rather than in whichever one a stale cookie last selected; the first entry
          # is also the default. Requires an agent build that understands the key — before
          # `d8c05e7` the instance service rejects it at startup.
          locales:
            - en

  service-discovery:
    image:
      repository: registry.aggregion.com/gh/aivoagent/agent/backend
      pullPolicy: Always
      tag: develop-452
    imagePullSecrets:
      - name: regcred

  identity:
    image:
      repository: registry.aggregion.com/gh/aivoagent/agent/backend
      pullPolicy: Always
      tag: develop-452
    imagePullSecrets:
      - name: regcred

  instance:
    image:
      repository: registry.aggregion.com/gh/aivoagent/agent/backend
      pullPolicy: Always
      tag: develop-452
    imagePullSecrets:
      - name: regcred

  # The vendored subchart is named retail-ai upstream; the key has to match it. What the objects
  # are called is set below and is ours to choose.
  retail-ai:
    imagePullSecrets:
      - name: regcred
    # Traffic reaches the agent through the gateway component, which is where authentication
    # happens; an Ingress here would be a second, unauthenticated door.
    ingress:
      enabled: false
    gatekeeper:
      enabled: false
    back:
      image:
        repository: registry.aggregion.com/gh/aivoagent/agent/backend
        pullPolicy: Always
        tag: develop-452
    front:
      image:
        repository: registry.aggregion.com/gh/aivoagent/agent/frontend
        pullPolicy: Always
        tag: develop-448
