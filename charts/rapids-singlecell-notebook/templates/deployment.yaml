{{- $name := include "rapids-singlecell-notebook.fullname" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "rapids-singlecell-notebook.labels" . | nindent 4 }}
spec:
  # One. A second replica would want a second card, and the workspace volume is
  # ReadWriteOnce.
  replicas: 1
  strategy:
    # The card is held by the running pod until it exits, so a rolling update
    # would leave the new pod Pending on a GPU quota of one for ever.
    type: Recreate
  selector:
    matchLabels:
      {{- include "rapids-singlecell-notebook.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # The environment lock and the notebooks are mounted, not baked, so a
        # change to either has to roll the pod for anything to notice.
        checksum/workspace: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rapids-singlecell-notebook.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.gpu.enabled }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName }}
      {{- end }}
      containers:
        # ---------------------------------------------------------------------
        # The notebook server, and the only container in this pod. The attested
        # environment is installed by `bootstrap.sh` as this container's first
        # act rather than by an init container, because an init container writes
        # into its own filesystem: `--target` onto a shared volume would put the
        # overlay ahead of the image's conda packages on sys.path and shadow the
        # CUDA builds that cudf, cuml and cupy are linked against.
        # ---------------------------------------------------------------------
        - name: notebook
          image: {{ include "rapids-singlecell-notebook.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The image's own entrypoint puts the conda environment on PATH; its
          # command is the part being replaced, and it is replaced because it
          # starts JupyterLab with `--NotebookApp.token=''`.
          command: [/home/rapids/entrypoint.sh]
          args: [bash, /opt/sc/bootstrap.sh]
          env:
            # jupyter_server reads this by itself and demands it on the login
            # form. By reference, never as an argument.
            - name: JUPYTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rapids-singlecell-notebook.secretName" . }}
                  key: {{ include "rapids-singlecell-notebook.secretKey" . }}
            # Which `obs` columns the ported notebooks group by. Not secret, and
            # the same for every deployment that chooses the same pair.
            - name: SC_BATCH_KEY
              value: {{ .Values.data.batchKey | quote }}
            - name: SC_LABEL_KEY
              value: {{ .Values.data.labelKey | quote }}
            - name: SC_BINDING_FILE
              value: /etc/sc/binding.json
            # The notebooks' own working directories, on the volume.
            - name: SC_DATA_DIR
              value: /workspace/data
            - name: SC_DERIVED_DIR
              value: /workspace/derived
            # sc_workspace.py and the notebooks are seeded into /workspace, and
            # /opt/sc is also importable so a tenant who has edited their copy
            # into a corner can still `sys.path` back to the shipped one.
            - name: PYTHONPATH
              value: /workspace/notebooks:/opt/sc
            # Telemetry off. A deployment serving patient-derived matrices inside
            # an enclave should not be reporting anything about itself.
            - name: DO_NOT_TRACK
              value: "1"
            - name: JUPYTER_PLATFORM_DIRS
              value: "1"
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          # `/login` — the one route jupyter_server serves without a credential,
          # which is what makes it usable as a probe at all. `/api/status` looks
          # like the obvious choice and is not: jupyter_server 2.17 answers it
          # 403 to an unauthenticated caller, so a probe on it marks the pod
          # unready for ever while the server behind it is serving perfectly
          # (measured on the image this chart pins, 2026-11-22).
          #
          # The startup probe has room for the environment install: pip fetches
          # 29 wheels and verifies every hash before the server starts, which is
          # ~30 s on a warm link and minutes on a cold one. A liveness probe
          # alone would restart the pod in the middle of it, for ever.
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: sc
              mountPath: /opt/sc
              readOnly: true
            - name: notebooks
              mountPath: /opt/sc-notebooks
              readOnly: true
            - name: binding
              mountPath: /etc/sc
              readOnly: true
            - name: shm
              mountPath: /dev/shm
          resources:
            # requests and limits are one map: a tenant cluster space sets
            # `maxLimitRequestRatio: 1`, so a pod whose request differs from its
            # limit is refused at admission and never exists.
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
              nvidia.com/gpu: {{ ternary .Values.gpu.count 0 .Values.gpu.enabled | quote }}
            limits:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
              nvidia.com/gpu: {{ ternary .Values.gpu.count 0 .Values.gpu.enabled | quote }}
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ $name }}-workspace
        - name: sc
          configMap:
            name: {{ $name }}
            defaultMode: 0555
        - name: notebooks
          configMap:
            name: {{ $name }}-notebooks
        - name: binding
          secret:
            secretName: {{ include "rapids-singlecell-notebook.secretName" . }}
            items:
              - key: binding.json
                path: binding.json
            # The slot may be empty — a deployment with no dataset bound reads
            # what the tenant uploads instead — and a Secret key that is not
            # there must not stop the pod from starting.
            optional: true
        # RAPIDS talks to its Dask workers over /dev/shm and the 64Mi default is
        # not enough. Memory-backed, so this counts against the container's
        # memory limit — `resources.memory` includes it.
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shm.size }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
