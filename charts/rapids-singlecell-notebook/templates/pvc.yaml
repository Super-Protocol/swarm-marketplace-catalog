{{- include "rapids-singlecell-notebook.validate" . -}}
{{- /*
The workspace. Kept across restarts because everything a tenant does here is in
it: their edits to the notebooks, the matrices they uploaded, and the derived
`.h5ad` files one notebook hands to the next. A published cluster space is
frozen — there is no exec and no port-forward into it — so a volume lost on a
restart is work that cannot be recovered by hand afterwards.
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rapids-singlecell-notebook.fullname" . }}-workspace
  labels:
    {{- include "rapids-singlecell-notebook.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
