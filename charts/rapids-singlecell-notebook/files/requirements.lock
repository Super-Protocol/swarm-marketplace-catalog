# The Python environment this deployment runs, pinned wheel by wheel.
#
# Rendered into a ConfigMap, so it is part of what the cloud digests and signs:
# every package the notebooks import is named, by sha256, inside the
# deployment's published evidence, and pip refuses to install a byte the lock
# did not name (`--require-hashes`). Without this the environment would be
# whatever PyPI served at boot — an unattested install behind an attested
# manifest, which is the one failure the evidence exists to make impossible.
#
# It is the closure of `requirements.in` resolved INSIDE the notebook image
# against the conda packages already there, which is why numpy, pandas, scipy,
# scikit-learn, numba and cupy are absent: the image provides them, and a second
# copy here would shadow the CUDA builds the RAPIDS libraries are linked against.
#
# Regenerate (README.md has the rationale):
#   docker run --rm --user root -v "$PWD/files:/w" \
#     --entrypoint bash rapidsai/notebooks:26.02-cuda13-py3.12 -lc \
#     'pip list --format=freeze | grep -v "@ file" > /w/image-constraints.txt
#      pip install --dry-run --report /w/report.json \
#        -c /w/image-constraints.txt -r /w/requirements.in'
# and turn report.json into this file with name==version + the archive sha256.
