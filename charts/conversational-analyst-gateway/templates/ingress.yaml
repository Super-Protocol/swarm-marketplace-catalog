{{- /*
Two routes, and the order matters: the identity provider is served under /auth and must NOT
sit behind the proxy that depends on it, or logging in requires being logged in.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: conversational-analyst
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ required "appHostname must be set" .Values.appHostname | quote }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: analyst-keycloak
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: analyst-oauth2-proxy
                port:
                  number: 4180
