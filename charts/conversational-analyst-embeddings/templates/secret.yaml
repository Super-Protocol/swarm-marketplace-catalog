{{- if .Values.enabled }}
{{- /*
The key the endpoint authenticates with. A Secret and not an argument: a command line is
rendered into the manifests, travels in the deployment bundle in clear and lands in the
evidence snapshot, where a key does not belong. The platform lifts every rendered Secret
out of the bundle and seals it for the target, which is also what keeps this value from
moving the attested digest.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: analyst-embeddings-auth
  labels:
    {{- include "analyst-embeddings.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.apiKey | quote }}
{{- end }}
