{{- include "ccd.validate" . -}}
{{- /*
Every credential this deployment holds, in the one place the platform protects. A Secret is
lifted out of the deployment bundle and sealed for the target before anything is applied, and its
contents are not in the evidence snapshot — which is both why a key belongs here and why a
generated value here costs the attested digest nothing.

The corpus binding is here for a second reason as well: it is the only value that differs
between two deployments of this version at the same parameters, so keeping it out of the snapshot
is what lets one declared digest describe a gated deployment and an ungated one alike.

Nothing in this chart puts a credential in an env value, a command argument or a ConfigMap.
Those are rendered into the manifests, travel in the bundle in clear, and are published.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ccd.name" . }}-secrets
  labels:
    {{- include "ccd.labels" . | nindent 4 }}
type: Opaque
stringData:
  console-password: {{ .Values.console.password | quote }}
  console-session-key: {{ .Values.console.sessionKey | quote }}
  # Authenticates this deployment to the generation endpoint beside it. That endpoint is on no
  # public address, but an unauthenticated inference endpoint is an unauthenticated inference
  # endpoint, and the client has to carry a key regardless.
  inference-api-key: {{ .Values.inference.apiKey | quote }}
  # The resolved `transcripts` data slot. Empty when nothing is attached, which is a supported
  # state: the deployment comes up and the console says no corpus is attached.
  corpus-binding: {{ .Values.corpus.bindingJson | quote }}
