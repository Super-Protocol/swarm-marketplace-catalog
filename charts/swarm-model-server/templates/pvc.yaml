{{- /*
Validated here as well as in configmap.yaml: this template is the first to ask
for the volume's size, and with `persistence.size` empty that size is derived
from the manifest — so a render that names no model at all would fail with
"nothing to size the volume from" rather than with the sentence written for it.
Helm aborts at the first `fail`, and which template reaches one first is not
something a chart should depend on.
*/ -}}
{{- include "swarm-model-server.validate" . -}}
{{- if .Values.persistence.enabled }}
{{- /*
The verified weights. Kept across restarts because the alternative is paying the
download again — 29 GiB for the largest of these listings — every time the pod
moves.
*/ -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "swarm-model-server.fullname" . }}-weights
  labels:
    {{- include "swarm-model-server.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ include "swarm-model-server.persistenceSize" . | quote }}
{{- end }}
