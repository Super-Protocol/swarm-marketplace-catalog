{{- if and .Values.apiKey (not .Values.existingSecret) }}
{{- /*
The only place the platform protects: every rendered Secret is lifted out of the
manifests and sealed for the target, and its contents are excluded from the
evidence snapshot. The same string in an argument or an env value would travel
in the bundle in clear.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "swarm-model-server.fullname" . }}
  labels:
    {{- include "swarm-model-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.apiKey | quote }}
{{- end }}
