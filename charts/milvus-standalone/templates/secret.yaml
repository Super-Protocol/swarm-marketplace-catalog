{{- /*
`user.yaml` is Milvus's own override file, and it carries the root password — so it is a Secret
and not the ConfigMap beside it. The platform lifts every rendered Secret out of the bundle and
seals it for the target, which is both what protects the credential and what keeps a
per-deployment generated value from moving the attested digest.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "milvus.name" . }}-config
  labels:
    {{- include "milvus.labels" . | nindent 4 }}
type: Opaque
stringData:
  user.yaml: |
    common:
      security:
        authorizationEnabled: true
        defaultRootPassword: {{ .Values.auth.rootPassword | quote }}
