{{- include "confidential-s3.validate" . -}}
{{- $component := "api" -}}
{{- $name := include "confidential-s3.componentName" (dict "root" . "component" $component) -}}
{{- /*
The control plane. It owns the schema and runs its migrations on boot, so nothing
sequences it: it is the first thing that needs PostgreSQL and the last thing the
gateway waits on — the gateway's three views do not exist until this has started
once.

There is no Ingress. The console runs beside it and is the only caller; putting
this on a hostname of its own would publish an API for no reader that does not
already have the console.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "confidential-s3.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "confidential-s3.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "confidential-s3.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "confidential-s3.image" (dict "image" .Values.api.image "name" "api") }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.api.service.port | quote }}
            {{- include "confidential-s3.databaseEnv" . | nindent 12 }}
            {{- include "confidential-s3.masterKeyEnv" . | nindent 12 }}
            - name: BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.bootstrapToken.existingSecret | default (include "confidential-s3.secretName" .) }}
                  key: {{ if .Values.bootstrapToken.existingSecret }}{{ .Values.bootstrapToken.existingSecretKey }}{{ else }}bootstrap-token{{ end }}
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.api.bootstrap.adminEmail | quote }}
            - name: BOOTSTRAP_WORKSPACE_NAME
              value: {{ .Values.api.bootstrap.workspaceName | quote }}
            - name: BOOTSTRAP_TOKEN_TTL_HOURS
              value: {{ .Values.api.bootstrap.tokenTtlHours | quote }}
            - name: INVITE_TOKEN_TTL_HOURS
              value: {{ .Values.api.inviteTokenTtlHours | quote }}
            - name: SESSION_TTL_HOURS
              value: {{ .Values.api.sessionTtlHours | quote }}
            # The console's file browser reads and writes objects through the
            # gateway rather than around it, and the control plane is what signs
            # those requests. Without this the console still manages buckets,
            # keys and users, and browsing answers 503.
            - name: GATEWAY_S3_ENDPOINT
              value: {{ printf "http://%s:%v" (include "confidential-s3.componentName" (dict "root" . "component" "gateway")) .Values.gateway.service.port | quote }}
          # `/readyz` does a real database round trip, so an unready pod is one
          # that cannot serve rather than one that has merely started. The
          # startup budget covers the migrations, which run before the first
          # answer on a fresh database.
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "confidential-s3.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "confidential-s3.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
