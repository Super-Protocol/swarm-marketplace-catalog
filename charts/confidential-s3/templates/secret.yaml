{{- include "confidential-s3.validate" . -}}
{{- /*
Everything secret this deployment has, in one object — which is the only place
the platform protects. Every Secret is lifted out of the manifests before they
are sent and sealed for the target, and is absent from the evidence snapshot; a
value anywhere else travels in the bundle in clear and is attested along with it.

That is also why the derivations live here rather than in a Job: a published
cluster space is frozen, so a Job that minted a credential would have nowhere to
write it. The chart derives both sides from one seed instead.

A deployment that already keeps one of these somewhere else points the matching
`existingSecret` at that object, and this one carries a key fewer.
*/ -}}
{{- $data := dict -}}

{{- if not .Values.masterKey.existingSecret -}}
{{- $_ := set $data "master-key" (include "confidential-s3.masterKey" .) -}}
{{- end -}}

{{- if not .Values.bootstrapToken.existingSecret -}}
{{- $_ := set $data "bootstrap-token" .Values.bootstrapToken.value -}}
{{- end -}}

{{- if not .Values.engine.existingSecret -}}
{{- $_ := set $data "engine-access-key" (include "confidential-s3.engineAccessKey" .) -}}
{{- $_ := set $data "engine-secret-key" (include "confidential-s3.engineSecretKey" .) -}}
{{- /*
Garage reads both of these from its environment rather than from `garage.toml`:
the file is a ConfigMap, and a ConfigMap is neither sealed nor lifted out.
*/ -}}
{{- $_ := set $data "garage-rpc-secret" (include "confidential-s3.garageRpcSecret" .) -}}
{{- $_ := set $data "garage-admin-token" (include "confidential-s3.garageAdminToken" .) -}}
{{- end -}}

{{- if .Values.postgresql.enabled -}}
{{- /*
Bitnami's chart takes the superuser password and the application user's from the
same object, under the two keys `postgresql.auth.secretKeys` names. This database
serves one application inside one namespace, so they are one value rather than a
second thing to rotate.
*/ -}}
{{- $_ := set $data "postgres-password" .Values.database.password -}}
{{- $_ := set $data "password" .Values.database.password -}}
{{- else if and .Values.database.password (not .Values.database.existingSecret) -}}
{{- $_ := set $data "password" .Values.database.password -}}
{{- end -}}
{{- if .Values.database.url -}}
{{- $_ := set $data "database-url" .Values.database.url -}}
{{- end -}}

{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "confidential-s3.secretName" . }}
  labels:
    {{- include "confidential-s3.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key := (keys $data | sortAlpha) }}
  {{ $key }}: {{ get $data $key | quote }}
  {{- end }}
{{- end }}
