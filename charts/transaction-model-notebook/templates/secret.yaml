{{- /*
The only place the platform protects: every rendered Secret is lifted out of the
manifests and sealed for the target, and its contents are excluded from the
evidence snapshot.

Two things are in here for two different reasons.

`token` is a credential, and the same string in a container argument or an env
value would travel in the deployment bundle in clear and land in the published
snapshot (marketplace trap 4).

`binding.json` is the marketplace's resolved dataset binding, which carries the
dataset owner's credentials — and, just as importantly, it is the one value in
this chart that differs between two deployments of the same version. In the
Secret it costs nothing: the snapshot never sees it, so the evidence digest stays
a property of the version rather than of whoever deployed it.
*/ -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "transaction-model-notebook.fullname" . }}
  labels:
    {{- include "transaction-model-notebook.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.token | default "" | quote }}
  binding.json: {{ .Values.data.bindingJson | default "" | quote }}
{{- end }}
