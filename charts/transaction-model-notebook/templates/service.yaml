apiVersion: v1
kind: Service
metadata:
  name: {{ include "transaction-model-notebook.fullname" . }}
  labels:
    {{- include "transaction-model-notebook.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "transaction-model-notebook.selectorLabels" . | nindent 4 }}
