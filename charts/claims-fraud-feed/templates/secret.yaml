{{- /*
Each party's client configuration, as a Secret so the passwords are sealed for the target and never
appear in a manifest. Two files, because two identities.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "feed.fullname" . }}-clients
type: Opaque
stringData:
  payer.properties: |
    security.protocol=SASL_PLAINTEXT
    sasl.mechanism=PLAIN
    sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.payer.username }}" password="{{ required "payer.password is required" .Values.payer.password }}";
  hospital.properties: |
    security.protocol=SASL_PLAINTEXT
    sasl.mechanism=PLAIN
    sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="{{ .Values.hospital.username }}" password="{{ required "hospital.password is required" .Values.hospital.password }}";
