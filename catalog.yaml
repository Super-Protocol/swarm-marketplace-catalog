apiVersion: swarm.cloud/v1alpha1
kind: CatalogSeed

# Everything below is *policy*, not definition. The specification deliberately keeps visibility,
# price, usage terms and grants off the AppDefinition and DataDefinition — they change without
# republishing, and Git is the wrong place for something meant to change instantly. This file is
# how a marketplace is filled from this repository for a demo or a test stand; a production
# marketplace gets the same facts from its own console.
#
# `${VAR}` is substituted from the environment at seed time. Real credentials never live here.

organizations:
  - slug: acme-corp
    name: Acme Corp
    verifiedPublisher: true
  - slug: meridian-data
    name: Meridian Data
    verifiedPublisher: false
  - slug: aivo
    name: Aivo
    verifiedPublisher: true
  - slug: reset-health
    name: Reset Health
    verifiedPublisher: true
  # The clinic in the gastroenterology demonstration: a six-site GI network that
  # owns its own records and publishes them to its own operator under the gate.
  # It is a separate organisation from reset-health deliberately — the boundary
  # the stand demonstrates is the tenant, so the clinic whose data it is cannot
  # be the same publisher as everybody else's.
  - slug: cypress-bay-digestive
    name: Cypress Bay Digestive Health
    verifiedPublisher: true
  # An internal platform team, which is who publishes third-party infrastructure in a company's own
  # marketplace. Deliberately not "Confluent": the publisher of a listing is whoever stands behind
  # it on this marketplace, and that is not the vendor here.
  - slug: platform-team
    name: Platform Team
    verifiedPublisher: true

apps:
  - path: apps/ollama-webui
    organization: acme-corp
  - path: apps/confidential-router
    organization: acme-corp
  # The model-serving family. Published by the platform team rather than by
  # acme-corp, because what these listings stand behind is the packaging and the
  # weights pin — the models themselves are Meta's, Google's and Qwen's, and the
  # publisher of a listing is whoever vouches for it on this marketplace.
  - path: apps/llama-3-2-3b-instruct
    organization: platform-team
  - path: apps/gemma-2-2b-it
    organization: platform-team
  - path: apps/qwen3-coder-30b-a3b-instruct-fp8
    organization: platform-team
  - path: apps/qwen3-coder-next-fp8
    organization: platform-team
  - path: apps/confidential-s3
    organization: acme-corp
  - path: apps/rag-agent
    organization: acme-corp
  - path: apps/confluent-platform
    organization: platform-team
  - path: apps/confidential-claims-fraud
    organization: platform-team
  # Ported from NVIDIA's open Single-Cell Analysis Blueprint (SUP-842). Published by
  # the platform team for the same reason the model-serving family is: the workflow
  # and its notebooks are scverse's and NVIDIA's, and what this listing stands behind
  # is the port — the image pin, the hash-pinned environment, the dataset slot and the
  # confidential execution. Naming it after NVIDIA would assert a relationship that
  # does not exist, and the container's own licence forbids implying one (§4(d)).
  - path: apps/confidential-single-cell-analysis
    organization: platform-team
  # Ported from NVIDIA's open RAG reference architecture (SUP-840), and the first
  # listing in that epic that needed real licence substitution rather than a
  # repackaging: the two NeMo Retriever NIMs, the generation NIM, Elasticsearch
  # and Redis Stack are all replaced. Published by the platform team for the same
  # reason as the rest of the ported family — what this listing stands behind is
  # the port, the pins and the confidential execution, not somebody else's brand.
  - path: apps/confidential-rag
    organization: platform-team
  - path: apps/conversational-analyst
    organization: aivo
    secrets:
      registryUsername: ${AIVO_REGISTRY_USERNAME}
      registryToken: ${AIVO_REGISTRY_TOKEN}

datasets:
  - path: datasets/acme-internal-knowledge-base
    organization: acme-corp
    sourceType: clickhouse
    visibility: restricted
    price: Internal
    expectedUpdate: Continuous (live table)
    secrets:
      kbReadUser: kb_reader
      kbReadPass: seed-only-password
    statistics:
      sizeBytes: "398458880"
      recordCount: "52000"
      format: JSONL
      usability: 9.6
      provenanceScore: 96
      provenanceAttested: true

  - path: datasets/retail-transactions
    organization: meridian-data
    sourceType: clickhouse
    visibility: public
    price: €0.02 / 1k rows
    expectedUpdate: Daily
    secrets:
      chReadUser: retail_reader
      chReadPass: seed-only-password
    statistics:
      sizeBytes: "4509715660"
      recordCount: "88000000"
      format: Parquet
      usability: 8.8
      provenanceScore: 91
      provenanceAttested: true

  - path: datasets/roczen-metabolic-programme
    organization: reset-health
    sourceType: clickhouse
    visibility: restricted
    price: On request
    expectedUpdate: Daily
    usageTerms: >-
      De-identified research use only. Aggregate results may be published; re-identification and
      record-level extraction are prohibited.
    secrets:
      readUser: ${CLINICS_READ_USER}
      readPassword: ${CLINICS_READ_PASSWORD}
    statistics:
      sizeBytes: "1288490188"
      recordCount: "2400000"
      format: ClickHouse MergeTree
      usability: 9.4
      provenanceScore: 94
      provenanceAttested: true

  # The one identifying clinical card on this catalog. The two above are
  # de-identified and prove nothing about reading a chart; this one carries names,
  # dates of birth and medical record numbers, because a surveillance tool has to
  # know which patient is overdue. `access.mode: gateway` is therefore load-bearing
  # rather than decorative, and the usage terms below say what the data is instead
  # of pretending it needs protecting.
  - path: datasets/cypressbay-digestive-health
    organization: cypress-bay-digestive
    sourceType: clickhouse
    visibility: restricted
    price: Not for sale
    expectedUpdate: On demand (regenerated from the committed generator)
    usageTerms: >-
      Synthetic demonstration data. No real patient is represented and no record is derived from
      one, so it may be loaded, queried and shown freely. It is not a substitute for real data in
      any evaluation that claims clinical validity.
    # Its own credential, not the one the two de-identified clinic cards share:
    # those point at a different ClickHouse, and a reader account is scoped to the
    # tables of one dataset here. On the marketplace stand this is `cbdh_reader`,
    # which holds SELECT on the eleven `cbdh_*` tables and nothing else.
    secrets:
      readUser: ${CYPRESSBAY_READ_USER}
      readPassword: ${CYPRESSBAY_READ_PASSWORD}
    statistics:
      sizeBytes: "18270732"
      recordCount: "131126"
      format: ClickHouse MergeTree
      usability: 9.7
      provenanceScore: 100
      provenanceAttested: true

  - path: datasets/autonomyx-inflammation-monitoring
    organization: reset-health
    sourceType: clickhouse
    visibility: restricted
    price: On request
    expectedUpdate: Continuous (live table)
    usageTerms: >-
      De-identified research use only. Aggregate results may be published; re-identification and
      record-level extraction are prohibited.
    secrets:
      readUser: ${CLINICS_READ_USER}
      readPassword: ${CLINICS_READ_PASSWORD}
    statistics:
      sizeBytes: "6871947674"
      recordCount: "31000000"
      format: ClickHouse MergeTree
      usability: 9.1
      provenanceScore: 94
      provenanceAttested: true

grants:
  - dataset: acme-internal-knowledge-base
    organizations: [acme-corp]
    apps: [rag-agent, confidential-rag]
  - dataset: retail-transactions
    organizations: [acme-corp]
    apps: [rag-agent]
  # The clinical datasets are the point of the Conversational Analyst listing: compatible *and* granted, so a
  # consumer can actually bind them rather than only see that they would fit.
  - dataset: roczen-metabolic-programme
    organizations: [reset-health, aivo]
    apps: [conversational-analyst]
  - dataset: autonomyx-inflammation-monitoring
    organizations: [reset-health, aivo]
    apps: [conversational-analyst]
  # The clinic grants its own organisation and the operator's. Which organisations
  # appear here is the whole of the tenant boundary the gastroenterology stand
  # demonstrates, so adding one is a decision and not housekeeping.
  - dataset: cypressbay-digestive-health
    organizations: [cypress-bay-digestive, aivo]
    apps: [conversational-analyst]

reviews:
  - app: ollama-webui
    kind: community
    rating: 5
    title: Deployed in minutes, evidence matched
    body: >-
      The expected digest on the listing matched what our cluster space reported after
      publishing. Model selection worked as documented.
    appVersion: "1.0.0"
    verifiedDeployment: true
    authorName: Alex Morgan
    authorRole: Platform engineer, Novus Bio

  - app: ollama-webui
    kind: lane
    lane: automated
    authorName: Container scanner
    score: 94
    verdict: No findings
    title: No known vulnerabilities in pinned images
    body: Both pinned digests scanned clean against the current advisory database.

  - app: ollama-webui
    kind: lane
    lane: ai
    authorName: AI reviewer
    score: 88
    verdict: Passed
    title: Definition matches its stated behaviour
    body: >-
      Declared parameters, resources and network exposure are consistent with the referenced
      charts.

  - app: rag-agent
    kind: community
    rating: 4
    title: Slot matching saved us a week
    body: >-
      Compatible datasets were listed before we deployed anything, so we knew what we were
      missing access to.
    appVersion: "1.2.0"
    authorName: Priya Raman
    authorRole: Data lead, Acme Corp

  - app: conversational-analyst
    kind: lane
    lane: ai
    authorName: AI reviewer
    score: 91
    verdict: Passed
    title: Grounding is derived, not hand-written
    body: >-
      The knowledge graph and the data-source registrations are built at deploy time from the
      bound datasets' published schemas, so what the agent believes about the data cannot drift
      from what the data owner declared.
