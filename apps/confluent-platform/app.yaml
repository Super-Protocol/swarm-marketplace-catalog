apiVersion: swarm.cloud/v1alpha1
kind: AppDefinition

metadata:
  name: confluent-platform
  title: Confluent Platform
  description: Apache Kafka with Confluent's Control Center — topics, schemas, consumer lag and message inspection from a browser.
  version: "1.5.0"
  category: data-streaming
  # The chart this listing deploys, which is where the wiring can be read; Confluent Platform
  # itself is not open source.
  sourceRepo: https://github.com/Super-Protocol/swarm-marketplace-catalog/tree/main/charts/confluent-platform
  # No SPDX identifier exists for Confluent's own licences, so it is named as a reference.
  license: LicenseRef-Confluent-Enterprise
  tags:
    - kafka
    - streaming
    - messaging
    - confluent

ui:
  sections:
    - id: access
      title: Access
      description: Where the console is served, and who may sign in to it.
      fields:
        - parameterId: consoleHostname
          widget: hostname
        - parameterId: adminPassword
          widget: password
        - parameterId: viewerPassword
          widget: password

    - id: licensing
      title: Licence
      description: >-
        A single-broker cluster runs under Confluent's developer licence: every commercial feature,
        free, with no expiry. Leave this empty unless you have been given an Enterprise key — and
        even then it can wait, because Control Center accepts one at any time under
        Administration → About → Licence.
      fields:
        - parameterId: licenseKey
          widget: password

    - id: components
      title: Components
      fields:
        - parameterId: schemaRegistry
          widget: switch
        - parameterId: ksqlDb
          widget: switch

    - id: storage
      title: Storage
      fields:
        - parameterId: kafkaStorage
          widget: select

parameters:
  - id: consoleHostname
    type: string
    title: Console hostname
    description: >-
      Where Control Center is served. Take the one offered and the DNS is written for you; bring
      your own and point it at this cloud's gateway before publishing the deployment.
    required: true
    validation:
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  - id: adminPassword
    type: string
    # The user name belongs in the title because this is the only place a person meets it: the
    # console asks for both at a browser prompt, and a password on its own does not open it.
    title: "Administrator password (user: admin)"
    description: >-
      For the `admin` account, which may create and delete topics and read any message in the
      cluster. Generated if left blank, and shown once this is deployed.
    sensitive: true
    generated: true

  - id: viewerPassword
    type: string
    title: "Read-only password (user: viewer)"
    description: >-
      For the `viewer` account, which can watch the cluster but not change it. Generated if left
      blank. Hand this one out rather than the administrator password.
    sensitive: true
    generated: true

  - id: licenseKey
    type: string
    title: Enterprise licence key
    description: >-
      Only needed once this cluster grows past one broker. Adding it here restarts the broker and
      the console with it; adding it in Control Center instead takes effect immediately, because
      the key is written to the cluster's own licence topic and every component reads it from
      there.
    sensitive: true

  - id: schemaRegistry
    type: boolean
    title: Schema Registry
    description: >-
      Serves Avro, Protobuf and JSON Schema subjects, and is what makes the console's Schemas
      section work. Reachable inside the cluster space only.
    default: true

  - id: ksqlDb
    type: boolean
    title: Stream processing (ksqlDB)
    description: >-
      Continuous SQL over the topics — joins, aggregations and derived streams that keep running as
      events arrive. Adds a pod and about a gigabyte of memory. Confluent Platform for Apache Flink
      is the other option and is licensed separately; ksqlDB is under the Community licence.
    default: false

  - id: clientPassword
    type: string
    title: "Client password (user: app)"
    description: >-
      Every connection to this cluster authenticates. Applications in the cluster space connect as
      `app`, which may read and write any topic. Generated if left blank.
    sensitive: true
    generated: true

  - id: consoleInternalPassword
    type: string
    title: Console internal credential
    description: >-
      What the sign-in proxy authenticates to Control Center with once it knows who signed in.
      Never shown and never typed; it exists so the console can still tell admin from viewer.
    sensitive: true
    generated: true

  - id: consoleCookieSecret
    type: string
    title: Console session key
    description: Signs the console's session cookie. Changing it signs everyone out.
    sensitive: true
    generated: true

  - id: kafkaStorage
    type: string
    title: Log storage
    description: >-
      Holds the topic log. Kafka keeps messages for seven days by default, so this is a function of
      how much you write rather than of how much you keep.
    required: true
    default: "20Gi"
    options:
      source:
        type: static
        values:
          - value: "20Gi"
            label: 20 GB
          - value: "50Gi"
            label: 50 GB
          - value: "100Gi"
            label: 100 GB
          - value: "250Gi"
            label: 250 GB

resources:
  # The quota the cluster space is created with, so it has to cover every container's limit at
  # once: the broker, Schema Registry, and the console pod's three processes together.
  min:
    cpu: "2"
    memory: "10Gi"
    storage: "30Gi"
  recommended:
    cpu: "4"
    memory: "12Gi"
    storage: "60Gi"

components:
  - name: platform
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: confluent-platform
      version: "0.6.0"
    # Pinned by digest, and the render fails if the chart ever references an image not listed here.
    # Confluent ships Control Center, its Prometheus and its Alertmanager as one matched set, so
    # the three carry the same version and are raised together.
    images:
      - name: confluentinc/cp-server
        digest: sha256:62e3b04c4c88d03fbb484b9976e6145f751c2e908310f3f8b2db5ae7fcd3608f
      - name: confluentinc/cp-schema-registry
        digest: sha256:f0cfd047a839c1ace54d93b92e3459f0d03dc3b5c9db1192a2246fd79b4f44c4
      - name: confluentinc/cp-enterprise-control-center-next-gen
        digest: sha256:10d81f0c7082ad3c7eed1efe4ebb702d9cdb092ba297c15b97b7fd8f89df097f
      - name: confluentinc/cp-enterprise-prometheus
        digest: sha256:19fa37215dc599ee81aeaf6c64efab2501b79048a3fad105eaecede5c95329a9
      - name: confluentinc/cp-enterprise-alertmanager
        digest: sha256:787c71440e0a17f5755854701b886b3878979d7cb62eac6897850c99ae7cd844
      # Collects the password with a form and carries it afterwards in a session cookie, then
      # presents the signed-in user to Control Center so the console still applies its roles.
      - name: quay.io/oauth2-proxy/oauth2-proxy
        digest: sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
      - name: confluentinc/cp-ksqldb-server
        digest: sha256:213f8b8368fb417f75aca1c057bbde866cd8c8e802e2d0e28d1d430a34bb94bf
    deployment:
      values:
        base:
          consoleHostname: "{{ params.consoleHostname }}"
          sasl:
            adminPassword: "{{ params.adminPassword }}"
            # One account for the applications sharing this cluster. A deployment that has to keep
            # two parties apart declares an account each, with its own topics — see the
            # confidential-claims-fraud listing, which composes this same chart that way.
            accounts:
              - name: app
                password: "{{ params.clientPassword }}"
                produce: ["*"]
                consume: ["*"]
                groups: ["*"]
          license: "{{ params.licenseKey }}"
          auth:
            enabled: true
            adminUser: admin
            adminPassword: "{{ params.adminPassword }}"
            viewerUser: viewer
            viewerPassword: "{{ params.viewerPassword }}"
            internalPassword: "{{ params.consoleInternalPassword }}"
            cookieSecret: "{{ params.consoleCookieSecret }}"
          kafka:
            storage: "{{ params.kafkaStorage }}"
          schemaRegistry:
            enabled: true
          # Off in the base so the switch below has something to replace, and so a deployment that
          # does not want stream processing does not carry the pod.
          ksqldb:
            enabled: false
        patches:
          - op: replace
            path: schemaRegistry.enabled
            value: false
            when: "params.schemaRegistry == false"

          - op: replace
            path: ksqldb.enabled
            value: true
            when: "params.ksqlDb == true"

outputs:
  - id: consoleUrl
    title: Control Center
    type: url
    value: "https://{{ params.consoleHostname }}"

  - id: signIn
    title: Sign in to the console
    type: string
    value: "A form asks for a user and password. Two accounts: admin, which may change the cluster, and viewer, which may only watch it. Their passwords are below."

  - id: adminPassword
    title: Password for admin
    type: secret
    value: "{{ params.adminPassword }}"

  - id: viewerPassword
    title: Password for viewer
    type: secret
    value: "{{ params.viewerPassword }}"

  - id: bootstrapServers
    title: Kafka, inside the cluster space
    type: string
    value: "{{ components.platform.release }}-kafka.{{ namespace }}.svc.cluster.local:9092 (SASL_PLAINTEXT / PLAIN, user \"app\")"

  - id: clientPassword
    title: Password for the app account
    type: secret
    value: "{{ params.clientPassword }}"

  - id: schemaRegistryUrl
    title: Schema Registry, inside the cluster space
    type: string
    when: "params.schemaRegistry == true"
    value: "http://{{ components.platform.release }}-schema-registry.{{ namespace }}.svc.cluster.local:8081"

  - id: licenceState
    title: Licence
    type: string
    when: "params.licenseKey == ''"
    value: "Developer licence: one broker, every commercial feature, no expiry. An Enterprise key can be added later in Control Center under Administration → About → Licence."

# Evidence exclusions are deliberately absent, and it is worth writing down why.
#
# What this listing would declare is settled and short: the namespace it was given, and the
# hostname it was asked to serve. Nothing else varies between two deployments — the Kafka cluster
# id is fixed in the chart precisely so that it does not — and passwords never appear, because they
# are sealed into Secrets that the canonical rules strip.
#
# It cannot be written down yet. `evidence` is not in the published specification these listings are
# validated against (the same gap that keeps conversational-analyst on the known-invalid list,
# SUP-99), and a digest can only be declared after a real deployment has been measured anyway. The
# order is: land the block in the spec, deploy, measure, declare.
