apiVersion: swarm.cloud/v1alpha1
kind: AppDefinition

metadata:
  name: conversational-analyst
  title: Conversational Analyst
  description: >-
    A conversational analyst for your own data. Connect one or more datasets and ask questions in
    plain language: the agent finds the relevant tables, writes the SQL, runs it inside the
    confidential cluster space and answers with figures and charts. Raw records never leave the
    space and never reach the model — only aggregates do.
  version: "3.0.6"
  category: ai-agents
  license: Proprietary
  tags:
    - ai
    - agent
    - analytics
    - text-to-sql
    - confidential

ui:
  sections:
    - id: access
      title: Access
      description: Where the agent is reachable and who may sign in.
      fields:
        - parameterId: appHostname
          widget: hostname
        - parameterId: internalSecret

    - id: model
      title: Model
      description: The language model that reads your questions and writes the SQL.
      fields:
        - parameterId: llmModel
          widget: select

    - id: appearance
      title: Appearance
      fields:
        - parameterId: brandTitle

parameters:
  - id: appHostname
    type: string
    title: Hostname
    description: >-
      The public hostname the agent is served on. Take the one offered and the DNS is written for
      you; bring your own and point it at this cloud's gateway before publishing the deployment.
    required: true
    validation:
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  - id: internalSecret
    type: string
    title: Internal credential
    description: >-
      Protects every service inside this deployment — the databases, the graph, the identity
      provider and the demo login. Leave it blank and one is generated for you; nothing outside
      the cluster space can reach these services either way.
    required: true
    sensitive: true
    generated: true
    validation:
      minLength: 16

  - id: llmModel
    type: string
    title: Model
    description: Used both for understanding the question and for generating SQL.
    required: true
    default: gemini-3.1-pro-preview
    options:
      source:
        type: static
        values:
          - value: gemini-3.1-pro-preview
            label: Gemini 3.1 Pro (preview)
          - value: gemini-3-flash-preview
            label: Gemini 3 Flash (preview)
          - value: gemini-2.5-pro
            label: Gemini 2.5 Pro
          - value: gemini-2.5-flash
            label: Gemini 2.5 Flash

  - id: brandTitle
    type: string
    title: Product name
    description: Shown in the browser tab and the header.
    required: true
    default: AI Analyst

secrets:
  - name: googleApiKey
    title: Google AI API key
    description: >-
      Calls the selected Gemini model. Held by the publisher, so the same account answers for every
      deployment and nobody deploying has to bring one.
  - name: openaiApiKey
    title: OpenAI API key
    description: >-
      Embeds the table and column descriptions of the connected datasets, which is how the agent
      finds the right tables for a question. Also used for voice input.
  - name: registryUsername
    title: Container registry username
    description: An account with read access to the agent's images.
  - name: registryToken
    title: Container registry token
    description: A read-only token for that account.

resources:
  min:
    cpu: "6"
    memory: "16Gi"
    # PostgreSQL 8, Redis 8, NATS 10, MinIO 20 and Neo4j 10 come to 56 before the platform
    # rounds anything, and a quota that tight fails at the last volume rather than the first.
    storage: "80Gi"
  recommended:
    cpu: "12"
    memory: "32Gi"
    storage: "120Gi"

data:
  slots:
    - name: datasets
      title: Datasets
      description: >-
        The data the agent answers questions about. Each dataset's published table and column
        descriptions become the agent's knowledge of it — there is nothing else to fill in.
      required: true
      multiple: true
      accepts:
        - interface: clickhouse-http/v1
        - interface: clickhouse-native/v1

components:
  # ---------------------------------------------------------------------------
  # Storage and messaging. Everything stateful, deployed first because the rest
  # will not start without it.
  # ---------------------------------------------------------------------------
  - name: platform
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: conversational-analyst-platform
      version: "0.3.0"
    deployment:
      values:
        base:
          internalSecret: ""
          imagePullSecret:
            registry: registry.aggregion.com
            username: ""
            password: ""
          postgresql:
            auth:
              postgresPassword: ""
              username: retail_ai_user
              password: ""
              database: retail_ai
          redis:
            global:
              redis:
                password: ""
          minio:
            rootPassword: ""
        patches:
          - op: replace
            path: internalSecret
            value: "{{ params.internalSecret }}"
          - op: replace
            path: imagePullSecret.username
            value: "{{ secrets.registryUsername }}"
          - op: replace
            path: imagePullSecret.password
            value: "{{ secrets.registryToken }}"
          - op: replace
            path: postgresql.auth.postgresPassword
            value: "{{ params.internalSecret }}"
          - op: replace
            path: postgresql.auth.password
            value: "{{ params.internalSecret }}"
          - op: replace
            path: redis.global.redis.password
            value: "{{ params.internalSecret }}"
          - op: replace
            path: minio.rootPassword
            value: "{{ params.internalSecret }}"

  # ---------------------------------------------------------------------------
  # Who may sign in, and which tenant they land in.
  # ---------------------------------------------------------------------------
  - name: identity
    dependsOn:
      - platform
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: conversational-analyst-identity
      version: "0.5.1"
    deployment:
      values:
        base:
          internalSecret: ""
          appHostname: ""
          tenant:
            name: ""
            alias: workspace
          demoUser:
            username: ""
            email: ""
            firstName: ""
            lastName: ""
          keycloak:
            auth:
              adminPassword: ""
            externalDatabase:
              password: ""
            extraEnvVars:
              # The issuer must match the public URL down to the /auth path, or the gateway
              # rejects every token this realm mints.
              - name: KC_HOSTNAME
                value: ""
              - name: KC_HOSTNAME_STRICT
                value: "false"
              - name: KC_HTTP_ENABLED
                value: "true"
              # Organizations are how the agent resolves a tenant; without the feature flag a
              # signed-in user has no tenant and gets an error instead of a chat.
              - name: KEYCLOAK_EXTRA_ARGS
                value: "--features organization"
              - name: RAI_SERVICE_DISCOVERY_URL
                value: ""
        patches:
          - op: replace
            path: internalSecret
            value: "{{ params.internalSecret }}"
          - op: replace
            path: appHostname
            value: "{{ params.appHostname }}"
          # The workspace, its first administrator and their address are what the marketplace
          # already knows about who is deploying. Reading them keeps the agent's idea of the
          # organization the same as the marketplace's, rather than a second one typed by hand.
          - op: replace
            path: tenant.name
            value: "{{ consumer.organization.name }}"
          - op: replace
            path: tenant.alias
            value: "{{ consumer.organization.slug }}"
          - op: replace
            path: demoUser.username
            value: "{{ consumer.user.email }}"
          - op: replace
            path: demoUser.email
            value: "{{ consumer.user.email }}"
          - op: replace
            path: demoUser.firstName
            value: "{{ consumer.user.name }}"
          - op: replace
            path: demoUser.lastName
            value: ""
          - op: replace
            path: keycloak.auth.adminPassword
            value: "{{ params.internalSecret }}"
          - op: replace
            path: keycloak.externalDatabase.password
            value: "{{ params.internalSecret }}"
          - op: replace
            path: keycloak.extraEnvVars.0.value
            value: "https://{{ params.appHostname }}/auth"
          - op: replace
            path: keycloak.extraEnvVars.4.value
            value: "http://{{ components.agent.release }}-service-discovery"

  # ---------------------------------------------------------------------------
  # The agent itself.
  # ---------------------------------------------------------------------------
  - name: agent
    dependsOn:
      - identity
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: conversational-analyst-agent
      version: "0.4.0"
    deployment:
      values:
        base:
          aivo:
            config:
              config:
                services:
                  identityService:
                    clientSecret: ""
                  api:
                    db:
                      config:
                        password: ""
                    redis:
                      password: ""
                    fileStorage:
                      config:
                        secretAccessKey: ""
                    embeddings:
                      apiKey: ""
                    llmSmart:
                      apiKey: ""
                      model: ""
                    llmFast:
                      apiKey: ""
                      model: ""
                    checkpointer:
                      uri: ""
                    stt:
                      apiKey: ""
                  ui:
                    logoutUrl: ""
                  instance:
                    endpoints:
                      graphqlHttp: ""
                      graphqlWs: ""
                    brand:
                      name: ""
                      title: ""
        patches:
          - op: replace
            path: aivo.config.config.services.identityService.clientSecret
            value: "{{ params.internalSecret }}"
          - op: replace
            path: aivo.config.config.services.api.db.config.password
            value: "{{ params.internalSecret }}"
          - op: replace
            path: aivo.config.config.services.api.redis.password
            value: "{{ params.internalSecret }}"
          - op: replace
            path: aivo.config.config.services.api.fileStorage.config.secretAccessKey
            value: "{{ params.internalSecret }}"
          - op: replace
            path: aivo.config.config.services.api.embeddings.apiKey
            value: "{{ secrets.openaiApiKey }}"
          - op: replace
            path: aivo.config.config.services.api.stt.apiKey
            value: "{{ secrets.openaiApiKey }}"
          - op: replace
            path: aivo.config.config.services.api.llmSmart.apiKey
            value: "{{ secrets.googleApiKey }}"
          - op: replace
            path: aivo.config.config.services.api.llmSmart.model
            value: "{{ params.llmModel }}"
          - op: replace
            path: aivo.config.config.services.api.llmFast.apiKey
            value: "{{ secrets.googleApiKey }}"
          - op: replace
            path: aivo.config.config.services.api.llmFast.model
            value: "{{ params.llmModel }}"
          - op: replace
            path: aivo.config.config.services.api.checkpointer.uri
            value: "postgresql://checkpointer_user:{{ params.internalSecret }}@analyst-postgresql:5432/retail_ai_checkpointer"
          - op: replace
            path: aivo.config.config.services.ui.logoutUrl
            value: "/oauth2/sign_out?rd=https%3A%2F%2F{{ params.appHostname }}%2Fauth%2Frealms%2Fmaster%2Fprotocol%2Fopenid-connect%2Flogout"
          - op: replace
            path: aivo.config.config.services.instance.endpoints.graphqlHttp
            value: "https://{{ params.appHostname }}/graphql"
          - op: replace
            path: aivo.config.config.services.instance.endpoints.graphqlWs
            value: "wss://{{ params.appHostname }}/graphql"
          - op: replace
            path: aivo.config.config.services.instance.brand.name
            value: "{{ params.brandTitle }}"
          - op: replace
            path: aivo.config.config.services.instance.brand.title
            value: "{{ params.brandTitle }}"

  # ---------------------------------------------------------------------------
  # The public door: authentication in front of the agent, and the routing that
  # keeps the identity provider outside it.
  # ---------------------------------------------------------------------------
  - name: gateway
    dependsOn:
      - agent
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: conversational-analyst-gateway
      version: "0.3.0"
    deployment:
      values:
        base:
          appHostname: ""
          oauth2-proxy:
            config:
              clientID: analyst
              clientSecret: ""
              configFile: ""
            alphaConfig:
              configData:
                providers:
                  - id: keycloak
                    provider: keycloak-oidc
                    clientID: analyst
                    clientSecret: ""
                    loginURL: ""
                    redeemURL: http://analyst-keycloak/auth/realms/master/protocol/openid-connect/token
                    oidcConfig:
                      issuerURL: ""
                      jwksURL: http://analyst-keycloak/auth/realms/master/protocol/openid-connect/certs
                      skipDiscovery: true
                      emailClaim: email
                      groupsClaim: groups
                      userIDClaim: sub
                    scope: openid email profile
                injectRequestHeaders:
                  - name: x-auth-subject
                    values:
                      - claimSource:
                          claim: user
                  - name: x-auth-user
                    values:
                      - claimSource:
                          claim: user
                  - name: x-auth-email
                    values:
                      - claimSource:
                          claim: email
                upstreamConfig:
                  upstreams:
                    - id: backend
                      path: /graphql
                      uri: ""
                    - id: frontend
                      path: /
                      uri: ""
        patches:
          - op: replace
            path: appHostname
            value: "{{ params.appHostname }}"
          - op: replace
            path: oauth2-proxy.config.clientSecret
            value: "{{ params.internalSecret }}"
          - op: replace
            path: "oauth2-proxy.alphaConfig.configData.providers.0.clientSecret"
            value: "{{ params.internalSecret }}"
          # Split horizon: the browser is sent to the public identity provider to log in, while
          # the token exchange and key fetch happen over the in-cluster service. The issuer the
          # token carries stays the public one either way.
          - op: replace
            path: "oauth2-proxy.alphaConfig.configData.providers.0.loginURL"
            value: "https://{{ params.appHostname }}/auth/realms/master/protocol/openid-connect/auth"
          - op: replace
            path: "oauth2-proxy.alphaConfig.configData.providers.0.oidcConfig.issuerURL"
            value: "https://{{ params.appHostname }}/auth/realms/master"
          - op: replace
            path: "oauth2-proxy.alphaConfig.configData.upstreamConfig.upstreams.0.uri"
            value: "http://{{ components.agent.release }}-retail-ai-back"
          - op: replace
            path: "oauth2-proxy.alphaConfig.configData.upstreamConfig.upstreams.1.uri"
            value: "http://{{ components.agent.release }}-retail-ai-front"
          - op: replace
            path: oauth2-proxy.config.configFile
            value: |
              email_domains = ["*"]
              redirect_url = "https://{{ params.appHostname }}/oauth2/callback"
              whitelist_domains = ["{{ params.appHostname }}"]
              skip_provider_button = true
              reverse_proxy = true

              session_store_type = "redis"
              redis_connection_url = "redis://default:{{ params.internalSecret }}@analyst-redis-master:6379/3"
              cookie_secure = true
              cookie_refresh = "1h"
              cookie_expire = "168h"

              standard_logging = true
              auth_logging = true

  # ---------------------------------------------------------------------------
  # What turns "a dataset is attached" into "the agent can answer questions
  # about it": data-source registration and the knowledge graph, both built from
  # the descriptions the dataset publisher already wrote.
  # ---------------------------------------------------------------------------
  - name: grounding
    dependsOn:
      - agent
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: conversational-analyst-grounding
      version: "0.3.0"
    deployment:
      values:
        base:
          internalSecret: ""
          bindings: "[]"
          llm:
            provider: google
            model: ""
            apiKey: ""
          embeddings:
            model: text-embedding-3-small
            dimensions: 1536
            apiKey: ""
        patches:
          - op: replace
            path: internalSecret
            value: "{{ params.internalSecret }}"
          - op: replace
            path: bindings
            value: "{{ data.datasets | json }}"
          - op: replace
            path: llm.model
            value: "{{ params.llmModel }}"
          - op: replace
            path: llm.apiKey
            value: "{{ secrets.googleApiKey }}"
          - op: replace
            path: embeddings.apiKey
            value: "{{ secrets.openaiApiKey }}"

outputs:
  - id: appUrl
    title: Agent
    type: url
    value: "https://{{ params.appHostname }}"

  - id: signIn
    title: Sign-in
    type: string
    value: "Sign in as {{ consumer.user.email }} with the internal credential. That account administers the realm."

# What a deployment of this version attests to.
#
# The digest is over the namespace as the cluster returns it, so anything a consumer chooses would
# otherwise make it their digest rather than this version's. The exclusions below name exactly what
# varies, found by rendering the application as two different consumers and diffing
# (`cli/evidence-preview.js`), and the resulting set is itself part of what gets digested — a running
# deployment cannot widen it.
#
# What stays attested is the software and how it is wired: every image, the replica counts, the
# commands, the ports, the volumes, the service topology, and the egress configuration through which
# this application reaches gated data. What is not attested is the value of the credential the
# platform generated for this deployment, anything derived from it (the checksum annotations charts
# put on their pods), and the hostname the operator chose — the gate binds evidence to the host it
# fetched it from, so the hostname is established by the channel rather than by the digest.
#
# `expectedDigest` is deliberately absent until this version has been deployed once and measured.
# It cannot be derived from the charts — a cluster defaults fields no template writes — so it comes
# from a reference deployment's own published evidence. Carrying the previous version's value here
# would be a declaration nothing was ever compared against, and would read as one that was.
evidence:
  exclude:
    # Every deployment lives in a namespace of its own.
    - fields:
        - "/metadata/namespace"

    # Derived from the generated internal credential, so different for every deployment.
    - match: { kind: ConfigMap, name: analyst-keycloak-bootstrap }
      fields:
        - "/data/bootstrap.sh"
    - match: { kind: ConfigMap, name: analyst-keycloak-env-vars }
      fields:
        - "/data/JAVA_OPTS_APPEND"
    - match: { kind: ConfigMap, name: analyst-oauth2-proxy }
      fields:
        - "/data/oauth2_proxy.cfg"
    - match: { kind: ConfigMap, name: analyst-postgres-initdb }
      fields:
        - "/data/create_databases.sql"
    - match: { kind: ConfigMap, name: conversational-analyst-agent-config-config }
      fields:
        - "/data/services.yaml"
    - match: { kind: Deployment, name: analyst-minio }
      fields:
        - "/spec/template/metadata/annotations/checksum~1secrets"
    - match: { kind: Deployment, name: analyst-oauth2-proxy }
      fields:
        - "/spec/template/metadata/annotations/checksum~1alpha-config"
        - "/spec/template/metadata/annotations/checksum~1config"
        - "/spec/template/metadata/annotations/checksum~1secret"
    - match: { kind: StatefulSet, name: analyst-keycloak }
      fields:
        - "/spec/template/metadata/annotations/checksum~1configmap-env-vars"
        - "/spec/template/metadata/annotations/checksum~1secrets"
        - "/spec/template/spec/containers/0/env/6/value"
    - match: { kind: StatefulSet, name: analyst-redis-master }
      fields:
        - "/spec/template/metadata/annotations/checksum~1secret"
    - match: { kind: StatefulSet, name: neo4j }
      fields:
        - "/spec/template/spec/containers/0/env/0/value"

    # The hostname the operator chose.
    - match: { kind: Ingress, name: conversational-analyst }
      fields:
        - "/spec/rules/0/host"

