apiVersion: swarm.cloud/v1alpha1
kind: AppDefinition

metadata:
  name: conversational-analyst
  title: Conversational Analyst
  description: >-
    A conversational analyst for your own data, with the language model inside the deployment.
    Connect one or more datasets and ask questions in plain language: the agent finds the
    relevant tables, writes the SQL, runs it inside the confidential cluster space and answers
    with figures and charts. The model you point it at is yours — any OpenAI-compatible
    endpoint, including one in your own perimeter — and the embeddings that index your schema
    and documents are served from inside the deployment, so neither your data nor its
    description reaches a third party.
  version: "4.0.3"
  category: ai-agents
  license: Proprietary
  tags:
    - ai
    - agent
    - analytics
    - text-to-sql
    - confidential

# ---------------------------------------------------------------------------
# 4.0.3 is the first version of this line that STARTS. Three containers of
# 4.0.2 could not run, and each one was fatal on its own; all three were found
# by deploying it on `azure-test` and reading the namespace rather than the
# render (SUP-711):
#
#   * `analyst-garage` refused every boot — «Invalid RPC secret key: expected
#     32 bytes of random hex». Garage wants 64 hex characters and the chart
#     handed it the deployment's generated credential, which is 32 printable
#     ones. Fixed in the vendored chart (platform 0.4.1), because the
#     definition language has no hash function to convert it with.
#   * `analyst-keycloak` was OOMKilled in the Quarkus augmentation that
#     `start-dev` runs at every boot. 1Gi was never enough; 2Gi is measured
#     (identity 0.6.1).
#   * `agent-config`'s init container read a ConfigMap mount as a flat
#     directory of keys and died with EISDIR on the kubelet's own `..data`
#     entry, taking the five services that wait for it with it (agent 0.5.1).
#
# `expectedDigest` is therefore absent here and is declared in the next
# version, measured on the cloud the stand runs on: a digest is a function of
# the collecting cloud's build as well as of this definition, and 4.0.2's was
# measured on a cloud that no longer exists.
# ---------------------------------------------------------------------------
# 4.0.2 corrects the one `evidence.exclude` entry whose `match.name` named an
# object no deployment renders, and declares the digest that correction makes
# stable. Two deployments of 4.0.0 attested different snapshots because of that
# entry, so until this version there was no digest to declare (SUP-823).
# ---------------------------------------------------------------------------
# 4.0.1 declares `resources.maxPod`, and nothing else. No rendered manifest
# moves, so the digest measured on a deployment of 4.0.0 is the digest this
# version attests; the bump is the repository's rule that a changed definition
# changes its version, not a change to the deployment (SUP-824).
# ---------------------------------------------------------------------------
# 4.0.0 is the agent 1.17 listing. A major, because it changes what the
# operator is asked and what the deployment contains, not only its versions:
#
#   * The model is the operator's. 3.0.9 offered four Gemini options and the
#     publisher's own Google key; this asks for an OpenAI-compatible endpoint,
#     a model id and an access key, which may be an address inside the
#     operator's own perimeter. Both external-provider secrets are gone.
#   * Embeddings are served inside the deployment. They are mandatory in this
#     product — the knowledge index and schema search are built from them — so
#     sending them to a hosted provider sends every table name, every column
#     description and the contents of every document with them.
#   * Three organisations instead of one, because the boundary this product
#     enforces is the tenant and nothing else.
#   * Speech to text is off and nothing is masked. Both deliberate; see below.
#   * No Neo4j. Agent 1.17 has no graph backend: the schema catalogue, the
#     semantic model and the knowledge index are in PostgreSQL, which now has
#     to carry pgvector.
#   * Object storage is Garage. MinIO's images stopped being pullable.
# ---------------------------------------------------------------------------

ui:
  sections:
    - id: access
      title: Access
      description: Where the agent is reachable, and who administers it.
      fields:
        - parameterId: appHostname
          widget: hostname
        - parameterId: internalSecret

    - id: model
      title: Model
      description: >-
        The language model that reads the questions and writes the SQL. Any OpenAI-compatible
        endpoint — a model server in your own perimeter, a gateway, or a hosted provider. The
        agent talks to this address and to nothing else about your data.
      fields:
        - parameterId: modelLabel
          widget: text
        - parameterId: modelBaseUrl
          widget: text
        - parameterId: modelId
          widget: text
        - parameterId: modelApiKey
          widget: password

    - id: embeddings
      title: Embeddings
      description: >-
        How the agent indexes your schema and documents so it can find the right table. This
        is a second model, it is not optional, and whatever serves it sees your column
        descriptions and your documents — which is why the default is to run it here.
      fields:
        - parameterId: embeddingsInPerimeter
          widget: switch
        - parameterId: embeddingsModel
          widget: text
          visible: "params.embeddingsInPerimeter == false"
        - parameterId: embeddingsDimensions
          widget: number
        - parameterId: embeddingsBaseUrl
          widget: text
          visible: "params.embeddingsInPerimeter == false"
        - parameterId: embeddingsApiKey
          widget: password
          visible: "params.embeddingsInPerimeter == false"

    - id: organizations
      title: Organisations
      description: >-
        Who the agent's tenants are. The first is yours and you administer it; the other two
        are created empty, for parties whose data must stay out of each other's reach. Leave
        them blank for a single-tenant deployment.
      fields:
        - parameterId: primaryOrgName
          widget: text
        - parameterId: primaryOrgAlias
          widget: text
        - parameterId: secondOrgName
          widget: text
        - parameterId: secondOrgAlias
          widget: text
          visible: "params.secondOrgName != ''"
        - parameterId: thirdOrgName
          widget: text
        - parameterId: thirdOrgAlias
          widget: text
          visible: "params.thirdOrgName != ''"

    - id: automation
      title: Automation
      description: >-
        What the agent may do on its own, and what it may reach while doing it.
      fields:
        - parameterId: signalsEnabled
          widget: switch
        - parameterId: mcpServerName
          widget: text
        - parameterId: mcpServerUrl
          widget: text
          visible: "params.mcpServerName != ''"
        - parameterId: mcpServerToken
          widget: password
          visible: "params.mcpServerName != ''"

    - id: limits
      title: Result handling
      description: >-
        What the agent does with a result too large to put in front of the model. With the
        model inside your perimeter these stop being a confidentiality control and become a
        context budget: a large result stays in the deployment's own object storage either
        way, and the model is given a preview and a summary of it.
      fields:
        - parameterId: largeResultRows
          widget: number
        - parameterId: largeResultBytes
          widget: number
        - parameterId: previewRows
          widget: number
        - parameterId: modelContextWindow
          widget: number

    - id: appearance
      title: Appearance
      fields:
        - parameterId: brandTitle

parameters:
  - id: appHostname
    type: string
    title: Hostname
    description: >-
      The public hostname the agent is served on. Take the one offered and the DNS is written for
      you; bring your own and point it at this cloud's gateway before publishing the deployment.
    required: true
    validation:
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  - id: internalSecret
    type: string
    title: Internal credential
    description: >-
      Protects every service inside this deployment — the databases, the object store, the
      identity provider — and is the password of the administrator account below. Leave it
      blank and one is generated for you; it is shown afterwards under the deployment's
      credentials, because it is how you sign in.
    required: true
    sensitive: true
    generated: true
    validation:
      minLength: 16

  - id: modelLabel
    type: string
    title: Model name
    description: >-
      What this model is called in the administration screens and in the dialog's model picker.
      A label, not an address: the endpoint and the model id are the next two fields.
    required: true
    default: In-perimeter model

  - id: modelBaseUrl
    type: string
    title: Model endpoint
    description: >-
      The OpenAI-compatible base URL, ending in /v1. A model server inside your own perimeter
      is the point of this deployment; a gateway or a hosted provider works the same way. Tool
      calling is required — the agent cannot work without it.
    required: true
    validation:
      pattern: "^https?://[^\\s]+$"

  - id: modelId
    type: string
    title: Model
    description: The model id that endpoint serves, exactly as it reports it.
    required: true

  - id: modelApiKey
    type: string
    title: Model access key
    description: >-
      The key the endpoint authenticates with. Held in a Secret, sealed for this deployment, and
      never written into anything the deployment publishes. An endpoint that needs no key still
      needs a value here — the agent's client requires one and the endpoint will ignore it.
    required: true
    sensitive: true
    generated: true

  - id: embeddingsInPerimeter
    type: boolean
    title: Serve embeddings inside this deployment
    description: >-
      On: a small embedding model runs here, on CPU, reachable only from inside the deployment,
      from weights pinned by sha256. Off: you supply your own OpenAI-compatible embedding
      endpoint. There is no third option — embeddings are mandatory in this product, and
      whatever serves them sees your schema descriptions and your documents.
    default: true

  - id: embeddingsModel
    type: string
    title: Embedding model
    description: The model id your embedding endpoint serves.
    required: true
    default: bge-large-en-v1.5

  - id: embeddingsDimensions
    type: integer
    title: Embedding width
    description: >-
      How many numbers the embedding model returns. It has to be the model's real width: the
      knowledge index's column is created from it and cannot be re-sized once the index holds
      anything, which is why this cannot be changed on a reconfigure. 1024 is the width of the
      model served here.
    required: true
    default: 1024
    immutable: true
    validation:
      min: 64
      max: 4096

  - id: embeddingsBaseUrl
    type: string
    title: Embedding endpoint
    description: >-
      Your own OpenAI-compatible embedding endpoint, ending in /v1. The default is the one
      served inside this deployment; it is hidden while that is what you are using.
    required: true
    default: "http://analyst-embeddings/v1"
    validation:
      pattern: "^https?://[^\\s]+$"

  - id: embeddingsApiKey
    type: string
    title: Embedding access key
    description: >-
      The key the embedding endpoint authenticates with. Generated when the endpoint is the one
      served here — it authenticates even though nothing outside the deployment can reach it.
    required: true
    sensitive: true
    generated: true

  - id: primaryOrgName
    type: string
    title: Your organisation
    description: >-
      The tenant you land in and administer. Left blank it is the organisation deploying this,
      so the agent's idea of who you are is the same as the marketplace's; fill it in to call
      the tenant something else.
    required: false
    default: ""

  - id: primaryOrgAlias
    type: string
    title: Your organisation's short name
    description: >-
      Lowercase letters, digits and hyphens — it is the tenant's key and a DNS label. Left
      blank it is your organisation's own short name in the marketplace.
    required: false
    default: ""
    validation:
      pattern: "^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"

  - id: secondOrgName
    type: string
    title: Second organisation
    description: >-
      Created empty. There is no invitation anywhere in this product by design — membership is
      maintained in the sign-in system, which is what makes "who gets in" this organisation's
      own decision rather than this deployment's.
    required: false
    default: ""

  - id: secondOrgAlias
    type: string
    title: Second organisation's short name
    required: false
    default: ""
    validation:
      pattern: "^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"

  - id: thirdOrgName
    type: string
    title: Third organisation
    description: Also created empty.
    required: false
    default: ""

  - id: thirdOrgAlias
    type: string
    title: Third organisation's short name
    required: false
    default: ""
    validation:
      pattern: "^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"

  - id: signalsEnabled
    type: boolean
    title: Business signals
    description: >-
      Lets an autopilot publish a finding as a signal, which another autopilot can subscribe to
      and act on. Off is a kill switch: no tool to publish one, and no webhook leaves the
      deployment.
    default: true

  - id: mcpServerName
    type: string
    title: Tool server
    description: >-
      An MCP server the agent may call — a system it can write back to, not read data from.
      Leave blank for none. It must be reachable over https from this cloud; a private address
      is refused unless the installation administrator has allowed it.
    required: false
    default: ""

  - id: mcpServerUrl
    type: string
    title: Tool server address
    description: The server's /mcp endpoint, over https.
    required: false
    default: ""
    validation:
      pattern: "^$|^https://[^\\s]+$"

  - id: mcpServerToken
    type: string
    title: Tool server token
    description: >-
      Sent as `Authorization: Bearer …` on every call. Held in a Secret; blank if the server
      needs no token.
    required: false
    sensitive: true

  - id: largeResultRows
    type: integer
    title: Rows before a result is set aside
    description: >-
      A result with more rows than this is kept in the deployment's own object storage and the
      model is given a preview and a summary of it instead of the rows.
    required: true
    default: 100
    validation:
      min: 1
      max: 100000

  - id: largeResultBytes
    type: integer
    title: Bytes before a result is set aside
    description: The same ceiling by size. 102400 is 100 KB.
    required: true
    default: 102400
    validation:
      min: 1024
      max: 104857600

  - id: previewRows
    type: integer
    title: Preview rows
    description: How many rows of a set-aside result the model does see.
    required: true
    default: 20
    validation:
      min: 1
      max: 1000

  - id: modelContextWindow
    type: integer
    title: Context window
    description: >-
      The model's context window in tokens. The agent budgets the conversation against it; a
      value larger than the model really has is a request the endpoint refuses mid-answer.
    required: true
    default: 128000
    validation:
      min: 8000
      max: 2000000

  - id: brandTitle
    type: string
    title: Product name
    description: Shown in the browser tab and the header.
    required: true
    default: AI Analyst

secrets:
  # The two external-provider keys this listing used to hold — a Google AI key for the model
  # and an OpenAI key for embeddings and voice — are GONE, not merely unused. There is no
  # parameter that can point this deployment at either company, and no credential in the
  # publisher's store that a future version could quietly start using again.
  - name: registryUsername
    title: Container registry username
    description: An account with read access to the agent's images.
  - name: registryToken
    title: Container registry token
    description: A read-only token for that account.

resources:
  # The cluster space's quota, which has to cover every container's limit AT ONCE — including
  # the one-shot Jobs, which run while everything else is already up, and the surge pod a
  # rolling update adds. Measured from the rendered manifests of all six components, by pod
  # (a pod's demand is its containers' limits summed, or its heaviest init container,
  # whichever is larger):
  #
  #   PostgreSQL 1/4Gi   agent back 1/4Gi    worker 1/4Gi     embeddings 2/4Gi
  #   Keycloak 0.5/2Gi   Garage 0.25/1Gi     front 0.25/0.5Gi identity 0.25/0.5Gi
  #   NATS 0.2/0.375Gi   config, instance, service-discovery 0.1/0.25Gi each
  #   Redis 0.1/0.25Gi   proxy 0.1/0.125Gi   four Jobs 0.55/1Gi together
  #   and the marketplace's own egress sidecar, 0.25/0.125Gi, when gated data is mounted
  #
  # which is 7.75 CPU and 22.6Gi; one surge pod of the heaviest Deployment is another 1/4Gi.
  # (Keycloak is 2Gi from identity 0.6.1: at 1Gi it was OOMKilled in the Quarkus augmentation
  # before it served anything, which left the whole deployment without an identity provider.)
  #
  # Storage is the five volumes — PostgreSQL 20Gi, Garage 20Gi, NATS 10Gi, Redis 8Gi, the
  # embedding weights 4Gi — and the margin is not politeness: a storage quota equal to the sum
  # fails at the last volume rather than the first, which reads as one broken service rather
  # than as a quota.
  min:
    cpu: "10"
    memory: "28Gi"
    storage: "80Gi"
  # The heaviest SINGLE pod, which is a different quantity from the quota above and the one a
  # node has to be able to hold. Without it the cloud assumes the whole 10/28Gi lands on one pod
  # and refuses this listing on any cloud whose nodes are smaller than its entire quota — which
  # is every reasonable cloud for a thirteen-pod application (SUP-824). Embeddings is the
  # heaviest of the pods listed above; `charts/tests/max_pod.py` checks that against the render,
  # so this stays true when a chart's limits move.
  maxPod:
    cpu: "2"
    memory: "4Gi"
  recommended:
    cpu: "16"
    memory: "48Gi"
    storage: "160Gi"
  gpu:
    # Nothing here needs one. The embedding model runs on CPU on purpose — it must not compete
    # for a card with whatever serves the primary model — and the primary model is somewhere
    # else by definition.
    required: false

data:
  slots:
    - name: datasets
      title: Datasets
      description: >-
        The data the agent answers questions about. Each dataset's published table and column
        descriptions become the agent's knowledge of it — they are written into the schema
        catalogue, which is the only thing it knows about your data.
      required: true
      multiple: true
      accepts:
        - interface: clickhouse-http/v1
        - interface: clickhouse-native/v1

components:
  # ---------------------------------------------------------------------------
  # Storage and messaging. Everything stateful, deployed first because the rest
  # will not start without it.
  # ---------------------------------------------------------------------------
  - name: platform
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: conversational-analyst-platform
      version: "0.4.1"
    images:
      - name: pgvector/pgvector
        digest: sha256:b513c48566e4777cd3370451400000c78eda6a08131d68f4c31d4a76f27bd8fd
      - name: docker.io/bitnamilegacy/redis
        digest: sha256:e79fb409a7d2ccafb278d1cd762b4944072c7b99f73ce11d9068ef2efb9abe13
      - name: nats
        digest: sha256:88fe8e0e09d6084a06b3d4dbbffbca70fa632b1ad981af8473da23c446630957
      - name: natsio/nats-server-config-reloader
        digest: sha256:10ff229eaf52f42de80107c02d38f3b3ec1ef6084d444431938778f4bd00d3dd
      - name: dxflrs/garage
        digest: sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
      - name: busybox
        digest: sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
    deployment:
      values:
        base:
          imagePullSecret:
            registry: registry.aggregion.com
            username: ""
            password: ""
          postgresql:
            auth:
              password: ""
            databases:
              - name: retail_ai
                owner: retail_ai_user
                password: ""
                extensions: [vector, pg_trgm]
              - name: retail_ai_identity
                owner: identity_user
                password: ""
              - name: retail_ai_checkpointer
                owner: checkpointer_user
                password: ""
              - name: keycloak
                owner: keycloak_user
                password: ""
          redis:
            global:
              redis:
                password: ""
          garage:
            credentials:
              # Garage refuses an access key id shorter than 8 characters and a secret shorter
              # than 16, and does not start at all on a pair it rejects. The id is fixed —
              # it names the key, it is not a credential — and the secret is the deployment's.
              accessKeyId: analyst-s3
              secretAccessKey: ""
            rpcSecret: ""
            adminToken: ""
        patches:
          - op: replace
            path: imagePullSecret.username
            value: "{{ secrets.registryUsername }}"
          - op: replace
            path: imagePullSecret.password
            value: "{{ secrets.registryToken }}"
          - op: replace
            path: postgresql.auth.password
            value: "{{ params.internalSecret }}"
          - op: replace
            path: postgresql.databases.0.password
            value: "{{ params.internalSecret }}"
          - op: replace
            path: postgresql.databases.1.password
            value: "{{ params.internalSecret }}"
          - op: replace
            path: postgresql.databases.2.password
            value: "{{ params.internalSecret }}"
          - op: replace
            path: postgresql.databases.3.password
            value: "{{ params.internalSecret }}"
          - op: replace
            path: redis.global.redis.password
            value: "{{ params.internalSecret }}"
          - op: replace
            path: garage.credentials.secretAccessKey
            value: "{{ params.internalSecret }}"
          - op: replace
            path: garage.rpcSecret
            value: "{{ params.internalSecret }}"
          - op: replace
            path: garage.adminToken
            value: "{{ params.internalSecret }}"

  # ---------------------------------------------------------------------------
  # The embedding model, inside the deployment.
  #
  # Always a component, because a definition cannot have a conditional one; the
  # chart's own `enabled` is what the switch turns off, and an operator who
  # brings their own endpoint gets no objects from this at all.
  # ---------------------------------------------------------------------------
  - name: embeddings
    dependsOn:
      - platform
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: conversational-analyst-embeddings
      version: "0.1.0"
    # The names are exactly the strings the rendered manifests carry, registry prefix and
    # all: the render path matches on them, and `library/python` and `docker.io/library/python`
    # are not the same allow-list entry. `charts/tests/declared_images.py` is what keeps the
    # two in step.
    images:
      - name: ghcr.io/huggingface/text-embeddings-inference
        digest: sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c
      - name: docker.io/library/python
        digest: sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    deployment:
      values:
        base:
          enabled: true
          apiKey: ""
        patches:
          - op: replace
            path: apiKey
            value: "{{ params.embeddingsApiKey }}"
          - op: replace
            path: enabled
            value: false
            when: "params.embeddingsInPerimeter == false"

  # ---------------------------------------------------------------------------
  # Who may sign in, which tenant they land in, and the group tree agent 1.17
  # reads org-scoped roles out of.
  # ---------------------------------------------------------------------------
  - name: identity
    dependsOn:
      - platform
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: conversational-analyst-identity
      version: "0.6.1"
    images:
      - name: docker.io/bitnamilegacy/keycloak
        digest: sha256:5a480d090639bbb09b25dbdb70819dab3302118fd824c2bad03d12a93f46c82b
    deployment:
      values:
        base:
          internalSecret: ""
          appHostname: ""
          # Three entries, always. A definition cannot append to a list — the
          # specification's patch paths are dot-notation with numeric indices — so the
          # second and third are left blank when the operator does not fill them in, and
          # the chart treats a blank entry as an organisation this deployment does not
          # want rather than as a mistake.
          organizations:
            - name: ""
              alias: ""
            - name: ""
              alias: ""
            - name: ""
              alias: ""
          demoUser:
            username: ""
            email: ""
            firstName: ""
            lastName: ""
          keycloak:
            auth:
              adminPassword: ""
            externalDatabase:
              password: ""
            # Every one of these is the same in every deployment, so every one of them is
            # attested. `KC_HOSTNAME` is not here: it is the public hostname, and the chart
            # delivers it from a Secret through `envFrom` rather than as a literal in the pod
            # spec — which is what retires the `env/N/value` index exclusion 3.0.9 needed.
            extraEnvVars:
              - name: KC_HOSTNAME_STRICT
                value: "false"
              - name: KC_HTTP_ENABLED
                value: "true"
              # Organizations are how the agent resolves a tenant; without the feature flag a
              # signed-in user has no tenant and gets an error instead of a chat.
              - name: KEYCLOAK_EXTRA_ARGS
                value: "--features organization"
              - name: RAI_SERVICE_DISCOVERY_URL
                value: ""
        patches:
          - op: replace
            path: internalSecret
            value: "{{ params.internalSecret }}"
          - op: replace
            path: appHostname
            value: "{{ params.appHostname }}"
          # The organisations, in order; the first is the one the administrator lands in.
          # Everything here reaches a Secret rather than the attested ConfigMap, which is
          # what lets the deploying person's own name and address stay out of a snapshot
          # that is published.
          # The deploying organisation by default — `consumer.*` is how an application names
          # its first tenant without asking somebody to retype what the marketplace already
          # knows — and whatever the operator typed if they typed something.
          - op: replace
            path: organizations.0.name
            value: "{{ consumer.organization.name }}"
          - op: replace
            path: organizations.0.alias
            value: "{{ consumer.organization.slug }}"
          - op: replace
            path: organizations.0.name
            value: "{{ params.primaryOrgName }}"
            when: "params.primaryOrgName != ''"
          - op: replace
            path: organizations.0.alias
            value: "{{ params.primaryOrgAlias }}"
            when: "params.primaryOrgAlias != ''"
          - op: replace
            path: organizations.1.name
            value: "{{ params.secondOrgName }}"
          - op: replace
            path: organizations.1.alias
            value: "{{ params.secondOrgAlias }}"
          - op: replace
            path: organizations.2.name
            value: "{{ params.thirdOrgName }}"
          - op: replace
            path: organizations.2.alias
            value: "{{ params.thirdOrgAlias }}"
          - op: replace
            path: demoUser.username
            value: "{{ consumer.user.email }}"
          - op: replace
            path: demoUser.email
            value: "{{ consumer.user.email }}"
          - op: replace
            path: demoUser.firstName
            value: "{{ consumer.user.name }}"
          - op: replace
            path: demoUser.lastName
            value: ""
          - op: replace
            path: keycloak.auth.adminPassword
            value: "{{ params.internalSecret }}"
          - op: replace
            path: keycloak.externalDatabase.password
            value: "{{ params.internalSecret }}"
          - op: replace
            path: keycloak.extraEnvVars.3.value
            value: "http://{{ components.agent.release }}-service-discovery"

  # ---------------------------------------------------------------------------
  # The agent itself: the configuration service, the backend, the background
  # worker that runs autopilots and reads schemas, and the UI.
  # ---------------------------------------------------------------------------
  - name: agent
    dependsOn:
      - identity
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: conversational-analyst-agent
      version: "0.5.1"
    images:
      - name: registry.aggregion.com/gh/aivoagent/agent/backend
        digest: sha256:ead6c3816c5a492e3ebc657276a224e5db15374d8e0d491c08f1bda6987d41a8
      - name: registry.aggregion.com/gh/aivoagent/agent/frontend
        digest: sha256:6e2920d5cf5b3eb85576871795f838de17b2605574335d85c5cc8f7129f77515
    deployment:
      values:
        base:
          aivo:
            config:
              # Every credential the platform configuration refers to. These reach a Secret;
              # the configuration document itself keeps the `${NAME}` references and is
              # attested in full, so a verifier reads every endpoint, threshold and egress
              # rule out of the signed snapshot and sees exactly which values were withheld.
              configOverlay:
                ANALYST_IDENTITY_CLIENT_SECRET: ""
                ANALYST_DB_PASSWORD: ""
                ANALYST_IDENTITY_DB_PASSWORD: ""
                ANALYST_REDIS_PASSWORD: ""
                ANALYST_S3_ACCESS_KEY_ID: ""
                ANALYST_S3_SECRET_KEY: ""
                ANALYST_CHECKPOINTER_URI: ""
                ANALYST_MODEL_API_KEY: ""
                ANALYST_EMBEDDINGS_API_KEY: ""
                ANALYST_GRAPHQL_HTTP_URL: ""
                ANALYST_GRAPHQL_WS_URL: ""
                ANALYST_LOGOUT_URL: ""
              config:
                services:
                  api:
                    embeddings:
                      baseUrl: ""
                      model: ""
                      dimensions: 1024
                    llmSmart:
                      model: ""
                      baseURL: ""
                    mcp:
                      enabled: true
                    signals:
                      enabled: true
                  instance:
                    brand:
                      name: ""
                      title: ""
        patches:
          # --- credentials, all of them into the Secret -----------------------------
          - op: replace
            path: aivo.config.configOverlay.ANALYST_IDENTITY_CLIENT_SECRET
            value: "{{ params.internalSecret }}"
          - op: replace
            path: aivo.config.configOverlay.ANALYST_DB_PASSWORD
            value: "{{ params.internalSecret }}"
          - op: replace
            path: aivo.config.configOverlay.ANALYST_IDENTITY_DB_PASSWORD
            value: "{{ params.internalSecret }}"
          - op: replace
            path: aivo.config.configOverlay.ANALYST_REDIS_PASSWORD
            value: "{{ params.internalSecret }}"
          - op: replace
            path: aivo.config.configOverlay.ANALYST_S3_ACCESS_KEY_ID
            value: "analyst-s3"
          - op: replace
            path: aivo.config.configOverlay.ANALYST_S3_SECRET_KEY
            value: "{{ params.internalSecret }}"
          # The whole connection string, not the password inside it: a reference has to be
          # the entire value of its key, because a credential is substituted as a quoted
          # scalar and pasting one into the middle of a URI would corrupt the document.
          - op: replace
            path: aivo.config.configOverlay.ANALYST_CHECKPOINTER_URI
            value: "postgresql://checkpointer_user:{{ params.internalSecret }}@analyst-postgresql:5432/retail_ai_checkpointer"
          - op: replace
            path: aivo.config.configOverlay.ANALYST_MODEL_API_KEY
            value: "{{ params.modelApiKey }}"
          - op: replace
            path: aivo.config.configOverlay.ANALYST_EMBEDDINGS_API_KEY
            value: "{{ params.embeddingsApiKey }}"

          # --- the model, as the attested configuration records it -------------------
          - op: replace
            path: aivo.config.config.services.api.llmSmart.model
            value: "{{ params.modelId }}"
          - op: replace
            path: aivo.config.config.services.api.llmSmart.baseURL
            value: "{{ params.modelBaseUrl }}"

          # --- embeddings ------------------------------------------------------------
          # Unconditional, and that is the point. Both values default to the endpoint served
          # inside this deployment, so the switch above decides whether that endpoint EXISTS
          # and never what the agent is pointed at. The alternative — a conditional patch
          # with an empty value on one branch — fails the wrong way: the agent's OpenAI
          # client with no `baseUrl` goes to OpenAI, so an operator who turned the in-
          # perimeter server off without supplying a replacement would have their schema
          # descriptions and documents embedded by a hosted provider and nothing would say
          # so. Pointed at an address that is no longer there, it fails loudly instead.
          - op: replace
            path: aivo.config.config.services.api.embeddings.baseUrl
            value: "{{ params.embeddingsBaseUrl }}"
          - op: replace
            path: aivo.config.config.services.api.embeddings.model
            value: "{{ params.embeddingsModel }}"
          - op: replace
            path: aivo.config.config.services.api.embeddings.dimensions
            value: "{{ params.embeddingsDimensions }}"

          # --- automation ------------------------------------------------------------
          - op: replace
            path: aivo.config.config.services.api.signals.enabled
            value: false
            when: "params.signalsEnabled == false"
          # The tool server, when there is one. `globalServers` is a list the api reads
          # entry for entry; an empty one renders no key at all, which is what an operator
          # who named no server gets.
          - op: add
            path: aivo.config.config.services.api.mcp.globalServers
            value:
              - slug: tools
                name: "{{ params.mcpServerName }}"
                url: "{{ params.mcpServerUrl }}"
                description: "{{ params.mcpServerName }}"
            when: "params.mcpServerName != ''"
          # Both conditions, not just the token's: this patch addresses `globalServers.0`,
          # which only exists if the patch above applied. A token typed without a server name
          # would otherwise be a patch against a list that is not there.
          - op: add
            path: aivo.config.config.services.api.mcp.globalServers.0.authHeaders
            value:
              Authorization: "${ANALYST_MCP_TOOLS_AUTH}"
            when: "params.mcpServerName != '' && params.mcpServerToken != ''"
          - op: add
            path: aivo.config.configOverlay.ANALYST_MCP_TOOLS_AUTH
            value: "Bearer {{ params.mcpServerToken }}"
            when: "params.mcpServerName != '' && params.mcpServerToken != ''"

          # --- where the browser talks to it -----------------------------------------
          # Into the overlay, not into the configuration document. These three are the only
          # per-deployment values the agent's configuration has, and leaving them in it would
          # make `/data/services.yaml` differ for every consumer — which costs either a stable
          # digest or, if the whole document is then excluded, everything the digest was for.
          - op: replace
            path: aivo.config.configOverlay.ANALYST_LOGOUT_URL
            value: "/oauth2/sign_out?rd=https%3A%2F%2F{{ params.appHostname }}%2Fauth%2Frealms%2Fmaster%2Fprotocol%2Fopenid-connect%2Flogout"
          - op: replace
            path: aivo.config.configOverlay.ANALYST_GRAPHQL_HTTP_URL
            value: "https://{{ params.appHostname }}/graphql"
          - op: replace
            path: aivo.config.configOverlay.ANALYST_GRAPHQL_WS_URL
            value: "wss://{{ params.appHostname }}/graphql"
          - op: replace
            path: aivo.config.config.services.instance.brand.name
            value: "{{ params.brandTitle }}"
          - op: replace
            path: aivo.config.config.services.instance.brand.title
            value: "{{ params.brandTitle }}"

  # ---------------------------------------------------------------------------
  # The public door: authentication in front of the agent, and the routing that
  # keeps the identity provider outside it.
  # ---------------------------------------------------------------------------
  - name: gateway
    dependsOn:
      - agent
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: conversational-analyst-gateway
      version: "0.4.0"
    images:
      - name: quay.io/oauth2-proxy/oauth2-proxy
        digest: sha256:47b1db28264a646c5c07e1fb690e3deef7edbbb487030ad7c1f0b22f942d6837
    deployment:
      values:
        base:
          appHostname: ""
          oauth2proxy:
            config:
              clientID: analyst
              clientSecret: ""
              # Everything that is neither a credential nor the hostname. The two settings
              # that ARE the hostname reach the pod as environment from a ConfigMap of their
              # own, so this document can be attested whole instead of being excluded from
              # the digest because an address is inside it.
              configFile: |
                email_domains = ["*"]
                skip_provider_button = true
                reverse_proxy = true

                cookie_secure = true
                cookie_refresh = "1h"
                cookie_expire = "168h"

                standard_logging = true
                auth_logging = true
            # Sessions in the platform's Redis, with the password taken from its Secret into
            # an environment variable by the chart. A `redis_connection_url` carrying the
            # password would have put it in the ConfigMap above.
            sessionStorage:
              type: redis
              redis:
                clientType: standalone
                existingSecret: analyst-redis
                passwordKey: redis-password
                standalone:
                  connectionUrl: redis://analyst-redis-master:6379/3
            alphaConfig:
              configData:
                providers:
                  - id: keycloak
                    provider: keycloak-oidc
                    clientID: analyst
                    clientSecret: ""
                    loginURL: ""
                    redeemURL: http://analyst-keycloak/auth/realms/master/protocol/openid-connect/token
                    oidcConfig:
                      issuerURL: ""
                      jwksURL: http://analyst-keycloak/auth/realms/master/protocol/openid-connect/certs
                      skipDiscovery: true
                      emailClaim: email
                      groupsClaim: groups
                      userIDClaim: sub
                    scope: openid email profile
                injectRequestHeaders:
                  - name: x-auth-subject
                    values:
                      - claimSource:
                          claim: user
                  - name: x-auth-user
                    values:
                      - claimSource:
                          claim: user
                  - name: x-auth-email
                    values:
                      - claimSource:
                          claim: email
                upstreamConfig:
                  upstreams:
                    - id: backend
                      path: /graphql
                      uri: ""
                    - id: frontend
                      path: /
                      uri: ""
        patches:
          - op: replace
            path: appHostname
            value: "{{ params.appHostname }}"
          - op: replace
            path: "oauth2proxy.config.clientSecret"
            value: "{{ params.internalSecret }}"
          - op: replace
            path: "oauth2proxy.alphaConfig.configData.providers.0.clientSecret"
            value: "{{ params.internalSecret }}"
          # Split horizon: the browser is sent to the public identity provider to log in, while
          # the token exchange and key fetch happen over the in-cluster service. The issuer the
          # token carries stays the public one either way. Both of these are rendered into the
          # chart's alpha-config SECRET, which the platform lifts out of the bundle — so the
          # hostname in them is not in the evidence snapshot and needs no exclusion.
          - op: replace
            path: "oauth2proxy.alphaConfig.configData.providers.0.loginURL"
            value: "https://{{ params.appHostname }}/auth/realms/master/protocol/openid-connect/auth"
          - op: replace
            path: "oauth2proxy.alphaConfig.configData.providers.0.oidcConfig.issuerURL"
            value: "https://{{ params.appHostname }}/auth/realms/master"
          - op: replace
            path: "oauth2proxy.alphaConfig.configData.upstreamConfig.upstreams.0.uri"
            value: "http://{{ components.agent.release }}-retail-ai-back"
          - op: replace
            path: "oauth2proxy.alphaConfig.configData.upstreamConfig.upstreams.1.uri"
            value: "http://{{ components.agent.release }}-retail-ai-front"

  # ---------------------------------------------------------------------------
  # What turns "a dataset is attached" into "the agent can answer questions
  # about it": the model in the registry, the data sources, the schema
  # catalogue built from the descriptions the dataset publisher wrote, and the
  # system prompt.
  # ---------------------------------------------------------------------------
  - name: grounding
    dependsOn:
      - agent
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: conversational-analyst-grounding
      version: "0.4.0"
    images:
      - name: docker.io/library/python
        digest: sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
    deployment:
      values:
        base:
          bindings: "[]"
          api:
            url: ""
          keycloak:
            clientSecret: ""
          model:
            name: ""
            baseUrl: ""
            id: ""
            apiKey: ""
            thresholds:
              largeDataRowThreshold: 100
              largeDataSizeThreshold: 102400
              previewRowCount: 20
            contextWindowSize: 128000
        patches:
          - op: replace
            path: bindings
            value: "{{ data.datasets | json }}"
          - op: replace
            path: api.url
            value: "http://{{ components.agent.release }}-retail-ai-back"
          - op: replace
            path: keycloak.clientSecret
            value: "{{ params.internalSecret }}"
          # The model row the deployment actually answers on. The same four values are in the
          # agent's attested configuration, from the same parameters, so the registry and the
          # signed snapshot cannot describe different models.
          - op: replace
            path: model.name
            value: "{{ params.modelLabel }}"
          - op: replace
            path: model.baseUrl
            value: "{{ params.modelBaseUrl }}"
          - op: replace
            path: model.id
            value: "{{ params.modelId }}"
          - op: replace
            path: model.apiKey
            value: "{{ params.modelApiKey }}"
          - op: replace
            path: model.thresholds.largeDataRowThreshold
            value: "{{ params.largeResultRows }}"
          - op: replace
            path: model.thresholds.largeDataSizeThreshold
            value: "{{ params.largeResultBytes }}"
          - op: replace
            path: model.thresholds.previewRowCount
            value: "{{ params.previewRows }}"
          - op: replace
            path: model.contextWindowSize
            value: "{{ params.modelContextWindow }}"

outputs:
  - id: appUrl
    title: Agent
    type: url
    value: "https://{{ params.appHostname }}"

  - id: signIn
    title: Sign-in
    type: string
    value: "Sign in as {{ consumer.user.email }}. That account administers the realm, its own organisation and the installation."

  # Without this the deployment is unusable when the credential was generated, which is the
  # default: it is the administrator's password and nobody would ever see it. `type: secret`
  # puts it behind the key icon on the deployment row, for people who may deploy for the
  # organisation, and nowhere else.
  - id: administratorPassword
    title: Administrator password
    type: secret
    value: "{{ params.internalSecret }}"

# What a deployment of this version attests to.
#
# The digest is over the namespace as the cluster returns it, so anything a consumer chooses
# would otherwise make it their digest rather than this version's. The set below was not
# carried over from 3.0.9: it was re-derived by rendering all six components twice — two
# hostnames, two consumer identities, two organisation names, two generated credentials, two
# namespaces — canonicalising both the way the cloud does and diffing. Twelve fields differed
# and all twelve are here. Nothing else did, including every object's name.
#
# Four exclusions 3.0.9 needed are GONE, because the thing that varied was moved rather than
# hidden:
#
#   /data/services.yaml of the agent's configuration — the whole of it, every endpoint,
#       threshold and egress rule, was excluded because the credentials and the hostname were
#       inside it. They are now `${NAME}` references into a Secret, and the document is
#       attested in full. This is the one that matters: a deployment claiming its model is
#       inside the operator's perimeter has to let a verifier read *where the model is* out of
#       the signed snapshot, and until now it did not.
#   /data/bootstrap.sh of the realm bootstrap — the script was rendered with the credential
#       and the deploying person's own name and address in it. Both now arrive as environment
#       from a Secret.
#   /data/oauth2_proxy.cfg — the session store's Redis password was interpolated into it.
#       The proxy takes that password from the platform's own Secret instead.
#   /spec/template/spec/containers/0/env/6/value of the Keycloak StatefulSet — KC_HOSTNAME.
#       An `env/N` pointer is silently wrong the day a variable is added above it; the chart
#       delivers that one setting from a Secret through `envFrom`, so there is no index to
#       name.
#
# What stays attested is the software and how it is wired: every image, the replica counts,
# the commands and arguments, the ports, the volumes, the probes, the service topology, the
# model and embedding endpoints, the result thresholds, both egress allowlists, the absence of
# a speech-to-text provider, and the substitution rule the configuration's credentials are
# filled in by. What is not attested is the value of the credential the platform generated,
# anything derived from it, and the hostname the operator chose — the gate binds evidence to
# the host it fetched it from, so the hostname is established by the channel rather than by the
# digest.
#
# One thing in that list not to over-read. The model endpoint in the configuration is the one
# this deployment was CREATED with, and it is what the grounding component writes into the
# installation's model registry — which is where the api actually reads a model from, so the
# two agree at deploy time by construction. They are not bound together afterwards: an
# installation administrator may add a second registry row pointing somewhere else, and no
# manifest changes, so the digest does not move. The two egress allowlists are different in
# kind — they ARE configuration, so what this deployment may reach cannot be widened without
# the digest saying so.
evidence:
  # NO DIGEST IN THIS VERSION, deliberately, and it is not an oversight.
  #
  # 4.0.2 declared `a94af2a0…`, measured on `sup823a` (build-448-release) on 2026-11-17. That
  # cloud is gone, and the measurement does not carry: a deployment of the SAME definition on
  # `azure-test` (build-477-release) attests a 62-resource snapshot where `sup823a` attested
  # 71, because the two clouds' evidence collectors do not collect the same KINDS —
  # ServiceAccount, Role, RoleBinding and PodDisruptionBudget entered the collector after the
  # pinned release was built. So `expectedDigest` is a function of the collecting cloud's
  # build as well as of this definition, and a digest declared against one build makes the
  # gate refuse a correct deployment on another (SUP-711, 2026-11-21).
  #
  # Leaving it absent is the lesser harm: the gate holds a deployment to a declared digest, so
  # a wrong one refuses a deployment that is doing exactly what the listing says — which is
  # how 3.0.9's carried-over 3.0.6 digest failed. The digest for this line is measured on the
  # cloud the stand runs on and declared in the next version, by the repository's own rule
  # that it takes two deployments: deploy, read the published evidence, declare, deploy again.
  #
  # The exclusion set below is unchanged from 4.0.2 and is known to be complete on both
  # builds: two deployments of one parameter set, differing only in hostname and namespace,
  # attested byte-identical snapshots on `azure-test` as well.
  exclude:
    # Every deployment lives in a namespace of its own. The platform strips this itself; it is
    # declared because the listing page shows the exclusions from the definition only, and a
    # reader comparing two snapshots should not have to wonder about the one difference they
    # will certainly see.
    - fields:
        - "/metadata/namespace"

    # The namespace again, this time inside a value: the bitnami Keycloak chart builds its
    # JGroups DNS query from the headless Service's fully-qualified name. Not ours to
    # restructure, and `/metadata/namespace` does not reach inside a string.
    - match: { kind: ConfigMap, name: analyst-keycloak-env-vars }
      fields:
        - "/data/JAVA_OPTS_APPEND"

    # The hostname, in the only two proxy settings that are it. This ConfigMap exists so that
    # excluding them costs two values rather than the proxy's whole configuration; it carries
    # the same exclusion as an annotation of its own, and is named here because the listing
    # page reads the definition.
    - match: { kind: ConfigMap, name: analyst-oauth2-proxy-public }
      fields:
        - "/data"

    # Checksums of objects the platform lifts out of the bundle, so each one is a hash of a
    # value that is different in every deployment by design. Charts put them on their pods to
    # roll them when a credential changes, which is the right behaviour and not something to
    # turn off.
    #
    # The agent's chart is the one component that does not pin a `fullnameOverride`, so its
    # objects are named from the Helm release rather than from `analyst`. The marketplace
    # derives that release as `<listing name>-<component name>` — `conversational-analyst-agent`
    # — which is deterministic for every deployment and every consumer, and is the name that has
    # to be matched here: `match.name` is an exact string compare against the rendered object
    # (`evidenceExclusionsFor`), with no patterns and no expressions.
    #
    # Through 4.0.1 this entry said `analyst-config`, matched nothing, and was the only reason
    # two deployments of this version attested different snapshots (SUP-823).
    - match: { kind: Deployment, name: conversational-analyst-agent-config }
      fields:
        - "/spec/template/metadata/annotations/checksum~1config-overlay"
    - match: { kind: Deployment, name: analyst-oauth2-proxy }
      fields:
        - "/spec/template/metadata/annotations/checksum~1alpha-config"
        - "/spec/template/metadata/annotations/checksum~1secret"
    - match: { kind: StatefulSet, name: analyst-garage }
      fields:
        - "/spec/template/metadata/annotations/checksum~1config"
    - match: { kind: StatefulSet, name: analyst-keycloak }
      fields:
        - "/spec/template/metadata/annotations/checksum~1configmap-env-vars"
        - "/spec/template/metadata/annotations/checksum~1secrets"
    - match: { kind: StatefulSet, name: analyst-postgresql }
      fields:
        - "/spec/template/metadata/annotations/checksum~1init"
    - match: { kind: StatefulSet, name: analyst-redis-master }
      fields:
        - "/spec/template/metadata/annotations/checksum~1secret"

    # The hostname the operator chose.
    - match: { kind: Ingress, name: conversational-analyst }
      fields:
        - "/spec/rules/0/host"
