apiVersion: swarm.cloud/v1alpha1
kind: AppDefinition

metadata:
  name: confidential-claims-fraud
  title: Confidential Claims Fraud Detection
  description: >-
    A payer and a hospital publish into one confidential event bus that neither of them operates,
    and a continuous SQL query finds the claims that contradict the clinical record.
  version: "1.6.0"
  category: data-streaming
  sourceRepo: https://github.com/Super-Protocol/swarm-marketplace-catalog/tree/main/charts/claims-fraud-feed
  license: LicenseRef-Confluent-Enterprise
  tags:
    - kafka
    - streaming
    - fraud-detection
    - healthcare
    - confidential-computing

ui:
  sections:
    - id: access
      title: Access
      description: Where Control Center is served — the window onto the running pipeline.
      fields:
        - parameterId: consoleHostname
          widget: hostname
        - parameterId: adminPassword
          widget: password
        - parameterId: viewerPassword
          widget: password

    - id: feed
      title: Event feed
      description: >-
        How fast the two parties publish, and how often a claim contradicts the clinical record.
        The defaults produce an alert roughly every forty seconds — often enough to demonstrate,
        rare enough that the alert still reads as an exception.
      fields:
        - parameterId: intervalSeconds
          widget: number
        - parameterId: conflictEvery
          widget: number

    - id: storage
      title: Storage
      fields:
        - parameterId: kafkaStorage
          widget: select

parameters:
  - id: consoleHostname
    type: string
    title: Console hostname
    description: >-
      Where Control Center is served. Take the one offered and the DNS is written for you.
    required: true
    validation:
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  - id: adminPassword
    type: string
    title: "Console administrator password (user: admin)"
    description: Full access to the console. Generated if left blank.
    sensitive: true
    generated: true

  - id: viewerPassword
    type: string
    title: "Console read-only password (user: viewer)"
    description: Watch the pipeline without being able to change the cluster. Generated if left blank.
    sensitive: true
    generated: true

  - id: intervalSeconds
    type: integer
    title: Seconds between events
    description: Each party publishes one event per interval, both about the same patient.
    default: 10
    validation:
      min: 2
      max: 120

  - id: conflictEvery
    type: integer
    title: One conflicting claim in every
    description: >-
      How many claims pass before the payer bills for a procedure at a site the patient was not
      admitted to. Set to 1 and every claim is fraudulent, which is a worse demonstration.
    default: 4
    validation:
      min: 2
      max: 50

  - id: consoleInternalPassword
    type: string
    title: Console internal credential
    description: >-
      What the sign-in proxy authenticates to Control Center with once it knows who signed in.
      Never shown and never typed; it exists so the console can still tell admin from viewer.
    sensitive: true
    generated: true

  - id: consoleCookieSecret
    type: string
    title: Console session key
    description: Signs the console's session cookie. Changing it signs everyone out.
    sensitive: true
    generated: true

  - id: kafkaStorage
    type: string
    title: Log storage
    default: "20Gi"
    options:
      source:
        type: static
        values:
          - value: "20Gi"
            label: 20 GB
          - value: "50Gi"
            label: 50 GB

  # Neither party's credential is ever shown: the point of the demonstration is that the two
  # identities are separate and enforced, not that an operator can borrow them.
  - id: payerPassword
    type: string
    title: Payer credential
    description: The identity the payer's feed authenticates with. Generated.
    sensitive: true
    generated: true

  - id: hospitalPassword
    type: string
    title: Hospital credential
    description: The identity the hospital's feed authenticates with. Generated.
    sensitive: true
    generated: true

  - id: analystPassword
    type: string
    title: Fraud analyst credential
    description: >-
      Reads the alert stream and nothing else — not the claims it was derived from, and not the
      clinical events. Generated.
    sensitive: true
    generated: true

resources:
  min:
    cpu: "3"
    memory: "14Gi"
    storage: "30Gi"
  recommended:
    cpu: "4"
    memory: "16Gi"
    storage: "60Gi"

components:
  # ---------------------------------------------------------------------------
  # The bus. The same chart the Confluent Platform listing deploys, given three
  # accounts instead of one: two parties that may only write their own topic,
  # and an analyst who may only read what the query concluded.
  # ---------------------------------------------------------------------------
  - name: platform
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: confluent-platform
      version: "0.7.0"
    images:
      - name: confluentinc/cp-server
        digest: sha256:62e3b04c4c88d03fbb484b9976e6145f751c2e908310f3f8b2db5ae7fcd3608f
      - name: confluentinc/cp-schema-registry
        digest: sha256:f0cfd047a839c1ace54d93b92e3459f0d03dc3b5c9db1192a2246fd79b4f44c4
      - name: confluentinc/cp-enterprise-control-center-next-gen
        digest: sha256:10d81f0c7082ad3c7eed1efe4ebb702d9cdb092ba297c15b97b7fd8f89df097f
      - name: confluentinc/cp-enterprise-prometheus
        digest: sha256:19fa37215dc599ee81aeaf6c64efab2501b79048a3fad105eaecede5c95329a9
      - name: confluentinc/cp-enterprise-alertmanager
        digest: sha256:787c71440e0a17f5755854701b886b3878979d7cb62eac6897850c99ae7cd844
      # Collects the password with a form and carries it afterwards in a session cookie, then
      # presents the signed-in user to Control Center so the console still applies its roles.
      - name: quay.io/oauth2-proxy/oauth2-proxy
        digest: sha256:56e3daedf765c7a1eea6e366fbe684be7d3084830ade14b6174570d3c7960954
      - name: confluentinc/cp-ksqldb-server
        digest: sha256:213f8b8368fb417f75aca1c057bbde866cd8c8e802e2d0e28d1d430a34bb94bf
    deployment:
      values:
        base:
          consoleHostname: "{{ params.consoleHostname }}"
          auth:
            enabled: true
            adminUser: admin
            adminPassword: "{{ params.adminPassword }}"
            viewerUser: viewer
            viewerPassword: "{{ params.viewerPassword }}"
            internalPassword: "{{ params.consoleInternalPassword }}"
            cookieSecret: "{{ params.consoleCookieSecret }}"
          kafka:
            storage: "{{ params.kafkaStorage }}"
          schemaRegistry:
            enabled: true
          sasl:
            adminPassword: "{{ params.adminPassword }}"
            accounts:
              - name: payer
                password: "{{ params.payerPassword }}"
                produce: ["claims"]
              - name: hospital
                password: "{{ params.hospitalPassword }}"
                produce: ["clinical.events"]
              - name: analyst
                password: "{{ params.analystPassword }}"
                consume: ["fraud.alerts"]
                groups: ["fraud-analyst"]
          topics:
            - name: claims
              partitions: 1
            - name: clinical.events
              partitions: 1
          ksqldb:
            enabled: true
            serviceId: "claims_fraud_"
            # The whole of the detection logic. Both sources are re-keyed by patient so they can be
            # joined at all — a stream-stream join in Kafka is a join of co-partitioned topics, and
            # the parties key their own events by their own identifiers, not by the patient.
            #
            # The rule itself is deliberately one a person can check: a claim naming a provider the
            # patient demonstrably was not at, while admitted somewhere else. No model, no
            # threshold — so what the confidential deployment is protecting is visibly the data and
            # the join, not a secret algorithm.
            # What must exist afterwards, because the ksql CLI reports success either way.
            verify:
              - FRAUD_ALERTS
              - CLAIMS_BY_PATIENT
              - EVENTS_BY_PATIENT
            statements: |
              CREATE STREAM IF NOT EXISTS claims (
                claim_id VARCHAR KEY, patient_id VARCHAR, provider_id VARCHAR,
                procedure VARCHAR, amount DOUBLE
              ) WITH (kafka_topic='claims', value_format='JSON', partitions=1, replicas=1);

              CREATE STREAM IF NOT EXISTS clinical_events (
                event_id VARCHAR KEY, patient_id VARCHAR, hospital_id VARCHAR, status VARCHAR
              ) WITH (kafka_topic='clinical.events', value_format='JSON', partitions=1, replicas=1);

              CREATE STREAM IF NOT EXISTS claims_by_patient AS
                SELECT * FROM claims PARTITION BY patient_id EMIT CHANGES;

              CREATE STREAM IF NOT EXISTS events_by_patient AS
                SELECT * FROM clinical_events PARTITION BY patient_id EMIT CHANGES;

              CREATE STREAM IF NOT EXISTS fraud_alerts
                WITH (kafka_topic='fraud.alerts', value_format='JSON') AS
                SELECT c.patient_id AS patient_id, c.claim_id AS claim_id,
                       c.provider_id AS billed_by, e.hospital_id AS admitted_at,
                       c.amount AS amount, c.procedure AS procedure
                FROM claims_by_patient c
                INNER JOIN events_by_patient e WITHIN 10 MINUTES ON c.patient_id = e.patient_id
                WHERE e.status = 'INPATIENT' AND c.provider_id <> e.hospital_id
                EMIT CHANGES;

  # ---------------------------------------------------------------------------
  # The two parties. Separate workloads with separate credentials, because what
  # is being shown is that neither can touch the other's stream.
  # ---------------------------------------------------------------------------
  - name: feed
    dependsOn:
      - platform
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: claims-fraud-feed
      version: "0.1.0"
    images:
      - name: confluentinc/cp-server
        digest: sha256:62e3b04c4c88d03fbb484b9976e6145f751c2e908310f3f8b2db5ae7fcd3608f
    deployment:
      values:
        base:
          bootstrapServers: "{{ components.platform.release }}-kafka:9092"
          intervalSeconds: "{{ params.intervalSeconds }}"
          conflictEvery: "{{ params.conflictEvery }}"
          payer:
            username: payer
            password: "{{ params.payerPassword }}"
            topic: claims
            providerId: HOSP-B
          hospital:
            username: hospital
            password: "{{ params.hospitalPassword }}"
            topic: clinical.events
            hospitalId: HOSP-B

outputs:
  - id: consoleUrl
    title: Control Center
    type: url
    value: "https://{{ params.consoleHostname }}"

  - id: signIn
    title: Sign in to the console
    type: string
    value: "A form asks for a user and password. Two accounts: admin, which may change the cluster, and viewer, which may only watch it."

  - id: adminPassword
    title: Password for admin
    type: secret
    value: "{{ params.adminPassword }}"

  - id: viewerPassword
    title: Password for viewer
    type: secret
    value: "{{ params.viewerPassword }}"

  - id: whatToWatch
    title: What to watch
    type: string
    value: "Topics → claims and clinical.events fill from two different identities; fraud.alerts holds only the contradictions. ksqlDB → the query that finds them."

  - id: analystCredential
    title: Fraud analyst credential
    type: secret
    value: "{{ params.analystPassword }}"

  - id: analystNote
    title: What the analyst account can reach
    type: string
    value: "User \"analyst\" over SASL/PLAIN may read fraud.alerts and nothing else — a consumer presenting it against claims or clinical.events is refused by the broker."

# What this version attests to.
#
# Measured, not assumed: this is the digest the cloud published and signed for a deployment of
# 1.5.0, read back from its evidence. It cannot be derived from the charts — a cluster defaults
# fields no template writes — and declaring it changes nothing that is sent, so a value measured on
# the version before this one holds for this one.
#
# The exclusion is the hostname the operator chose, which is the only field that legitimately
# differs between two deployments: the namespace and the platform's own deployment label are
# already stripped by the canonical rules, and every generated password lives in a Secret, which is
# lifted out of the manifests before they are digested.
#
# It is stated twice on purpose. The chart annotates its own Ingress, which is the mechanism the
# specification prefers when the chart is yours; the block below is what the marketplace reads to
# show the exclusion on the listing, and a digest presented with "no exclusions" beside it would be
# a misleading answer to the only question that matters about it. Both routes stamp the same
# annotation, so the manifests — and the digest — are identical either way.
evidence:
  expectedDigest: "a6e39b9f5263cb6309432dede82268e501359c2224d25f221f517aafc01f58cb"
  exclude:
    - match: { kind: Ingress, name: confidential-claims-fraud-platform-control-center }
      fields:
        - "/spec/rules/0/host"
