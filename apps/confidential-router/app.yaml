apiVersion: swarm.cloud/v1alpha1
kind: AppDefinition

metadata:
  name: confidential-router
  title: Confidential Router
  description: An OpenAI-compatible endpoint whose deployment publishes signed evidence of what it is running, with a console for keys, credit and generation history.
  version: "0.3.1"
  category: ai-inference
  sourceRepo: https://github.com/Super-Protocol/confidential-router
  license: Apache-2.0
  icon: icon.svg
  tags:
    - ai
    - llm
    - inference
    - openai-compatible
    - attestation
    - confidential-computing

ui:
  sections:
    # Ordered so that a deployment can be reached from the top of the form: the two
    # hostnames arrive filled in, the models have a default and the GPU is off, which
    # leaves nothing above Advanced that has to be typed before Deploy.
    - id: access
      title: Access
      description: >-
        Two hostnames, because two different things are served: the console a person signs in to,
        and the API a client points its OpenAI SDK at. The API hostname is also the endpoint a
        Gatekeeper is pointed at, so it is the name that ends up in someone else's configuration.
      fields:
        # `hostname`, so a marketplace holding a DNS zone offers a name in it and writes the
        # records; both are the deployment's own addresses, so both are marked.
        - parameterId: consoleHostname
          widget: hostname
        - parameterId: apiHostname
          widget: hostname

    - id: models
      title: Models
      description: >-
        Downloaded on first start, which takes a few minutes per model, and served from then on.
        Every one you pick is advertised by the API and listed in the console; sizes below are what
        is pulled onto the model volume.
      fields:
        - parameterId: models
          widget: multiselect

    - id: compute
      title: Compute
      fields:
        - parameterId: gpuEnabled
          widget: switch
        - parameterId: gpuCount
          widget: number
          visible: "params.gpuEnabled == true"

    # There is no collapsed-section or group concept in the specification, so "advanced"
    # is expressed the only way the form can express it: one section, last, holding every
    # field that already has an answer. Nothing in here has to be opened to deploy.
    - id: advanced
      title: Advanced
      description: >-
        Every field below is already answered — the volumes are sized for the models above, billing
        starts on manual credit, and the first sign-in token is generated and shown with the
        deployment's outputs. Open this to size a volume differently, to take real payments, or to
        bring your own token; skip it otherwise.
      fields:
        - parameterId: modelStorage
          widget: select
        - parameterId: databaseStorage
          widget: select
        - parameterId: bootstrapToken
          widget: password
        - parameterId: passwordSignup
          widget: switch
        - parameterId: billingMode
          widget: select
        - parameterId: stripeSecretKey
          widget: password
          visible: "params.billingMode == 'stripe'"
        - parameterId: stripeWebhookSecret
          widget: password
          visible: "params.billingMode == 'stripe'"
        - parameterId: mailFrom
          widget: text
          visible: "params.billingMode == 'stripe'"
        - parameterId: resendApiKey
          widget: password
          visible: "params.billingMode == 'stripe'"

parameters:
  - id: consoleHostname
    type: string
    title: Console hostname
    description: >-
      Where the console is served. Take the one offered and the DNS is written for you; bring your
      own and point it at this cloud's gateway before publishing the deployment.
    required: true
    validation:
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  - id: apiHostname
    type: string
    title: API hostname
    description: >-
      Where `/v1` is served — the base URL an OpenAI client is given, and the upstream a Gatekeeper
      is pointed at. It has to differ from the console hostname: they are separate ingresses.
    required: true
    validation:
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  - id: bootstrapToken
    type: string
    title: First sign-in token
    description: >-
      Claims the administrator account, once, for the address of the marketplace account deploying
      this — nobody is asked to retype it. Generated if left blank and shown below after this is
      deployed; the endpoint that accepts it stops existing the moment an account exists.
    sensitive: true
    generated: true
    validation:
      minLength: 32

  - id: passwordSignup
    type: boolean
    title: Allow sign-up with a password
    description: >-
      On, because the token above claims exactly one account and this deployment has no mailbox to
      send an invitation from: without it nobody but the first administrator can ever sign in.
      Each account that signs up gets its own empty workspace and no credit, and can read nobody
      else's keys — but anyone who can reach the console can create one, so turn this off where the
      console is reachable by people this deployment is not for. There is no password reset either
      way; that would need the mail delivery this deployment does without.
    default: true

  - id: models
    type: array
    items:
      type: string
    title: Models
    description: >-
      Pick one or more. Every model you pick is pulled onto the model volume, kept resident, and
      advertised under its own name and price in the console — so the storage and the memory this
      deployment needs are a function of this list.
    required: true
    default: ["llama3.2:3b"]
    validation:
      minItems: 1
    options:
      source:
        type: static
        values:
          - value: "llama3.2:3b"
            label: Llama 3.2 3B Instruct — 2.0 GB
          - value: "qwen2.5:3b"
            label: Qwen 2.5 3B Instruct — 1.9 GB
          - value: "gemma2:2b"
            label: Gemma 2 2B — 1.6 GB
          - value: "phi3.5:3.8b"
            label: Phi-3.5 Mini 3.8B — 2.2 GB
          - value: "mistral:7b"
            label: Mistral 7B Instruct — 4.1 GB

  - id: gpuEnabled
    type: boolean
    title: Use a GPU
    description: >-
      Off by default, because a cluster space without GPUs schedules nothing at all when it is on:
      the pod asks for a device and a runtime class that are not there, and waits forever. On CPU
      these models answer, slowly — turn this on where the space actually has one.
    default: false

  - id: gpuCount
    type: integer
    title: GPUs
    description: How many to allocate to the model server.
    default: 1
    validation:
      min: 1
      max: 8

  - id: modelStorage
    type: string
    title: Model storage
    description: >-
      Holds the downloaded weights. All five models together are under 12 GB, so the default has
      room for every one of them — which is why this is not asked for, only offered.
    required: false
    default: "30Gi"
    options:
      source:
        type: static
        values:
          - value: "20Gi"
            label: 20 GB
          - value: "30Gi"
            label: 30 GB
          - value: "50Gi"
            label: 50 GB
          - value: "100Gi"
            label: 100 GB

  - id: databaseStorage
    type: string
    title: Database storage
    description: >-
      Holds accounts, API keys, credit and one metering row per generation. Prompts and completions
      are never stored, so this grows with how often the endpoint is called rather than with how
      much is said to it — slowly enough that the default is the right answer for an evaluation.
    required: false
    default: "8Gi"
    options:
      source:
        type: static
        values:
          - value: "8Gi"
            label: 8 GB
          - value: "20Gi"
            label: 20 GB
          - value: "50Gi"
            label: 50 GB

  - id: billingMode
    type: string
    title: Billing
    description: >-
      `Manual credit` mints credit from a signed link an administrator issues, and is what a demo or
      an evaluation runs on — so it is what this deploys as unless it is changed here. `Stripe`
      takes real payments and needs the two keys below.
    required: false
    default: "manual"
    options:
      source:
        type: static
        values:
          - value: "manual"
            label: Manual credit
          - value: "stripe"
            label: Stripe

  - id: stripeSecretKey
    type: string
    title: Stripe secret key
    description: The `sk_live_…` or `sk_test_…` key this deployment charges with.
    sensitive: true

  - id: stripeWebhookSecret
    type: string
    title: Stripe webhook signing secret
    description: >-
      The `whsec_…` secret for a webhook endpoint pointed at `https://<API hostname>/billing`.
      Without it a completed payment never becomes credit.
    sensitive: true

  - id: mailFrom
    type: string
    title: Sender address
    description: >-
      Where sign-in links come from. Only used with Stripe billing, and it has to be on a domain
      verified with Resend, or the mail is refused.
    default: "no-reply@confidential-router.local"

  - id: resendApiKey
    type: string
    title: Resend API key
    description: >-
      Needed with Stripe billing and nothing else. Stripe puts the API into production mode, and in
      production a sign-in link written to the container log would be a sign-in link anyone with
      log access could use — so a real mail provider becomes mandatory at the same moment.
    sensitive: true

  # ---------------------------------------------------------------------------
  # Internal credentials. No UI section names them: they are shared between this
  # application's own components and nobody outside the deployment ever needs to
  # see one, so the platform generates them and they stay sealed.
  # ---------------------------------------------------------------------------
  - id: authSecret
    type: string
    title: Session signing secret
    description: >-
      Signs session cookies and first-sign-in tokens. Rotating it signs everyone out. Generated.
    sensitive: true
    generated: true
    validation:
      minLength: 32

  - id: databasePassword
    type: string
    title: Database password
    description: >-
      Both what the bundled PostgreSQL is created with and what the API connects with. Generated.
    sensitive: true
    generated: true
    validation:
      minLength: 32

  - id: litellmKey
    type: string
    title: Model proxy key
    description: >-
      Demanded by the model proxy on every request and presented by the API. The proxy is only
      reachable inside the cluster space; this is what keeps a neighbouring pod from using it.
    sensitive: true
    generated: true
    validation:
      minLength: 32

resources:
  # A cluster space is created with this quota, so it has to cover every container at once —
  # including the model server, which has no limit of its own and grows with the number of models
  # kept resident.
  min:
    cpu: "4"
    memory: "12Gi"
    storage: "40Gi"
  recommended:
    cpu: "8"
    memory: "24Gi"
    storage: "70Gi"
  gpu:
    required: false
    minCount: 1
    minVram: "16Gi"
    types:
      - nvidia-h100
      - nvidia-a100
      - nvidia-l40s
      - nvidia-rtx-4090

components:
  # ---------------------------------------------------------------------------
  # The model server. Reachable inside the cluster space and nowhere else: an
  # Ollama endpoint has no authentication of its own, and publishing one would
  # hand the deployment's GPU and models to whoever found the name. Everything
  # that reaches it goes through the proxy and then the router, which is where
  # keys, credit and metering live.
  # ---------------------------------------------------------------------------
  - name: ollama
    source:
      type: helm
      repoUrl: https://otwld.github.io/ollama-helm/
      chart: ollama
      version: "1.12.0"
    # This chart references `ollama/ollama` by tag and its init container by
    # bare name, and an unpinned reference makes the deployment's evidence
    # digest uncomputable (specification 2.7). Declaring them here rewrites both
    # to a digest before the manifests are sent.
    images:
      - name: ollama/ollama
        digest: sha256:de0786b654561830021475310d61df8073797e917d006a8c6372c8548efc639b
      - name: busybox
        digest: sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    deployment:
      values:
        base:
          service:
            type: ClusterIP
          ollama:
            gpu:
              enabled: false
              type: nvidia
              number: 0
            models:
              pull: []
              run: []
          runtimeClassName: ""
          persistentVolume:
            enabled: true
            size: 30Gi
          ingress:
            enabled: false
        patches:
          # The whole selection, as a list: a value that is exactly one
          # placeholder is interpolated in its native type, so this reaches the
          # chart as a YAML sequence rather than as one string naming five
          # models.
          - op: replace
            path: ollama.models.pull
            value: "{{ params.models }}"

          - op: replace
            path: ollama.gpu.enabled
            value: true
            when: "params.gpuEnabled == true"

          - op: replace
            path: ollama.gpu.number
            value: "{{ params.gpuCount }}"
            when: "params.gpuEnabled == true"

          # A device request without the runtime class leaves the pod Pending
          # forever rather than falling back to CPU, so the two move together.
          - op: replace
            path: runtimeClassName
            value: nvidia
            when: "params.gpuEnabled == true"

          - op: replace
            path: persistentVolume.size
            value: "{{ params.modelStorage }}"

  # ---------------------------------------------------------------------------
  # The OpenAI-compatible face on Ollama. It publishes one model name per
  # selected model — the same strings the router advertises, because the Ollama
  # name *is* the catalogue key on both sides.
  # ---------------------------------------------------------------------------
  - name: litellm
    dependsOn:
      - ollama
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: confidential-router-litellm
      version: "0.1.0"
    images:
      - name: ghcr.io/berriai/litellm
        digest: sha256:e9711f484c7c8462c028803130afef546aa54c8d2fc11120242c01bbadc12e65
    deployment:
      values:
        base:
          ollamaUrl: "http://{{ components.ollama.release }}:11434"
          models: "{{ params.models }}"
          masterKey: "{{ params.litellmKey }}"
          service:
            type: ClusterIP

  # ---------------------------------------------------------------------------
  # The router itself: `/v1` for clients, `/graphql` and `/auth` for the console,
  # and the PostgreSQL it stores accounts, keys, credit and metering in. Prompts
  # and completions are not among those — the console shows token counts, not
  # what was said.
  # ---------------------------------------------------------------------------
  - name: router-api
    dependsOn:
      - litellm
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: confidential-router-api
      version: "0.2.1"
    images:
      - name: ghcr.io/super-protocol/confidential-router/router-api
        digest: sha256:878e146f5946cd3dc05cc627fbfa4bc536122fb984dccd99549f0bed35169f1e
      - name: docker.io/bitnamilegacy/postgresql
        digest: sha256:51db17ce1aa19e1b4ba65bf4ff45f0afcde6b59e44623d0005142703b91f4a1e
    deployment:
      values:
        base:
          apiHostname: "{{ params.apiHostname }}"
          consoleHostname: "{{ params.consoleHostname }}"
          publicScheme: https
          # The proxy's service name, which its chart derives from the chart name
          # rather than from the release: our three charts have to find each
          # other by DNS, and a name that moved with the release would make every
          # one of those defaults wrong.
          litellmUrl: http://confidential-router-litellm:4000
          litellm:
            apiKey: "{{ params.litellmKey }}"
          models: "{{ params.models }}"
          database:
            password: "{{ params.databasePassword }}"
          auth:
            secret: "{{ params.authSecret }}"
            magicLink:
              # Nothing here can deliver mail, so the console does not offer a
              # link it would only write to the pod log. Stripe billing brings a
              # Resend key with it and the patch below turns the mailer back on.
              mailer: none
            # The sign-in path that needs nothing outside the cluster (SUP-112).
            # It is what makes this deployment usable by a second person: the
            # token below claims exactly one account and then stops existing.
            password:
              enabled: true
            # The first-sign-in path for a deployment with no mailbox and no
            # OAuth app: while this is set and no user exists, posting it to
            # /auth/bootstrap creates the administrator. The endpoint is a 404
            # from then on.
            bootstrapToken: "{{ params.bootstrapToken }}"
            # Whoever is deploying, read from the marketplace account rather than
            # asked for: the console's first administrator is that person, and a
            # parameter here would only be a second copy of an address the
            # marketplace already holds — one that drifts the moment either changes.
            bootstrapEmail: "{{ consumer.user.email }}"
          billing:
            mode: manual
          postgresql:
            primary:
              persistence:
                size: "{{ params.databaseStorage }}"
        patches:
          - op: replace
            path: auth.password.enabled
            value: false
            when: "params.passwordSignup == false"

          # Switching sign-up off has to leave *some* way back in, or the chart
          # refuses to render: the bootstrap token is spent on the first account
          # and mail goes nowhere. So the mailer returns to `console` — the link
          # lands in the API log, which an administrator can read and nobody
          # outside the cluster can. Stripe billing replaces it with Resend
          # further down, which is why this patch comes first.
          - op: replace
            path: auth.magicLink.mailer
            value: console
            when: "params.passwordSignup == false"

          # `add` rather than `replace` wherever the base above does not already
          # carry the key: `replace` requires the path to exist in the resolved
          # values, and the base deliberately does not name a Stripe key it has
          # no value for.
          - op: replace
            path: billing.mode
            value: stripe
            when: "params.billingMode == 'stripe'"

          - op: add
            path: billing.stripe.secretKey
            value: "{{ params.stripeSecretKey }}"
            when: "params.billingMode == 'stripe'"

          - op: add
            path: billing.stripe.webhookSecret
            value: "{{ params.stripeWebhookSecret }}"
            when: "params.billingMode == 'stripe'"

          # Stripe puts the API into production mode, and the console mailer is
          # refused there — a sign-in link in the container log is a sign-in link
          # for anyone who can read logs. These three are the same decision as
          # the one above, not extras.
          - op: replace
            path: auth.magicLink.mailer
            value: resend
            when: "params.billingMode == 'stripe'"

          - op: add
            path: auth.magicLink.from
            value: "{{ params.mailFrom }}"
            when: "params.billingMode == 'stripe'"

          - op: add
            path: auth.magicLink.resendApiKey
            value: "{{ params.resendApiKey }}"
            when: "params.billingMode == 'stripe'"

  # ---------------------------------------------------------------------------
  # The console. Served on its own hostname and talking to the API on the other
  # one, which is why the API's ingress carries /auth and /graphql: the browser
  # calls them cross-origin with credentials.
  #
  # The console resolves its API origin at run time (SUP-100), which is what lets
  # this component exist at all: an image reference pinned by digest and a
  # hostname the customer chooses at deploy time used to be the same requirement
  # pulling in opposite directions, and the chart refused to render a console
  # pointed at anything but the origin its image was built for.
  # ---------------------------------------------------------------------------
  - name: router-ui
    dependsOn:
      - router-api
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: confidential-router-ui
      version: "0.1.4"
    images:
      - name: ghcr.io/super-protocol/confidential-router/router-ui
        digest: sha256:960369da2cc397fdc2a4fdcbe02761abcec770005a9ff358f8b6c5af13299c93
    deployment:
      values:
        base:
          consoleHostname: "{{ params.consoleHostname }}"
          apiHostname: "{{ params.apiHostname }}"
          publicScheme: https

outputs:
  - id: consoleUrl
    title: Console
    type: url
    value: "https://{{ params.consoleHostname }}"

  - id: apiBaseUrl
    title: OpenAI base URL
    type: url
    value: "https://{{ params.apiHostname }}/v1"

  - id: firstSignIn
    title: First sign-in
    type: string
    value: "Open the console, choose \"Use a first-sign-in token\", and enter the token below together with {{ consumer.user.email }} — the account is created for that address. That claims it and the token stops working — it is spent by the first account, whoever creates it, so claim the deployment before its hostname is handed out."

  - id: signUp
    title: Everyone else
    type: string
    when: "params.passwordSignup == true"
    value: "https://{{ params.consoleHostname }}/signup — an email address and a password, with nothing to deliver and nothing to verify. Each account arrives with its own empty workspace and no credit: anyone who can reach the console can create one, so turn \"Allow sign-up with a password\" off by reconfiguring if this console is reachable by people it is not for. There is no password reset — it would need the mail delivery this deployment does without."

  - id: bootstrapToken
    title: First sign-in token
    type: secret
    value: "{{ params.bootstrapToken }}"

  - id: gatekeeperSetup
    title: Point a Gatekeeper at this endpoint
    type: string
    value: "gatekeeper endpoint add router --listen 127.0.0.1:8443 --upstream https://{{ params.apiHostname }} && gatekeeper endpoint discover router && gatekeeper endpoint trust add router --from-upstream && gatekeeper run"

  - id: gatekeeperBaseUrl
    title: OpenAI base URL, through a Gatekeeper
    type: url
    value: "http://127.0.0.1:8443/v1"

  - id: evidenceBundle
    title: Published evidence
    type: url
    value: "https://{{ params.apiHostname }}/.well-known/swarm-evidence"

  - id: billingNote
    title: Credit
    type: string
    when: "params.billingMode == 'manual'"
    value: "Billing runs on manual credit: an administrator mints it from the console's Billing screen and no payment leaves this deployment. Switch to Stripe by reconfiguring."
