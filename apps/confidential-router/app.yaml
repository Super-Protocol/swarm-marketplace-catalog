apiVersion: swarm.cloud/v1alpha1
kind: AppDefinition

metadata:
  name: confidential-router
  title: Confidential Router
  description: An OpenAI-compatible endpoint whose deployment publishes signed evidence of what it is running, with a console for keys, credit and generation history.
  version: "0.16.0"
  category: ai-inference
  sourceRepo: https://github.com/Super-Protocol/confidential-router
  license: Apache-2.0
  icon: icon.svg
  tags:
    - ai
    - llm
    - inference
    - openai-compatible
    - attestation
    - confidential-computing

ui:
  sections:
    # Ordered so that a deployment can be reached from the top of the form: the two
    # hostnames arrive filled in and no built-in model is selected, which leaves
    # nothing above Advanced that has to be typed or chosen before Deploy. Models are
    # external since ADR-008, so a router serving only the endpoints an administrator
    # registers after deploy is the configuration the form arrives at (SUP-245).
    - id: access
      title: Access
      description: >-
        Two hostnames, because two different things are served: the console a person signs in to,
        and the API a client points its OpenAI SDK at. The API hostname is also the endpoint a
        Gatekeeper is pointed at, so it is the name that ends up in someone else's configuration.
      fields:
        # `hostname`, so a marketplace holding a DNS zone offers a name in it and writes the
        # records; both are the deployment's own addresses, so both are marked.
        - parameterId: consoleHostname
          widget: hostname
        - parameterId: apiHostname
          widget: hostname

    - id: models
      title: Built-in models
      description: >-
        Optional. Leave this empty and the deployment runs no model of its own — no model server,
        no model volume — and serves the external endpoints you register in the console's admin
        section after deploy, each verified by its attestation before a prompt reaches it. Pick
        some and they are downloaded on first start, a few minutes per model, then served beside
        the external ones; sizes below are what is pulled onto the model volume.
      fields:
        - parameterId: models
          widget: multiselect

    # A campaign is a different thing from a deployment, and the two fields only a
    # campaign wants belong together rather than among the answered ones below: both
    # are empty by default and nothing else depends on either.
    - id: campaign
      title: Campaign
      description: >-
        Invitation codes grant credit on sign-up, and the funnel is measured across both surfaces.
        Neither field is needed to deploy — leave them empty and this is an endpoint with a console,
        which is what an evaluation wants.
      fields:
        - parameterId: landingHostname
          widget: text
        - parameterId: posthogProjectKey
          widget: password
        - parameterId: inviteOnlySignup
          widget: switch
        - parameterId: signupGrantUsd
          widget: number

    # There is no collapsed-section or group concept in the specification, so "advanced"
    # is expressed the only way the form can express it: one section, last, holding every
    # field that already has an answer. Nothing in here has to be opened to deploy.
    - id: advanced
      title: Advanced
      description: >-
        Every field below is already answered — the volumes are sized for the models above, the
        built-in models run on CPU, the deployment sells no credit, and the first sign-in token is
        generated and shown with the deployment's outputs. Open this to give built-in models a GPU,
        to size a volume differently, to take real payments, or to bring your own token; skip it
        otherwise.
      fields:
        # The GPU belongs to the built-in model server and to nothing else, so it
        # sits here rather than in a section of its own. It cannot be hidden while
        # no model is selected: `visible` cannot test an array parameter (spec
        # §7.4), and adding a boolean beside `models` just to hide it would give
        # the form two answers to one question. With no model selected it reaches
        # no manifest — the model server is not rendered — but the marketplace
        # still reserves the card for the space, which is what its description
        # says.
        - parameterId: gpuEnabled
          widget: switch
        - parameterId: gpuCount
          widget: number
          visible: "params.gpuEnabled == true"
        - parameterId: modelStorage
          widget: select
        - parameterId: databaseStorage
          widget: select
        - parameterId: bootstrapToken
          widget: password
        - parameterId: passwordSignup
          widget: switch
        - parameterId: billingMode
          widget: select
        - parameterId: stripeSecretKey
          widget: password
          visible: "params.billingMode == 'stripe'"
        - parameterId: stripeWebhookSecret
          widget: password
          visible: "params.billingMode == 'stripe'"
        - parameterId: mailFrom
          widget: text
          visible: "params.billingMode == 'stripe'"
        - parameterId: resendApiKey
          widget: password
          visible: "params.billingMode == 'stripe'"

parameters:
  - id: consoleHostname
    type: string
    title: Console hostname
    description: >-
      Where the console is served. Take the one offered and the DNS is written for you; bring your
      own and point it at this cloud's gateway before publishing the deployment.
    required: true
    validation:
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  - id: apiHostname
    type: string
    title: API hostname
    description: >-
      Where `/v1` is served — the base URL an OpenAI client is given, and the upstream a Gatekeeper
      is pointed at. It has to differ from the console hostname: they are separate ingresses.
    required: true
    validation:
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  - id: bootstrapToken
    type: string
    title: First sign-in token
    description: >-
      Claims the administrator account, once, for the address of the marketplace account deploying
      this — nobody is asked to retype it. Generated if left blank and shown below after this is
      deployed; the endpoint that accepts it stops existing the moment an account exists.
    sensitive: true
    generated: true
    validation:
      minLength: 32

  - id: passwordSignup
    type: boolean
    title: Allow sign-up with a password
    description: >-
      On, because the token above claims exactly one account and this deployment has no mailbox to
      send an invitation from: without it nobody but the first administrator can ever sign in.
      Each account that signs up gets its own empty workspace and the sign-up credit set under Campaign (none at 0), and can read nobody
      else's keys — but anyone who can reach the console can create one, so turn this off where the
      console is reachable by people this deployment is not for. There is no password reset either
      way; that would need the mail delivery this deployment does without.
    default: true

  - id: inviteOnlySignup
    type: boolean
    title: Only invited people can create an account
    description: >-
      Off, which is what an evaluation wants: anyone who can reach the console can sign up, and an
      invitation code only decides whether $100 of credit comes with the account. On, the code decides
      whether the account exists at all — every sign-up path is refused, before anything is created,
      unless the request carries a code that is valid and has not been redeemed yet. Signing in to an
      account that already exists is unaffected, and so is the first-sign-in token above. Turn this on
      only once the campaign's codes have been generated: with none issued, nobody can register.
    default: false

  - id: signupGrantUsd
    type: integer
    title: Sign-up credit, USD
    description: >-
      Credit every new account starts with, granted once at registration and shown on its Credits
      screen as a sign-up credit. It stacks with an invitation: $20 here and a $100 code start the
      account at $120. 0 grants nothing. This is your decision about your own deployment, fixed when
      you deploy — no one signing up can raise it, and it is not a way to buy credit. It is granted
      per account, and password sign-up does not verify the address, so on an open deployment each
      throwaway account collects it too: keep it an evaluation allowance, or turn on invite-only
      sign-up above. A launch whose credit should come only from invitations sets it to 0.
    default: 20
    validation:
      min: 0
      max: 1000

  - id: models
    type: array
    items:
      type: string
    title: Built-in models
    description: >-
      Empty means no built-in models: nothing is downloaded and no model server runs — add
      external ones in the admin console after deploy. Every model you pick is pulled onto the
      model volume, kept resident, and advertised under its own name and price in the console
      beside the external ones.
    # Empty by default and allowed to stay empty: the charts read the list and
    # render no model server and no proxy without one (SUP-245). That decision
    # cannot live here — there is no `when:` on a component, and an array cannot
    # be tested in a condition — so it lives in confidential-router-ollama and
    # confidential-router-litellm, which are ours.
    required: false
    default: []
    options:
      source:
        type: static
        values:
          - value: "llama3.2:3b"
            label: Llama 3.2 3B Instruct — 2.0 GB
          - value: "qwen2.5:3b"
            label: Qwen 2.5 3B Instruct — 1.9 GB
          - value: "gemma2:2b"
            label: Gemma 2 2B — 1.6 GB
          - value: "phi3.5:3.8b"
            label: Phi-3.5 Mini 3.8B — 2.2 GB
          - value: "mistral:7b"
            label: Mistral 7B Instruct — 4.1 GB

  - id: landingHostname
    type: string
    title: Campaign landing page
    description: >-
      Where invitation codes are handed out — a page hosted elsewhere, not by this deployment. Its
      origin is the only one besides the console allowed to look a code up from the browser, which
      is how the page can tell a visitor the credit is already theirs before they have signed up;
      it is also the origin the generated invitation URLs point at. Empty runs no campaign.
    required: false
    # The same hostname pattern as the two above, widened by an empty alternative:
    # this field is optional, and a pattern that rejected "" would make it required
    # in the only way that matters.
    validation:
      pattern: "^$|^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  - id: posthogProjectKey
    type: string
    title: PostHog project key
    description: >-
      The `phc_…` key of the project this deployment's funnel is recorded in. Without it every
      event is accepted and dropped, and sign-up, redemption and first request exist only as rows
      in this deployment's own database. A write-only ingest key — it can add events and read
      nothing back.
    required: false
    sensitive: true

  - id: gpuEnabled
    type: boolean
    title: Run built-in models on a GPU
    description: >-
      Only for the built-in models above — external endpoints run on their own hardware. With
      none selected, leave this off: nothing here would use the card, but the cluster space is
      still created with one reserved. Off by default for a second reason, because a space
      without GPUs schedules nothing at all when it is on: the model server asks for a device and
      a runtime class that are not there, and waits forever. On CPU the built-in models answer,
      slowly — turn this on where the space actually has one.
    default: false

  - id: gpuCount
    type: integer
    title: GPUs
    description: How many to allocate to the built-in model server.
    default: 1
    validation:
      min: 1
      max: 8

  - id: modelStorage
    type: string
    title: Model storage
    description: >-
      Holds the downloaded weights of the built-in models; not created when none is selected. All
      five models together are under 12 GB, so the default has room for every one of them — which
      is why this is not asked for, only offered.
    required: false
    default: "30Gi"
    options:
      source:
        type: static
        values:
          - value: "20Gi"
            label: 20 GB
          - value: "30Gi"
            label: 30 GB
          - value: "50Gi"
            label: 50 GB
          - value: "100Gi"
            label: 100 GB

  - id: databaseStorage
    type: string
    title: Database storage
    description: >-
      Holds accounts, API keys, credit and one metering row per generation. Prompts and completions
      are never stored, so this grows with how often the endpoint is called rather than with how
      much is said to it — slowly enough that the default is the right answer for an evaluation.


      This is the size of one instance's volume, and the database runs three of them — one per node,
      each a full copy. The quota has to cover three times whatever is chosen here.
    required: false
    default: "8Gi"
    options:
      source:
        type: static
        values:
          - value: "8Gi"
            label: 8 GB
          - value: "20Gi"
            label: 20 GB
          - value: "50Gi"
            label: 50 GB

  - id: billingMode
    type: string
    title: Billing
    description: >-
      `No purchases` sells nothing: the console has no buy panel and a checkout is refused, so credit
      arrives the way an evaluation's does — an invitation code redeemed at sign-up, or an
      administrator's grant. It is what this deploys as unless it is changed here. `Stripe` takes real
      payments and needs the two keys below.


      There is no third option. The router also implements a provider that mints credit from a signed
      link, for a developer's laptop, and it is refused on any hostname other people can reach: a
      deployment that shipped it gave every account holder an unbounded free-credit button (SUP-167).
    required: false
    default: "disabled"
    options:
      source:
        type: static
        values:
          - value: "disabled"
            label: No purchases
          - value: "stripe"
            label: Stripe

  - id: stripeSecretKey
    type: string
    title: Stripe secret key
    description: The `sk_live_…` or `sk_test_…` key this deployment charges with.
    sensitive: true

  - id: stripeWebhookSecret
    type: string
    title: Stripe webhook signing secret
    description: >-
      The `whsec_…` secret for a webhook endpoint pointed at `https://<API hostname>/billing`.
      Without it a completed payment never becomes credit.
    sensitive: true

  - id: mailFrom
    type: string
    title: Sender address
    description: >-
      Where sign-in links come from. Only used with Stripe billing, and it has to be on a domain
      verified with Resend, or the mail is refused.
    default: "no-reply@confidential-router.local"

  - id: resendApiKey
    type: string
    title: Resend API key
    description: >-
      Needed with Stripe billing and nothing else. Stripe puts the API into production mode, and in
      production a sign-in link written to the container log would be a sign-in link anyone with
      log access could use — so a real mail provider becomes mandatory at the same moment.
    sensitive: true

  # ---------------------------------------------------------------------------
  # Internal credentials. No UI section names them: they are shared between this
  # application's own components and nobody outside the deployment ever needs to
  # see one, so the platform generates them and they stay sealed.
  # ---------------------------------------------------------------------------
  - id: authSecret
    type: string
    title: Session signing secret
    description: >-
      Signs session cookies and first-sign-in tokens. Rotating it signs everyone out. Generated.
    sensitive: true
    generated: true
    validation:
      minLength: 32

  - id: databasePassword
    type: string
    title: Database password
    description: >-
      Both what the bundled PostgreSQL is created with and what the API connects with. Generated.
    sensitive: true
    generated: true
    validation:
      minLength: 32

  - id: litellmKey
    type: string
    title: Model proxy key
    description: >-
      Demanded by the model proxy on every request and presented by the API. The proxy is only
      reachable inside the cluster space; this is what keeps a neighbouring pod from using it.
    sensitive: true
    generated: true
    validation:
      minLength: 32

  # 43 characters, and that number is load-bearing. The router seals an upstream
  # credential with AES-256 and accepts the key as base64url, base64 or hex —
  # whichever spelling, it has to decode to exactly 32 bytes. The marketplace
  # generates a value of `minLength` characters from an alphanumeric alphabet,
  # which is a subset of base64url's, so 43 of them decode to exactly 32 bytes
  # and any other length does not. A key the router refuses is not a boot
  # failure: it is a deployment whose administrator can register an external
  # endpoint and never store its API key.
  - id: secretsKey
    type: string
    title: Upstream credential key
    description: >-
      Seals the API key of every external model endpoint an administrator registers, so the
      plaintext is absent from SQL, from a database dump and from the log. Generated. Rotating it
      re-encrypts nothing — the stored keys become unreadable and have to be entered again.
    sensitive: true
    generated: true
    validation:
      minLength: 43

resources:
  # A cluster space is created with this quota, so it has to cover every container at once —
  # including the model server, which has no limit of its own and grows with the number of models
  # kept resident.
  #
  # The database is three instances rather than one (replicated across the cloud's nodes, so that a
  # node rebooting is a switchover and not the silent loss of everything it held — SUP-179), which
  # is +500m, +1.5 GB and +2 × the database volume against the single-instance version of this
  # listing.
  #
  # 0.10.0 adds five more small pods to it: three etcd members holding Patroni's leader lock, and
  # two routers in front of the leader (SUP-215). That is +500m and +0.8 GB of limits, and no
  # storage at all — the DCS keeps nothing it would need a volume for, so its members are
  # `emptyDir` and count against the node's ephemeral disk rather than against this quota.
  # The extra 0.1 GB is the two routers sitting on the cluster-space memory floor (128Mi each)
  # instead of 64Mi, which that LimitRange refuses (SUP-238).
  #
  # The rendered limits of a default deployment now come to 3.85 CPU / 10.6 GB / 54 GB; what is
  # declared here keeps the headroom the earlier numbers had, so neither minimum moves. The CPU
  # total does not move with 0.11.1's two init-container floors: a pod's effective request is the
  # larger of its init containers and the sum of its regular ones, and in both pods the regular
  # container already asks for more.
  #
  # 0.12.0 adds one more container to the API pod — the attested egress, a ~30 MiB static binary
  # verifying external model endpoints (ADR-008). That is +100m and +128 MB of limits, no storage
  # and no GPU.
  #
  # 0.12.1 does not move the quota. It pins the Ollama chart at 1.85.0 and tells llama-server
  # to size its thread pools from this container's CPU limit, which is the same 2 CPU already
  # counted above.
  #
  # The rendered limits of a default deployment now come to 3.95 CPU / 10.7 GB / 54 GB; what is
  # declared here keeps the headroom the earlier numbers had, so neither minimum moves.
  #
  # 0.13.0 makes the built-in models optional and selects none by default (SUP-245). With none,
  # the model server and its proxy are not rendered, and the rendered limits come to
  # 1.70 CPU / 4.7 GB / 24 GB — the ollama container (2 CPU, 4 GB), its 30 GB volume and the
  # litellm proxy (250m, 2 GB) less than the 3.95 / 10.7 / 54 above, which still describe a
  # deployment with one model on the default volume.
  #
  # The minimum stays where it is anyway, and that is a decision, not an oversight: an external-
  # only deployment reserves about 3.3 CPU, 9 GB and 36 GB it does not use. `min` is the quota the
  # cluster space is created with, the specification has no way to make it depend on a
  # parameter, and a reconfigure re-renders into the same space without resizing it — so a
  # minimum sized for the empty selection would leave a later reconfigure that picks a model
  # with a model server that cannot be admitted, which reads as "the app is broken". Keeping the
  # headroom is what keeps "add a built-in model later" a reconfigure rather than a redeploy.
  # If that is not worth the reservation, the alternative is a smaller minimum and a form that
  # says picking a model needs a fresh deployment; it is a product call, not a chart one.
  min:
    cpu: "5"
    memory: "14Gi"
    storage: "60Gi"
  recommended:
    cpu: "9"
    memory: "26Gi"
    storage: "120Gi"
  gpu:
    required: false
    minCount: 1
    minVram: "16Gi"
    # nvidia-smi product names, which hw-measurement writes to device.swarm.io/gpu-product.
    # Placement requires this exact string. An A100 80GB or PCIe card is a different product
    # and needs its own entry. Spaces stay in the value; the node-label mirror turns them
    # into hyphens for Kubernetes, while placement compares the raw product name.
    types:
      - NVIDIA H100 NVL
      - NVIDIA H100 80GB HBM3
      - NVIDIA A100-SXM4-40GB
      - NVIDIA L40S
      - NVIDIA GeForce RTX 4090

components:
  # ---------------------------------------------------------------------------
  # The built-in model server. Reachable inside the cluster space and nowhere
  # else: an Ollama endpoint has no authentication of its own, and publishing
  # one would hand the deployment's GPU and models to whoever found the name.
  # Everything that reaches it goes through the proxy and then the router,
  # which is where keys, credit and metering live.
  #
  # Optional from 0.13.0 (SUP-245). A component cannot be left out of a
  # deployment — the specification has no `when:` on one, and an array
  # parameter cannot be tested in any condition — so this chart is ours rather
  # than otwld's and reads `models` itself: with none selected it renders no
  # Deployment, no Service and no volume, only one inert ConfigMap, because the
  # cloud refuses a component with nothing in it.
  # ---------------------------------------------------------------------------
  - name: ollama
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: confidential-router-ollama
      version: "0.1.0"
    # The same server image 0.12.x pulled through otwld's chart. Its `busybox`
    # went with that chart: it was the image of a `helm test` Pod the
    # marketplace never ran.
    images:
      - name: ollama/ollama
        digest: sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    deployment:
      values:
        base:
          # The whole selection, as a list: a value that is exactly one
          # placeholder is interpolated in its native type, so this reaches the
          # chart as a YAML sequence rather than as one string naming five
          # models. Empty is the external-only router.
          models: "{{ params.models }}"
          gpu:
            enabled: "{{ params.gpuEnabled }}"
            count: "{{ params.gpuCount }}"
          persistence:
            size: "{{ params.modelStorage }}"
          # llama-server's thread pools are sized from this CPU limit by the
          # chart, and the GPU count is added to both requests and limits there
          # — explicitly zero without one, because a GPU cluster space's
          # LimitRange defaults a missing `nvidia.com/gpu` to the reserved count.
          resources:
            cpu: "2"
            memory: 4Gi

  # ---------------------------------------------------------------------------
  # The OpenAI-compatible face on Ollama. It publishes one model name per
  # selected model — the same strings the router advertises, because the Ollama
  # name *is* the catalogue key on both sides. With none selected it is not
  # deployed either: one inert ConfigMap, for the same reason as above. External
  # endpoints never pass through it; the router proxies to them through the
  # attested egress in its own pod.
  # ---------------------------------------------------------------------------
  - name: litellm
    dependsOn:
      - ollama
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: confidential-router-litellm
      version: "0.2.0"
    images:
      - name: ghcr.io/berriai/litellm
        digest: sha256:e9711f484c7c8462c028803130afef546aa54c8d2fc11120242c01bbadc12e65
    deployment:
      values:
        base:
          # The model server's service name is fixed by its chart, as this
          # proxy's is, rather than derived from the release.
          ollamaUrl: http://confidential-router-ollama:11434
          models: "{{ params.models }}"
          masterKey: "{{ params.litellmKey }}"
          service:
            type: ClusterIP

  # ---------------------------------------------------------------------------
  # The router itself: `/v1` for clients, `/graphql` and `/auth` for the console,
  # and the PostgreSQL it stores accounts, keys, credit and metering in. Prompts
  # and completions are not among those — the console shows token counts, not
  # what was said.
  # ---------------------------------------------------------------------------
  - name: router-api
    dependsOn:
      - litellm
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: confidential-router-api
      # 0.10.0 renders the deployment's own endpoint whatever `models` says
      # (SUP-255). The form arrives with no built-in model since 0.13.0, and that
      # render published no endpoint at all — so the API could not tell which
      # endpoint was its own and the chat composer stayed locked, asking the user
      # to name it in the router configuration. The hostname is still a `${…}`
      # placeholder filled from the excluded ConfigMap (SUP-211); what moves is
      # `checksum/config` for every external-only render, so a pinned digest of
      # one re-pins.
      version: "0.10.0"
    images:
      - name: ghcr.io/super-protocol/confidential-router/router-api
        digest: sha256:14346b456061b80527b2c80c082bd934c53eeba4911b06bab542ce627e05086c
      # The attested egress, a second container in the API pod (ADR-008 §2): the
      # gatekeeper's own core, verifying an external model endpoint's evidence and
      # pinning its TLS leaf before this deployment proxies a prompt to it. The
      # same binary a client runs on their own machine, so the verification a user
      # performs on this router and the one this router performs on an upstream
      # cannot drift apart.
      #
      # Declared here for the reason every image is, and one more: this list is
      # the fail-closed gate, so a sidecar nobody declared is a deployment that is
      # refused rather than one that quietly runs an undeclared container — and
      # the digest is what puts the egress verifier inside the snapshot a user
      # pins.
      #
      # 0.13.1 re-pins it (SUP-248): the build 0.13.0 declared exited on the
      # `endpoints: []` document every fresh deployment starts from, so the API
      # pod never became Ready and no endpoint could ever be registered. This one
      # waits for a runnable configuration instead (`main-481445c`). 0.15.0 moves
      # it to `main-5efa452`, which also verifies Azure confidential-VM roots
      # (SUP-251) and evaluates two-factor endpoint trust (SUP-252); 0.16.0 to
      # `main-f23d2d6`, whose registry lookup is proven against the real
      # `sp-vm/signatures` layout, Azure folders included (SUP-255);
      # `charts/tests/sidecar_boot.sh` boots the declared digest on that document.
      - name: ghcr.io/super-protocol/confidential-router/gatekeeper
        digest: sha256:56158ed17a2f7f9124d30215472ea0fe2ac3dc56974eb0e6808ba0aced11e7d8
      # Spilo: PostgreSQL 17.5 and Patroni 4.0.4 in one image, which is what makes the
      # database three instances that elect a leader instead of one that comes back empty.
      # It replaces `bitnamilegacy/postgresql` — a mirror that receives no rebuilds, no
      # PostgreSQL minor releases and no CVE patches since Bitnami's free catalogue ended.
      - name: ghcr.io/zalando/spilo-17
        digest: sha256:b7db9e8f62e809ebd9a0679fbdba147a811fdd240ab78380ea4720a46a017184
      # Patroni's leader election store. It is etcd and not the Kubernetes API because a
      # cluster space confines its tenant pods and pod → kube-apiserver is one of the
      # things it blocks, which the API-as-DCS version of this listing found out by never
      # electing anybody (SUP-215). Three members, in the namespace, holding nothing but
      # the lock.
      - name: quay.io/coreos/etcd
        digest: sha256:2c029095680c13c2b36116cc3935e1b0cddc0f5af78004457fd863616d8d072b
      # A shell and `wget`, for the one decision an etcd member cannot take from a
      # manifest: whether to bootstrap the cluster or join one that is already there.
      # etcd's own image is distroless and has neither.
      - name: docker.io/library/busybox
        digest: sha256:5cec3fc171c87218698e85a52af7087de727372aae264a787b8112901a5b0092
      # The router in front of the leader. With the lock in etcd rather than in a
      # Service's Endpoints, which instance is the primary is a question only Patroni's
      # REST API answers — so something has to ask it, and a Service cannot.
      - name: docker.io/library/haproxy
        digest: sha256:56b887da77428b7a6621e59e480cdbd330cc805c22d3cedb66ceea76ffdea2c6
    deployment:
      values:
        base:
          apiHostname: "{{ params.apiHostname }}"
          consoleHostname: "{{ params.consoleHostname }}"
          publicScheme: https
          # The proxy's service name, which its chart derives from the chart name
          # rather than from the release: our three charts have to find each
          # other by DNS, and a name that moved with the release would make every
          # one of those defaults wrong.
          litellmUrl: http://confidential-router-litellm:4000
          litellm:
            apiKey: "{{ params.litellmKey }}"
          models: "{{ params.models }}"
          database:
            password: "{{ params.databasePassword }}"
          auth:
            secret: "{{ params.authSecret }}"
            magicLink:
              # Nothing here can deliver mail, so the console does not offer a
              # link it would only write to the pod log. Stripe billing brings a
              # Resend key with it and the patch below turns the mailer back on.
              mailer: none
            # The sign-in path that needs nothing outside the cluster (SUP-112).
            # It is what makes this deployment usable by a second person: the
            # token below claims exactly one account and then stops existing.
            password:
              enabled: true
            # The first-sign-in path for a deployment with no mailbox and no
            # OAuth app: while this is set and no user exists, posting it to
            # /auth/bootstrap creates the administrator. The endpoint is a 404
            # from then on.
            bootstrapToken: "{{ params.bootstrapToken }}"
            # Whoever is deploying, read from the marketplace account rather than
            # asked for: the console's first administrator is that person, and a
            # parameter here would only be a second copy of an address the
            # marketplace already holds — one that drifts the moment either changes.
            #
            # The chart carries it to the pod in its Secret rather than as a
            # literal in the container's env list, which is what keeps it out of
            # the published snapshot: until chart 0.8.0 this one address was the
            # last thing making the evidence digest a property of who deployed
            # this listing rather than of the version (SUP-241).
            bootstrapEmail: "{{ consumer.user.email }}"
            # Who may read the campaign's own numbers — issued, redeemed,
            # activated, granted, and the fraud-watch queries behind them. Read
            # from the marketplace account for the same reason as the address
            # above: the console's first administrator is the person deploying
            # this, and a parameter here would only be a second copy of an
            # address that drifts the moment either changes. An empty list
            # refuses everyone, and a published cluster space has no exec to run
            # `invites stats` through instead — so a campaign deployed without
            # this is a campaign nobody can see converting.
            adminEmails:
              - "{{ consumer.user.email }}"
          # The attested egress (ADR-008). On, which is what ships the feature: an
          # endpoint is registered in the console at run time, so the sidecar has
          # to be in the pod before there is anything to register. The trust list
          # and the endpoints themselves are not configured here and deliberately
          # cannot be — they are admin state, not deployment state.
          externalEndpoints:
            enabled: true
            secretsKey: "{{ params.secretsKey }}"
          # Nothing is for sale: checkout is refused and the console hides its buy
          # panel. The alternative the API used to fall back to was a provider
          # that mints credit from a signed link (SUP-167).
          billing:
            mode: disabled
            # Credit for every new account (SUP-249). Always passed: the chart
            # renders `signupGrantMicros` only when it is above zero.
            signupGrantUsd: "{{ params.signupGrantUsd }}"
          # Per instance, and there are three.
          postgresql:
            persistence:
              size: "{{ params.databaseStorage }}"
            # A cluster space's LimitRange refuses a container under 100m CPU or 128Mi, and
            # the request has to equal the limit (SUP-238). Chart 0.8.0 already defaults to
            # that floor; pinning it here is what kept a deployment of chart 0.6.1 admissible
            # and still stops a render from dropping below it.
            etcd:
              bootstrapResources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                  nvidia.com/gpu: "0"
                limits:
                  cpu: 100m
                  memory: 128Mi
                  nvidia.com/gpu: "0"
            router:
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                  nvidia.com/gpu: "0"
                limits:
                  cpu: 100m
                  memory: 128Mi
                  nvidia.com/gpu: "0"
          migrations:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 100m
                memory: 128Mi
        patches:
          - op: replace
            path: auth.password.enabled
            value: false
            when: "params.passwordSignup == false"

          # Switching sign-up off has to leave *some* way back in, or the chart
          # refuses to render: the bootstrap token is spent on the first account
          # and mail goes nowhere. So the mailer returns to `console` — the link
          # lands in the API log, which an administrator can read and nobody
          # outside the cluster can. Stripe billing replaces it with Resend
          # further down, which is why this patch comes first.
          - op: replace
            path: auth.magicLink.mailer
            value: console
            when: "params.passwordSignup == false"

          # And with it, out of production mode — the only thing that changes here.
          # The API refuses to write sign-in links to a log it considers
          # production, which is the right default and the wrong one for a
          # deployment whose administrator reads them out of `kubectl logs` on
          # purpose. It no longer touches billing: which provider binds follows
          # from `billing.mode` and the API's own check that its publicBaseUrl is
          # not a loopback address, neither of which this value can reach (SUP-167).
          - op: add
            path: nodeEnv
            value: development
            when: "params.passwordSignup == false"

          # `add` rather than `replace` wherever the base above does not already
          # carry the key: `replace` requires the path to exist in the resolved
          # values, and the base deliberately does not name a Stripe key it has
          # no value for.
          - op: replace
            path: billing.mode
            value: stripe
            when: "params.billingMode == 'stripe'"

          - op: add
            path: billing.stripe.secretKey
            value: "{{ params.stripeSecretKey }}"
            when: "params.billingMode == 'stripe'"

          - op: add
            path: billing.stripe.webhookSecret
            value: "{{ params.stripeWebhookSecret }}"
            when: "params.billingMode == 'stripe'"

          # Stripe puts the API into production mode, and the console mailer is
          # refused there — a sign-in link in the container log is a sign-in link
          # for anyone who can read logs. These three are the same decision as
          # the one above, not extras.
          - op: replace
            path: auth.magicLink.mailer
            value: resend
            when: "params.billingMode == 'stripe'"

          - op: add
            path: auth.magicLink.from
            value: "{{ params.mailFrom }}"
            when: "params.billingMode == 'stripe'"

          - op: add
            path: auth.magicLink.resendApiKey
            value: "{{ params.resendApiKey }}"
            when: "params.billingMode == 'stripe'"

          # The campaign, when there is one. `add` for both, and nothing in the
          # base: a deployment running no campaign has to render no landing
          # origin and no analytics key at all, because the router's config
          # schema is strict about keys it does not know and an empty one is
          # still a key.
          - op: add
            path: invites.landingHostname
            value: "{{ params.landingHostname }}"
            when: 'params.landingHostname != ""'

          - op: add
            path: analytics.posthog.projectKey
            value: "{{ params.posthogProjectKey }}"
            when: 'params.posthogProjectKey != ""'

          # Invite-only registration (SUP-173). `add`, and absent from the base
          # for the same reason the two above are: the chart renders the key only
          # when it is on, so a deployment that is not invite-only carries no
          # `auth.requireInviteForSignUp` at all rather than an explicit `false`.
          - op: add
            path: auth.requireInviteForSignUp
            value: true
            when: "params.inviteOnlySignup == true"

  # ---------------------------------------------------------------------------
  # The console. Served on its own hostname and talking to the API on the other
  # one, which is why the API's ingress carries /auth and /graphql: the browser
  # calls them cross-origin with credentials.
  #
  # The console resolves its API origin at run time (SUP-100), which is what lets
  # this component exist at all: an image reference pinned by digest and a
  # hostname the customer chooses at deploy time used to be the same requirement
  # pulling in opposite directions, and the chart refused to render a console
  # pointed at anything but the origin its image was built for.
  # ---------------------------------------------------------------------------
  - name: router-ui
    dependsOn:
      - router-api
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: confidential-router-ui
      version: "0.2.4"
    images:
      # Moves with the API's digest above, from the same source revision: the
      # admin section that registers an external endpoint and edits the trust
      # list is a console screen over a GraphQL schema the API half ships, and
      # the two halves of one contract are not independently pinnable.
      - name: ghcr.io/super-protocol/confidential-router/router-ui
        digest: sha256:097b8d87e83fe2d21fc12ad357aefcb78188d9a36e7274fe8c7a82ca32be7bf3
    deployment:
      values:
        base:
          consoleHostname: "{{ params.consoleHostname }}"
          apiHostname: "{{ params.apiHostname }}"
          publicScheme: https

outputs:
  - id: consoleUrl
    title: Console
    type: url
    value: "https://{{ params.consoleHostname }}"

  - id: apiBaseUrl
    title: OpenAI base URL
    type: url
    value: "https://{{ params.apiHostname }}/v1"

  - id: firstSignIn
    title: First sign-in
    type: string
    value: "Open the console, choose \"Use a first-sign-in token\", and enter the token below together with {{ consumer.user.email }} — the account is created for that address. That claims it and the token stops working — it is spent by the first account, whoever creates it, so claim the deployment before its hostname is handed out."

  - id: signUp
    title: Everyone else
    type: string
    when: "params.passwordSignup == true && params.inviteOnlySignup == false"
    value: "https://{{ params.consoleHostname }}/signup — an email address and a password, with nothing to deliver and nothing to verify. Each account arrives with its own empty workspace and ${{ params.signupGrantUsd }} of sign-up credit: anyone who can reach the console can create one, and each such account collects that credit, so turn \"Allow sign-up with a password\" off by reconfiguring if this console is reachable by people it is not for. There is no password reset — it would need the mail delivery this deployment does without."

  - id: invitedSignUp
    title: Everyone else
    type: string
    when: "params.inviteOnlySignup == true"
    value: "https://{{ params.consoleHostname }}/signup — but only with an invitation. Every sign-up path is refused unless the request carries a code that is valid and has not been redeemed, and the refusal says which of the three it is: no code, already claimed, or expired. Generate the codes with `invites generate` before handing the hostname out; with none issued nobody can register, including you — claim the administrator account with the first-sign-in token above first."

  - id: bootstrapToken
    title: First sign-in token
    type: secret
    value: "{{ params.bootstrapToken }}"

  - id: gatekeeperSetup
    title: Point a Gatekeeper at this endpoint
    type: string
    value: "gatekeeper endpoint add router --listen 127.0.0.1:8443 --upstream https://{{ params.apiHostname }} && gatekeeper endpoint discover router && gatekeeper endpoint trust add router --from-upstream && gatekeeper run"

  - id: gatekeeperBaseUrl
    title: OpenAI base URL, through a Gatekeeper
    type: url
    value: "http://127.0.0.1:8443/v1"

  - id: evidenceBundle
    title: Published evidence
    type: url
    value: "https://{{ params.apiHostname }}/.well-known/swarm-evidence"

  - id: billingNote
    title: Credit
    type: string
    when: "params.billingMode == 'disabled'"
    value: "This deployment sells no credit: the console has no buy panel and a checkout is refused. Credit arrives as a grant — the ${{ params.signupGrantUsd }} every new account starts with (the sign-up credit, 0 for none), an invitation code redeemed at sign-up, or `credits grant` from an administrator. Switch to Stripe by reconfiguring."

# What a deployment of this version attests to, and what about it is left out.
#
# `expectedDigest` is deliberately absent. It cannot be derived from the charts —
# a cluster defaults fields no template writes — so it has to be measured from a
# reference deployment of exactly this version and declared afterwards. Until
# then the cloud publishes a digest, nothing compares it to anything, and no
# operator is shown a mismatch that is not one.
#
# What this version does deliver is the property that makes such a measurement
# worth declaring: two deployments of it *with the same parameters*, under
# different hostnames in different namespaces, render byte-identical snapshots.
# Before it they could not — the chosen hostname reached `server.publicBaseUrl`,
# the CORS allow-list, the checkout return URL and the attested endpoint inside
# `router.yaml`, so the digest was a property of the hostname and no two
# deployments could ever agree on one (SUP-210).
#
# The way out was not to drop `router.yaml` from the snapshot — that would have
# hidden the router's entire configuration, which is the one thing the digest is
# worth attesting. The hostname-derived values moved into a ConfigMap of their
# own and `router.yaml` names them by `${…}` placeholder; the small object is
# excluded, the configuration stays attested (SUP-211). They are not in a Secret
# for the same reason: Secrets are lifted out wholesale, which would have hidden
# the exclusion from this listing instead of disclosing it.
#
# The qualifier two paragraphs up — *with the same parameters* — is the whole of
# what is left, and it is not a footnote: the digest is one per parameter set,
# not one per version. What the hostname work removed was the axis no deployment
# chooses on purpose; the parameters that change what the deployment *does*
# still reach the attested render and still move it —
#
#   - `models` — the catalogue is the `models:` block of the attested
#     `/data/router.yaml`, and the endpoints the selected models refer to are
#     its `endpoints:` block. The deployment's own endpoint is in that block
#     whatever the selection — from chart 0.10.0 (SUP-255), because the chat
#     verifies this router's channel and locked without it; before that an
#     empty selection published no endpoint. From 0.13.0 an empty selection
#     also leaves the model server and its proxy out of the snapshot entirely,
#     each replaced by one ConfigMap that says so;
#   - `inviteOnlySignup` — writes `auth.requireInviteForSignUp` into the same
#     file, rendered only while it is on;
#   - `signupGrantUsd` — writes `billing.signupGrantMicros` into the same file,
#     rendered only while it is above zero, and its value with it: a deployment
#     granting $20 and one granting $50 publish different digests, which is the
#     point — what an account starts with is behaviour (SUP-249);
#   - `gpuEnabled` — renders `runtimeClassName: nvidia`, the `nvidia.com/gpu`
#     requests and the GPU tolerations into the attested ollama Deployment, and
#     moves nothing when no model is selected, because there is none;
#
# and on the same footing `passwordSignup`, `billingMode` and `landingHostname`,
# each of which makes a `router.yaml` block appear or disappear. The chart's own
# goldens pin it: `checksum/config` is `b3f6581a…` for the form as it arrives
# (no built-in model, the egress on), `422eac71…` for one built-in model,
# `9d86a7cb…` for three, `df5ff3db…` for none with the egress off, `eb15fbf2…`
# for an invite-only launch with a campaign landing page
# (`charts/tests/golden/api-*.yaml`; the label inside the hashed ConfigMap
# carries the chart version, so every chart release moves all of them).
# Parameters whose value lands in the Secret — the tokens, keys and passwords —
# do not move it: the Secret is lifted out of the snapshot wholesale, so what
# moves the digest is a block appearing, not the credential inside one.
#
# None of those axes is excluded, and none should be: SUP-239 settled that
# behaviour-bearing configuration belongs in the snapshot, because a digest that
# says nothing about which models are served attests to nothing worth attesting.
# They are instead the second reason `expectedDigest` is absent above — there is
# no single value it could hold — and it stays absent until expectation profiles
# declare one digest per parameter set (SUP-240).
#
# One field survived that and was found by the measurement it blocked: the
# address of whoever deployed this, which the chart handed the API as a literal
# in two containers' env lists. Byte-identical deployments by two different
# marketplace accounts published two different digests, and each snapshot carried
# a personal address nobody was told it would publish. It is in the chart's
# Secret from 0.7.2 on (SUP-241) — and not in the exclusions below, because a
# Secret's values are stripped by the platform rather than left out by this
# listing, so there is no exclusion to disclose and the configuration a reviewer
# reads is no smaller than it was.
#
# Each entry below is also a `swarm.io/exclude-evidence-fields` annotation on the
# object that carries it. Repeated here because this block is what the
# marketplace reads to show the exclusions beside the digest, and a digest
# displayed next to "no exclusions" answers the only question that matters about
# it wrongly.
evidence:
  exclude:
    # The two published hostnames. `ingress.tls.enabled` is false for this
    # listing — the cloud holds the certificate — so `/spec/rules/0/host` is the
    # only pointer each Ingress renders.
    - match: { kind: Ingress, name: confidential-router-api }
      fields:
        - "/spec/rules/0/host"
    - match: { kind: Ingress, name: confidential-router-ui }
      fields:
        - "/spec/rules/0/host"

    # The hostname-derived values themselves: the API's public base URL and
    # attested endpoint, the browser origins allowed to call it, the checkout
    # return URL, the campaign landing origin — and, for the console, the API
    # origin it fetches from. Whole objects rather than fields inside them, which
    # is what moving them out of the attested documents bought.
    - match: { kind: ConfigMap, name: confidential-router-api-public }
      fields:
        - "/data"
    - match: { kind: ConfigMap, name: confidential-router-ui-public }
      fields:
        - "/data"

    # And the two pod-template hashes of those objects, which exist so a hostname
    # reconfigure actually restarts the pods that read them once at start.
    # `checksum/config` — the hash of the attested `router.yaml` — is not here,
    # and that is the point: it no longer varies with the hostname, which is what
    # made it worthless. It is a property of the version and the parameters now,
    # and it does still vary with `models`, `inviteOnlySignup`, `passwordSignup`,
    # `billingMode` and `landingHostname` — deliberately, as the block above
    # explains.
    - match: { kind: Deployment, name: confidential-router-api }
      fields:
        - "/spec/template/metadata/annotations/checksum~1public-config"
    - match: { kind: Deployment, name: confidential-router-ui }
      fields:
        - "/spec/template/metadata/annotations/checksum~1public-config"
