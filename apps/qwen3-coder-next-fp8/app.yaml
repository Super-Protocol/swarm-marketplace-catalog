apiVersion: swarm.cloud/v1alpha1
kind: AppDefinition

metadata:
  name: qwen3-coder-next-fp8
  title: Qwen3-Coder-Next (FP8)
  description: Qwen3-Coder-Next in Qwen's own FP8 quantisation — an 80B hybrid-attention mixture of experts with 3B active parameters and a 262 144-token context, served on an authenticated, OpenAI-compatible endpoint whose deployment publishes signed evidence of the weights. Needs one H200 NVL to itself. Tool calling works.
  version: "0.1.0"
  category: ai-inference
  sourceRepo: https://huggingface.co/Qwen/Qwen3-Coder-Next-FP8
  license: Apache-2.0
  tags:
    - ai
    - llm
    - inference
    - openai-compatible
    - tool-calling
    - code
    - qwen
    - fp8
    - moe
    - long-context
    - attestation

ui:
  sections:
    # Same shape as the 30B-A3B listing: one field above Advanced, and it arrives
    # filled in. The difference is that this model's defaults are not a
    # compromise — it takes the whole card, so the context length default is the
    # model's own maximum rather than a fraction of it.
    - id: access
      title: Access
      description: >-
        Where the OpenAI-compatible API is served. This is the name that ends up in somebody
        else's configuration: a client's `base_url`, or the Confidential Router's
        "Add external model" field.
      fields:
        - parameterId: apiHostname
          widget: hostname

    - id: advanced
      title: Advanced
      description: >-
        Every field below is answered. The key is generated and shown with the deployment's
        outputs, the context length is the model's own maximum, and the GPU share is sized for
        the one card this listing accepts. Open this to bring your own key, to trade context
        length for concurrency, or to leave the engine less of the card — but note that the
        weights alone are 74.9 GiB, so there is much less room to give away here than on a
        smaller model.
      fields:
        - parameterId: apiKey
          widget: password
        - parameterId: maxModelLen
          widget: select
        - parameterId: gpuMemoryUtilization
          widget: number

parameters:
  - id: apiHostname
    type: string
    title: API hostname
    description: >-
      Where `/v1` is served. Take the one offered and the DNS is written for you; bring your own
      and point it at this cloud's gateway before publishing the deployment.
    required: true
    validation:
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  - id: apiKey
    type: string
    title: API key
    description: >-
      Demanded on every `/v1` request as `Authorization: Bearer …`. Generated if left blank and
      shown below once this is deployed, together with a connection link that carries it. Letters
      and digits only — the key travels inside a URL fragment, and punctuation there would split
      the link on its own separators.
    sensitive: true
    generated: true
    validation:
      minLength: 32
      pattern: "^[A-Za-z0-9]+$"

  - id: maxModelLen
    type: integer
    title: Context length
    description: >-
      The longest prompt-plus-answer the endpoint accepts, and this model's own maximum is the
      default. Its hybrid attention makes a long context unusually cheap: only 12 of the 48
      layers keep a per-token KV cache, so a token costs 24 KiB rather than the 96 KiB a
      full-attention model of this shape would — 6.0 GiB for one full-length 262 144-token
      sequence, 1.5 GiB at 65 536. The other 36 layers hold a fixed-size recurrent state per
      sequence that does not grow with length at all. A shorter context therefore buys less
      concurrency here than elsewhere; the reason to lower it is a tighter GPU share, not speed.
    default: 262144
    options:
      source:
        type: static
        values:
          - value: 32768
            label: "32 768 tokens"
          - value: 65536
            label: "65 536 tokens"
          - value: 131072
            label: "131 072 tokens"
          - value: 262144
            label: "262 144 tokens"

  - id: gpuMemoryUtilization
    type: number
    title: Share of the GPU
    description: >-
      The fraction of the card the engine claims for weights and KV cache. A fraction of the
      *whole* card: on the 140 GiB H200 NVL this listing requires, the default 0.90 is ~126 GiB,
      of which 74.9 GiB is weights — so roughly 51 GiB is left for KV cache, about eight
      full-length sequences at once. The floor is 0.6 rather than 0.2 because the weights alone
      are 53% of the card and the engine refuses to start below them. Nothing else may hold the
      card: the engine checks free memory at startup and declines rather than sharing.
    default: 0.90
    validation:
      min: 0.6
      max: 0.95

resources:
  # The cluster space quota, not a hint: it becomes the namespace's quota, and
  # under-declared it evicts the heaviest pod and reads as "the app is broken".
  #
  # Derived from the 30B-A3B listing's measured figures rather than measured on
  # this model — the deployment that measures it is a separate issue (SUP-330),
  # and these numbers are the budget it will check, not a report of it. There,
  # the container's cgroup peaked at 20.3 GiB serving 29.05 GiB of weights; the
  # part of that which scales is the page cache pulled in by reading the
  # weights, and this checkpoint is 2.6x larger. 48Gi plus the 2 GiB of
  # memory-backed /dev/shm the engine's workers talk over is the budget, with
  # the engine's own footprint unchanged — the resident set lives on the card,
  # not in RAM.
  #
  # `storage` is the weights volume, which has to hold 74.89 GiB plus the
  # `.part` file of whichever shard is being written; the chart's own floor is
  # 82.4 GiB and refuses to render below it.
  min:
    cpu: "8"
    memory: "48Gi"
    storage: "100Gi"
  recommended:
    cpu: "16"
    memory: "64Gi"
    storage: "120Gi"
  gpu:
    # Not optional and not a switch. The engine's published image is a CUDA build
    # and does not serve on a CPU; a deployment without a card starts, finds no
    # device and restarts for ever.
    required: true
    minCount: 1
    # 74.9 GiB of weights is 53% of an H200 NVL and more than the whole of an
    # 80 GiB card, so unlike the 30B-A3B listing this one has no second option:
    # a 94 GiB H100 NVL would hold the weights and ~10 GiB of KV cache, which is
    # one and a half full-length requests. The floor is set to exclude it rather
    # than to let it fail at startup.
    minVram: "120Gi"
    # nvidia-smi product names, which hw-measurement writes to
    # device.swarm.io/gpu-product. Placement requires this exact string, so a
    # different card of the same family needs its own entry.
    types:
      - NVIDIA H200 NVL

components:
  - name: engine
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: swarm-model-server
      version: "0.2.0"
    # The engine image, and the only image this deployment runs — it serves the
    # model and, as an init container, fetches and hash-checks the weights. An
    # unpinned reference would make the evidence digest uncomputable
    # (specification 2.7).
    #
    # vLLM 0.22.0, the same digest the other listings in this family pin, and
    # deliberately not newer: it already registers `Qwen3NextForCausalLM`
    # (`vllm/model_executor/models/registry.py` at v0.22.0) and the
    # `qwen3_coder` tool-call parser, while every build from 0.24.0 up either
    # fails to import against this stand's CUDA 12.9 driver or — worse — starts,
    # passes a readiness probe and returns fluent wrong answers. The measurements
    # are in `charts/swarm-model-server/values.yaml`.
    images:
      - name: docker.io/vllm/vllm-openai
        digest: sha256:0fec7ec5f3e6bc168e54899935fb0557da908a4832a1dbc88e2debcf2f889416
    deployment:
      values:
        base:
          hostname: "{{ params.apiHostname }}"
          apiKey: "{{ params.apiKey }}"
          persistence:
            size: 100Gi
          resources:
            cpu: "8"
            memory: 48Gi
          model:
            # The user-visible id, which is what a client asks for and what the
            # Confidential Router registers. Shorter than the repository name on
            # purpose: it is typed into configuration by people.
            id: qwen3-coder-next
            maxModelLen: "{{ params.maxModelLen }}"
            gpuMemoryUtilization: "{{ params.gpuMemoryUtilization }}"
            toolCalling:
              enabled: true
              parser: qwen3_coder
            # The checkpoint's chat template emits Qwen3-Coder's XML tool format
            # (`<tool_call><function=…><parameter=…>`), which is what this parser
            # reads — the same format and the same parser as the 30B-A3B listing,
            # verified against `chat_template.jinja` at the pinned revision.

            # The checkpoint carries its own `quantization_config` (fp8 e4m3,
            # dynamic activations, 128x128 weight blocks, with the embeddings,
            # the router gates and the linear-attention convolutions left in
            # bf16), so this names what is already there rather than asking for
            # a conversion.
            quantization: fp8

            # ---------------------------------------------------------------
            # The weights, pinned file by file.
            #
            # This block is rendered into a ConfigMap, so it is part of what the
            # cloud digests and signs: the bytes this deployment serves are
            # named, by sha256, inside its published evidence. An init container
            # downloads each file, hashes it while writing, and refuses to let
            # the engine start on any mismatch.
            #
            # Regenerate with:
            #   scripts/model-weights-manifest.py Qwen/Qwen3-Coder-Next-FP8
            # ---------------------------------------------------------------
            weights:
              repo: Qwen/Qwen3-Coder-Next-FP8
              revision: da6e2ed27304dd39abadd9c82ef50e8de67bdd4c
              totalBytes: 80407722953
              files:
