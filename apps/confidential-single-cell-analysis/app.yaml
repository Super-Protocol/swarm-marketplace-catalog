apiVersion: swarm.cloud/v1alpha1
kind: AppDefinition

# ---------------------------------------------------------------------------
# Confidential Single Cell Analysis — the first listing in the blueprint-port
# epic (SUP-837) whose upstream needed no licence substitution at all.
#
# What it is: NVIDIA's open Single-Cell Analysis Blueprint — RAPIDS-singlecell
# on a GPU, Apache-2.0 — running inside a confidential cluster space, over a
# matrix the tenant never has to export. What it is NOT is an NVIDIA product,
# and the naming here follows the guardrails in SUP-841: a product name of ours
# plus an honest provenance line, and no claim of endorsement (which the
# container's own licence forbids in so many words, §4(d)).
#
# The one encumbrance the stage-1 audit did not find, recorded here because it
# is the question anybody reading this listing will ask: the RAPIDS notebooks
# image carries `/NGC-DL-CONTAINER-LICENSE` and its entrypoint prints that the
# container is governed by the NVIDIA Deep Learning Container License. That is
# NOT Apache-2.0 — but it is also not NVIDIA AI Enterprise: it needs no
# entitlement, no NGC credential and no per-GPU fee, it permits deploying the
# container to offer a service to third parties (§1(b)) given material
# additional functionality (§2(a)), and the Docker Hub copy pinned below pulls
# anonymously. Surfaced on the card through the `containerLicence` output
# rather than buried here.
# ---------------------------------------------------------------------------

metadata:
  name: confidential-single-cell-analysis
  title: Confidential Single Cell Analysis
  description: >-
    GPU-accelerated single-cell RNA analysis — QC, normalisation, clustering, UMAP, Harmony batch
    correction, marker genes and transcription-factor activity — on patient-derived expression
    matrices that never leave the enclave. A JupyterLab workspace with RAPIDS-singlecell on the
    card, serving notebooks ported from NVIDIA's open Single-Cell Analysis Blueprint (Apache-2.0),
    reading the dataset you attach rather than a corpus off the public internet. The deployment
    publishes signed evidence of the exact environment it is running, down to the sha256 of every
    Python wheel.
  version: "0.2.1"
  category: life-sciences
  # What an auditor should read: the workflow, its authors and its licence are
  # upstream's. What we changed is in the chart's
  # files/notebooks/PROVENANCE.md, which is also copied into every deployment's
  # workspace.
  sourceRepo: https://github.com/NVIDIA-AI-Blueprints/single-cell-analysis-blueprint
  license: Apache-2.0
  tags:
    - single-cell
    - genomics
    - rapids
    - gpu
    - jupyter
    - scverse
    - healthcare
    - attestation

ui:
  sections:
    - id: access
      title: Access
      description: >-
        Where the workspace is served, and the token that opens it. Take the hostname offered and
        the DNS is written for you.
      fields:
        - parameterId: hostname
          widget: hostname
        - parameterId: token
          widget: password

    - id: data
      title: Your data
      description: >-
        Which columns of your matrix the notebooks group by. Both are answered; open this only if
        your `obs` uses different names. The first notebook prints the columns it actually found, so
        a wrong answer here is a message in cell 3 rather than a failure forty cells in.
      fields:
        - parameterId: batchKey
          widget: text
        - parameterId: labelKey
          widget: text

parameters:
  - id: hostname
    type: string
    title: Workspace hostname
    description: >-
      Where JupyterLab is served. Take the one offered and the DNS is written for you; bring your
      own and point it at this cloud's gateway before publishing the deployment.
    required: true
    validation:
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  - id: token
    type: string
    title: Sign-in token
    description: >-
      The only credential the workspace accepts. Generated if left blank and shown below once this
      is deployed — paste it into the sign-in form. It is the whole of the authentication in front
      of a GPU and whatever data you attach, so it is not optional and it is not short.
    sensitive: true
    generated: true
    validation:
      minLength: 32

  - id: batchKey
    type: string
    title: Batch column
    description: >-
      The `obs` column the notebooks treat as the batch — for the QC violins and for Harmony
      integration. The blueprint's own notebooks used `assay`, which is a column of the public
      corpus they downloaded; yours is whatever your matrix calls it.
    required: true
    default: batch
    validation:
      pattern: "^[A-Za-z_][A-Za-z0-9_.-]*$"

  - id: labelKey
    type: string
    title: Cell-type column
    description: >-
      The `obs` column carrying an existing cell-type annotation, which the notebooks compare their
      own clustering against. Genuinely optional in the data — a matrix without it still runs
      everything up to that comparison.
    required: true
    default: cell_type
    validation:
      pattern: "^[A-Za-z_][A-Za-z0-9_.-]*$"

resources:
  # ---------------------------------------------------------------------------
  # The cluster space quota, not a hint: it becomes the namespace's quota, and
  # under-declared it evicts the heaviest pod and reads as "the app is broken".
  #
  # One pod, one container — 8 CPU / 48Gi, which includes the 8Gi of
  # memory-backed /dev/shm RAPIDS uses to talk to its Dask workers. The extra
  # 1 CPU and 2Gi above that are not margin: the marketplace adds its own
  # egress sidecar to any deployment that mounts GATED data (limits 250m /
  # 128Mi), and a quota sized for the application alone refuses it.
  #
  # Memory is host memory, not VRAM. anndata holds a full copy of the matrix
  # there before it ever reaches the card, and an out-of-core workflow streams
  # through it by design.
  min:
    cpu: "9"
    memory: "50Gi"
    storage: "100Gi"
  # The heaviest single pod, which is the one the cloud requires ONE node to be
  # able to hold — and the LimitRange max of the space. The sidecar is a pod of
  # its own, and a far smaller one, so this is the notebook container's limits.
  maxPod:
    cpu: "8"
    memory: "48Gi"
  recommended:
    cpu: "16"
    memory: "96Gi"
    storage: "200Gi"
  gpu:
    # RAPIDS-singlecell is CUDA. Without a card the notebooks import and then
    # fail on the first `rsc.get.anndata_to_GPU` — a deployment that looks
    # healthy and cannot do the one thing it is for.
    required: true
    minCount: 1
    # The blueprint's own floor: ≥24 GB for the notebooks this listing ships,
    # which is also what makes an L40S or an A10 a legitimate target for it
    # rather than only a datacentre card.
    minVram: "24Gi"
    # nvidia-smi product names, which hw-measurement writes to
    # device.swarm.io/gpu-product. Placement requires this exact string, so a
    # different card of the same family needs its own entry — and a plausible
    # guess is worse than no entry at all. These two are the cards this estate
    # actually has: H100 NVL was measured inside a cluster space on the
    # gpu-blueprints cloud (SUP-868), H200 NVL is the card the model-serving
    # listings run on.
    types:
      - NVIDIA H100 NVL
      - NVIDIA H200 NVL

data:
  slots:
    # -------------------------------------------------------------------------
    # One slot, two interfaces, and the difference between them is who holds the
    # credentials.
    #
    # `clickhouse-http/v1` is the gateable one — today it is the ONLY interface
    # the marketplace gatekeeper can serve, because the gate injects ClickHouse
    # credentials into every request it forwards and rewrites the database it
    # names. A dataset published `access.mode: gateway` over this interface
    # reaches this deployment through a plain listener in its own namespace, and
    # every read is admitted against the evidence this deployment published.
    #
    # `s3-h5ad/v1` is the format a lab's matrices already exist in, registered
    # in the specification and mirrored into the platform's `BUNDLED_INTERFACES`
    # by SUP-881 — which is what made naming it here possible at all: a
    # definition naming a contract the registry does not hold is refused at
    # submission. It is second because it cannot be gated. The gatekeeper is an
    # HTTP proxy in front of ClickHouse, so an `.h5ad` dataset is bound straight
    # into the enclave with credentials of its own and read out of the bucket by
    # `sc_workspace._read_h5ad_from_s3`. Preference order therefore reads "gate
    # it if the dataset can be gated", which is the order below.
    #
    # Not required. A deployment with nothing attached is a supported and useful
    # one: the tenant drops an `.h5ad` into /workspace/data through the browser
    # and never registers the data with a marketplace at all. The binding — and
    # therefore everything that varies between two deployments of this version —
    # lives in a Secret, so the attested render is the same either way.
    # -------------------------------------------------------------------------
    - name: matrices
      title: Single-cell matrices
      description: >-
        The expression matrices the notebooks work on: an `.h5ad` dataset in object storage, or
        long-form `sc_counts` (`cell_id`, `gene`, `count`) plus `sc_cells` and, optionally,
        `sc_genes` in ClickHouse. Attach more than one and the notebooks read the first —
        `00_dataset.ipynb` lists them all. Nothing attached is also supported: upload an `.h5ad`
        into /workspace/data instead.
      required: false
      multiple: true
      accepts:
        - interface: clickhouse-http/v1
        - interface: s3-h5ad/v1
      schema:
        tables:
          - columns:
              - name: cell_id
                type: string
              - name: gene
                type: string
              - name: count
                type: number

components:
  - name: workspace
    source:
      type: helm
      repoUrl: https://super-protocol.github.io/swarm-marketplace-catalog/charts
      chart: rapids-singlecell-notebook
      version: "0.1.0"
    # The RAPIDS notebooks image, and the only image this deployment runs. The
    # Python environment the notebooks need is installed from a hash-pinned lock
    # that the chart renders into an attested ConfigMap — so the environment is
    # named by sha256 inside the evidence even though it is not in the image.
    images:
      - name: docker.io/rapidsai/notebooks
        digest: sha256:bbe8a453ff7e3613829eb8ad723f78ae3df236acf86c3ad9166820235a32ffbf
    deployment:
      values:
        base:
          hostname: ""
          token: ""
          data:
            bindingJson: ""
            batchKey: ""
            labelKey: ""
        patches:
          - op: replace
            path: hostname
            value: "{{ params.hostname }}"

          - op: replace
            path: token
            value: "{{ params.token }}"

          # The resolved binding, straight into the chart's Secret. It carries
          # the dataset owner's credentials, and it is the one value that
          # differs between two deployments of this version — both of which are
          # reasons for it to be nowhere else.
          - op: replace
            path: data.bindingJson
            value: "{{ data.matrices | json }}"

          - op: replace
            path: data.batchKey
            value: "{{ params.batchKey }}"

          - op: replace
            path: data.labelKey
            value: "{{ params.labelKey }}"

outputs:
  - id: workspaceUrl
    title: Open the workspace
    type: url
    value: "https://{{ params.hostname }}/lab"

  - id: token
    title: Sign-in token
    # `secret`, so it is surfaced only to people who may deploy for the
    # organisation, masked, with one-click copy.
    type: secret
    value: "{{ params.token }}"

  - id: signIn
    title: How to sign in
    # Deliberately NOT a `https://…/lab?token=…` link, which is how JupyterLab
    # usually hands a token over. A query string is written to the ingress
    # controller's access log, to any proxy in between, and to the browser's
    # history; the sign-in form posts the same token in a body and sets a
    # cookie. One copy-paste is worth that.
    type: string
    value: >-
      Open the workspace above and paste the sign-in token into the form. Do not append it to the
      URL as `?token=…` — a query string lands in the gateway's access log and in your browser
      history, and the form does not.

  - id: containerLicence
    title: Licence of the container this runs
    type: string
    value: >-
      The notebooks, the chart and the ported workflow are Apache-2.0. The image they run in —
      `rapidsai/notebooks` 26.02, from Docker Hub — is governed by the NVIDIA Deep Learning
      Container License (`/NGC-DL-CONTAINER-LICENSE` inside the image), with its components under
      their own open licences. It needs no NVIDIA entitlement, no NGC credential and no per-GPU
      fee, and it pulls anonymously. What it does require of you: material additional functionality
      beyond the container (§2(a)), no claim that this is sponsored or endorsed by NVIDIA (§4(d)),
      and NVIDIA's own notice that the container is not certified for medical or other life-critical
      use (§4(h)).

  - id: evidenceBundle
    title: Published evidence
    type: url
    value: "https://{{ params.hostname }}/.well-known/swarm-evidence"

  - id: dataBound
    title: Data
    type: string
    value: >-
      A dataset is attached to this deployment. `00_dataset.ipynb` names it, shows its `obs` columns
      and proves the GPU is reachable before any analysis starts.
    when: "data.matrices.count > 0"

  - id: dataUnbound
    title: Data
    type: string
    value: >-
      No dataset is attached. Upload an `.h5ad` into /workspace/data with the file browser in
      JupyterLab, or reconfigure the deployment with a dataset in the "Single-cell matrices" slot.
    when: "data.matrices.count == 0"

evidence:
  # evidence-configuration: gated
  #
  # ---------------------------------------------------------------------------
  # Measured, not derived, and it describes the GATED configuration.
  #
  # Two deployments of this render on the gpu-blueprints cloud, 2026-11-24 —
  # `sc-900a` and `sc-900b`, two hostnames in two namespaces with two separately
  # generated sign-in tokens, each with `kestrel-pbmc-panel` attached — published
  # signed snapshots that are byte-identical: the same digest AND the same 121,459
  # bytes of resource JSON, compared field by field as JSON Pointers rather than
  # by the digest alone. 279 pointers each, zero differing values, no object
  # present on one side only.
  #
  # TEN resources in each, where the ungated measurement had six: 3 ConfigMaps,
  # 2 Deployments, the Ingress, 2 Secrets, 2 Services. The four the marketplace
  # adds for a gated deployment are the egress sidecar's ConfigMap, Deployment and
  # Service **and the Secret holding its client certificate** — four objects, not
  # the three an earlier version of this comment claimed. That was a reading of
  # `gatekeeper/egress-sidecar.ts`; this is a count of a published snapshot.
  #
  # **It is the gated configuration on purpose.** The marketplace hands the gate
  # the `expectedDigest` of the listing version a deployment was created from and
  # the gate fetches that deployment's own evidence and compares, so the only
  # deployments this number is ever checked against are the ones that mount
  # gateway-mode data. Declaring the ungated number would therefore refuse every
  # gated read of this listing — which is the one thing its `clickhouse-http/v1`
  # slot exists for, and which is what SUP-900 was raised to fix.
  #
  # What that costs: an UNGATED deployment of this listing — one with an
  # `s3-h5ad/v1` dataset, or nothing attached — does not match the number on its
  # own listing page. Nothing refuses it, because there is no gate in front of it
  # to do the refusing, and README.md says which configuration the digest is.
  # **The ungated digest, for the record, is
  # `3e03a7196d77d9e0b9f8340a976d372337fc2e5474f591530e6f84b41730979a`** — six
  # resources, measured on `sc-842a` / `sc-842b` on 2026-11-22 (SUP-842), and not
  # declared.
  #
  # Checked against the gate and not only against itself: both measurement
  # deployments read `matchesExpected: false` while the listing still declared the
  # ungated number, and `sc-900b` — created after this number was the declared one
  # — read `matchesExpected: true` and the gate admitted it. A real read ran inside
  # the deployment through the sidecar: `sc_workspace.load_matrix()` over
  # `clickhouse-http/v1` assembled the whole 1,800 x 933 matrix, 1,101,372 non-zero
  # counts, nine annotated populations, `batch` and `cell_type` resolved. Admission
  # is not instant — for a few minutes after the number is declared the read fails
  # with a `502` from this deployment's own egress sidecar, because the gate has
  # not yet been told about the client.
  #
  # ---------------------------------------------------------------------------
  # THE REFERENCE PARAMETER SET it was measured with. The digest holds for this
  # one, and a deployment that answers differently attests its own — expected,
  # not tampering.
  #
  #   hostname     sc-900a / sc-900b .conf-apps.superprotocol.dev
  #                (excluded from the snapshot — see `exclude` below)
  #   token        generated, separately in each. It is in a Secret, whose DATA is
  #                not in the snapshot, so it cannot move the digest
  #   batchKey     batch        (this listing's default)
  #   labelKey     cell_type    (this listing's default)
  #   data slot `matrices`   kestrel-pbmc-panel   (gated, clickhouse-http/v1)
  #
  # `kestrel-pbmc-panel` names its columns `batch` and `cell_type` on purpose, so
  # the two data parameters stay at their defaults and the gated and ungated
  # renders differ by the sidecar and by nothing else.
  expectedDigest: "9942e5d8956673b4d272f381c0c362727323e19f4dccddc87509c68d2301791f"
  # ---------------------------------------------------------------------------
  # The hostname is the one field that differs between two deployments of this
  # version, and excluding it is what makes the digest a property of the version
  # rather than of the deployment. Declared here as well as in the chart's own
  # annotation, because the listing page shows only what the definition declares
  # — a digest displayed beside "no exclusions" answers the only question that
  # matters about it wrongly.
  exclude:
    - match:
        kind: Ingress
        name: rapids-singlecell-notebook
      fields:
        - /spec/rules/0/host
