apiVersion: swarm.cloud/v1alpha1
kind: AppDefinition

metadata:
  name: ollama-webui
  title: Ollama + Open WebUI
  description: Run large language models with a chat interface powered by Open WebUI.
  version: "1.0.9"
  category: ai-inference
  sourceRepo: https://github.com/swarm-cloud/marketplace-apps
  license: MIT
  icon: icon.svg
  tags:
    - ai
    - llm
    - inference
    - chat

ui:
  sections:
    - id: access
      title: Access
      description: Where the chat interface is reachable.
      fields:
        - parameterId: chatHostname
          widget: hostname

    - id: model
      title: Model
      description: The model downloaded on first start and served from then on.
      fields:
        - parameterId: modelName
          widget: select

    - id: compute
      title: Compute
      fields:
        - parameterId: gpuEnabled
          widget: switch
        - parameterId: gpuCount
          widget: number
          visible: "params.gpuEnabled == true"

    - id: storage
      title: Storage
      fields:
        - parameterId: storageSize
          widget: select

parameters:
  - id: chatHostname
    type: string
    title: Hostname
    description: >-
      The public hostname the chat interface is served on. Take the one offered and the DNS is
      written for you; bring your own and point it at this cloud's gateway before publishing the
      deployment.
    required: true
    validation:
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$"

  - id: modelName
    type: string
    title: Model
    description: >-
      Downloaded on first start, which takes a few minutes. The defaults below are sized for CPU;
      the larger ones want a GPU to answer at a usable speed.
    required: true
    default: "llama3.2:3b"
    options:
      source:
        type: static
        values:
          - value: "llama3.2:3b"
            label: Llama 3.2 (3B)
          - value: "qwen2.5:7b"
            label: Qwen 2.5 (7B)
          - value: "mistral:7b"
            label: Mistral (7B)
          - value: "llama3.1:8b"
            label: Llama 3.1 (8B)
          - value: "gemma2:9b"
            label: Gemma 2 (9B)
          - value: "deepseek-r1:14b"
            label: DeepSeek R1 (14B)

  - id: gpuEnabled
    type: boolean
    title: Use a GPU
    description: >-
      Off by default, because a cluster space without GPUs schedules nothing at all when it is on:
      the pod asks for a device and a runtime class that are not there, and waits forever. Turn it
      on where the space actually has one.
    default: false

  - id: gpuCount
    type: integer
    title: GPUs
    description: How many to allocate.
    default: 1
    validation:
      min: 1
      max: 8

  - id: storageSize
    type: string
    title: Model storage
    description: Holds the downloaded weights. A 3B model is around 2 GB, a 14B one around 9 GB.
    default: "30Gi"
    options:
      source:
        type: static
        values:
          - value: "20Gi"
            label: 20 GB
          - value: "30Gi"
            label: 30 GB
          - value: "50Gi"
            label: 50 GB
          - value: "100Gi"
            label: 100 GB

resources:
  # Storage covers the default model disk (30Gi) and the chat volume (2Gi). The space is
  # created at this size for every deployment.
  min:
    cpu: "4"
    memory: "8Gi"
    storage: "32Gi"
  recommended:
    cpu: "8"
    memory: "16Gi"
    storage: "50Gi"
  gpu:
    required: false
    minCount: 1
    minVram: "8Gi"
    # nvidia-smi product names, which hw-measurement writes to device.swarm.io/gpu-product.
    # Placement requires this exact string. An A100 80GB or PCIe card is a different product
    # and needs its own entry.
    types:
      - NVIDIA H100 NVL
      - NVIDIA A100-SXM4-40GB
      - NVIDIA L40S
      - NVIDIA GeForce RTX 4090

components:
  # ---------------------------------------------------------------------------
  # The model server. Reachable inside the cluster space and nowhere else: an
  # Ollama endpoint has no authentication of its own, and publishing one would
  # hand the deployment's GPU and model to whoever found the name.
  # ---------------------------------------------------------------------------
  - name: ollama
    source:
      type: helm
      repoUrl: https://otwld.github.io/ollama-helm/
      chart: ollama
      version: "1.85.0"
    deployment:
      values:
        base:
          service:
            type: ClusterIP
          ollama:
            gpu:
              enabled: false
              type: nvidia
              number: 0
            models:
              pull: []
              run: []
          runtimeClassName: ""
          persistentVolume:
            enabled: true
            size: 30Gi
          ingress:
            enabled: false
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              # Explicit zero, not an omitted field. A GPU cluster space's LimitRange
              # defaults a missing nvidia.com/gpu to the reserved count, so a CPU
              # deploy would still ask for a card and lose the quota to nothing.
              nvidia.com/gpu: "0"
            limits:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "0"
        patches:
          - op: replace
            path: ollama.models.pull
            value:
              - "{{ params.modelName }}"

          - op: replace
            path: ollama.gpu.enabled
            value: true
            when: "params.gpuEnabled == true"

          - op: replace
            path: ollama.gpu.number
            value: "{{ params.gpuCount }}"
            when: "params.gpuEnabled == true"

          - op: replace
            path: runtimeClassName
            value: nvidia
            when: "params.gpuEnabled == true"

          # `nvidia.com/gpu` is not a dotted path, so the count cannot be set beside the
          # CPU and memory above. The whole resources object is replaced, and those two
          # are repeated.
          - op: replace
            path: resources
            value:
              requests:
                cpu: "2"
                memory: 4Gi
                nvidia.com/gpu: "{{ params.gpuCount }}"
              limits:
                cpu: "2"
                memory: 4Gi
                nvidia.com/gpu: "{{ params.gpuCount }}"
            when: "params.gpuEnabled == true"

          - op: replace
            path: persistentVolume.size
            value: "{{ params.storageSize }}"

  # ---------------------------------------------------------------------------
  # The chat interface, and the only thing served publicly. It has accounts of
  # its own: the first person to sign up becomes the administrator.
  # ---------------------------------------------------------------------------
  - name: open-webui
    dependsOn:
      - ollama
    source:
      type: helm
      repoUrl: https://open-webui.github.io/helm-charts
      chart: open-webui
      version: "5.20.0"
    deployment:
      values:
        base:
          service:
            type: ClusterIP
          # This chart ships Ollama as a subchart and installs it by default. The component above
          # is the one this deployment uses, so the bundled copy would be a second model server
          # downloading the same weights into a volume nothing reads.
          ollama:
            enabled: false
          # An extension mechanism this listing does not use, on by default upstream. Left on it is
          # another image to pull and another pod to wait for before the chat answers.
          pipelines:
            enabled: false
          # The chart's own volume, separate from Model storage. The space quota above
          # includes these 2Gi; leaving the size implicit would let a chart bump spend
          # quota the listing never counted.
          persistence:
            enabled: true
            size: 2Gi
          extraEnvVars:
            - name: OLLAMA_BASE_URL
              value: "http://{{ components.ollama.release }}:11434"
            - name: ENABLE_OLLAMA_API
              value: "true"
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
              # The chat UI does not use a GPU. Zero opts out of the namespace
              # LimitRange default, which would otherwise request a card here too
              # and exceed a one-GPU quota already taken by Ollama.
              nvidia.com/gpu: "0"
            limits:
              cpu: 500m
              memory: 2Gi
              nvidia.com/gpu: "0"
          # Init container copies bundled app data onto the volume. Empty resources
          # get LimitRange defaults (limit 4 CPU / request 1 CPU, and a GPU when the
          # space reserved one) and the pod is refused: tenant maxLimitRequestRatio
          # is 1, and the GPU quota is already held by Ollama.
          copyAppData:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
                nvidia.com/gpu: "0"
              limits:
                cpu: 100m
                memory: 128Mi
                nvidia.com/gpu: "0"
          ingress:
            enabled: true
            # Without a class the object is created, the cloud registers the hostname and writes
            # its DNS, and nothing serves it: the ingress controller only picks up what names it.
            # This is what made every deployment of this listing resolve and answer nothing.
            class: nginx
            annotations:
              # Answers stream token by token over a long-lived connection, which the default
              # 60-second read timeout cuts off mid-sentence.
              nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
              nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
              nginx.ingress.kubernetes.io/proxy-body-size: "30m"
            host: ""
        patches:
          # This chart takes a single hostname, not a list — the shape differs from ollama's.
          - op: replace
            path: ingress.host
            value: "{{ params.chatHostname }}"

outputs:
  - id: chatUrl
    title: Chat interface
    type: url
    value: "https://{{ params.chatHostname }}"

  - id: firstSignIn
    title: First sign-in
    type: string
    value: "Open the chat interface and create an account. The first one registered administers this deployment."

  - id: internalApi
    title: Model API, inside the cluster space
    type: url
    value: "http://{{ components.ollama.release }}.{{ namespace }}.svc.cluster.local:11434"
