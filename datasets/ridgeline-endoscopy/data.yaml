apiVersion: swarm.cloud/v1alpha1
kind: DataDefinition

# Ridgeline Endoscopy Partners — a synthetic GI clinic network.
#
# Everything in this dataset is generated by
# datasets/ridgeline-endoscopy/generate/generate.py. No row is taken from a real
# patient, a real practice or a real dataset, and none is a derivative of one.
# The generator is deterministic, so the corpus behind this card can be
# reproduced byte for byte and a regenerated copy is the same data, not similar
# data.
#
# This card is deliberately IDENTIFYING: patients carry names, dates of birth,
# medical record numbers, addresses and telephone numbers, because a clinical
# tool has to know which patient it is talking about and the point of a
# confidential deployment is that it can. Read `access.mode: gateway` below with
# that in mind — a consumer never holds this connection, and every request is
# admitted against the deployment evidence the consuming application published.
#
# WHAT IS DIFFERENT ABOUT THIS ONE, AND READ IT BEFORE COMPUTING ANYTHING.
#
# Eleven sites across a rural service area, eighteen thousand patients, a record
# going back to 2016 — and a registry that is thin in four specific, declared
# ways:
#
#   * about a third of captured colonoscopies carry NO bowel-preparation score;
#   * about a fifth record the preparation as the endoscopist's prose rather than
#     as one of the four scale adjectives;
#   * nearly half carry NO withdrawal time;
#   * about a fifth of completed colonoscopies never had their surveillance
#     interval entered, so they have NO recommendation row and therefore NO
#     recall at all — those patients are invisible to this practice's own
#     overdue list;
#   * structured capture runs about two months behind: the most recent procedure
#     here is NOT from the as-of date, because this practice batches its uploads.
#
# None of that is a statement about the care. The examination had a preparation
# quality and earned a surveillance interval whichever columns are null, and the
# dictated report in the document register still says so — which is exactly what
# makes this corpus worth reading with an assistant rather than with SQL. What it
# IS a statement about is the record, and an answer computed off this data that
# does not say which examinations it had to leave out is wrong even when its
# arithmetic is right.
#
# This is one of THREE identifying GI clinic cards on this catalogue, each owned
# and granted by a different practice, each reaching the same consuming
# application through its own grant. They share a generator and a schema, which
# is what makes a question that crosses them answerable; they do not share a
# shape. Volumes, periods, site counts, how well the examinations go and how
# completely the forms get filled in all differ, and the differences are the
# subject of any cross-network question worth asking. `datasets/gi-network-generator/profiles.py`
# is where they are declared and reasoned about.
#
# The descriptions in this file are not documentation. A consuming agent builds
# its entire knowledge of this database from the table and column descriptions
# published here, including each column's `role` and `references` — so anything
# left vague here is something the agent will get wrong, and the only place to fix
# it is here.

metadata:
  name: ridgeline-endoscopy
  title: Ridgeline Endoscopy Partners — Colonoscopy Surveillance (US)
  description: >-
    Identifying clinical records from an eleven-site rural US gastroenterology network:
    patients, office encounters, colonoscopies and upper endoscopies, polyp-level findings,
    histopathology, post-polypectomy surveillance recommendations with the guideline basis for
    each, the recall each one generates, every outreach attempt against it, and the register of
    clinical documents the practice holds. A ten-year record with KNOWN GAPS — a third of
    examinations carry no bowel-preparation score, nearly half no withdrawal time, a fifth of
    surveillance intervals never reached the structured record and so generate no recall, and
    capture runs about two months behind. The gaps are in the forms, not in the care, and the
    column descriptions say where each one is. Synthetic throughout.
  category: healthcare
  tags:
    - healthcare
    - clinical
    - gastroenterology
    - colonoscopy
    - surveillance
    - identifying
    - synthetic
    - incomplete-capture

spec:
  secrets:
    - name: readUser
      title: ClickHouse read-only user
      description: A user with SELECT on this database and nothing else.
    - name: readPassword
      title: ClickHouse read-only password

  # Consumers never receive this connection. An application is given an address it can only reach
  # the data through, and every request is admitted against the deployment evidence it published —
  # so an application that changes after we approved it stops being served, and the credentials
  # below never enter anyone else's cluster.
  #
  # For this dataset that is not a nicety. The records are identifying, so the gate is the only
  # thing standing between a named patient and an application nobody approved.
  access:
    mode: gateway

  provides:
    - interface: clickhouse-http/v1
      connection:
        static:
          host: 10.10.1.11
          port: 8123
          # The tables live in this database under a `rep_` prefix. The ClickHouse
          # account the marketplace holds on this server carries
          # `CREATE DATABASE, CREATE TABLE ON marketplace.*` and nothing wider, so
          # a database of this dataset's own cannot be created without host
          # access — and the clinic datasets already published here live the same
          # way. The reader account behind the secrets above is granted SELECT on
          # these eleven tables and nothing else in the database.
          database: marketplace
          username: "{{ secrets.readUser }}"
          password: "{{ secrets.readPassword }}"
          tls: false

  schema:
    tables:
      - name: rep_sites
        description: >-
          The network's clinical sites. One row per site. Join from any table carrying
          `site_id` to get the city a procedure or an encounter happened in.
        columns:
          - name: site_id
            type: string
            role: dimension
            description: "Site identifier (primary key), e.g. R01."
          - name: site_name
            type: string
            role: dimension
            description: "Name of the clinic or endoscopy center."
          - name: city
            type: string
            role: dimension
            description: "City the site is in."
          - name: state
            type: string
            role: dimension
            description: "Two-letter US state code. Every site is in CO."
          - name: endoscopy_suites
            type: integer
            role: measure
            description: "Number of procedure rooms at the site — its capacity."
          - name: opened_on
            type: date
            role: dimension
            description: "Date the site opened. Earlier sites carry longer histories."

      - name: rep_providers
        description: >-
          Clinicians and surveillance staff. One row per person. Endoscopists appear as
          `rep_procedures.provider_id`, pathologists as `rep_pathology.pathologist_id`, surveillance
          coordinators as `rep_recalls.assigned_coordinator_id`, so a per-clinician figure is a
          join away.
        columns:
          - name: provider_id
            type: string
            role: dimension
            description: "Provider identifier (primary key), e.g. PR-0007."
          - name: provider_name
            type: string
            role: dimension
            description: "Full name with credential, e.g. 'Vance Hollingsworth, MD'."
          - name: npi
            type: string
            role: dimension
            description: >-
              Ten-digit National Provider Identifier. Deliberately invalid: every one begins with
              9, which no issued NPI does.
          - name: role
            type: string
            role: dimension
            description: >-
              Gastroenterologist / Advanced endoscopist / Colorectal surgeon / Nurse practitioner /
              Physician assistant / Surveillance coordinator / Pathologist. Only the first three
              perform procedures.
          - name: site_id
            type: string
            role: dimension
            references: rep_sites.site_id
            description: "The site the provider is based at."
          - name: specialty_focus
            type: string
            role: dimension
            description: >-
              Clinical interest, e.g. 'Advanced polypectomy and EMR', 'Colorectal cancer
              screening', 'Hereditary GI cancer risk'.

      - name: rep_patients
        description: >-
          One row per patient, with direct identifiers. This is a live clinical record, not a
          de-identified extract: a name, a date of birth and a medical record number are present
          because the clinical work needs them. `mrn` is the number that appears on the
          practice's documents and is how a scanned note is matched to this row.
        columns:
          - name: patient_id
            type: string
            role: dimension
            description: "Internal patient identifier (primary key), e.g. P-0004296."
          - name: mrn
            type: string
            role: dimension
            description: >-
              Medical record number, e.g. RG-1004296. The identifier printed on clinical
              documents — use it to match a note or a report to a patient.
          - name: family_name
            type: string
            role: dimension
            description: "Patient family name (surname)."
          - name: given_name
            type: string
            role: dimension
            description: "Patient given name (first name)."
          - name: date_of_birth
            type: date
            role: dimension
            description: >-
              Date of birth. Age is not stored; compute it from this and the date of interest,
              because the age that matters is the age at the procedure, not today's.
          - name: sex
            type: string
            role: dimension
            description: "F or M."
          - name: phone
            type: string
            role: dimension
            description: >-
              Telephone number on file — the number recall outreach dials. Every one is in the
              North American fiction range (`555-0100` to `555-0199`), so patients share numbers;
              outside that range a generated number belongs to a real person.
          - name: email
            type: string
            role: dimension
            description: "Email address on file. Every one is in the example.org reserved domain."
          - name: address_line
            type: string
            role: dimension
            description: "Street address on file. Letters go here, and come back from here."
          - name: city
            type: string
            role: dimension
            description: "City of residence."
          - name: state
            type: string
            role: dimension
            description: "Two-letter US state code."
          - name: postal_code
            type: string
            role: dimension
            description: "Five-digit ZIP code."
          - name: primary_site_id
            type: string
            role: dimension
            references: rep_sites.site_id
            description: "The site the patient is registered at."
          - name: primary_provider_id
            type: string
            role: dimension
            references: rep_providers.provider_id
            description: "The patient's usual gastroenterologist."
          - name: payer_type
            type: string
            role: dimension
            description: "Medicare Part B / Medicare Advantage / Commercial / Medicaid / Self-pay."
          - name: insurance_plan
            type: string
            role: dimension
            description: "Name of the specific plan, e.g. 'Sunstate Advantage HMO'."
          - name: preferred_language
            type: string
            role: dimension
            description: >-
              Language the patient prefers to be contacted in. Relevant to recall outreach: a
              letter in the wrong language is an attempt that was never going to land.
          - name: registered_on
            type: date
            role: dimension
            description: "Date the patient registered with the network."
          - name: patient_status
            type: string
            role: dimension
            description: >-
              active / inactive / transferred out / deceased. A recall on a patient who is not
              active should not be generating outreach, which makes this column worth checking
              against `rep_recalls.recall_status`.

      - name: rep_encounters
        description: >-
          Office and telehealth visits. One row per visit. A procedure is normally preceded by a
          pre-procedure consultation and followed by a results review; a procedure performed at
          another facility instead has a 'New patient consultation' at which the outside records
          were requested.
        columns:
          - name: encounter_id
            type: string
            role: dimension
            description: "Encounter identifier (primary key)."
          - name: patient_id
            type: string
            role: dimension
            references: rep_patients.patient_id
            description: "The patient seen."
          - name: site_id
            type: string
            role: dimension
            references: rep_sites.site_id
            description: "Where the visit happened."
          - name: provider_id
            type: string
            role: dimension
            references: rep_providers.provider_id
            description: "Who the patient saw."
          - name: encounter_date
            type: date
            role: dimension
            description: "Date of the visit."
          - name: encounter_type
            type: string
            role: dimension
            description: >-
              Pre-procedure consultation / Results review / New patient consultation.
          - name: chief_complaint
            type: string
            role: dimension
            description: "Why the patient came, as a short category rather than free text."
          - name: disposition
            type: string
            role: dimension
            description: >-
              What was decided, e.g. 'Colonoscopy scheduled', 'Pathology discussed, surveillance
              interval agreed', 'Outside records requested', 'Referred to colorectal surgery'.

      - name: rep_procedures
        description: >-
          Endoscopic procedures. One row per procedure — colonoscopies (screening, surveillance,
          diagnostic), flexible sigmoidoscopies and upper endoscopies.

          Read `report_source` before any aggregate over this table. 'Structured capture' means
          the practice performed the procedure and keyed its detail in, so `rep_findings`,
          `rep_pathology` and `rep_surveillance_recommendations` all have rows for it. 'Outside report'
          means it was performed at another facility: the date, the type and the indication are
          all that reached the structured record, every other column is empty, and there are NO
          findings, NO pathology and NO surveillance recommendation anywhere. That detail exists
          only in a document — see `rep_clinical_documents`. A quality figure such as an adenoma
          detection rate must be restricted to 'Structured capture' or it is diluted by procedures
          whose findings were never entered.

          THIS PRACTICE'S CAPTURE IS INCOMPLETE, AND IN KNOWN PLACES. About a third of captured
          colonoscopies have no `bbps_total`, about a fifth record `bowel_prep_quality` as free
          text rather than as one of the four scale adjectives, and nearly half have no
          `withdrawal_time_min`. The examination had all three — the dictated report in
          `rep_clinical_documents` still carries them — but the form was not completed, so a
          figure with any of those columns in its denominator is computed over a SUBSET and has
          to say which subset. There is no flag marking an incompletely captured row: the null
          is the flag.

          `procedure_date` also stops about two months short of the as-of date, because this
          practice uploads in batches. The most recent complete quarter here is not the most
          recent complete quarter anywhere else, which matters the moment this table is compared
          with another network's.
        columns:
          - name: procedure_id
            type: string
            role: dimension
            description: "Procedure identifier (primary key), e.g. PROC-0000905."
          - name: patient_id
            type: string
            role: dimension
            references: rep_patients.patient_id
            description: "The patient."
          - name: site_id
            type: string
            role: dimension
            references: rep_sites.site_id
            description: "Where it was performed. Empty when `report_source` is 'Outside report'."
          - name: provider_id
            type: string
            role: dimension
            references: rep_providers.provider_id
            description: >-
              The endoscopist. Empty when `report_source` is 'Outside report' — the person who
              performed it does not work here and is named only in the document.
          - name: procedure_date
            type: date
            role: dimension
            description: "Date of the procedure."
          - name: procedure_type
            type: string
            role: dimension
            description: >-
              Screening colonoscopy / Surveillance colonoscopy / Diagnostic colonoscopy /
              Flexible sigmoidoscopy / EGD. Only the first three examine the whole colon, and
              only they appear in `rep_surveillance_recommendations`. A flexible sigmoidoscopy
              examines the left colon and stops — by design, not by failure, so it has no
              `cecal_intubation` result and earns no surveillance interval; there is nothing to
              say about a colon two thirds of which was not looked at. An EGD is an upper
              endoscopy and says nothing about the colon at all. Restrict any colonoscopy quality
              figure to the three colonoscopy types.
          - name: indication
            type: string
            role: dimension
            description: >-
              Why the procedure was done, e.g. 'Average-risk colorectal cancer screening,
              age-appropriate', 'Positive fecal immunochemical test', 'Post-polypectomy
              surveillance, prior adenoma'. Average-risk screening begins at 45, so
              'age-appropriate' appears only on patients who were 45 or older on the day;
              a younger patient scoped for screening carries the reason instead — a
              first-degree relative, Lynch syndrome, familial adenomatous polyposis.
          - name: report_source
            type: string
            role: dimension
            description: >-
              'Structured capture' — performed here, detail entered, findings and pathology
              present. 'Outside report' — performed elsewhere, clinical detail exists only as a
              document and nothing below is populated.
          - name: bowel_prep_quality
            type: string
            role: dimension
            description: >-
              Excellent / Good / Fair / Poor — OR, on about a fifth of captured examinations at
              this practice, the endoscopist's own words: 'adequate', 'adequate to the cecum',
              'good views throughout', 'suboptimal, washed', 'poor prep, limited views in the
              right colon', 'residual stool, repeat advised', 'satisfactory after lavage'. The
              free-text values are NOT the four grades under another name and must not be mapped
              onto them by string matching — 'adequate to the cecum' is a clinician saying the
              examination was good enough, which is a judgement and not a score. Where the value
              IS one of the four grades the adjective still straddles the adequacy threshold and
              `bbps_total` is what decides it. Empty for an outside report.
          - name: bbps_total
            type: integer
            role: measure
            nullable: true
            description: >-
              Boston Bowel Preparation Scale, 0 to 9 across three colon segments. A total under 6
              is an inadequate preparation and the examination has to be repeated within a year
              whatever was found.

              Null for an outside report AND on about a third of this practice's own captured
              examinations, where nobody entered it. That second case is the one to be careful
              with: it is a missing SCORE, not a missing preparation, and an adequate-preparation
              denominator built on `bbps_total >= 6` therefore covers only about half of the
              colonoscopies in this table. Any rate computed that way has to state its coverage,
              and comparing it with a network that scores every examination without saying so is
              the single easiest way to get a cross-network answer wrong.
          - name: cecal_intubation
            type: integer
            role: dimension
            nullable: true
            description: >-
              1 when the cecum was reached, 0 when it was not. A COLONOSCOPY that did not reach
              the cecum did not examine the whole colon and is a repeat, not a surveillance
              decision. Null where the question does not apply: an outside report, an EGD, and a
              flexible sigmoidoscopy — which was never going to the cecum, so counting it as a
              failure overstates the failure rate badly. Compute a cecal intubation rate over the
              three colonoscopy types only.
          - name: withdrawal_time_min
            type: number
            role: measure
            nullable: true
            description: >-
              Minutes spent withdrawing the scope and inspecting the mucosa. Six minutes is the
              accepted floor; it correlates with how many polyps get found. Null for an outside
              report, for an EGD, and on nearly half of this practice's captured colonoscopies,
              where it was not recorded — the scope was withdrawn and timed, the number did not
              reach the form. A mean over the non-null rows is a mean over the examinations
              somebody documented, which is not the same population.
          - name: sedation
            type: string
            role: dimension
            description: "Monitored anesthesia care / Moderate sedation / General anesthesia."
          - name: asa_class
            type: string
            role: dimension
            description: "American Society of Anesthesiologists physical status, I to IV."
          - name: completion_status
            type: string
            role: dimension
            description: >-
              'Complete to cecum' — a colonoscopy that reached the cecum.
              'Incomplete — cecum not reached' — one that did not; it has to be repeated.
              'Complete to the extent intended — left colon only' — a flexible sigmoidoscopy,
              which is a finished examination and not a failed colonoscopy.
              'Complete — upper tract' — an EGD.
              'Unknown — outside report not abstracted' — performed elsewhere; the document says
              and no column does.
          - name: complication
            type: string
            role: dimension
            description: >-
              'None' or the complication, e.g. 'Post-polypectomy bleeding, managed
              endoscopically'. Empty for an outside report.

      - name: rep_findings
        description: >-
          Polyps and lesions, one row per lesion — so a procedure that removed four polyps has
          four rows here. Only procedures with `report_source = 'Structured capture'` appear.
          Count rows per `procedure_id` for the polyp burden of an examination.
        columns:
          - name: finding_id
            type: string
            role: dimension
            description: "Finding identifier (primary key). One lesion."
          - name: procedure_id
            type: string
            role: dimension
            references: rep_procedures.procedure_id
            description: "The procedure it was found at."
          - name: patient_id
            type: string
            role: dimension
            references: rep_patients.patient_id
            description: "The patient."
          - name: segment
            type: string
            role: dimension
            description: >-
              Cecum / Ascending colon / Transverse colon / Descending colon / Sigmoid colon /
              Rectum, from the far end of the colon to the near. The first three are the proximal
              colon, where serrated lesions concentrate and are easiest to miss. A finding is
              never recorded beyond where that examination's scope actually reached: a
              sigmoidoscopy has findings no further in than the descending colon, and a
              colonoscopy with `cecal_intubation = 0` has none in the cecum.
          - name: size_mm
            type: integer
            role: measure
            description: >-
              Largest dimension in millimetres, as the endoscopist measured it. Ten millimetres
              is the threshold that makes a lesion advanced on size alone; twenty is the
              threshold at which a piecemeal resection needs a six-month check.
          - name: morphology
            type: string
            role: dimension
            description: >-
              Paris classification, e.g. 'Paris Is — sessile', 'Paris IIa — flat elevated',
              'Paris Ip — pedunculated'. Flat and depressed lesions are the ones that get missed.
          - name: resection_method
            type: string
            role: dimension
            description: >-
              Cold snare polypectomy / Cold forceps biopsy / Hot snare polypectomy / Endoscopic
              mucosal resection, en bloc / Endoscopic mucosal resection, piecemeal / Not resected.
          - name: resection_complete
            type: string
            role: dimension
            description: >-
              Yes / No / 'Endoscopically complete, piecemeal'. The last one means the endoscopist
              believes the lesion is gone but the pathologist cannot confirm it from fragments.
          - name: piecemeal
            type: integer
            role: dimension
            description: >-
              1 when the lesion was removed in fragments. A piecemeal resection of a lesion 20 mm
              or larger earns a six-month examination of the scar, which is the shortest interval
              in routine surveillance.

      - name: rep_pathology
        description: >-
          Histopathology, one row per specimen, keyed to the lesion it came from. A lesion that
          was not resected has no row here. `adenoma` and `advanced_histology` are precomputed
          because they are the two flags every surveillance rule turns on.
        columns:
          - name: pathology_id
            type: string
            role: dimension
            description: "Pathology record identifier (primary key)."
          - name: finding_id
            type: string
            role: dimension
            references: rep_findings.finding_id
            description: "The lesion this specimen came from."
          - name: procedure_id
            type: string
            role: dimension
            references: rep_procedures.procedure_id
            description: "The procedure."
          - name: patient_id
            type: string
            role: dimension
            references: rep_patients.patient_id
            description: "The patient."
          - name: accession_number
            type: string
            role: dimension
            description: "Laboratory accession, shared by every specimen from one procedure."
          - name: received_date
            type: date
            role: dimension
            description: "Date the specimen reached the laboratory."
          - name: reported_date
            type: date
            role: dimension
            description: >-
              Date the report was issued. The gap from `received_date` is laboratory turnaround,
              and a long one delays the surveillance decision.
          - name: lab_name
            type: string
            role: dimension
            description: "Reporting laboratory."
          - name: pathologist_id
            type: string
            role: dimension
            references: rep_providers.provider_id
            description: "The reporting pathologist."
          - name: histology
            type: string
            role: dimension
            description: >-
              The diagnosis. Tubular adenoma / Tubulovillous adenoma / Villous adenoma /
              Traditional serrated adenoma — all neoplastic, all count toward surveillance.
              Sessile serrated lesion — neoplastic, and dangerous precisely because it looks
              innocuous. Hyperplastic polyp / Inflammatory polyp / Normal colonic mucosa — not
              neoplastic, no surveillance consequence. Adenocarcinoma — cancer, and not a
              surveillance decision at all.
          - name: dysplasia_grade
            type: string
            role: dimension
            description: >-
              None / Low-grade / High-grade. High-grade dysplasia shortens the interval to three
              years on its own, whatever the lesion's size.
          - name: adenoma
            type: integer
            role: measure
            description: >-
              1 when the histology is an adenoma. The adenoma detection rate is the share of
              screening colonoscopies at which AT LEAST ONE adenoma was found — a per-procedure
              figure, so count distinct `procedure_id` with any adenoma over all screening
              colonoscopies. Averaging this column across rows instead gives the share of
              specimens that were adenomas, which is a different and much larger number. Restrict
              to `rep_procedures.report_source = 'Structured capture'` either way, or the figure
              is diluted by procedures whose findings were never entered.
          - name: advanced_histology
            type: integer
            role: measure
            description: >-
              1 when the lesion is one of the ones that earns a three-year interval on its own:
              10 mm or larger, or high-grade dysplasia, or tubulovillous or villous histology, or
              a traditional serrated adenoma, or a sessile serrated lesion with any dysplasia.
              The flag and `rep_surveillance_recommendations.basis` are computed from the same
              rule, so they cannot disagree.
          - name: margin_status
            type: string
            role: dimension
            description: >-
              Clear / Involved / 'Cannot be assessed' / 'Cannot be assessed — piecemeal specimen'
              / 'Not applicable — lesion not resected'.

      - name: rep_surveillance_recommendations
        description: >-
          The interval each completed examination earned, one row per procedure that generated
          one. `basis` states the rule that produced it in words, so a recommendation can be
          checked rather than taken on trust. A patient accumulates one row per examination;
          `superseded_by` names the later examination that replaced this recommendation, and is
          empty on the one that is still live.

          ABOUT A FIFTH OF THIS PRACTICE'S COMPLETED COLONOSCOPIES HAVE NO ROW HERE. The interval
          was set — it is in the dictated report — and nobody entered it, so there is no
          recommendation and, because a recall is generated from a recommendation, no recall
          either. Those patients are invisible to every overdue query this practice runs,
          including the ones run against `rep_recalls`. Counting rows here against
          `rep_procedures` is how the gap is measured; there is no column that marks it.
        columns:
          - name: recommendation_id
            type: string
            role: dimension
            description: "Recommendation identifier (primary key)."
          - name: procedure_id
            type: string
            role: dimension
            references: rep_procedures.procedure_id
            description: "The examination it followed."
          - name: patient_id
            type: string
            role: dimension
            references: rep_patients.patient_id
            description: "The patient."
          - name: recommended_on
            type: date
            role: dimension
            description: "Date of the examination the recommendation followed."
          - name: interval_months
            type: integer
            role: measure
            description: >-
              Months until the next examination: 3 or 6 for a repeat or a piecemeal scar check,
              12, 36, 60, 84 or 120 for routine surveillance and screening.
          - name: due_date
            type: date
            role: dimension
            description: "`recommended_on` plus `interval_months` — when the next examination is due."
          - name: risk_tier
            type: string
            role: dimension
            description: >-
              Low / Intermediate / High / Malignant / 'Repeat required'. The last two are not
              surveillance: 'Malignant' means cancer was found in a polypectomy specimen and the
              case needs multidisciplinary review; 'Repeat required' means the examination itself
              was inadequate — the cecum was not reached, or the preparation was too poor to see
              through — so nothing was learned and it has to be done again.
          - name: basis
            type: string
            role: dimension
            description: >-
              The rule in words, e.g. '3 small adenomas, none 10 mm or larger — 3 years',
              'Advanced histology — lesion 10 mm or larger, villous histology — 3 years',
              'Piecemeal resection of a lesion 20 mm or larger — 6 months to confirm clearance'.
          - name: recommending_provider_id
            type: string
            role: dimension
            references: rep_providers.provider_id
            description: "Who made the recommendation."
          - name: recommendation_source
            type: string
            role: dimension
            description: >-
              'Endoscopist at discharge' — decided before the pathology came back.
              'Pathology-triggered revision' — revised once it had.
          - name: superseded_by
            type: string
            role: dimension
            references: rep_procedures.procedure_id
            description: >-
              The later examination that answered this recommendation. Empty when the
              recommendation is still the patient's current one — which is the only kind that can
              be overdue.

      - name: rep_recalls
        description: >-
          The recall each surveillance recommendation generates, and what became of it. One row
          per recommendation.

          This is the table the overdue-surveillance question is answered from. `recall_status =
          'overdue'` means the due date has passed, no later examination happened, and outreach
          is still being attempted; 'lost_to_follow_up' means outreach has been exhausted or the
          patient cannot be reached at all. Both carry a positive `days_overdue`. 'completed'
          names the later examination in `completed_procedure_id`, so it can be verified rather
          than believed. 'not_yet_due' is the large, uninteresting majority: a ten-year interval
          set last year.

          One row per recommendation — and therefore NOT one row per completed colonoscopy at
          this practice. About a fifth of them never produced a recommendation (see
          `rep_surveillance_recommendations`), so the true population owed a surveillance
          examination is LARGER than this table, and an adherence or overdue figure computed from
          this table alone flatters the practice. The honest denominator is the colonoscopies in
          `rep_procedures`, not the recalls here.
        columns:
          - name: recall_id
            type: string
            role: dimension
            description: "Recall identifier (primary key)."
          - name: recommendation_id
            type: string
            role: dimension
            references: rep_surveillance_recommendations.recommendation_id
            description: "The recommendation being chased."
          - name: patient_id
            type: string
            role: dimension
            references: rep_patients.patient_id
            description: "The patient."
          - name: due_date
            type: date
            role: dimension
            description: "When the next examination is due. Copied from the recommendation."
          - name: recall_status
            type: string
            role: dimension
            description: >-
              not_yet_due — due more than 90 days away. due_soon — due within 90 days, no
              appointment. scheduled — appointment booked. completed — a later examination
              answered it. overdue — past due, no appointment, outreach continuing.
              lost_to_follow_up — past due, outreach exhausted or undeliverable. declined —
              patient refused. deferred_medical — postponed for a clinical reason, see
              `deferral_reason`. moved_away — transferred out of the network. deceased.
          - name: days_overdue
            type: integer
            role: measure
            description: >-
              Days past `due_date` as of the dataset's as-of date, for the overdue and
              lost-to-follow-up statuses only. Zero everywhere else — so sum or average it over
              those two statuses, not over the whole table.
          - name: outreach_attempts
            type: integer
            role: measure
            description: >-
              How many times the practice has tried to reach the patient about this recall. The
              individual attempts are in `rep_recall_outreach`.
          - name: last_outreach_date
            type: date
            role: dimension
            nullable: true
            description: "Date of the most recent attempt, or null if none has been made."
          - name: scheduled_date
            type: date
            role: dimension
            nullable: true
            description: >-
              The booked appointment when the status is 'scheduled', or the date of the
              examination that closed it when the status is 'completed'.
          - name: completed_procedure_id
            type: string
            role: dimension
            references: rep_procedures.procedure_id
            description: >-
              The examination that answered this recall. Populated only when the status is
              'completed', and it always resolves — an unverifiable 'completed' is how a recall
              register comes to disagree with the clinical record.
          - name: assigned_coordinator_id
            type: string
            role: dimension
            references: rep_providers.provider_id
            description: "The surveillance coordinator who owns this recall."
          - name: deferral_reason
            type: string
            role: dimension
            description: >-
              Why the recall was postponed, when the status is 'deferred_medical' — e.g.
              'Anticoagulation cannot be interrupted', 'Active cardiac workup'. Empty otherwise.

      - name: rep_recall_outreach
        description: >-
          Every attempt to reach a patient about a recall, one row per attempt. The outcome is a
          code, not a narrative: it records that the call did not land, never why. Why is in the
          coordinator's note, which is a document.
        columns:
          - name: outreach_id
            type: string
            role: dimension
            description: "Outreach attempt identifier (primary key)."
          - name: recall_id
            type: string
            role: dimension
            references: rep_recalls.recall_id
            description: "The recall being chased."
          - name: patient_id
            type: string
            role: dimension
            references: rep_patients.patient_id
            description: "The patient."
          - name: attempt_no
            type: integer
            role: measure
            description: "1 for the first attempt against this recall, ascending."
          - name: attempt_date
            type: date
            role: dimension
            description: "Date of the attempt."
          - name: channel
            type: string
            role: dimension
            description: "Telephone / Patient portal / Letter / SMS."
          - name: outcome
            type: string
            role: dimension
            description: >-
              What the attempt ended in, and it is always something that channel can produce: a
              telephone call ends 'No answer', 'Voicemail left', 'Wrong or disconnected number',
              'Reached — will call back', 'Reached — declined' or 'Reached — appointment
              scheduled'; a letter ends 'No response to letter' or 'Mail returned undeliverable';
              a portal message ends 'Portal message unread' or 'Portal message read, no reply';
              an SMS ends 'No reply to text message' or 'Text message undeliverable'.
              'Wrong or disconnected number', 'Mail returned undeliverable' and 'Text message
              undeliverable' mean the contact details on file are wrong — a different problem
              from a patient who will not come, and a different fix.
          - name: coordinator_id
            type: string
            role: dimension
            references: rep_providers.provider_id
            description: "The surveillance coordinator who made the attempt."

      - name: rep_clinical_documents
        description: >-
          The register of documents the practice holds about a procedure — what the file is, where
          it came from, and whether anyone has read it into the record yet. The documents
          themselves are PDF, DOCX and text files outside this database; `document_filename` names
          one.

          Two cohorts live here. `abstraction_status = 'pending'` on an 'Outside records packet'
          is a colonoscopy performed elsewhere whose entire clinical detail — preparation, cecal
          intubation, every polyp, every histology, the recommended interval — is in the document
          and in no column of this database. `abstraction_status = 'quality review'` on an
          'Endoscopy and pathology report' is the signed report that a structurally captured
          procedure's columns were keyed in from by a person, sampled to be read back against the
          record.
        columns:
          - name: document_id
            type: string
            role: dimension
            description: "Document register identifier (primary key)."
          - name: procedure_id
            type: string
            role: dimension
            references: rep_procedures.procedure_id
            description: >-
              The procedure the document is about. Empty for a document that is not about a
              procedure, such as a recall coordinator's note.
          - name: patient_id
            type: string
            role: dimension
            references: rep_patients.patient_id
            description: "The patient."
          - name: document_type
            type: string
            role: dimension
            description: >-
              'Outside records packet' / 'Endoscopy and pathology report' / 'Referral letter' /
              'Recall coordinator note'.
          - name: source_facility
            type: string
            role: dimension
            description: "Where the document came from. Empty for a document created here."
          - name: received_on
            type: date
            role: dimension
            nullable: true
            description: >-
              Date the document reached the practice. Null when it has not arrived — the long gap
              from `rep_procedures.procedure_date` is how long the records office spent chasing it.
          - name: document_status
            type: string
            role: dimension
            description: >-
              received / requested / 'not received'. A procedure whose document has not arrived
              cannot be abstracted at all, which is a different queue from one that can.
          - name: document_filename
            type: string
            role: dimension
            description: >-
              Filename of the document, e.g.
              'arrington-deborah-outside-colonoscopy-2022-09-06.pdf'. Empty when the document has
              not arrived.
          - name: document_format
            type: string
            role: dimension
            description: "pdf / docx / txt."
          - name: document_pages
            type: integer
            role: measure
            nullable: true
            description: "Pages in the document. Null when it has not arrived."
          - name: abstraction_status
            type: string
            role: dimension
            description: >-
              pending — the document is in hand and nobody has read it into the record.
              'blocked - awaiting records' — it has not arrived. 'quality review' — the record was
              keyed in from this document and the sample is being read back against it. complete.
          - name: assigned_abstractor_id
            type: string
            role: dimension
            references: rep_providers.provider_id
            description: "The nurse practitioner or physician assistant who owns the abstraction."
