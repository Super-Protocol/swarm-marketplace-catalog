apiVersion: swarm.cloud/v1alpha1
kind: DataDefinition

# Cypress Bay Digestive Health — aggregate release.
#
# The counts this practice is willing to hand to somebody outside it. Cypress Bay
# publishes its records under `cypressbay-digestive-health`, which is identifying
# and granted only to the operator it chose; this card is a separate decision
# with a separate grant, and what it carries is arithmetic.
#
# Cypress Bay is the COMPLETE, LARGE and LONG-RUNNING one of the three networks:
# six sites, twelve thousand patients, a record that starts in January 2019, and
# nothing missing from it. It is the network the other two are read against, so
# the useful thing about its release is that none of its denominators have a hole
# in them.
#
# ---------------------------------------------------------------------------
# What is in here, and what is deliberately not
# ---------------------------------------------------------------------------
#
# Generated by datasets/gi-network-generator/aggregate.py from the corpus
# datasets/gi-network-generator/generate.py writes. Synthetic throughout: no real
# patient, practice or record is represented and nothing is derived from one.
#
# Every column below is either a dimension this practice publishes in its own
# name — the site, the month, the procedure type, the recall status — or an
# integer count of rows. There is no patient, no encounter, no medical record
# number, no name, no date of birth, no procedure identifier and no free text out
# of a chart. There is also NO CLINICIAN: a per-endoscopist detection rate is the
# most sensitive figure this practice could release, it identifies a person, and
# no question this release exists to answer needs it.
#
# `access.mode: gateway` is here for the same reason it is on the identifying
# card. These are counts, not records, but they are still this practice's to
# withdraw: the grant behind this card can be revoked, and when it is, the gate
# stops answering for it within half a minute and the journal shows where the
# data stopped. That is the point of publishing it as a card rather than sending
# a spreadsheet.
#
# Small cells are NOT suppressed. A single examination in one month at one site
# appears as a count of one. A real release would round or suppress that; this one
# does not, because the property it is built to demonstrate is that the
# researcher's pooled figures come out EXACTLY equal to the figures the practice
# computes from its own records, and suppression would make them only
# approximately equal. Said plainly here rather than left for somebody to find.
#
# The descriptions in this file are not documentation. The consuming agent builds
# its whole knowledge of this database from the table and column descriptions
# published here — and the researcher who reads this card holds NO identifying
# card to fall back on, so a caveat that is not written here is a caveat nobody
# downstream ever sees. `datasets/gi-network-generator/selftest.py` asserts this
# card against the release's own schema, column for column, in order.

metadata:
  name: cypressbay-release
  title: Cypress Bay Digestive Health — Colonoscopy Quality Release (aggregate counts)
  description: >-
    Aggregate counts from a six-site US gastroenterology network, by site, by month and by
    procedure type: examinations performed, how they were captured, bowel-preparation quality
    including what was never scored, adenoma and advanced-histology detection, cecal intubation,
    withdrawal time, surveillance intervals recorded, and the state of every recall that fell
    due. Complete capture — no denominator here has a hole in it. No patient, clinician or
    record is identified. Synthetic throughout.
  category: healthcare
  tags:
    - healthcare
    - clinical
    - gastroenterology
    - colonoscopy
    - surveillance
    - aggregate
    - de-identified
    - synthetic

spec:
  secrets:
    - name: readUser
      title: ClickHouse read-only user
      description: A user with SELECT on this release's four tables and nothing else.
    - name: readPassword
      title: ClickHouse read-only password

  # Counts, and still behind the gate. The practice can withdraw this grant, and
  # the deployment that was reading these numbers stops being served — which is
  # the whole reason the release is a card and not an export.
  access:
    mode: gateway

  provides:
    - interface: clickhouse-http/v1
      connection:
        static:
          host: 10.10.1.11
          port: 8123
          # Four tables under a `cbdh_release_` prefix, in the database the
          # marketplace's own account is allowed to create tables in. The reader
          # behind the secrets above is granted SELECT on these four and nothing
          # else — in particular not on this practice's identifying tables, which
          # live in the same database under their own prefix and their own reader.
          database: marketplace
          username: "{{ secrets.readUser }}"
          password: "{{ secrets.readPassword }}"
          tls: false

  schema:
    tables:
      - name: cbdh_release_network_profile
        description: >-
          One row, and it is the row to read first. What Cypress Bay Digestive Health is, how
          big its record is, how far back it goes, how current it is, and how completely its
          forms were filled in — followed by `coverage_note`, the practice's own sentence about
          what an outside reader has to know before comparing these counts with another
          network's. Join nothing to it: there is one row and `network_key` is on every other
          table here. The caveat, written out here so it is part of what you know about this
          database rather than something you have to remember to go and query: Complete capture.
          Every structured examination carries a bowel-preparation score and a withdrawal time,
          every surveillance interval reached the structured record, and the feed is current to
          the as-of date. No examination has to be excluded from a preparation-quality
          denominator.
        columns:
          - name: network_key
            type: string
            role: dimension
            description: >-
              Stable key for this network: `cypress-bay`. The same key is on every other table
              in this release, and each of the other two networks' releases carries its own — so
              a question that pools all three groups by this column.
          - name: network
            type: string
            role: dimension
            description: >-
              Display name: "Cypress Bay Digestive Health".
          - name: network_short
            type: string
            role: dimension
            description: >-
              Short code the practice uses on its own paperwork: "CBDH".
          - name: state
            type: string
            role: dimension
            description: "Two-letter US state code the network operates in (FL)."
          - name: sites
            type: integer
            role: measure
            description: "Number of clinical sites in the network."
          - name: patients
            type: integer
            role: measure
            description: >-
              How many patients are in the practice's record. A count, nothing more — no patient
              is identified anywhere in this release and none can be reached from it.
          - name: procedures
            type: integer
            role: measure
            description: "How many examinations of any kind the record holds."
          - name: colonoscopies
            type: integer
            role: measure
            description: >-
              Of those, how many were colonoscopies — screening, surveillance or diagnostic.
              Upper endoscopies and flexible sigmoidoscopies are counted in `procedures` and not
              here, because neither examines enough of the colon to carry a bowel-preparation
              denominator or set a surveillance interval.
          - name: first_procedure_date
            type: date
            role: dimension
            description: >-
              Date of the earliest examination in the record. A comparison that reaches before
              this date is comparing this network with its own absence, and the difference will
              look like a collapse in volume.
          - name: last_procedure_date
            type: date
            role: dimension
            description: "Date of the most recent examination in the record."
          - name: data_through
            type: date
            role: dimension
            description: >-
              The last day this practice's structured capture covers. Where it is earlier than
              the as-of date the feed is running behind, and the final months of
              `procedure_monthly` are thinner than they will become.
          - name: feed_lag_days
            type: integer
            role: measure
            description: >-
              How many days behind the as-of date the capture runs. Zero means current to the
              day. A non-zero lag is the reason the most recent quarter is not comparable across
              networks that do not all report at the same speed.
          - name: prep_score_recorded_pct
            type: number
            role: measure
            description: >-
              Percentage of structured colonoscopies that carry a Boston Bowel Preparation Scale
              total. Anything below 100 is examinations whose preparation was never scored, and
              `procedure_monthly.prep_missing` says how many, month by month.
          - name: prep_free_text_pct
            type: number
            role: measure
            description: >-
              Percentage of structured colonoscopies where the preparation was described in the
              endoscopist's prose instead of being scored. Those examinations still have a scale
              total where one was recorded; this column is about the adjective.
          - name: withdrawal_recorded_pct
            type: number
            role: measure
            description: "Percentage of structured colonoscopies that carry a withdrawal time."
          - name: interval_recorded_pct
            type: number
            role: measure
            description: >-
              Percentage of examinations eligible for a surveillance interval whose interval
              reached the structured record. The remainder generate NO recall at all: those
              patients are not on this practice's overdue list, because this practice's system
              has never heard of them. That is a gap in the surveillance programme, not a gap in
              a report.
          - name: coverage_note
            type: string
            role: dimension
            description: >-
              What an outside reader has to know about this record before comparing it with
              another network's, in the practice's own words. Read it before quoting any rate
              from this release, and quote it alongside the rate.

      - name: cbdh_release_sites
        description: >-
          Cypress Bay Digestive Health's clinical sites. One row per site, and the only
          dimension table in this release. Join from `cbdh_release_procedure_monthly.site_id` or
          `cbdh_release_recall_monthly.site_id` to get the city a month's counts belong to.
        columns:
          - name: network_key
            type: string
            role: dimension
            description: >-
              `cypress-bay`, repeated on every row so a pooled site list says which network each
              site is in.
          - name: network
            type: string
            role: dimension
            description: >-
              Display name: "Cypress Bay Digestive Health".
          - name: site_id
            type: string
            role: dimension
            description: "Site identifier (primary key)."
          - name: site_name
            type: string
            role: dimension
            description: "Name of the clinic or endoscopy centre."
          - name: city
            type: string
            role: dimension
            description: "City the site is in."
          - name: state
            type: string
            role: dimension
            description: "Two-letter US state code."
          - name: endoscopy_suites
            type: integer
            role: measure
            description: >-
              Number of procedure rooms at the site — its capacity, and the right thing to
              divide a volume by when comparing sites of different sizes.
          - name: opened_on
            type: date
            role: dimension
            description: >-
              Date the site opened. A site that opened recently has a short history and its
              earlier months are absent rather than empty.

      - name: cbdh_release_procedure_monthly
        description: >-
          The release's main table: one row per site, calendar month and procedure type, with
          every count Cypress Bay Digestive Health publishes about the examinations themselves.
          A rate is a ratio of two columns on these rows — and the counts that a rate has to
          EXCLUDE are published beside the ones it includes, so the size of the exclusion is a
          number the reader can quote instead of a silence.
        columns:
          - name: network_key
            type: string
            role: dimension
            description: >-
              `cypress-bay`. Group by this column when pooling with another network's release.
          - name: network
            type: string
            role: dimension
            description: >-
              Display name: "Cypress Bay Digestive Health".
          - name: site_id
            type: string
            role: dimension
            references: cbdh_release_sites.site_id
            description: >-
              The site these examinations happened at. EMPTY means an examination this network
              did not perform: it is known only from an outside report the practice holds, it
              joins to no row in the sites table, and it carries no preparation score, no
              withdrawal time and no surveillance interval of its own. Those rows are counted
              under `dictated_reports` and contribute zero to every quality column below.
          - name: month
            type: date
            role: dimension
            description: >-
              The calendar month, as its first day. The grain is a month, so a question whose
              window starts or ends mid-month cannot be answered exactly from this table — say
              so rather than rounding it.
          - name: procedure_type
            type: string
            role: dimension
            description: >-
              Screening colonoscopy / Surveillance colonoscopy / Diagnostic colonoscopy /
              Flexible sigmoidoscopy / EGD. The first three are colonoscopies; a
              bowel-preparation or adenoma rate is computed over those and not over all five.
          - name: procedures
            type: integer
            role: measure
            description: >-
              Examinations of this type, at this site, in this month. The sum of
              `structured_reports` and `dictated_reports`.
          - name: structured_reports
            type: integer
            role: measure
            description: >-
              Of those, how many were captured in the structured record — the form with the
              preparation score, the withdrawal time and the completion status on it. Every
              quality column below is counted over these and only these.
          - name: dictated_reports
            type: integer
            role: measure
            description: >-
              The rest: an examination known from a dictated or an outside report, with no
              structured fields. It happened and it is counted; nothing about its quality is
              recoverable, so it belongs in neither the numerator nor the denominator of a
              quality rate.
          - name: prep_adequate
            type: integer
            role: measure
            description: >-
              Structured examinations with a recorded Boston Bowel Preparation Scale total of 6
              or more. This is the DENOMINATOR of an adenoma detection rate: a rate over
              examinations whose preparation was inadequate or unknown is measuring the prep,
              not the endoscopist.
          - name: prep_inadequate
            type: integer
            role: measure
            description: "Structured examinations with a recorded BBPS total below 6."
          - name: prep_missing
            type: integer
            role: measure
            description: >-
              Structured examinations with NO BBPS total recorded. The examination still had a
              preparation — what is missing is the score, not the care. These are the
              examinations a preparation-qualified rate must EXCLUDE, and this column is how
              much it excluded. Quote it next to the rate.
          - name: prep_free_text
            type: integer
            role: measure
            description: >-
              Structured examinations where the preparation was written as prose rather than one
              of the four scale adjectives. Overlaps the three columns above rather than
              partitioning with them: a prose description may still carry a scale total.
          - name: with_adenoma
            type: integer
            role: measure
            description: >-
              Examinations where histopathology reported at least one adenoma, whatever the
              preparation. Counted once per examination however many specimens it produced,
              because a detection rate counts examinations.
          - name: prep_adequate_with_adenoma
            type: integer
            role: measure
            description: >-
              Examinations that had BOTH an adequate recorded preparation and at least one
              adenoma. This is the NUMERATOR that goes with `prep_adequate`, and it is published
              as its own count because it cannot be recovered from `with_adenoma` and
              `prep_adequate` side by side — the two sets overlap in a way only the record
              knows.
          - name: with_advanced_histology
            type: integer
            role: measure
            description: >-
              Examinations where at least one specimen met the advanced-histology definition: an
              adenoma 10mm or larger, high-grade dysplasia, a villous component, or a sessile
              serrated lesion with dysplasia. Counted once per examination.
          - name: cecal_intubation
            type: integer
            role: measure
            description: >-
              Examinations recorded as reaching the cecum. The denominator for a cecal
              intubation rate is colonoscopies — a flexible sigmoidoscopy stops in the left
              colon by design and is not an incomplete colonoscopy.
          - name: withdrawal_recorded
            type: integer
            role: measure
            description: >-
              Examinations carrying a withdrawal time. The DENOMINATOR for a mean withdrawal
              time.
          - name: withdrawal_minutes_total
            type: number
            role: measure
            description: >-
              Sum of the recorded withdrawal times, in minutes. Divide by `withdrawal_recorded`
              to get a mean, never by `procedures` — dividing by the wrong denominator makes a
              network that fills in fewer forms look faster.
          - name: surveillance_eligible
            type: integer
            role: measure
            description: >-
              Structured examinations that should have carried a surveillance interval:
              colonoscopies, excluding upper endoscopies and flexible sigmoidoscopies, neither
              of which says anything about the whole colon. The DENOMINATOR for
              `interval_recorded`.
          - name: interval_recorded
            type: integer
            role: measure
            description: >-
              Of those, how many had their interval reach the structured record. The difference
              is examinations that generated no recommendation and therefore no recall: those
              patients are invisible to this practice's overdue list. The difference, not a
              separate column, because `surveillance_eligible` is published beside it for
              exactly that subtraction.

      - name: cbdh_release_recall_monthly
        description: >-
          What became of Cypress Bay Digestive Health's surveillance recalls, by the month each
          one fell due, the risk tier of the recommendation behind it, and its current status. A
          recall exists only where a surveillance interval reached the structured record — so
          this table counts the patients the programme knows about, and
          `cbdh_release_procedure_monthly.surveillance_eligible` minus `interval_recorded`
          counts the ones it does not.
        columns:
          - name: network_key
            type: string
            role: dimension
            description: "`cypress-bay`."
          - name: network
            type: string
            role: dimension
            description: >-
              Display name: "Cypress Bay Digestive Health".
          - name: site_id
            type: string
            role: dimension
            references: cbdh_release_sites.site_id
            description: >-
              The site of the examination the recall descends from. Always a real site: a recall
              exists only behind a structured examination, and those always have one.
          - name: due_month
            type: date
            role: dimension
            description: >-
              The month the recall fell due, as its first day. NOT the month of the examination
              — a three-year interval means these two are three years apart, and a volume by
              `due_month` is a forecast of workload rather than a history of it.
          - name: risk_tier
            type: string
            role: dimension
            description: >-
              The surveillance risk tier of the recommendation behind the recall, which is what
              set the interval: Normal / Low / Intermediate / High / Repeat required /
              Malignant.
          - name: recall_status
            type: string
            role: dimension
            description: >-
              Where the recall stands: `not_yet_due`, `due_soon`, `scheduled`, `completed`,
              `overdue`, `lost_to_follow_up`, `declined`, `deferred_medical`, `moved_away`,
              `deceased`. `completed` means a later examination actually answered the
              recommendation. `overdue` and `lost_to_follow_up` are the two that represent a
              patient who needed a scope and has not had one.
          - name: recalls
            type: integer
            role: measure
            description: "Recalls in this month, tier and status."
          - name: days_overdue_total
            type: integer
            role: measure
            description: >-
              Sum of days overdue across those recalls. Zero for every status that is not
              `overdue` or `lost_to_follow_up`, so divide it by the `recalls` of those two
              statuses and not by all of them.
          - name: outreach_attempts
            type: integer
            role: measure
            description: >-
              Total outreach attempts made against those recalls — letters, telephone calls and
              portal messages. Divide by `recalls` for attempts per recall.
